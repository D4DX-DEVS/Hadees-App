name = "hadeeth-ai"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[vars]
API_URL = "https://hadithencyclopedia.com/api/index.php"
ALLOWED_ORIGINS = "*"
# Secrets (set with `npx wrangler secret put NAME`):
#   MATCH_KEY              long random string; the SAME value as 'match_key' in /home/<account>/hadees-config.php
#   ADMIN_TOKEN            optional: any random string, lets an admin pick the Workers AI model per request
#   ANTHROPIC_API_KEY      optional: Claude answers instead of free Workers AI model
#   CLAUDE_MODEL           optional, default claude-opus-5-5
# (No more Supabase keys, and no keep-alive cron: the database is on the cPanel server.)

[[kv_namespaces]]
binding = "CACHE"
id = "66fb0985bb964f3a989d01c101b6de81"

name: Deploy to cPanel

# Runs on every push to main (and by hand from the Actions tab).
# check      -> typecheck + lint the app, syntax-check the PHP API
# deploy-api -> upload api/ over FTPS (changed files only), then health-check it (database reachable)
# deploy-admin -> upload admin/ (the editor page, /admin/) over FTPS, then check it answers
# deploy     -> build the web app against that API, upload changed files, smoke-test the live site
# One-time setup (secrets/variables, FTP account): docs/DEPLOY_CPANEL.md

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'api/**'
      - 'admin/**'
      - '.github/workflows/deploy-cpanel.yml'
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: PHP syntax check
        run: |
          command -v php >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq php-cli; }
          php -l api/index.php
          for f in admin/*.php; do php -l "$f"; done
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Typecheck
        working-directory: app
        run: npx tsc --noEmit
      - name: Lint
        working-directory: app
        run: npx expo lint

  deploy-api:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Upload api/ to cPanel (changed files only)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: api/
          server-dir: ${{ format('{0}api/', vars.FTP_SERVER_DIR || './') }}
          # the database password lives OUTSIDE the web root (/home/<account>/hadees-config.php) and is never deployed
          exclude: |
            **/hadees-config*.php
            **/db-role.sql
            **/editor-role.sql
            **/sources-search.sql
            **/editor-extras.sql
      - name: Health check (API reaches the database)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL variable not set, skipping health check"; exit 0; fi
          out=$(curl -fsS --retry 3 --retry-delay 5 "$SITE_URL/api/index.php?r=health")
          echo "$out"
          echo "$out" | grep -q '"db":true' || { echo "::error::API health check failed"; exit 1; }

  deploy-admin:
    needs: [check, deploy-api]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Upload admin/ to cPanel (changed files only)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: admin/
          server-dir: ${{ format('{0}admin/', vars.FTP_SERVER_DIR || './') }}
      - name: Check the editor page answers (not set up yet = 503, still deployed)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL variable not set, skipping check"; exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$SITE_URL/admin/api.php?a=me")
          echo "admin/api.php?a=me -> HTTP $code (401 = deployed and waiting for a login)"
          case "$code" in 401|503) ;; *) echo "::error::unexpected HTTP $code from the editor page"; exit 1 ;; esac
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/admin/lib.php")
          test "$code" != 200 || { echo "::error::admin/lib.php is served directly"; exit 1; }

  deploy:
    needs: [check, deploy-api]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci

      - name: Build web app
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_AI_URL: ${{ secrets.EXPO_PUBLIC_AI_URL }}
        run: |
          test -n "$EXPO_PUBLIC_API_URL" || { echo "::error::EXPO_PUBLIC_API_URL secret is not set"; exit 1; }
          npx expo export -p web
          python3 -I scripts/pack-cpanel.py --dir

      - name: Upload to cPanel (changed files only)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: app/deploy/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          # never touch the server's own config files
          exclude: |
            **/.htaccess
            **/.well-known/**
            **/php.ini
            **/.user.ini

      - name: Smoke test the live site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL variable not set, skipping smoke test"; exit 0; fi
          html=$(curl -fsS --retry 3 --retry-delay 5 "$SITE_URL/")
          js=$(printf '%s' "$html" | grep -o '/_expo/static/js/web/entry-[a-z0-9]*\.js' | head -1)
          test -n "$js" || { echo "::error::index.html does not reference a bundle"; exit 1; }
          curl -fsSI --retry 3 --retry-delay 5 "$SITE_URL$js" >/dev/null
          echo "OK: $SITE_URL serves $js"

 حِينَ يَلْقَاهُ جِبْرِيلُ، وَكَانَ جِبْرِيلُ يَلْقَاهُ فِي كُلِّ لَيْلَةٍ مِنْ شَهْرِ رَمَضَانَ فَيُدَارِسُهُ الْقُرْآنَ، قَالَ: كَانَ رَسُولُ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ حِينَ يَلْقَاهُ جِبْرِيلُ عَلَيْهِ السَّلَام أَجْوَدَ بِالْخَيْرِ مِنَ الرِّيحِ الْمُرْسَلَةِ. (ن)", "malayalam": "അബ്ദുല്ലാഹിബ്നു അബ്ബാസ്(റ): റസൂൽ(സ) വളരെയധികം ദാനം ചെയ്യുന്നവരായിരുന്നു. റമളാനിൽ ജിബ്രീലിനെ കാണുന്ന അവസരത്തിലായിരുന്നു അധികമായി ദാനം ചെയ്തിരുന്നത്. റമളാനിന്റെ എല്ലാ രാത്രികളിലും ഖുർആൻ പാരായണം ചെയ്തുകൊടുക്കാൻ ജിബ്രീൽ(അ) റസൂൽ(സ)യെ കാണുമായിരുന്നു. ജിബ്രീലിനെ കാണുന്ന അവസരത്തിൽ, അടിച്ചുവീശുന്ന കാറ്റിനെക്കാൾ നന്മകൊണ്ടു ധർമിഷ്ഠനായിരുന്നു റസൂൽ(സ). (ന)", "narrator_ml": "അബ്ദുല്ലാഹിബ്നു അബ്ബാസ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 83, "page_start": 133}, {"hadith_no": 337, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: مَا لَعَنَ رَسُولُ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ مِنْ لَعْنَةٍ تُذْكَرُ، كَانَ إِذَا كَانَ قَرِيبَ عَهْدٍ بِجِبْرِيلَ عَلَيْهِ السَّلَام يُدَارِسُهُ كَانَ أَجْوَدَ بِالْخَيْرِ مِنَ الرِّيحِ الْمُرْسَلَةِ. (ن)", "malayalam": "ആഇശ(റ): പറയപ്പെടാവുന്ന ഒരു ശാപവും റസൂൽ(സ) ശപിച്ചിട്ടില്ല. ഖുർആൻ പാരായണത്തിനായി ജിബ്രീൽ(അ) വരാനടുക്കുമ്പോൾ റസൂൽ(സ) അടിച്ചുവീശുന്ന കാറ്റിനെക്കാൾ നന്മകൊണ്ടു ദാനം ചെയ്തിരുന്നു. (ന.)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 83, "page_start": 133}, {"hadith_no": 338, "arabic": "عَنْ عَطِيَّةَ بْنِ سُفْيَانَ بْنِ عَبْدِ اللَّهِ بْنِ رَبِيعَةَ قَالَ: حَدَّثَنَا وَفْدُنَا الَّذِينَ قَدِمُوا عَلَى رَسُولِ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ بِإِسْلَامِ ثَقِيفٍ، قَالَ: وَقَدِمُوا عَلَيْهِ فِي رَمَضَانَ، فَضَرَبَ عَلَيْهِمْ قُبَّةً فِي الْمَسْجِدِ، فَلَمَّا أَسْلَمُوا صَامُوا مَا بَقِيَ عَلَيْهِمْ مِنَ الشَّهْرِ. [ز: فيه راو مجهول، ومدلس عنه] (جه)", "malayalam": "അത്വിയ്യതുബ്നു സുഫ്യാനിബ്നി അബ്ദില്ലാഹിബ്നി റബീഅ(റ): സഖീഫുകാർ ഇസ്ലാമിലേക്കു വന്ന വാർത്തയുമായി റസൂൽ(സ)യുടെ അടുത്ത് ചെന്ന ഞങ്ങളുടെ സംഘം ഞങ്ങൾക്ക് പറഞ്ഞുതന്നു. നിവേദകൻ പറയുന്നു: റമളാനിലാണ് അവർ റസൂൽ(സ)യുടെ അടുത്തെത്തിയത്. അവിടന്ന് അവർക്കു പള്ളിയിൽ ഒരു കൂടാരമൊരുക്കി. അവർ ഇസ്ലാം സ്വീകരിച്ചപ്പോൾ റമളാനിൽ ബാക്കിയുള്ള ദിവസങ്ങൾ അവർ നോമ്പെടുത്തു. (നിവേദക പരമ്പര സംശയകരം) (ജ)", "narrator_ml": "അത്വിയ്യതുബ്നു സുഫ്യാനിബ്നി അബ്ദില്ലാഹിബ്നി റബീഅ(റ)", "source_codes_ar": ["جه"], "grading_note_ml": "നിവേദക പരമ്പര സംശയകരം", "grading_note_ar": "ز: فيه راو مجهول، ومدلس عنه", "explanation_ml": null, "variants": [], "bab_seq": 84, "page_start": 133}, {"hadith_no": 339, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: كَانَ رَسُولُ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ إِذَا دَخَلَ الْعَشْرُ أَحْيَا اللَّيْلَ وَأَيْقَظَ أَهْلَهُ، وَجَدَّ، وَشَدَّ الْمِئْزَرَ. (م)", "malayalam": "ആഇശ(റ): റമളാനിലെ അവസാനത്തെ പത്തായാൽ റസൂൽ(സ) രാത്രിയെ ആരാധനകളാൽ ജീവിപ്പിക്കുകയും വീട്ടുകാരെ വിളിച്ചുണർത്തുകയും അരയുടുപ്പ് മുറുക്കി ആരാധനക്ക് പരിശ്രമിക്കുകയും ചെയ്യുമായിരുന്നു. (മു)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["م"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 85, "page_start": 134}, {"hadith_no": 340, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: كَانَ النَّبِيُّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ يَجْتَهِدُ فِي الْعَشْرِ الْأَوَاخِرِ مَا لَا يَجْتَهِدُ فِي غَيْرِهِ. (جه)", "malayalam": "ആഇശ(റ): മറ്റു ദിവസങ്ങളിലില്ലാത്ത പരിശ്രമം അവസാനത്തെ പത്തിൽ റസൂൽ(സ) പരിശ്രമിക്കാറുണ്ടായിരുന്നു. (ജ)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 85, "page_start": 134}, {"hadith_no": 341, "arabic": "عَنِ ابْنِ عُمَرَ رَضِيَ اللهُ عَنْهُمَا أَنَّ رِجَالًا مِنْ أَصْحَابِ النَّبِيِّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ أُرُوا لَيْلَةَ الْقَدْرِ فِي الْمَنَامِ فِي السَّبْعِ الْأَوَاخِرِ فَقَالَ رَسُولُ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: \"أَرَى رُؤْيَاكُمْ قَدْ تَوَاطَأَتْ فِي السَّبْعِ الْأَوَاخِرِ فَمَنْ كَانَ مُتَحَرِّيهَا فَلْيَتَحَرَّهَا فِي السَّبْعِ الْأَوَاخِرِ\". (خ)", "malayalam": "ഇബ്നുഉമർ(റ): തിരുമേനി(സ)യുടെ അനുചരന്മാരിൽ അധികപേർക്കും ലൈലത്തുൽഖദ്ർ റമളാനിലെ അവസാന ആഴ്ചയിൽ വരുന്നതായി സ്വപ്നദർശനമുണ്ടായി. അപ്പോൾ അവിടന്ന് പറഞ്ഞു: \"നിങ്ങളുടെയെല്ലാം സ്വപ്നങ്ങൾ അവസാനത്തെ ഏഴുദിനങ്ങളിൽ ഒത്തുചേരുന്നതായാണു കാണുന്നത്. അതിനാൽ, ആരെങ്കിലും ഖദ്റിന്റെ രാത്രിയെ അന്വേഷിക്കുന്നുവെങ്കിൽ അവൻ റമളാനിന്റെ അവസാനത്തെ ആഴ്ചയിൽ അന്വേഷിക്കട്ടെ.\" (ബു)", "narrator_ml": "ഇബ്നുഉമർ(റ)", "source_codes_ar": ["خ"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 86, "page_start": 134}, {"hadith_no": 342, "arabic": "عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ رَضِيَ اللهُ عَنْهُ قَالَ: اعْتَكَفْنَا مَعَ النَّبِيِّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ الْعَشْرَ الْأَوْسَطَ مِنْ رَمَضَانَ فَخَرَجَ صَبِيحَةَ عِشْرِينَ فَخَطَبَنَا وَقَالَ: \"إِنِّي أُرِيتُ لَيْلَةَ الْقَدْرِ ثُمَّ أُنْسِيتُهَا أَوْ نَسِيتُهَا فَالْتَمِسُوهَا فِي الْعَشْرِ الْأَوَاخِرِ فِي الْوَتْرِ، وَإِنِّي رَأَيْتُ أَنِّي أَسْجُدُ فِي مَاءٍ وَطِينٍ، فَمَنْ كَانَ اعْتَكَفَ مَعَ رَسُولِ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ فَلْيَرْجِعْ\"، فَرَجَعْنَا وَمَا نَرَى فِي السَّمَاءِ قَزَعَةً، فَجَاءَتْ سَحَابَةٌ فَمَطَرَتْ حَتَّى سَالَ سَقْفُ الْمَسْجِدِ وَكَانَ مِنْ جَرِيدِ النَّخْلِ، وَأُقِيمَتِ الصَّلَاةُ، فَرَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ يَسْجُدُ فِي الْمَاءِ وَالطِّينِ، حَتَّى رَأَيْتُ أَثَرَ الطِّينِ فِي جَبْهَتِهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ. (خ)", "malayalam": "അബുസഈദ്(റ): റമളാനിന്റെ മധ്യത്തിലെ പത്തു ദിനങ്ങളിൽ തിരുമേനി(സ)യുടെ കൂടെ ഞങ്ങൾ ഇഅ്തികാഫിരുന്നു. റമളാൻ ഇരുപതിനു രാവിലെ തിരുമേനി(സ) പള്ളിയിൽനിന്നു പുറത്തുവന്ന് ഞങ്ങളോടു പറഞ്ഞു: \"ലൈലത്തുൽ ഖദ്റിനെക്കുറിച്ച് എനിക്കു സ്വപ്നദർശനമുണ്ടായി. ശേഷം ഞാനതു മറന്നുപോയി. അവസാനത്തെ പത്തിലെ ഒറ്റയിട്ട ദിനങ്ങളിൽ നിങ്ങളതിനെ അന്വേഷിക്കുക. വെള്ളത്തിലും കളിമണ്ണിലും സുജൂദ് ചെയ്യുന്നതായും എനിക്കു സ്വപ്നദർശനമുണ്ടായി. അതിനാൽ പ്രവാചകനോടൊപ്പം ഇഅ്തികാഫ് ഇരുന്നവരൊക്കെ പള്ളിയിലേക്കുതന്നെ മടങ്ങുക.\" ഉടനെ ഞങ്ങൾ മടങ്ങി. അപ്പോൾ ആകാശത്തിൽ ഒരു മേഘപാളിപോലുമില്ലായിരുന്നു. പെട്ടെന്നു കാർമേഘങ്ങൾ വന്ന് മഴ വർഷിക്കാൻ തുടങ്ങി. മഴയുടെ ശക്തികാരണം ഈത്തപ്പന മട്ടലുകൊണ്ടുള്ള പള്ളിയുടെ മേൽക്കൂര ചോർന്നൊലിച്ചു. ശേഷം നിസ്കാരം നടന്നു. തിരുമേനി(സ) കളിമണ്ണിലും വെള്ളത്തിലും സുജൂദ് ചെയ്യുന്നത് ഞാൻ കണ്ടു. അവിടത്തെ തിരുനെറ്റിയിൽ കളിമണ്ണിന്റെ അവശിഷ്ടങ്ങളും ഞാൻ കണ്ടു. (ബു)", "narrator_ml": "അബുസഈദ്(റ)", "source_codes_ar": ["خ"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 86, "page_start": 134}, {"hadith_no": 343, "arabic": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا أَنَّ النَّبِيَّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"الْتَمِسُوهَا فِي الْعَشْرِ الْأَوَاخِرِ مِنْ رَمَضَانَ لَيْلَةَ الْقَدْرِ فِي تَاسِعَةٍ تَبْقَى فِي سَابِعَةٍ تَبْقَى فِي خَامِسَةٍ تَبْقَى\". (خ)", "malayalam": "ഇബ്നുഅബ്ബാസ്(റ): തിരുമേനി(സ) പറഞ്ഞു: \"ലൈലത്തുൽ ഖദ്റിനെ നിങ്ങൾ റമളാനിന്റെ ഒടുവിലെ പത്തിൽ, അതായത് റമളാനിൽ നിന്ന് ഒമ്പത് ദിവസം ബാക്കിനിൽക്കെ, ഏഴു ദിവസം ബാക്കിനിൽക്കെ, അഞ്ച് ദിവസം ബാക്കിനിൽക്കെ. റമളാൻ ഇരുപത്തൊമ്പതിലും ഇരുപത്തേഴിലും ഇരുപത്തഞ്ചിലും പ്രതീക്ഷിക്കുക.\" (ബു)", "narrator_ml": "ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["خ"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 86, "page_start": 135}, {"hadith_no": 344, "arabic": "عَنِ ابْنِ عُمَرَ رَضِيَ اللهُ عَنْهُمَا قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: \"الْتَمِسُوهَا فِي الْعَشْرِ الْأَوَاخِرِ– يَعْنِي لَيْلَةَ الْقَدْرِ– فَإِنْ ضَعُفَ أَحَدُكُمْ أَوْ عَجَزَ فَلَا يُغْلَبَنَّ عَلَى السَّبْعِ الْبَوَاقِي\". (م)", "malayalam": "ഇബ്നുഉമർ(റ): റസൂൽ(സ) പറഞ്ഞു: \"അതിനെ - ലൈലതുൽ ഖദ്റിനെ - നിങ്ങൾ അവസാനത്തെ പത്തിൽ അന്വേഷിച്ചുകൊള്ളുക. ആർക്കെങ്കിലും അതിനു കഴിഞ്ഞില്ലെങ്കിൽ അവസാനത്തെ ഏഴു ദിവസങ്ങളിൽ അവൻ പരാജിതനാകരുത്.\" (മു)", "narrator_ml": "ഇബ്നുഉമർ(റ)", "source_codes_ar": ["م"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 86, "page_start": 135}, {"hadith_no": 345, "arabic": "عَنْ عَبْدِ اللَّهِ بْنِ أُنَيْسٍ رَضِيَ اللهُ عَنْهُ: أَنَّ رَسُولَ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"أُرِيتُ لَيْلَةَ الْقَدْرِ ثُمَّ أُنْسِيتُهَا، وَأَرَانِي صَبِيحَتَهَا أَسْجُدُ فِي مَاءٍ وَطِينٍ\". قَالَ: فَمُطِرْنَا لَيْلَةَ ثَلَاثٍ وَعِشْرِينَ، فَصَلَّى بِنَا رَسُولُ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ فَانْصَرَفَ وَإِنَّ أَثَرَ الْمَاءِ وَالطِّينِ عَلَى جَبْهَتِهِ وَأَنْفِهِ. قَالَ: وَكَانَ عَبْدُ اللَّهِ بْنُ أُنَيْسٍ يَقُولُ: ثَلَاثٍ وَعِشْرِينَ. (م)", "malayalam": "അബ്ദുല്ലാഹിബ്നു ഉനൈസ്(റ): റസൂൽ(സ) പറഞ്ഞു: \"ലൈലതുൽ ഖദ്ർ എന്നാണെന്ന് എനിക്ക് അറിയിക്കപ്പെട്ടു. പിന്നീട് ഞാനതു മറന്നു. അന്നു രാവിലെ ഞാൻ വെള്ളത്തിലും ചെളിയിലും സുജൂദ് ചെയ്യുന്നത് എനിക്ക് കാണിക്കപ്പെട്ടു.\" അബ്ദുല്ല(റ) പറയുന്നു: ഇരുപത്തിമൂന്നിനു രാത്രി മഴപെയ്തു. നബി(സ) ഞങ്ങളോടൊപ്പം നിസ്കരിച്ചു തിരിച്ചുപോന്നു. നബിയുടെ മൂക്കിൻമേലും നെറ്റിയിലും വെള്ളവും ചെളിയുമുണ്ടായിരുന്നു. അബ്ദുല്ലാഹിബ്നു ഉനൈസ്(റ) പറയാറുണ്ടായിരുന്നു: ലൈലത്തുൽ ഖദ്ർ ഇരുപത്തിമൂന്നിനാകുന്നു. (മു)", "narrator_ml": "അബ്ദുല്ലാഹിബ്നു ഉനൈസ്(റ)", "source_codes_ar": ["م"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 86, "page_start": 135}, {"hadith_no": 346, "arabic": "عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ رَضِيَ اللهُ عَنْهُ قَالَ: اعْتَكَفَ رَسُولُ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ الْعَشْرَ الْأَوْسَطَ مِنْ رَمَضَانَ، يَلْتَمِسُ لَيْلَةَ الْقَدْرِ قَبْلَ أَنْ تُبَانَ لَهُ، قَالَ: فَلَمَّا انْقَضَيْنَ أَمَرَ بِالْبِنَاءِ فَقُوِّضَ، ثُمَّ أُبِينَتْ لَهُ أَنَّهَا فِي الْعَشْرِ الْأَوَاخِرِ، فَأَمَرَ بِالْبِنَاءِ فَأُعِيدَ، ثُمَّ خَرَجَ عَلَى النَّاسِ فَقَالَ: \"يَا أَيُّهَا النَّاسُ، إِنَّهَا كَانَتْ أُبِينَتْ لِي لَيْلَةُ الْقَدْرِ، وَإِنِّي خَرَجْتُ لِأُخْبِرَكُمْ بِهَا، فَجَاءَ رَجُلَانِ يَحْتَقَّانِ مَعَهُمَا الشَّيْطَانُ، فَنُسِّيتُهَا، فَالْتَمِسُوهَا فِي الْعَشْرِ الْأَوَاخِرِ مِنْ رَمَضَانَ، الْتَمِسُوهَا فِي التَّاسِعَةِ وَالسَّابِعَةِ وَالْخَامِسَةِ\". قَالَ: قُلْتُ: يَا أَبَا سَعِيدٍ إِنَّكُمْ أَعْلَمُ بِالْعَدَدِ مِنَّا. قَالَ: أَجَلْ نَحْنُ أَحَقُّ بِذَلِكَ مِنْكُمْ. قَالَ: قُلْتُ: مَا التَّاسِعَةُ وَالسَّابِعَةُ وَالْخَامِسَةُ؟ قَالَ: إِذَا مَضَتْ وَاحِدَةٌ وَعِشْرُونَ فَالَّتِي تَلِيهَا ثِنْتَانِ وَعِشْرُونَ، فَهِيَ التَّاسِعَةُ. فَإِذَا مَضَتْ ثَلَاثٌ وَعِشْرُونَ فَالَّتِي تَلِيهَا السَّابِعَةُ، فَإِذَا مَضَى خَمْسٌ وَعِشْرُونَ فَالَّتِي تَلِيهَا الْخَامِسَةُ. (م)", "malayalam": "അബൂസഈദിൽ ഖുദ്രി(റ): 'ലൈലത്തുൽ ഖദ്ർ' എന്നാണെന്ന് വ്യക്തമാക്കപ്പെടുന്നതിനു മുമ്പ് അതന്വേഷിച്ച് ഒരു റമളാൻ മാസത്തിലെ നടുവിലെ പത്തിൽ നബി(സ) ഇഅ്തികാഫിരുന്നു. നടുവിലെ പത്ത് അവസാനിച്ചപ്പോൾ അവിടത്തെ കൽപനപ്രകാരം തമ്പുകൾ പൊളിച്ചുമാറ്റപ്പെട്ടു. അനന്തരം അത് അവസാനത്തെ പത്തിലാണെന്ന് അവിടത്തേക്ക് വ്യക്തമാക്കപ്പെട്ടു. ഉടനെ തമ്പുകെട്ടാൻ കല്പിക്കുകയും അതു വീണ്ടും നിർമ്മിക്കുകയും ചെയ്തു. പിന്നെ നബി(സ) ജനങ്ങളുടെ അടുക്കലെത്തി. ഇങ്ങനെ പറഞ്ഞു: \"ലൈലതുൽ ഖദ്ർ ഏതു രാത്രിയാണെന്ന് എനിക്കു വ്യക്തമാക്കപ്പെട്ടിരിക്കുന്നു. അതു നിങ്ങളെ അറിയിക്കാനാണ് ഞാൻ പുറത്തുവന്നത്. ആ സമയം തർക്കിക്കുന്ന രണ്ടുപേർ വന്നു. അവരോടുകൂടെ പിശാചുമുണ്ടായിരുന്നു. തന്നിമിത്തം ഞാനതു മറന്നുപോയി. അതുകൊണ്ട് നിങ്ങൾ റമളാനിലെ അവസാനത്തെ പത്തിൽ അതിനെ അന്വേഷിക്കുക. ഒമ്പതാം രാത്രിയും ഏഴാം രാത്രിയും അഞ്ചാം രാത്രിയും നിങ്ങൾ അതിനെ അന്വേഷിക്കുക.\" നിവേദകൻ പറയുന്നു: ഓ, അബൂസഈദ്, എണ്ണത്തെ സംബന്ധിച്ച് നിങ്ങൾക്കാണ് ഞങ്ങളേക്കാൾ അറിവുള്ളത്. അദ്ദേഹം പറഞ്ഞു: അതെ, നിങ്ങളെക്കാൾ അതിനർഹരായവർ ഞങ്ങൾ തന്നെയാണ്. നിവേദകൻ ചോദിച്ചു: ഒമ്പതാം രാവ്, ഏഴാം രാവ്, അഞ്ചാം രാവ് എന്നു പറഞ്ഞാൽ എന്താണ്? അബൂസഈദ്(റ) പറഞ്ഞു: ഇരുപത്തിയൊന്നു കഴിഞ്ഞാൽ അതിനടുത്ത് ഇരുപത്തിരണ്ടു വരും. അതാണ് ഒമ്പതാം രാവ്. ഇരുപത്തിമൂന്നു കഴിഞ്ഞാൽ അതിനോടടുത്ത് വരുന്നതാണ് ഏഴ്. ഇരുപത്തഞ്ച് കഴിഞ്ഞാൽ അതിനോടടുത്ത് വരുന്നതാണ് അഞ്ച്. (ഒമ്പതും, ഏഴും, അഞ്ചും രാവുകൾ അവശേഷിക്കുന്ന രാവുകളാണീ പറഞ്ഞത് കൊണ്ടുള്ള ഉദ്ദേശ്യം). (മു)", "narrator_ml": "അബൂസഈദിൽ ഖുദ്രി(റ)", "source_codes_ar": ["م"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 86, "page_start": 135}, {"hadith_no": 347, "arabic": "عَنْ زِرِّ بْنِ حُبَيْشٍ رَضِيَ اللهُ عَنْهُ قَالَ: سَأَلْتُ أُبَيَّ بْنَ كَعْبٍ رَضِيَ اللهُ عَنْهُ فَقُلْتُ: إِنَّ أَخَاكَ ابْنَ مَسْعُودٍ يَقُولُ: مَنْ يَقُمِ الْحَوْلَ يُصِبْ لَيْلَةَ الْقَدْرِ، فَقَالَ: رَحِمَهُ اللَّهُ، أَرَادَ أَنْ لَا يَتَّكِلَ النَّاسُ، أَمَا إِنَّهُ قَدْ عَلِمَ أَنَّهَا فِي رَمَضَانَ، وَأَنَّهَا فِي الْعَشْرِ الْأَوَاخِرِ، وَأَنَّهَا لَيْلَةُ سَبْعٍ وَعِشْرِينَ. ثُمَّ حَلَفَ– لَا يَسْتَثْنِي– أَنَّهَا لَيْلَةُ سَبْعٍ وَعِشْرِينَ. فَقُلْتُ: بِأَيِّ شَيْءٍ تَقُولُ ذَلِكَ يَا أَبَا الْمُنْذِرِ؟ قَالَ: بِالْعَلَامَةِ– أَوْ بِالْآيَةِ– الَّتِي أَخْبَرَنَا رَسُولُ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ أَنَّهَا تَطْلُعُ يَوْمَئِذٍ لَا شُعَاعَ لَهَا. (م)", "malayalam": "സിർറുബ്നു ഹുബൈശ്(റ): ഞാൻ ഉബയ്യുബ്നു കഅ്ബ്(റ)വിനോട് ചോദിച്ചു: നിങ്ങളുടെ സഹോദരൻ ഇബ്നുമസ്ഊദ്(റ) കൊല്ലം മുഴുവൻ രാത്രി നിസ്കരിക്കുന്നവനു ലൈലതുൽ ഖദ്റിന്റെ അനുഗ്രഹം കിട്ടുന്നതാണെന്ന് പറയുന്നു. അപ്പോൾ ഉബയ്യ്(റ) പറഞ്ഞു: അല്ലാഹു അദ്ദേഹത്തിന് കരുണ ചെയ്യട്ടെ. അദ്ദേഹം അങ്ങനെ പറയുന്നത് ജനങ്ങൾ ഒരു ദിവസം മാത്രം ആരാധനയിൽ മുഴുകി മറ്റു ദിവസങ്ങൾ ഉപേക്ഷിക്കാതിരിക്കാൻ വേണ്ടിയാണ്. അതു റമളാനിലെ അവസാനത്തെ പത്തിൽ ഇരുപത്തിയേഴാം രാവിലാണെന്ന് അദ്ദേഹത്തിന് അറിയാം. ശേഷം അതു റമളാൻ ഇരുപത്തിയേഴിനാണ് എന്ന് അദ്ദേഹം സത്യം ചെയ്തു പറഞ്ഞു. അപ്പോൾ ഞാൻ ചോദിച്ചു: നിങ്ങൾ എങ്ങനെയാണ് അത് ഉറപ്പിച്ചുപറയുന്നത്? അദ്ദേഹം പറഞ്ഞു: നബി(സ) ഞങ്ങൾക്ക് അറിയിച്ചുതന്ന അടയാളങ്ങളും തെളിവുകളും അടിസ്ഥാനമാക്കിയാണ് ഞാൻ പറയുന്നത്. അന്ന് സൂര്യൻ കിരണങ്ങളില്ലാതെയാണ് ഉദിക്കുക. (മു)", "narrator_ml": "സിർറുബ്നു ഹുബൈശ്(റ)", "source_codes_ar": ["م"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 86, "page_start": 136}, {"hadith_no": 348, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: كَانَ رَسُولُ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ يُجَاوِرُ فِي الْعَشْرِ الْأَوَاخِرِ مِنْ رَمَضَانَ، وَيَقُولُ: \"تَحَرَّوْا لَيْلَةَ الْقَدْرِ فِي الْعَشْرِ الْأَوَاخِرِ مِنْ رَمَضَانَ\". حَسَنٌ صَحِيحٌ. (ت)", "malayalam": "ആഇശ(റ): നബി(സ) റമളാൻ അവസാനത്തെ പത്തിൽ ആരാധനക്കായി ഒഴിഞ്ഞുനിൽക്കുമായിരുന്നു. \"റമളാൻ അവസാനത്തെ പത്തിൽ നിങ്ങൾ ലൈലതുൽ ഖദ്ർ പ്രതീക്ഷിക്കുവിൻ\" എന്ന് നബി(സ) പറയാറുണ്ടായിരുന്നു. (തു)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 86, "page_start": 137}, {"hadith_no": 349, "arabic": "عَنْ زِرِّ بْنِ حُبَيْشٍ رَضِيَ اللهُ عَنْهُ قَالَ: قُلْتُ لِأُبَيِّ بْنِ كَعْبٍ رَضِيَ اللهُ عَنْهُ: إِنِّي عَلِمْتُ– أَبَا الْمُنْذِرِ– أَنَّهَا لَيْلَةُ سَبْعٍ وَعِشْرِينَ؟ قَالَ: بَلَى، أَخْبَرَنَا رَسُولُ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: \"أَنَّهَا لَيْلَةٌ، صَبِيحَتُهَا تَطْلُعُ الشَّمْسُ لَيْسَ لَهَا شُعَاعٌ\". فَعَدَدْنَا وَحَفِظْنَا، وَاللَّهِ، لَقَدْ عَلِمَ ابْنُ مَسْعُودٍ أَنَّهَا فِي رَمَضَانَ، وَأَنَّهَا لَيْلَةُ سَبْعٍ وَعِشْرِينَ، وَلَكِنْ كَرِهَ أَنْ يُخْبِرَكُمْ فَتَتَّكِلُوا. حَسَنٌ صَحِيحٌ. (م,د,ت)", "malayalam": "സിർറുബ്നു ഹുബൈശ്(റ): ഞാൻ ഉബയ്യുബ്നു കഅ്ബ്(റ)വിനോട് ചോദിച്ചു: അബുൽമുൻദിർ, ലൈലത്തുൽ ഖദ്ർ ഇരുപത്തിഏഴാം രാവിലല്ലേ? അദ്ദേഹം പറഞ്ഞു: അതെ, ഞങ്ങളോട് റസൂൽ(സ) പറഞ്ഞിട്ടുണ്ട്: \"ആ രാവിന്റെ പ്രഭാതത്തിലുദിക്കുന്ന സൂര്യന് കിരണങ്ങളുണ്ടാവില്ല.\" ആയതിനാൽ ഞങ്ങൾ ആ കാര്യം എണ്ണി നിശ്ചയിക്കുകയും സൂക്ഷ്മമായി മനസ്സിലാക്കുകയും ചെയ്തു. അദ്ദേഹം പറയുന്നു: അല്ലാഹുവാണ്, ഇബ്നുമസ്ഊദ്(റ) ഈ രാത്രി റമളാനിലാണെന്നും ഇരുപത്തിഏഴാം രാവിലാണെന്നും അറിഞ്ഞിട്ടുണ്ട്. എങ്കിലും നിങ്ങളോട് അതു തുറന്ന് പറയാൻ അദ്ദേഹം ഇഷ്ടപ്പെട്ടില്ല. കാരണം നിങ്ങൾ അങ്ങനെ മാത്രം കൈക്കൊള്ളാൻ സാധ്യതയുള്ളതിനാലാണ് അങ്ങനെ പറഞ്ഞത്. (മു,ദ,തു)", "narrator_ml": "സിർറുബ്നു ഹുബൈശ്(റ)", "source_codes_ar": ["م", "د", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 86, "page_start": 137}, {"hadith_no": 350, "arabic": "عَنْ أَبِي بَكْرَةَ رَضِيَ اللهُ عَنْهُ، وَذُكِرَتْ لَيْلَةُ الْقَدْرِ عِنْدَهُ، فَقَالَ: مَا أَنَا مُلْتَمِسُهَا– لِشَيْءٍ سَمِعْتُهُ مِنْ رَسُولِ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ– إِلَّا فِي الْعَشْرِ الْأَوَاخِرِ، فَإِنِّي سَمِعْتُهُ يَقُولُ: \"الْتَمِسُوهَا فِي تِسْعٍ يَبْقَيْنَ، أَوْ فِي سَبْعٍ يَبْقَيْنَ، أَوْ فِي خَمْسٍ يَبْقَيْنَ، أَوْ فِي ثَلَاثِ أَوَاخِرِ لَيْلَةٍ\". قَالَ: وَكَانَ أَبُو بَكْرَةَ يُصَلِّي فِي الْعِشْرِينَ مِنْ رَمَضَانَ كَصَلَاتِهِ فِي سَائِرِ السَّنَةِ، فَإِذَا دَخَلَ الْعَشْرُ اجْتَهَدَ. حَسَنٌ صَحِيحٌ. (ت)", "malayalam": "അബുബക്റത്(റ): ലൈലത്തുൽ ഖദ്റിനെപറ്റി പരാമർശിക്കപ്പെട്ടപ്പോൾ അദ്ദേഹം പറഞ്ഞു: റസൂൽ(സ)യിൽ നിന്നു കേട്ട ഒരുകാര്യം നിമിത്തമായി ഞാൻ അതിനെ അവസാനത്തെ പത്തിലല്ലാതെ പ്രതീക്ഷിക്കാറില്ല. നബി(സ) പറയുന്നതു ഞാൻ കേട്ടിട്ടുണ്ട്. \"ലൈലത്തുൽ ഖദ്റിനെ നിങ്ങൾ അഞ്ചോ ഏഴോ ഒമ്പതോ ശേഷിക്കുന്ന അവസരങ്ങളിൽ പ്രതീക്ഷിക്കുക, (ഇരുപത്തി ഒന്നാം രാവിലോ, ഇരുപത്തിമൂന്നാം രാവിലേ, ഇരുപത്തിയഞ്ചാം രാവിലോ എന്നർത്ഥം.) അല്ലെങ്കിൽ അവസാനത്തെ മൂന്നു ദിവസങ്ങളിൽ പ്രതീക്ഷിച്ചുകൊള്ളുക.\" നിവേദകൻ പറയുന്നു: റമളാൻ ഇരുപതുവരെ കൊല്ലത്തിൽ മറ്റു ദിവസങ്ങളെപ്പോലെ അബൂബക്ർ(റ) നിസ്ക്കരിക്കും. എന്നാൽ അവസാനത്തെ പത്തായാൽ അദ്ദേഹം പരിശ്രമിക്കും. (തു)", "narrator_ml": "അബുബക്റത്(റ)", "source_codes_ar": ["ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 86, "page_start": 137}, {"hadith_no": 351, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا: أَنَّ النَّبِيَّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ كَانَ يَعْتَكِفُ الْعَشْرَ الْأَوَاخِرَ مِنْ رَمَضَانَ حَتَّى قَبَضَهُ اللَّهُ، ثُمَّ اعْتَكَفَ أَزْوَاجُهُ مِنْ بَعْدِهِ. (ق,د,ت)", "malayalam": "ആഇശ(റ): തന്റെ വിയോഗം വരെ റമളാനിലെ അവസാനത്തെ പത്തിൽ നബി(സ) ഇഅ്തികാഫിരിക്കാറുണ്ട് (ഭജനമിരിക്കുക). അവിടത്തെ ശേഷം തന്റെ ഭാര്യമാരും ഇഅ്തികാഫിരിക്കാറുണ്ട്. (ബു,ദ,തു)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["ق", "د", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 87, "page_start": 137}, {"hadith_no": 352, "arabic": "عَنْ أُبَيِّ بْنِ كَعْبٍ رَضِيَ اللهُ عَنْهُ: أَنَّ النَّبِيَّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ كَانَ يَعْتَكِفُ الْعَشْرَ الْأَوَاخِرَ مِنْ رَمَضَانَ، فَلَمْ يَعْتَكِفْ عَامًا، فَلَمَّا كَانَ فِي الْعَامِ الْمُقْبِلِ اعْتَكَفَ عِشْرِينَ لَيْلَةً. (د,جه)", "malayalam": "ഉബയ്യുബ്നു കഅ്ബ്(റ): നിശ്ചയം നബി(സ) റമളാനിലെ അവസാന പത്തു ദിനങ്ങളിൽ ഭജനമിരിക്കാറുണ്ട്. ഒരു വർഷം നബി(സ) ഭജനമിരുന്നില്ല. അങ്ങനെ അടുത്ത വർഷം അവിടന്ന് ഇരുപത് രാത്രികളിൽ ഭജനമിരുന്നു. (ദ,ജ)", "narrator_ml": "ഉബയ്യുബ്നു കഅ്ബ്(റ)", "source_codes_ar": ["د", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 87, "page_start": 138}, {"hadith_no": 353, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: كَانَ النَّبِيُّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ يَعْتَكِفُ كُلَّ عَامٍ عَشْرَةَ أَيَّامٍ، فَلَمَّا كَانَ الْعَامُ الَّذِي قُبِضَ فِيهِ اعْتَكَفَ عِشْرِينَ يَوْمًا. وَكَانَ يُعْرَضُ عَلَيْهِ الْقُرْآنُ فِي كُلِّ عَامٍ مَرَّةً، فَلَمَّا كَانَ الْعَامُ الَّذِي قُبِضَ فِيهِ عُرِضَ عَلَيْهِ مَرَّتَيْنِ. (خ,د,جه)", "malayalam": "അബൂഹുറൈറ(റ): എല്ലാ വർഷവും നബി(സ) പത്തുദിവസം ഇഅ്തികാഫിരിക്കും. അവിടത്തെ വഫാത്ത് നടന്ന കൊല്ലം അവിടന്ന് ഇരുപതു ദിവസം ഇഅ്തികാഫിരുന്നു. ഓരോ കൊല്ലത്തിലും ഒരു പ്രാവശ്യം നബി(സ)യ്ക്കു ഖുർആൻ വെളിവാക്കപ്പെടും. വിയോഗം നടന്ന വർഷത്തിൽ നബി(സ)ക്കു രണ്ട് തവണ ഖുർആൻ വെളിപ്പെടുത്തപ്പെടുകയുണ്ടായി. (ബു,ദ,ജ)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["خ", "د", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 87, "page_start": 138}, {"hadith_no": 354, "arabic": "عَنْ عُمَرَ رَضِيَ اللهُ عَنْهُ أَنَّهُ سَأَلَ النَّبِيَّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ قَالَ: كُنْتُ نَذَرْتُ فِي الْجَاهِلِيَّةِ أَنْ أَعْتَكِفَ لَيْلَةً فِي الْمَسْجِدِ الْحَرَامِ؟ قَالَ: \"فَأَوْفِ بِنَذْرِكَ\". (ق,د,ت,ن,جه)", "malayalam": "ഉമർ(റ): അദ്ദേഹം നബി(സ)യോടു ചോദിച്ചു: ഞാൻ ജാഹിലിയ്യാ കാലത്ത് മസ്ജിദുൽ ഹറാമിൽ ഒരു രാത്രി ഇഅ്തികാഫിരിക്കാൻ നേർച്ചയാക്കിയിരുന്നു? നബി(സ) പറഞ്ഞു: \"നിന്റെ നേർച്ച വീട്ടിക്കൊള്ളുക.\" (ബു,മു,ദ,തു,ന,ജ)", "narrator_ml": "ഉമർ(റ)", "source_codes_ar": ["ق", "د", "ت", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 88, "page_start": 138}, {"hadith_no": 355, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: كَانَ النَّبِيُّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ إِذَا أَرَادَ أَنْ يَعْتَكِفَ صَلَّى الصُّبْحَ، ثُمَّ دَخَلَ الْمَكَانَ الَّذِي يُرِيدُ أَنْ يَعْتَكِفَ فِيهِ. فَأَرَادَ أَنْ يَعْتَكِفَ الْعَشْرَ الْأَوَاخِرَ مِنْ رَمَضَانَ، فَأَمَرَ، فَضُرِبَ لَهُ خِبَاءٌ، فَأَمَرَتْ عَائِشَةُ بِخِبَاءٍ فَضُرِبَ لَهَا، وَأَمَرَتْ حَفْصَةُ بِخِبَاءٍ فَضُرِبَ لَهَا، فَلَمَّا رَأَتْ زَيْنَبُ خِبَاءَهُمَا أَمَرَتْ بِخِبَاءٍ فَضُرِبَ لَهَا، فَلَمَّا رَأَى ذَلِكَ رَسُولُ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"آلْبِرَّ تُرِدْنَ\". فَلَمْ يَعْتَكِفْ فِي رَمَضَانَ، وَاعْتَكَفَ عَشْرًا مِنْ شَوَّالٍ. (ق,د,ت,ن,جه)", "malayalam": "ആഇശ(റ): നബി(സ) ഇഅ്തികാഫിരിക്കാൻ ഉദ്ദേശിച്ചാൽ സുബ്ഹി നിസ്കരിച്ചു ഇഅ്തികാഫിരിക്കുന്നിടത്തേയ്ക്കു കടന്നിരിക്കുകയാണു ചെയ്തിരുന്നത്. അങ്ങനെ റമളാൻ അവസാനത്തെ പത്തിൽ നബി(സ) ഇഅ്തികാഫിരിക്കാൻ ഉദ്ദേശിച്ചപ്പോൾ കൽപ്പനയനുസരിച്ച് ഒരു തമ്പ് നിർമ്മിക്കപ്പെട്ടു. അപ്പോൾ ആഇശ(റ)യും ഒരു തമ്പു കെട്ടാൻ കൽപ്പിച്ചു. അതു നിർമ്മിക്കപ്പെടുകയും ചെയ്തു. ഹഫ്സ(റ)യും ഒരു തമ്പു കെട്ടിച്ചു. സൈനബ(റ) ഇതുകണ്ടപ്പോൾ തനിക്കും ഒരു തമ്പു കെട്ടിച്ചു. നബി(സ) ഇതു കണ്ടപ്പോൾ \"ഗുണമാണോ ഇവരുദ്ദേശിക്കുന്നത്?\" എന്നു ചോദിച്ചു. ആ റമളാനിൽ നബി(സ) ഇഅ്തികാഫിരുന്നില്ല. പിന്നെ ശവ്വാൽ പത്ത്ദിനങ്ങളിലാണ് നബി(സ) ഇഅ്തികാഫിരുന്നത്. (ബു,മു,ദ,തു,ന,ജ)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["ق", "د", "ت", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 89, "page_start": 138}, {"hadith_no": 356, "arabic": "عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ قَالَ: كَانَ النَّبِيُّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ يَعْتَكِفُ فِي الْعَشْرِ الْأَوَاخِرِ مِنْ رَمَضَانَ، فَلَمْ يَعْتَكِفْ عَامًا، فَلَمَّا كَانَ فِي الْعَامِ الْمُقْبِلِ اعْتَكَفَ عِشْرِينَ. (ت)", "malayalam": "അനസുബ്നു മാലിക്(റ): നബി(സ) റമളാനിലെ അവസാന പത്തിൽ ഇഅ്തികാഫ് ഇരിക്കാറുണ്ട്. എന്നാൽ ഒരുവർഷം അപ്രകാരം ചെയ്തില്ല. അടുത്തവർഷം ഇരുപത് ദിവസം ഇഅ്തികാഫ് ഇരിക്കുകയുണ്ടായി. (തു)", "narrator_ml": "അനസുബ്നു മാലിക്(റ)", "source_codes_ar": ["ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 89, "page_start": 139}, {"hadith_no": 357, "arabic": "عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ رَضِيَ اللهُ عَنْهُ قَالَ: إِنَّ رَسُولَ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ اعْتَكَفَ الْعَشْرَ الْأَوَّلَ مِنْ رَمَضَانَ، ثُمَّ اعْتَكَفَ الْعَشْرَ الْأَوْسَطَ فِي قُبَّةٍ تُرْكِيَّةٍ عَلَى سُدَّتِهَا حَصِيرٌ. قَالَ: فَأَخَذَ الْحَصِيرَ بِيَدِهِ فَنَحَّاهَا فِي نَاحِيَةِ الْقُبَّةِ، ثُمَّ أَطْلَعَ رَأْسَهُ فَكَلَّمَ النَّاسَ فَدَنَوْا مِنْهُ، فَقَالَ: \"إِنِّي اعْتَكَفْتُ الْعَشْرَ الْأَوَّلَ، أَلْتَمِسُ هَذِهِ اللَّيْلَةَ، ثُمَّ اعْتَكَفْتُ الْعَشْرَ الْأَوْسَطَ، ثُمَّ أُتِيتُ فَقِيلَ لِي: إِنَّهَا فِي الْعَشْرِ الْأَوَاخِرِ، فَمَنْ أَحَبَّ مِنْكُمْ أَنْ يَعْتَكِفَ، فَلْيَعْتَكِفْ\". فَاعْتَكَفَ النَّاسُ مَعَهُ، قَالَ: \"وَإِنِّي أُرِيتُهَا لَيْلَةَ وِتْرٍ، وَإِنِّي أَسْجُدُ صَبِيحَتَهَا فِي طِينٍ وَمَاءٍ\". فَأَصْبَحَ مِنْ لَيْلَةِ إِحْدَى وَعِشْرِينَ، وَقَدْ قَامَ إِلَى الصُّبْحِ، فَمَطَرَتِ السَّمَاءُ، فَوَكَفَ الْمَسْجِدُ، فَأَبْصَرْتُ الطِّينَ وَالْمَاءَ، فَخَرَجَ حِينَ فَرَغَ مِنْ صَلَاةِ الصُّبْحِ، وَجَبِينُهُ وَرَوْثَةُ أَنْفِهِ فِيهِمَا الطِّينُ وَالْمَاءُ، وَإِذَا هِيَ لَيْلَةُ إِحْدَى وَعِشْرِينَ مِنَ الْعَشْرِ الْأَوَاخِرِ. (م)", "malayalam": "അബൂസഈദുൽ ഖുദ്രി(റ): റമളാനിലെ ആദ്യപത്തിൽ നബി(സ) ഇഅ്തികാഫ് ഇരുന്നു. പിന്നെ നടുവിലെ പത്തിൽ ഒരു തുർക്കീഖുബ്ബയിൽ നബി (സ) ഇഅ്തികാഫ് ഇരുന്നു. അതിന്റെ വാതിലിൽ ഒരു പായയുണ്ടായിരുന്നു. നബി(സ) പായ കൈകൊണ്ടു എടുത്ത് ഖുബ്ബയുടെ ഒരു ഭാഗത്തേക്കു മാറ്റി പിന്നെ തല പുറത്തുകാട്ടി ജനങ്ങളോട് സംസാരിച്ചു. അപ്പോൾ അവർ നബി (സ)യുടെ അടുത്ത് വന്നു. അങ്ങനെ നബി(സ) പറഞ്ഞു: \"ഈ രാത്രിയെ പ്രതീക്ഷിച്ച്, ഒന്നാം പത്തിൽ ഞാൻ ഇഅ്തികാഫ് ഇരുന്നു. പിന്നെ ഞാൻ നടുവിലെ പത്തിലും ഇഅ്തികാഫ് ഇരുന്നു. പിന്നെ എനിക്ക് അറിയിക്കപ്പെട്ടു: അത് അവസാന പത്തിലാണെന്ന്. അത്കൊണ്ട് നിങ്ങളിൽ ആരെങ്കിലും ഇഅ്തികാഫ് ഇരിക്കാൻ ഇഷ്ടപ്പെടുന്നെങ്കിൽ ഇഅ്തികാഫ് ഇരുന്നുകൊള്ളുക.\" അങ്ങനെ ജനങ്ങൾ നബി(സ)യോടൊപ്പം ഇഅ്തികാഫ് ഇരുന്നു. നബി(സ) പറഞ്ഞു: \"ഒറ്റപ്പെട്ട രാത്രിയാണ് അതെന്ന് എനിക്കറിയിക്കപ്പെട്ടു. അതിന്റെ പ്രഭാതത്തിൽ ഞാൻ വെള്ളത്തിലും ചെളിയിലും സുജൂദ് ചെയ്യുമെന്നും.\" അങ്ങനെ ഇരുപത്തിയൊന്നാം രാവ് പുലർന്നു. നബി(സ) സുബ്ഹി നിസ്കരിക്കാൻ നിന്നു. അപ്പോൾ മഴ വർഷിച്ചു. പള്ളിയാകെ നിറഞ്ഞൊലിച്ചു. വെള്ളവും ചെളിയും കാണാൻ തുടങ്ങി. സുബ്ഹി കഴിഞ്ഞ ഉടനെ നബി(സ) പുറപ്പെട്ടു. അവിടത്തെ മൂക്കിൻമേലും നെറ്റിയിലും വെള്ളവും ചെളിയുമുണ്ടായിരുന്നു. അത് അവസാനത്തെ പത്തിലെ ഇരുപത്തിയൊന്നാം രാവിലായിരുന്നു. (മു)", "narrator_ml": "അബൂസഈദുൽ ഖുദ്രി(റ)", "source_codes_ar": ["م"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 90, "page_start": 139}, {"hadith_no": 358, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا أَنَّ النَّبِيَّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: أَرَادَ أَنْ يَعْتَكِفَ، فَلَمَّا انْصَرَفَ إِلَى الْمَكَانِ الَّذِي أَرَادَ أَنْ يَعْتَكِفَ فِيهِ إِذَا أَخْبِيَةٌ، خِبَاءُ عَائِشَةَ، وَخِبَاءُ حَفْصَةَ، وَخِبَاءُ زَيْنَبَ، فَقَالَ: \"أَالْبِرَّ تَقُولُونَ بِهِنَّ؟\". ثُمَّ انْصَرَفَ فَلَمْ يَعْتَكِفْ حَتَّى اعْتَكَفَ عَشْرًا مِنْ شَوَّالٍ. (خ)", "malayalam": "ആഇശ(റ): നബി(സ) ഇഅ്തികാഫിരിക്കാൻ ഉദ്ദേശിച്ചു. നബി(സ) ഇരിക്കാൻ ഉദ്ദേശിച്ച സ്ഥലത്തേക്ക് തിരിഞ്ഞപ്പോൾ അവിടങ്ങളിൽ ആഇശ(റ), ഹഫ്സ(റ), സൈനബ്(റ) എന്നിവരുടെ കൂടാരങ്ങളുണ്ട്. അന്നേരം നബി(സ) \"ഈ കാര്യം നന്മയാണെന്ന് കരുതുന്നോ?\" എന്ന് ചോദിച്ച് ഇഅ്തികാഫ് ഇരിക്കാതെ തിരിഞ്ഞു പോയി. പിന്നീട് ശവ്വാലിൽ പത്ത് ദിവസം ഇഅ്തികാഫിരുന്നു. (ബു)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["خ"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 91, "page_start": 140}, {"hadith_no": 359, "arabic": "عَنِ ابْنِ عُمَرَ رَضِيَ اللهُ عَنْهُمَا: أَنَّ النَّبِيَّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ كَانَ يَعْتَكِفُ الْعَشْرَ الْأَوَاخِرَ مِنْ رَمَضَانَ، قَالَ نَافِعٌ: وَقَدْ أَرَانِي عَبْدُ اللَّهِ الْمَكَانَ الَّذِي كَانَ يَعْتَكِفُ فِيهِ رَسُولُ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ فِي الْمَسْجِدِ. (ق,د,جه)", "malayalam": "ഇബ്നുഉമർ(റ): നബി(സ) റമളാനിലെ അവസാന പത്തിൽ ഇഅ്തികാഫിരിക്കാറുണ്ട്. നാഫിഅ് പറയുന്നു: അബ്ദുല്ല(റ) നബി(സ) ഇരുന്നിരുന്ന പള്ളിയിലെ സ്ഥലം എനിക്ക് കാണിച്ചു തന്നു. (ബു,മു,ദ,ജ)", "narrator_ml": "ഇബ്നുഉമർ(റ)", "source_codes_ar": ["ق", "د", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 91, "page_start": 140}, {"hadith_no": 360, "arabic": "عَنِ ابْنِ عُمَرَ رَضِيَ اللهُ عَنْهُمَا، عَنِ النَّبِيِّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: أَنَّهُ كَانَ إِذَا اعْتَكَفَ طُرِحَ لَهُ فِرَاشُهُ– أَوْ يُوضَعُ لَهُ سَرِيرُهُ– وَرَاءَ أُسْطُوَانَةِ التَّوْبَةِ. (جه)", "malayalam": "ഇബ്നുഉമർ(റ): നബി(സ) ഇഅ്തികാഫ് ഇരുന്നാൽ 'തൗബ' തൂണിന് പിന്നിൽ അവിടത്തെ വിരിപ്പ് വിരിക്കുകയോ അല്ലെങ്കിൽ അവിടത്തെ കട്ടിൽ അവിടെ കൊണ്ടിടുകയോ ചെയ്യാറുണ്ടായിരുന്നു. (ജ)", "narrator_ml": "ഇബ്നുഉമർ(റ)", "source_codes_ar": ["جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 91, "page_start": 140}, {"hadith_no": 361, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: وَإِنْ كَانَ رَسُولُ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ لَيُدْخِلُ عَلَيَّ رَأْسَهُ وَهُوَ فِي الْمَسْجِدِ فَأُرَجِّلُهُ، وَكَانَ لَا يَدْخُلُ الْبَيْتَ إِلَّا لِحَاجَةٍ إِذَا كَانَ مُعْتَكِفًا. (خ)", "malayalam": "ആഇശ(റ): നബി(സ) പള്ളിയിലായിരിക്കെ എന്റെ അടുത്തേക്ക് തല നീട്ടിത്തരികയും ഞാൻ ചീകിക്കൊടുക്കുകയും ചെയ്യാറുണ്ട്. നബി(സ) ഇഅ്തികാഫിരിക്കുമ്പോൾ എന്തെങ്കിലും ആവശ്യത്തിനല്ലാതെ വീട്ടിലേക്ക് പ്രവേശിക്കാറില്ല. (ബു)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["خ"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 92, "page_start": 140}, {"hadith_no": 362, "arabic": "عَنْ صَفِيَّةَ زَوْجِ النَّبِيِّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ أَنَّهَا جَاءَتْ رَسُولَ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ تَزُورُهُ فِي اعْتِكَافِهِ فِي الْمَسْجِدِ فِي الْعَشْرِ الْأَوَاخِرِ مِنْ رَمَضَانَ فَتَحَدَّثَتْ عِنْدَهُ سَاعَةً، ثُمَّ قَامَتْ تَنْقَلِبُ، فَقَامَ النَّبِيُّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ مَعَهَا يَقْلِبُهَا، حَتَّى إِذَا بَلَغَتْ بَابَ الْمَسْجِدِ عِنْدَ بَابِ أُمِّ سَلَمَةَ، مَرَّ رَجُلَانِ مِنَ الْأَنْصَارِ فَسَلَّمَا عَلَى رَسُولِ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ، فَقَالَ لَهُمَا النَّبِيُّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: \"عَلَى رِسْلِكُمَا إِنَّمَا هِيَ صَفِيَّةُ بِنْتُ حُيَيٍّ\"، فَقَالَا: سُبْحَانَ اللَّهِ يَا رَسُولَ اللَّهِ وَكَبُرَ عَلَيْهِمَا، فَقَالَ النَّبِيُّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: \"إِنَّ الشَّيْطَانَ يَبْلُغُ مِنَ الْإِنْسَانِ مَبْلَغَ الدَّمِ وَإِنِّي خَشِيتُ أَنْ يَقْذِفَ فِي قُلُوبِكُمَا شَيْئًا\". (ق,د,جه)\nوَفِي رِوَايَةٍ لِابْنِ مَاجَه: وَكَانَ مَسْكَنُهَا (حَفْصَةَ رَضِيَ اللهُ عَنْهَا) فِي دَارِ أُسَامَةَ بْنِ زَيْدٍ. (جه)", "malayalam": "നബി(സ)യുടെ പത്നി സ്വഫിയ്യ(റ): നബി(സ) റമളാനിലെ അവസാനത്തെ പത്തിൽ പള്ളിയിൽ ഇഅ്തികാഫ് ഇരിക്കെ മഹതി നബി(സ)യുമായി സംഭാഷണം നടത്താൻ ചെല്ലുകയും കുറച്ച് സമയം സംസാരിക്കുകയും ചെയ്ത് തിരിച്ചു പോരാൻ എണീറ്റു. അന്നേരം കൂടെ അനുഗമിച്ച് നബി(സ)യും എണീറ്റു. പള്ളിയിലെ ഉമ്മുസലമ(റ)യുടെ വാതിലിനടുത്ത് എത്തിയപ്പോൾ അൻസാരികളിൽ പെട്ട രണ്ടാളുകൾ വന്ന് റസൂൽ(സ)യോട് സലാം പറഞ്ഞു. അവരോട് നബി(സ) പറഞ്ഞു: \"ഏയ്, നിൽക്കൂ. ഇത് ഹുയയ്യിന്റെ മകൾ സ്വഫിയ്യയാണ്.\" അന്നേരം അവർ രണ്ടുപേരും പറഞ്ഞു: സുബ്ഹാനല്ലാഹ്! അല്ലാഹുവിന്റെ റസൂലെ. നബി(സ) പറഞ്ഞത് അവർക്ക് വിഷമമായി. അപ്പോൾ നബി(സ) പറഞ്ഞു: \"നിശ്ചയം പിശാച് രക്തമോടുന്നിടത്തെല്ലാം എത്തുന്നു. തീർച്ചയായും നിങ്ങളുടെ മനസ്സിൽ അവൻ വല്ലതും തോന്നിപ്പിക്കുമോ എന്ന് ഞാൻ ഭയപ്പെടുന്നു.\" (ബു,മു,ദ,ജ)\nഇബ്നുമാജയിലെ നിവേദനം: മഹതി (ഹഫ്സ(റ) യുടെ താമസം ഉസാമതുബ്നു സൈദ്(റ)വിന്റെ വീട്ടിലായിരുന്നു. (ജ)", "narrator_ml": "നബി(സ)യുടെ പത്നി സ്വഫിയ്യ(റ)", "source_codes_ar": ["جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ لِابْنِ مَاجَه: وَكَانَ مَسْكَنُهَا (حَفْصَةَ رَضِيَ اللهُ عَنْهَا) فِي دَارِ أُسَامَةَ بْنِ زَيْدٍ. (جه)", "malayalam": null}], "bab_seq": 92, "page_start": 140}, {"hadith_no": 363, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: كَانَ رَسُولُ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ إِذَا اعْتَكَفَ يُدْنِي إِلَيَّ رَأْسَهُ فَأُرَجِّلُهُ، وَكَانَ لَا يَدْخُلُ الْبَيْتَ إِلَّا لِحَاجَةِ الْإِنْسَانِ. وَفِي رِوَايَةٍ: كَانَ رَسُولُ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ يَكُونُ مُعْتَكِفًا فِي الْمَسْجِدِ، فَيُنَاوِلُنِي رَأْسَهُ مِنْ خَلَلِ الْحُجْرَةِ فَأَغْسِلُ رَأْسَهُ، وَفِي رِوَايَةٍ: فَأُرَجِّلُهُ، وَأَنَا حَائِضٌ. (ق,د,ن,جه)", "malayalam": "ആഇശ(റ): നബി(സ) ഇഅ്തികാഫിരുന്നാൽ എന്റെയടുത്തേയ്ക്കു തല നീട്ടി വെക്കുകയും ഞാൻ നബി(സ)യുടെ മുടി ചീകിക്കൊടുക്കുകയും ചെയ്യാറുണ്ടായിരുന്നു. പ്രാഥമിക കാര്യങ്ങൾക്കു മാത്രമേ നബി(സ) വീട്ടിൽ പ്രവേശിക്കാറുണ്ടായിരുന്നുള്ളു.\nമറ്റൊരു നിവേദനം: നബി(സ) പള്ളിയിൽ ഇഅ്തികാഫിരിക്കുകയായിരിക്കും. നബി(സ) തന്റെ തല മുറിയുടെ ഒരു വിടവിലൂടെ നീട്ടിത്തരുകയും ഞാൻ തല കഴുകിക്കൊടുക്കുകയും ചെയ്യുമായിരുന്നു.\nമറ്റൊരു നിവേദനം: ഞാൻ ആർത്തവകാരിയായിരിക്കെ മുടി ചീകിക്കൊടുക്കുമായിരുന്നു. (ബു,മു,ദ,ന,ജ)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["ق", "د", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: كَانَ رَسُولُ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ يَكُونُ مُعْتَكِفًا فِي الْمَسْجِدِ، فَيُنَاوِلُنِي رَأْسَهُ مِنْ خَلَلِ الْحُجْرَةِ فَأَغْسِلُ رَأْسَهُ،", "malayalam": "മറ്റൊരു നിവേദനം: നബി(സ) പള്ളിയിൽ ഇഅ്തികാഫിരിക്കുകയായിരിക്കും. നബി(സ) തന്റെ തല മുറിയുടെ ഒരു വിടവിലൂടെ നീട്ടിത്തരുകയും ഞാൻ തല കഴുകിക്കൊടുക്കുകയും ചെയ്യുമായിരുന്നു."}, {"seq": 2, "arabic": "وَفِي رِوَايَةٍ: فَأُرَجِّلُهُ، وَأَنَا حَائِضٌ. (ق,د,ن,جه)", "malayalam": "മറ്റൊരു നിവേദനം: ഞാൻ ആർത്തവകാരിയായിരിക്കെ മുടി ചീകിക്കൊടുക്കുമായിരുന്നു. (ബു,മു,ദ,ന,ജ)"}], "bab_seq": 92, "page_start": 141}, {"hadith_no": 364, "arabic": "عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ رَضِيَ اللهُ عَنْهُ: أَنَّ رَسُولَ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ اعْتَكَفَ فِي قُبَّةٍ تُرْكِيَّةٍ، عَلَى سُدَّتِهَا قِطْعَةُ حَصِيرٍ. قَالَ: فَأَخَذَ الْحَصِيرَ بِيَدِهِ فَنَحَّاهَا فِي نَاحِيَةِ الْقُبَّةِ، ثُمَّ أَطْلَعَ رَأْسَهُ فَكَلَّمَ النَّاسَ. (جه)", "malayalam": "അബൂസഈദിൽ ഖുദ്രി(റ): ഒരു തുർക്കി ഖുബ്ബയിൽ നബി(സ) ഇഅ്തികാഫിരുന്നു. അതിന്റെ വാതിലിൽ ഒരു പായക്കഷണമുണ്ടായിരുന്നു. അദ്ദേഹം പറയുന്നു: നബി(സ) പായയെടുത്ത് ഖുബ്ബയുടെ ഒരു ഭാഗത്തേക്കു മാറ്റിവെച്ചു. എന്നിട്ട് തല പുറത്തുകാട്ടി ജനങ്ങളോടു സംസാരിച്ചു. (ജ)", "narrator_ml": "അബൂസഈദിൽ ഖുദ്രി(റ)", "source_codes_ar": ["جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 92, "page_start": 141}, {"hadith_no": 365, "arabic": "عَنْ صَفِيَّةَ بِنْتِ حُيَيٍّ رَضِيَ اللهُ عَنْهَا، زَوْجِ النَّبِيِّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: أَنَّهَا جَاءَتْ إِلَى رَسُولِ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ تَزُورُهُ، وَهُوَ مُعْتَكِفٌ فِي الْمَسْجِدِ، فِي الْعَشْرِ الْأَوَاخِرِ مِنْ شَهْرِ رَمَضَانَ. فَتَحَدَّثَتْ عِنْدَهُ سَاعَةً مِنَ الْعِشَاءِ، ثُمَّ قَامَتْ تَنْقَلِبُ، فَقَامَ مَعَهَا رَسُولُ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ يَقْلِبُهَا، حَتَّى إِذَا بَلَغَتْ بَابَ الْمَسْجِدِ الَّذِي كَانَ عِنْدَ مَسْكَنِ أُمِّ سَلَمَةَ، زَوْجِ النَّبِيِّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ فَمَرَّ بِهِمَا رَجُلَانِ مِنَ الْأَنْصَارِ، فَسَلَّمَا عَلَى رَسُولِ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ ثُمَّ نَفَذَا، فَقَالَ لَهُمَا رَسُولُ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: \"عَلَى رِسْلِكُمَا، إِنَّهَا صَفِيَّةُ بِنْتُ حُيَيٍّ\". قَالَا: سُبْحَانَ اللَّهِ يَا رَسُولَ اللَّهِ. وَكَبُرَ عَلَيْهِمَا ذَلِكَ. فَقَالَ رَسُولُ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: \"إِنَّ الشَّيْطَانَ يَجْرِي مِنِ ابْنِ آدَمَ مَجْرَى الدَّمِ، وَإِنِّي خَشِيتُ أَنْ يَقْذِفَ فِي قُلُوبِكُمَا شَيْئًا\". (ق,د,جه)", "malayalam": "നബി(സ)യുടെ ഭാര്യ സ്വഫിയ്യബിൻത് ഹുയയ്യ്(റ): റസൂൽ(സ) റമസാൻ മാസം അവസാനത്തെ പത്തിൽ പള്ളിയിൽ ഇഅ്തികാഫിരിക്കുമ്പോൾ അവർ നബി(സ)യെ കാണാൻ ചെന്നു. ഇശാ സമയം ഒത്തിരി നേരം നബി(സ)യോട് സംസാരിച്ചിട്ട് അവർ പോകാൻ എണീറ്റു. പറഞ്ഞയക്കാൻ നബി(സ) അവരോടൊപ്പം വന്നു. നബി(സ)യുടെ മറ്റൊരു ഭാര്യയായ ഉമ്മുസലമ(റ)യുടെ വീടിനടുത്തുള്ള, പള്ളിയുടെ വാതിലുവരെ അവർ എത്തി. അപ്പോൾ അൻസാരികളിൽ പെട്ട രണ്ടുപേർ ആ വഴിവന്നു. അവരിരുപേരും നബി(സ)യോട് സലാം ചൊല്ലി വേഗം കടന്നുപോവുകയായിരുന്നു. അപ്പോൾ നബി(സ) അവരെ വിളിച്ചു പറഞ്ഞു: \"ഏയ് നിൽക്കൂ, ഇതു ഹുയയ്യിന്റെ മകൾ സ്വഫിയ്യ(റ)യാണ്\". അവരിരുവരും പറഞ്ഞു: സുബ്ഹാനല്ലാഹ്! അല്ലാഹുവിന്റെ റസൂലെ. നബി(സ) പറഞ്ഞത് അവരെ വിഷമിപ്പിച്ചു. അപ്പോൾ നബി(സ) പറഞ്ഞു: \"പിശാച് മനുഷ്യ ശരീരത്തിൽ രക്തം നടക്കുന്നിടത്തൊക്കെ നടക്കും. നിങ്ങളുടെ ഹൃദയങ്ങളിൽ അവനെന്തെങ്കിലും തോന്നിപ്പിക്കുമോയെന്ന് ഞാൻ പേടിച്ചു\". (ബു,മു,ദ,ജ)", "narrator_ml": "നബി(സ)യുടെ ഭാര്യ സ്വഫിയ്യബിൻത് ഹുയയ്യ്(റ)", "source_codes_ar": ["ق", "د", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 93, "page_start": 141}, {"hadith_no": 366, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: كَانَ النَّبِيُّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ يَمُرُّ بِالْمَرِيضِ وَهُوَ مُعْتَكِفٌ، فَيَمُرُّ كَمَا هُوَ، وَلَا يُعَرِّجُ، يَسْأَلُ عَنْهُ. وَفِي رِوَايَةٍ: قَالَتْ: إِنْ كَانَ النَّبِيُّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ يَعُودُ الْمَرِيضَ وَهُوَ مُعْتَكِفٌ. (د)", "malayalam": "ആഇശ(റ): ഇഅ്തികാഫിരിക്കെ നബി(സ) രോഗിയുടെ അടുത്തുകൂടെ നടന്നുപോകും. തിരുമേനി(സ) അതുപോലെ തന്നെ നടക്കും. രോഗിയെക്കുറിച്ച് അന്വേഷിക്കാൻ അവിടെ നിൽക്കില്ല. മറ്റൊരു റിപ്പോർട്ട്: ഇഅ്തികാഫിരിക്കെ നബി(സ) രോഗികളെ സന്ദർശിക്കാറുണ്ട്. (ദ)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: قَالَتْ: إِنْ كَانَ النَّبِيُّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ يَعُودُ الْمَرِيضَ وَهُوَ مُعْتَكِفٌ. (د)", "malayalam": "മറ്റൊരു നിവേദന്: ഇഅ്തികാഫിരിക്കെ നബി(സ) രോഗികളെ സന്ദർശിക്കാറുണ്ട്. (ദ)"}], "bab_seq": 94, "page_start": 142}, {"hadith_no": 367, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: السُّنَّةُ عَلَى الْمُعْتَكِفِ أَنْ لَا يَعُودَ مَرِيضًا، وَلَا يَشْهَدَ جَنَازَةً، وَلَا يَمَسَّ امْرَأَةً وَلَا يُبَاشِرَهَا، وَلَا يَخْرُجَ لِحَاجَةٍ إِلَّا لِمَا لَا بُدَّ مِنْهُ، وَلَا اعْتِكَافَ إِلَّا بِصَوْمٍ، وَلَا اعْتِكَافَ إِلَّا فِي مَسْجِدٍ جَامِعٍ. (د,ن)", "malayalam": "ആഇശ(റ): അത്യാവശ്യ കാര്യങ്ങൾക്കല്ലാതെ പുറത്തുപോകാതിരിക്കലും സ്ത്രീയെ തൊടാതിരിക്കലും സുഖാനുഭൂതിയിലേർപ്പെടാതിരിക്കലും ജനാസയിൽ പങ്കെടുക്കാതിരിക്കലും രോഗിയെ സന്ദർശിക്കാതിരിക്കലുമാണ് ഇഅ്തികാഫ് ഇരിക്കുന്നവന് സുന്നത്ത്. നോമ്പുകൊണ്ടല്ലാതെ ഇഅ്തികാഫ് ഇല്ല. ജുമുഅ നടത്തപ്പെടുന്ന പള്ളിയിലല്ലാതെ ഇഅ്തികാഫും ഇല്ല. (ദ,ന)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["د", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 94, "page_start": 142}, {"hadith_no": 368, "arabic": "عَنِ ابْنِ عُمَرَ رَضِيَ اللهُ عَنْهُمَا: أَنَّ عُمَرَ رَضِيَ اللهُ عَنْهُ جَعَلَ عَلَيْهِ أَنْ يَعْتَكِفَ فِي الْجَاهِلِيَّةِ لَيْلَةً– أَوْ يَوْمًا– عِنْدَ الْكَعْبَةِ، فَسَأَلَ النَّبِيَّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ فَقَالَ: \"اعْتَكِفْ وَصُمْ\". وَفِي رِوَايَةٍ: فَبَيْنَمَا هُوَ مُعْتَكِفٌ إِذْ كَبَّرَ النَّاسُ فَقَالَ: مَا هَذَا يَا عَبْدَ اللَّهِ؟ قَالَ: سَبْيُ هَوَازِنَ، أَعْتَقَهُمُ النَّبِيُّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ. قَالَ: وَتِلْكَ الْجَارِيَةُ، فَأَرْسَلَهَا مَعَهُمْ. (ق,د,ت,ن)", "malayalam": "ഇബ്നുഉമർ(റ): ജാഹിലിയ്യാകാലത്ത്, ഒരു രാത്രി അല്ലെങ്കിൽ ഒരു പകൽ കഅ്ബക്കരികെ ഇഅ്തികാഫിരിക്കാൻ ഉമർ(റ) നേർച്ചയാക്കിയിരുന്നു. ഇതേക്കുറിച്ചദ്ദേഹം പ്രവാചകരോടു ചോദിച്ചപ്പോൾ തിരുമേനി(സ) പറഞ്ഞു: \"താങ്കൾ നോമ്പെടുക്കുകയും ഭജനമിരിക്കുകയും ചെയ്യുക.\"\nമറ്റൊരു നിവേദനം: ഉമർ(റ) ഇഅ്തികാഫ് ഇരിക്കെ ജനങ്ങൾ ഉച്ചത്തിൽ തക്ബീർ ചൊല്ലി. അപ്പോൾ ഉമർ(റ) ചോദിച്ചു: അബ്ദുല്ലാ, ഇതെന്താണ്? ഇബ്നുഉമർ(റ) പറഞ്ഞു: പ്രവാചകർ(സ) മോചിപ്പിച്ച 'ഹവാസിൻ' ഗോത്രത്തിലെ അടിമകളാണിവർ. ഉമർ(റ) പറഞ്ഞു: എന്നാൽ ഈ അടിമപ്പെൺകുട്ടിയും അങ്ങനെയിരിക്കട്ടെ (ഹവാസിനിലെ ഒരു പെൺകുട്ടി ഉമർ(റ)വിന്റെ അടിമയായിരുന്നു). അങ്ങനെ ഉമർ(റ) ആ പെൺകുട്ടിയെ അവരോടൊപ്പം പറഞ്ഞയച്ചു. (ബു,മു,ദ,തു,ന)", "narrator_ml": "ഇബ്നുഉമർ(റ)", "source_codes_ar": ["ق", "د", "ت", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: فَبَيْنَمَا هُوَ مُعْتَكِفٌ إِذْ كَبَّرَ النَّاسُ فَقَالَ: مَا هَذَا يَا عَبْدَ اللَّهِ؟ قَالَ: سَبْيُ هَوَازِنَ، أَعْتَقَهُمُ النَّبِيُّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ. قَالَ: وَتِلْكَ الْجَارِيَةُ، فَأَرْسَلَهَا مَعَهُمْ. (ق,د,ت,ن)", "malayalam": "മറ്റൊരു നിവേദനം: ഉമർ(റ) ഇഅ്തികാഫ് ഇരിക്കെ ജനങ്ങൾ ഉച്ചത്തിൽ തക്ബീർ ചൊല്ലി. അപ്പോൾ ഉമർ(റ) ചോദിച്ചു: അബ്ദുല്ലാ, ഇതെന്താണ്? ഇബ്നുഉമർ(റ) പറഞ്ഞു: പ്രവാചകർ(സ) മോചിപ്പിച്ച 'ഹവാസിൻ' ഗോത്രത്തിലെ അടിമകളാണിവർ. ഉമർ(റ) പറഞ്ഞു: എന്നാൽ ഈ അടിമപ്പെൺകുട്ടിയും അങ്ങനെയിരിക്കട്ടെ (ഹവാസിനിലെ ഒരു പെൺകുട്ടി ഉമർ(റ)വിന്റെ അടിമയായിരുന്നു). അങ്ങനെ ഉമർ(റ) ആ പെൺകുട്ടിയെ അവരോടൊപ്പം പറഞ്ഞയച്ചു. (ബു,മു,ദ,തു,ന)"}], "bab_seq": 94, "page_start": 142}, {"hadith_no": 369, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: إِنْ كُنْتُ لَأَدْخُلُ الْبَيْتَ لِلْحَاجَةِ، وَالْمَرِيضُ فِيهِ، فَمَا أَسْأَلُ عَنْهُ إِلَّا وَأَنَا مَارَّةٌ. قَالَتْ: وَكَانَ رَسُولُ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ لَا يَدْخُلُ الْبَيْتَ إِلَّا لِحَاجَةٍ، إِذَا كَانُوا مُعْتَكِفِينَ. (ق,د,ت,جه)", "malayalam": "ആഇശ(റ): ഞാനെന്തെങ്കിലും ആവശ്യത്തിന് വീട്ടിൽ പ്രവേശിക്കാറില്ല. അവിടെ ഒരു രോഗിയുണ്ടായാൽ, ഞാൻ നടന്നിട്ടല്ലാതെ രോഗിയെക്കുറിച്ച് അന്വേഷിക്കാറില്ല. മഹതി പറയുന്നു: നബി(സ) ഭജനമിരിക്കുന്നതിനിടയിൽ അവിടന്ന് ആവശ്യത്തിനല്ലാതെ വീട്ടിൽ പ്രവേശിക്കാറില്ല. (ബു,മു,ദ,തു,ജ)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["ق", "د", "ت", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 94, "page_start": 143}, {"hadith_no": 370, "arabic": "عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: \"الْمُعْتَكِفُ يَتْبَعُ الْجِنَازَةَ، وَيَعُودُ الْمَرِيضَ\". [ز: إِسْنَادُهُ ضَعِيفٌ، وَمُخَالِفٌ لِمَا رَوَاهُ الثِّقَاتُ] (جه)", "malayalam": "അനസ്(റ): റസൂൽ(സ) പറഞ്ഞു: \"ഇഅ്തികാഫിരിക്കുന്നവൻ ജനാസയെ പിന്തുടരാം. രോഗികളെ സന്ദർശിക്കുകയും ചെയ്യാം.\" (പരമ്പരയിൽ ദൗർബല്യമുണ്ട്, മാത്രമല്ല വിശ്വസ്ഥർ നിവേദനം ചെയ്ത ഹദീസുമായി ഇത് എതിരാണ്.) (ജ)", "narrator_ml": "അനസ്(റ)", "source_codes_ar": ["جه"], "grading_note_ml": null, "grading_note_ar": "ز: إِسْنَادُهُ ضَعِيفٌ، وَمُخَالِفٌ لِمَا رَوَاهُ الثِّقَاتُ", "explanation_ml": null, "variants": [], "bab_seq": 94, "page_start": 143}, {"hadith_no": 371, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: كَانَ رَسُولُ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ يُدْنِي إِلَيَّ رَأْسَهُ وَهُوَ مُجَاوِرٌ، فَأَغْسِلُهُ وَأُرَجِّلُهُ وَأَنَا فِي حُجْرَتِي، وَأَنَا حَائِضٌ، وَهُوَ فِي الْمَسْجِدِ. (جه)", "malayalam": "ആഇശ(റ): ആർത്തവമുള്ള നിലയിൽ ഞാനെന്റെ റൂമിലിരിക്കുമ്പോൾ പള്ളിയിൽ ഇരിക്കുന്ന നബി(സ) എന്നിലേക്ക് തലനീട്ടിത്തരികയും ഞാൻ മുടി കഴുകുകയും ചീകിക്കൊടുക്കുകയും ചെയ്യാറുണ്ട്. (ജ)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 95, "page_start": 143}, {"hadith_no": function crumb(parts){ $('crumb').innerHTML = parts.map(([t,h]) => h ? `<a href="${h}">${esc(t)}</a>` : esc(t)).join(' › '); }

function viewBooks(){
  crumb([['വാല്യം 2']]); $('title').textContent = 'ഹദീസ് വിജ്ഞാനകോശം';
  $('main').innerHTML = `<div class="schema">books (16) — only book 2 has hadith loaded</div><ul class="list">` +
    D.books.map(b => `<li class="row" onclick="${b.no===2?"location.hash='#/book/2'":''}" style="${b.no===2?'':'opacity:.55;cursor:default'}">
      <div class="num">${b.no}</div><div class="t"><div>${esc(b.title)}</div>
      <div class="meta">${b.chapters} ബാബുകൾ · പേജ് ${b.page??'-'}${b.no===2?' · 374 ഹദീസ്':''}</div></div></li>`).join('') + '</ul>';
}

function viewChapters(){
  crumb([['വാല്യം 2','#/'],['നോമ്പ്']]); $('title').textContent = 'كِتَابُ الصَّوْمِ · നോമ്പ്';
  const count = {}; D.hadiths.forEach(h => count[h.bab_seq] = (count[h.bab_seq]||0)+1);
  $('main').innerHTML = `<div class="schema">chapters (98) → title_ml, title_ar, start_page</div><ul class="list">` +
    D.chapters.map(c => `<li class="row" onclick="location.hash='#/ch/${c.no}'"><div class="num">${c.no}</div>
      <div class="t"><div>${esc(c.ml)}</div><div class="ar">${esc(c.ar)}</div>
      <div class="meta">${count[c.no]||0} ഹദീസ് · പേജ് ${c.page}</div></div></li>`).join('') + '</ul>';
}

function card(h){
  const codes = (h.source_codes_ar||[]).map(c => `<span class="chip">${esc(SRC[c]||c)}</span>`).join('');
  const grade = h.grading_note_ml || h.grading_note_ar;
  const vars = (h.variants||[]).length ? `<details><summary>മറ്റു നിവേദനങ്ങൾ (${h.variants.length}) — وفي رواية</summary>` +
    h.variants.map(v => `<div class="var">${v.arabic?`<div class="arabic">${esc(v.arabic)}</div>`:''}${v.malayalam?`<div class="ml">${esc(v.malayalam)}</div>`:'<div class="meta">(പരിഭാഷ പ്രധാന വാചകത്തിൽ ഉൾപ്പെട്ടിരിക്കുന്നു)</div>'}</div>`).join('') + '</details>' : '';
  const rl = (rels[h.hadith_no]||[]).sort((a,b)=>b.s-a.s);
  const rel = rl.length ? `<div class="chips rel">` + rl.map(r => `<span class="chip">${REL[r.relation]}: <a onclick="jump(${r.no})">#${r.no}</a> <span class="meta">${Math.round(r.s*100)}%</span></span>`).join('') + '</div>' : '';
  return `<article class="card" id="h${h.hadith_no}">
    <div class="card-top"><span class="badge">${h.hadith_no}</span><span class="meta">പേജ് ${h.page_start}</span></div>
    <div class="arabic">${esc(h.arabic)}</div>
    ${h.narrator_ml?`<span class="narr">${esc(h.narrator_ml)}</span>`:''}
    <div class="ml">${esc(h.malayalam)}</div>
    <div class="chips">${codes}</div>
    ${grade?`<div class="warn">⚠ ${esc(grade)}</div>`:''}
    ${h.explanation_ml?`<div class="note">${esc(h.explanation_ml)}</div>`:''}
    ${vars}${rel}
  </article>`;
}

function viewChapter(no){
  const c = D.chapters.find(c => c.no == no);
  crumb([['വാല്യം 2','#/'],['നോമ്പ്','#/book/2'],['ബാബ് '+no]]); $('title').textContent = c.ml;
  const hs = D.hadiths.filter(h => h.bab_seq == no);
  const prev = no>1?`<a href="#/ch/${no-1}">‹ മുമ്പത്തെ</a>`:'', next = no<D.chapters.length?`<a href="#/ch/${+no+1}">അടുത്തത് ›</a>`:'';
  $('main').innerHTML = `<div class="arabic" style="text-align:center;margin-top:12px">${esc(c.ar)}</div>` +
    hs.map(card).join('') + `<div class="crumb" style="display:flex;justify-content:space-between">${prev}<span></span>${next}</div>
    <div class="schema">hadith card fields: hadith_no · arabic_text · narrator_ml · malayalam_text · source_codes_ar → sources · grading_note_* · explanation_ml · hadith_variants · related_hadiths()</div>`;
}

function jump(n){ const h = byNo[n]; location.hash = `#/ch/${h.bab_seq}/${n}`; }

function viewSearch(q){
  const qa = strip(q), res = D.hadiths.filter(h => h.malayalam.includes(q) || strip(h.arabic).includes(qa)).slice(0,40);
  crumb([['വാല്യം 2','#/'],['തിരയൽ']]); $('title').textContent = `"${q}" — ${res.length} ഫലം`;
  $('main').innerHTML = res.map(card).join('') || '<p class="meta">ഒന്നും കണ്ടെത്തിയില്ല</p>';
}

function route(){
  const p = location.hash.replace(/^#\//,'').split('/');
  if (p[0]==='book') viewChapters();
  else if (p[0]==='ch') { viewChapter(+p[1]); if (p[2]) { const el = $('h'+p[2]); el?.scrollIntoView({block:'center'}); el?.classList.add('hl'); } else scrollTo(0,0); }
  else viewBooks();
}
let t; $('q').addEventListener('input', e => { clearTimeout(t); const v = e.target.value.trim(); t = setTimeout(() => v.length>1 ? viewSearch(v) : route(), 250); });
addEventListener('hashchange', route); route();
</script>
</body>
</html>

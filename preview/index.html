ِنِي بِهِ\". فَأَتَيْتُهُ مَعَهُ فَقَالَ: \"كَيْفَ تَصُومُ\". قُلْتُ: كُلَّ يَوْمٍ. قَالَ: \"صُمْ مِنْ كُلِّ جُمُعَةٍ ثَلَاثَةَ أَيَّامٍ\". قُلْتُ: إِنِّي أُطِيقُ أَفْضَلَ مِنْ ذَلِكَ. قَالَ: \"صُمْ يَوْمَيْنِ وَأَفْطِرْ يَوْمًا\". قَالَ: إِنِّي أُطِيقُ أَفْضَلَ مِنْ ذَلِكَ. قَالَ: \"صُمْ أَفْضَلَ الصِّيَامِ صِيَامَ دَاوُدَ عَلَيْهِ السَّلَامُ: صَوْمُ يَوْمٍ وَفِطْرُ يَوْمٍ\". (ن)", "malayalam": "അബ്ദുല്ലാഹിബ്നു അംറ്(റ): എന്റെ പിതാവ് എനിക്ക് കുലീനയായ ഒരു വനിതയെ വിവാഹം ചെയ്തുതന്നു. പിതാവ് അവളുടെ അടുക്കൽ വന്ന് ഭർത്താവിനെക്കുറിച്ച് ചോദിക്കാറുണ്ടായിരുന്നു. അവൾ പറയും: നല്ല മനുഷ്യൻ, നമ്മുടെ വിരിപ്പിൽ ഇതുവരെ ബന്ധപ്പെട്ടിട്ടില്ല. അദ്ദേഹത്തിന്റെ പാർശ്വം എന്നോടിതുവരെ ചേർത്തുവച്ചിട്ടുമില്ല. അദ്ദേഹമത് റസൂൽ(സ)യെ അറിയിക്കുകയും ചെയ്തു. അവിടന്ന് പറഞ്ഞു: \"അയാളെ എന്റെയടുത്തേക്ക് കൊണ്ടുവരിക.\" ഞാൻ അദ്ദേഹത്തോടൊപ്പം ചെന്നു. നബി(സ) ചോദിച്ചു: \"നീ എങ്ങനെയാണു നോമ്പെടുക്കുന്നത്?\" ഞാൻ പറഞ്ഞു: എല്ലാ ദിനവും. നബി(സ) അരുളി: \"ആഴ്ചയിൽ മൂന്ന് ദിവസം നോമ്പെടുക്കുക.\" ഞാൻ പറഞ്ഞു: എനിക്കതിലേറെ കഴിയുമല്ലോ, നബിയേ. അവിടന്ന് പറഞ്ഞു: \"രണ്ടുദിനം നോമ്പെടുക്കുക, ഒരു ദിനം നോമ്പ് മുറിക്കുക.\" ഞാൻ പറഞ്ഞു: എനിക്ക് അതിലേറെ കഴിയുമല്ലോ. തിരുമേനി(സ) അരുളി: \"നീ ദാവൂദ് നബി(അ)ന്റെ ഉത്തമവ്രതം അനുഷ്ഠിക്കുക; അഥവാ, ഒരു ദിനം നോമ്പെടുക്കുക. അടുത്ത ദിനം നോമ്പുമുറിക്കുക.\" (ന)", "narrator_ml": "അബ്ദുല്ലാഹിബ്നു അംറ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 27, "page_start": 81}, {"hadith_no": 124, "arabic": "عَنْ عَبْدِ اللَّهِ بْنِ عَمْرو رَضِيَ اللَّهُ عَنْهُمَا قَالَ: زَوَّجَنِي أَبِي امْرَأَةً فَجَاءَ يَزُورُهَا، فَقَالَ: كَيْفَ تَرَيْنَ بَعْلَكِ؟ فَقَالَتْ: نِعْمَ الرَّجُلُ مِنْ رَجُلٍ، لَا يَنَامُ اللَّيْلَ وَلَا يُفْطِرُ النَّهَارَ. فَوَقَعَ بِي وَقَالَ: زَوَّجْتُكَ امْرَأَةً مِنَ الْمُسْلِمِينَ فَعَضَلْتَهَا. قَالَ: فَجَعَلْتُ لَا أَلْتَفِتُ إِلَى قَوْلِهِ مِمَّا أَرَى عِنْدِي مِنَ الْقُوَّةِ وَالِاجْتِهَادِ، فَبَلَغَ ذَلِكَ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ: \"لَكِنِّي أَنَا أَقُومُ وَأَنَامُ، وَأَصُومُ وَأُفْطِرُ. فَقُمْ وَنَمْ، وَصُمْ وَأَفْطِرْ\". قَالَ: \"صُمْ مِنْ كُلِّ شَهْرٍ ثَلَاثَةَ أَيَّامٍ\". فَقُلْتُ: أَنَا أَقْوَى مِنْ ذَلِكَ. قَالَ: \"صُمْ صَوْمَ دَاوُدَ عَلَيْهِ السَّلَامُ: صُمْ يَوْمًا وَأَفْطِرْ يَوْمًا\". قُلْتُ: أَنَا أَقْوَى مِنْ ذَلِكَ. قَالَ: \"اقْرَأِ الْقُرْآنَ فِي كُلِّ شَهْرٍ\". ثُمَّ انْتَهَى إِلَى خَمْسَ عَشْرَة، وَأَنَا أَقُولُ: أَنَا أَقْوَى مِنْ ذَلِكَ. (ن)", "malayalam": "അബ്ദുല്ലാഹിബ്നു അംറ്(റ): എന്റെ പിതാവ് എനിക്കൊരു സ്ത്രീയെ വിവാഹം ചെയ്തുതന്നു. എന്നിട്ടദ്ദേഹം അവളെ സന്ദർശിക്കാനായി വന്നു. അവളോടു ചോദിച്ചു: എങ്ങനെയുണ്ട് നിന്റെ ഭർത്താവ്? അവൾ പറഞ്ഞു: വളരെ നല്ല മനുഷ്യൻ, രാത്രി ഉറങ്ങുകയോ പകൽ വ്രതം ഒഴിവാക്കുകയോ ചെയ്യില്ല. അദ്ദേഹം എന്നിലേക്കു തിരിഞ്ഞു പറഞ്ഞു: ഒരു മുസ്ലിം വനിതയെ നിനക്കു ഞാൻ വിവാഹം ചെയ്തുതന്നു. എന്നിട്ട് നീ അവളുമായി ദാമ്പത്യബന്ധത്തിലേർപ്പെട്ടില്ല. ശക്തിയും പരിശ്രമവും എനിക്കുണ്ടെന്നുള്ള ധാരണത്താൽ അദ്ദേഹത്തിന്റെ വാക്യം ഞാൻ ശ്രദ്ധിച്ചില്ല. അങ്ങനെയത് നബി(സ)യുടെ അടുത്തെത്തി. അവിടന്ന് പറഞ്ഞു: \"ഞാൻ നിസ്കരിക്കുന്നു, ഉറങ്ങുന്നു, നോമ്പെടുക്കുന്നു, മുറിക്കുന്നു. അതുപോലെ നീ നിസ്കരിക്കുക, ഉറങ്ങുക, നോമ്പെടുക്കുക, മുറിക്കുകയും ചെയ്യുക. ഓരോ മാസവും മൂന്നുദിവസം നോമ്പെടുക്കുക.\" ഞാൻ പറഞ്ഞു: എനിക്കതിലേറെ കഴിയുമല്ലോ. അവിടന്ന് അരുളി: \"ദാവൂദ്(അ)ന്റെ വ്രതമെടുക്കുക; ഒരു ദിവസം നോമ്പെടുക്കുക, അടുത്ത ദിവസം മുറിക്കുക.\" ഞാൻ പറഞ്ഞു: എനിക്കതിൽ കൂടുതൽ കഴിയുമല്ലോ. നബി(സ) പറഞ്ഞു: \"എല്ലാ മാസവും ഖുർആൻ പാരായണം നടത്തുക.\" പിന്നെയത് പതിനഞ്ചു ദിവസമായി ചുരുങ്ങി. അതിലേറെ കഴിയുമെന്ന് ഞാൻ പറഞ്ഞുകൊണ്ടിരുന്നു. (ന)", "narrator_ml": "അബ്ദുല്ലാഹിബ്നു അംറ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 27, "page_start": 81}, {"hadith_no": 125, "arabic": "عَنْ عَبْدِ اللَّهِ بْنِ عَمْرو رَضِيَ اللَّهُ عَنْهُمَا قَالَ: دَخَلَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ حُجْرَتِي فَقَالَ: \"أَلَمْ أُخْبَرْ أَنَّكَ تَقُومُ اللَّيْلَ وَتَصُومُ النَّهَارَ\". قَالَ: بَلَى. قَالَ: \"فَلَا تَفْعَلَنَّ، نَمْ وَقُمْ، وَصُمْ وَأَفْطِرْ، فَإِنَّ لِعَيْنِكَ عَلَيْكَ حَقًّا، وَإِنَّ لِجَسَدِكَ عَلَيْكَ حَقًّا، وَإِنَّ لِزَوْجَتِكَ عَلَيْكَ حَقًّا، وَإِنَّ لِضَيْفِكَ عَلَيْكَ حَقًّا، وَإِنَّ لِصَدِيقِكَ عَلَيْكَ حَقًّا. وَإِنَّهُ عَسَى أَنْ يَطُولَ بِكَ عُمُرٌ، وَإِنَّهُ حَسْبُكَ أَنْ تَصُومَ مِنْ كُلِّ شَهْرٍ ثَلَاثًا، فَذَلِكَ صِيَامُ الدَّهْرِ كُلِّهِ، وَالْحَسَنَةُ بِعَشْرِ أَمْثَالِهَا\". قُلْتُ: إِنِّي أَجِدُ قُوَّةً، فَشَدَّدْتُ فَشُدِّدَ عَلَيَّ، قَالَ: \"صُمْ مِنْ كُلِّ جُمُعَةٍ ثَلَاثَةَ أَيَّامٍ\". قُلْتُ: إِنِّي أُطِيقُ أَكْثَرَ مِنْ ذَلِكَ، فَشَدَّدْتُ فَشُدِّدَ عَلَيَّ، قَالَ: \"صُمْ صَوْمَ نَبِيِّ اللَّهِ دَاوُدَ عَلَيْهِ السَّلَامُ\". قُلْتُ: وَمَا كَانَ صَوْمُ دَاوُدَ؟ قَالَ: \"نِصْفُ الدَّهْرِ\". (ن)", "malayalam": "അബ്ദുല്ലാഹിബ്നു അംറ്(റ): അല്ലാഹുവിന്റെ റസൂൽ(സ) എന്റെ മുറിയിലേക്ക് വന്നു. എന്നിട്ട് പറഞ്ഞു: \"നീ രാത്രി മുഴുവൻ നിസ്കരിക്കുകയും പകൽ നോമ്പനുഷ്ഠിക്കുകയും ചെയ്യുന്നുണ്ടെന്ന വിവരം എനിക്ക് ലഭിച്ചല്ലോ?\" അദ്ദേഹം പറഞ്ഞു: അതെ. അവിടന്ന് പറഞ്ഞു: \"ഇനി അങ്ങനെ ചെയ്യരുത്. ഉറങ്ങുക, നിസ്കരിക്കുക, നോമ്പെടുക്കുക, ഒഴിവാക്കുക. നിന്റെ നേത്രങ്ങളോട് നിനക്ക് കടപ്പാടുണ്ട്. നിന്റെ ശരീരത്തോട് നിനക്ക് കടപ്പാടുണ്ട്, നിന്റെ ഭാര്യയോട് നിനക്ക് കടപ്പാടുണ്ട്, നിന്റെ അതിഥിയോട് നിനക്ക് കടപ്പാടുണ്ട്, നിന്റെ സുഹൃത്തിനോടും നിനക്ക് കടപ്പാടുണ്ട്; നിന്റെ ആയുസ്സ് ദൈർഘ്യമുള്ളതായിരിക്കാം, അതിനാൽ ഓരോ മാസവും മൂന്നു നോമ്പെടുത്താൽ മതി. അത് ഒരു കൊല്ലം മുഴുവനുള്ള നോമ്പുതന്നെയാണ്. നന്മ അതിന്റെ പത്തിരട്ടിയാണ്.\" ഞാൻ പറഞ്ഞു: എനിക്ക് ശക്തിയുണ്ട്, ഞാൻ ശക്തമാക്കിയപ്പോൾ എന്റെ മേൽ ശക്തമാക്കപ്പെട്ടു. നബി(സ) അരുളി: \"എന്നാൽ നീ ആഴ്ചയിൽ മൂന്നുദിവസം നോമ്പെടുക്കുക.\" ഞാൻ പറഞ്ഞു: എനിക്കതിലേറെ കഴിയും. ഞാൻ ശക്തമാക്കിയപ്പോൾ എന്റെ മേൽ ശക്തമാക്കപ്പെട്ടു. അവിടന്ന് പറഞ്ഞു: \"നീ അല്ലാഹുവിന്റെ പ്രവാചകൻ ദാവൂദ്(അ)മിന്റെ നോമ്പെടുക്കുക.\" ഞാൻ ചോദിച്ചു: എങ്ങനെയാണ് ദാവൂദ്(അ)മിന്റെ നോമ്പ്? അവിടന്ന് പറഞ്ഞു: \"വർഷത്തിന്റെ പകുതി.\" (ന)", "narrator_ml": "അബ്ദുല്ലാഹിബ്നു അംറ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 27, "page_start": 82}, {"hadith_no": 126, "arabic": "عَنْ عَبْدِ اللَّهِ بْنِ عَمْرو رَضِيَ اللَّهُ عَنْهُمَا قَالَ: ذُكِرَ لِرَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنَّهُ يَقُولُ: لَأَقُومَنَّ اللَّيْلَ وَلَأَصُومَنَّ النَّهَارَ مَا عِشْتُ. فَقَالَ: رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"أَنْتَ الَّذِي تَقُولُ ذَلِكَ\". فَقُلْتُ لَهُ: قَدْ قُلْتُهُ يَا رَسُولَ اللَّهِ. فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"فَإِنَّكَ لَا تَسْتَطِيعُ ذَلِكَ، فَصُمْ وَأَفْطِرْ، وَنَمْ وَقُمْ، وَصُمْ مِنَ الشَّهْرِ ثَلَاثَةَ أَيَّامٍ، فَإِنَّ الْحَسَنَةَ بِعَشْرِ أَمْثَالِهَا، وَذَلِكَ مِثْلُ صِيَامِ الدَّهْرِ\". قُلْتُ: فَإِنِّي أُطِيقُ أَفْضَلَ مِنْ ذَلِكَ؟ قَالَ: \"صُمْ يَوْمًا وَأَفْطِرْ يَوْمَيْنِ\". فَقُلْتُ: لِإِنِّي أُطِيقُ أَفْضَلَ مِنْ ذَلِكَ يَا رَسُولَ اللَّهِ؟ قَالَ: \"فَصُمْ يَوْمًا وَأَفْطِرْ يَوْمًا، وَذَلِكَ صِيَامُ دَاوُدَ، وَهُوَ أَعْدَلُ الصِّيَامِ\". قُلْتُ: فَإِنِّي أُطِيقُ أَفْضَلَ مِنْ ذَلِكَ؟ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"لَا أَفْضَلَ مِنْ ذَلِكَ\". قَالَ عَبْدُ اللَّهِ بْنُ عَمْرو: لَأَنْ أَكُونَ قَبِلْتُ الثَّلَاثَةَ الْأَيَّامَ الَّتِي قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَحَبُّ إِلَيَّ مِنْ أَهْلِي وَمَالِي. (ن)", "malayalam": "അബ്ദുല്ലാഹിബ്നു അംറ്(റ): ജീവിതകാലമത്രയും ഞാൻ രാത്രി മുഴുവൻ നിസ്കരിക്കുകയും പകൽ നോമ്പെടുക്കുകയും ചെയ്യുമെന്നു പറഞ്ഞത് റസൂൽ(സ)യോട് പറയപ്പെട്ടു. അപ്പോൾ അവിടന്ന് എന്നോട് ചോദിച്ചു: \"നീ അങ്ങനെ പറഞ്ഞോ?\" ഞാൻ പറഞ്ഞു: അതേ, തിരുദൂതരേ. നബി(സ) പറഞ്ഞു: \"നിനക്കതിനാവില്ല. നീ നോമ്പെടുക്കുകയും ഒഴിവാക്കുകയും ചെയ്യുക. ഉറങ്ങുകയും നിസ്കരിക്കുകയും ചെയ്യുക. അതായത് മാസത്തിൽ മൂന്നുദിവസം നോമ്പെടുക്കുക. നന്മയുടെ പ്രതിഫലം പത്തിരട്ടിയാണ്. അത് ഒരു വർഷത്തെ നോമ്പുപോലെയാണ്.\" ഞാൻ പറഞ്ഞു: എനിക്കതിലേറെ കഴിയും. അവിടന്ന് പറഞ്ഞു: \"ഒരു ദിവസം നോമ്പെടുക്കുക. രണ്ടുദിവസം മുറിക്കുക.\" ഞാൻ പറഞ്ഞു: എനിക്കതിലും കൂടുതൽ കഴിയുമല്ലോ തിരുദൂതരേ? അവിടന്നരുളി: \"ഒരു ദിവസം നോമ്പെടുക്കുക, ഒരു ദിവസം ഒഴിവാക്കുകയും ചെയ്യുക. അതാണു ദാവൂദ്(അ)ന്റെ നോമ്പ്, അതാണ് ഏറ്റവും നല്ലത്.\" ഞാൻ പറഞ്ഞു: അതിലും ശ്രേഷ്ഠമായതെനിക്കു കഴിയുമല്ലോ? തിരുമേനി(സ) പറഞ്ഞു: \"അതിലേറെ ശ്രേഷ്ഠതയുള്ളതായി മറ്റൊന്നുമില്ല.\" അബ്ദുല്ലാഹിബ്നു അംറ്(റ) പറഞ്ഞു: റസൂൽ(സ) പറഞ്ഞ മൂന്ന് ദിവസത്തെ സ്വീകരിക്കലായിരുന്നു എന്റെ കുടുംബത്തെക്കാളും സമ്പത്തിനേക്കാളും എനിക്കിഷ്ടമായത്. (ന)", "narrator_ml": "അബ്ദുല്ലാഹിബ്നു അംറ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 27, "page_start": 82}, {"hadith_no": 127, "arabic": "عَنْ أَبِي سَلَمَةَ بْنِ عَبْدِ الرَّحْمَنِ قَالَ: دَخَلْتُ عَلَى عَبْدِ اللَّهِ بْنِ عَمْرو رَضِيَ اللَّهُ عَنْهُمَا، قُلْتُ: أَيْ عَمِّ، حَدِّثْنِي عَمَّا قَالَ لَكَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. قَالَ: يَا ابْنَ أَخِي، إِنِّي قَدْ كُنْتُ أَجْمَعْتُ عَلَى أَنْ أَجْتَهِدَ اجْتِهَادًا شَدِيدًا، حَتَّى قُلْتُ: لَأَصُومَنَّ الدَّهْرَ، وَلَأَقْرَأَنَّ الْقُرْآنَ فِي كُلِّ يَوْمٍ وَلَيْلَةٍ. فَسَمِعَ بِذَلِكَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَأَتَانِي حَتَّى دَخَلَ عَلَيَّ فِي دَارِي، فَقَالَ: \"بَلَغَنِي أَنَّكَ قُلْتَ: لَأَصُومَنَّ الدَّهْرَ، وَلَأَقْرَأَنَّ الْقُرْآنَ\". فَقُلْتُ: قَدْ قُلْتُ ذَلِكَ يَا رَسُولَ اللَّهِ. قَالَ: \"فَلَا تَفْعَلْ، صُمْ مِنْ كُلِّ شَهْرٍ ثَلَاثَةَ أَيَّامٍ\". قُلْتُ: إِنِّي أَقْوَى عَلَى أَكْثَرَ مِنْ ذَلِكَ. قَالَ: \"فَصُمْ مِنَ الْجُمُعَةِ يَوْمَيْنِ: الِاثْنَيْنِ وَالْخَمِيسَ\". قُلْتُ: فَإِنِّي أَقْوَى عَلَى أَكْثَرَ مِنْ ذَلِكَ. قَالَ: \"فَصُمْ صِيَامَ دَاوُدَ عَلَيْهِ السَّلَامُ، فَإِنَّهُ أَعْدَلُ الصِّيَامِ عِنْدَ اللَّهِ: يَوْمًا صَائِمًا وَيَوْمًا مُفْطِرًا، وَإِنَّهُ كَانَ إِذَا وَعَدَ لَمْ يُخْلِفْ، وَإِذَا لَاقَى لَمْ يَفِرَّ\". (ن)", "malayalam": "അബുസലമതുബ്നു അബ്ദുറഹ്മാൻ(റ): ഞാൻ അബ്ദുല്ലാഹിബ്നു അംറ്(റ)വിന്റെ അടുത്ത് ചെന്നു പറഞ്ഞു: പിതൃവ്യാ, റസൂൽ(സ) താങ്കൾക്കു പറഞ്ഞുതന്നത് എനിക്കു വിവരിച്ചു തന്നാലും. അദ്ദേഹം പറഞ്ഞു: സഹോദരപുത്രാ, ശക്തമായ പരിശ്രമം നടത്താൻ ഞാൻ തീരുമാനിച്ചു. അങ്ങനെ ഞാൻ പറഞ്ഞു: വർഷം മുഴുവൻ ഞാൻ വ്രതമെടുക്കും, എല്ലാ രാപ്പകലുകളിലും ഖുർആൻ പാരായണം ചെയ്യും. റസൂൽ(സ) ഇത് അറിയുകയും എന്റെ വീട്ടിൽ എത്തുകയും ചെയ്തു. തുടർന്ന് അവിടന്ന് പറഞ്ഞു: \"നീ ഖുർആൻ ഓതുമെന്നും, നിത്യവ്രതം അനുഷ്ഠിക്കുമെന്നും പറഞ്ഞതായി ഞാൻ അറിഞ്ഞല്ലോ!\" ഞാൻ പറഞ്ഞു: അതേ, ഞാനത് പറഞ്ഞിട്ടുണ്ട് പ്രവാചകരേ. അവിടന്നരുളി: \"ഇനിയങ്ങനെ ചെയ്യരുത്. ഓരോ മാസവും മൂന്നുദിനം നീ നോമ്പെടുക്കുക.\" ഞാൻ പറഞ്ഞു: എനിക്കതിലേറെ കഴിയും. നബി(സ) പറഞ്ഞു: \"എങ്കിൽ നീ ആഴ്ചയിൽ രണ്ടു നോമ്പെടുക്കുക; തിങ്കളാഴ്ചയും, വ്യാഴാഴ്ചയും.\" ഞാൻ പറഞ്ഞു: എനിക്കതിലേറെ കഴിയും. അവിടന്നരുളി: \"നീ ദാവൂദ്(അ)ന്റെ വ്രതമെടുക്കുക. അതാണ് അല്ലാഹുവിന്റെയടുക്കൽ ഏറ്റവും മാന്യമായ നോമ്പ്. ഒരു ദിനം നോമ്പനുഷ്ഠിക്കുകയും അടുത്ത ദിവസം നോമ്പ് ഒഴിവാക്കുകയും ചെയ്യുക. നിശ്ചയം ദാവൂദ്(അ) കരാർ ചെയ്താൽ ലംഘിക്കുകയോ, (ശത്രുവിനെ) കണ്ടുമുട്ടിയാൽ തിരിഞ്ഞോടുകയോ ചെയ്തിട്ടില്ല.\" (ന)", "narrator_ml": "അബുസലമതുബ്നു അബ്ദുറഹ്മാൻ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 27, "page_start": 83}, {"hadith_no": 128, "arabic": "عَنْ أَنَسٍ رَضِيَ اللَّهُ عَنْهُ وَقَدْ سُئِلَ عَنْ صِيَامِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: مَا كُنْتُ أُحِبُّ أَنْ أَرَاهُ مِنَ الشَّهْرِ صَائِمًا إِلَّا رَأَيْتُهُ، وَلَا مُفْطِرًا إِلَّا رَأَيْتُهُ، وَلَا مِنَ اللَّيْلِ قَائِمًا إِلَّا رَأَيْتُهُ، وَلَا نَائِمًا إِلَّا رَأَيْتُهُ، وَلَا مَسِسْتُ خَزَّةً وَلَا حَرِيرَةً أَلْيَنَ مِنْ كَفِّ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَلَا شَمِمْتُ مِسْكَةً وَلَا عَبِيرَةً أَطْيَبَ رَائِحَةً مِنْ رَائِحَةِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. (خ)", "malayalam": "അനസ്(റ): നബി(സ)യുടെ നോമ്പിനെക്കുറിച്ച് ചോദിക്കപ്പെട്ടപ്പോൾ അനസ്(റ) പറഞ്ഞു: ഏതു മാസത്തിൽ നോമ്പുകാരനായി കാണാൻ ഞാനുദ്ദേശിച്ചാലും തിരുമേനി(സ)യെ ആ നിലക്കു ഞാൻ കാണാതിരുന്നിട്ടില്ല. തിരുമേനി(സ) നോമ്പുപേക്ഷിക്കുന്നതു കാണാൻ ഏതു മാസത്തിൽ ഞാനുദ്ദേശിച്ചാലും ഞാനതും കാണാതിരുന്നിട്ടില്ല. രാത്രി തിരുമേനി(സ) നിസ്കരിക്കുന്നത് കാണാനുദ്ദേശിച്ചാൽ അതും കാണാതിരിന്നിട്ടില്ല. ഉറങ്ങുന്നത് കാണാനുദ്ദേശിച്ചാൽ അതും കാണാതിരുന്നിട്ടില്ല. തിരുമേനി(സ)യുടെ കൈപ്പത്തിയേക്കാൾ മാർദ്ദവമേറിയ ഒരു പട്ടും ഞാൻ സ്പർശിച്ചിട്ടില്ല. റസൂൽ(സ)യേക്കാൾ സുഗന്ധമുള്ള ഒരു കസ്തൂരിയോ മറ്റു സുഗന്ധമോ ഞാൻ വാസനിച്ചിട്ടില്ല. (ബു)", "narrator_ml": "അനസ്(റ)", "source_codes_ar": ["خ"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 28, "page_start": 84}, {"hadith_no": 129, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ حَتَّى نَقُولَ لَا يُفْطِرُ، وَيُفْطِرُ حَتَّى نَقُولَ لَا يَصُومُ. وَمَا رَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ اسْتَكْمَلَ صِيَامَ شَهْرٍ قَطُّ إِلَّا رَمَضَانَ، وَمَا رَأَيْتُهُ فِي شَهْرٍ أَكْثَرَ صِيَامًا مِنْهُ فِي شَعْبَانَ. (خ,د,ن,جه)", "malayalam": "ആഇശ(റ): ഇനി നോമ്പുപേക്ഷിക്കില്ല എന്ന് ഞങ്ങൾ പറയുംവരെ റസൂൽ(സ) നോമ്പെടുക്കാറുണ്ടായിരുന്നു. ഇനി നോമ്പെടുക്കില്ല എന്ന് ഞങ്ങൾ പറയുംവരെ റസൂൽ(സ) നോമ്പ് ഒഴിവാക്കിയിരുന്നു. റമളാനിലൊഴികെ റസൂൽ(സ) ഒരു മാസം പൂർണമായും നോമ്പെടുക്കുന്നത് ഞാൻ കണ്ടിട്ടില്ല. ശഅ്ബാനിലേതിനേക്കാൾ കൂടുതലായി മറ്റൊരു മാസത്തിൽ റസൂൽ(സ) നോമ്പെടുക്കുന്നതും ഞാൻ കണ്ടിട്ടില്ല. (ബു,ദ,ന,ജ)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["خ", "د", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 28, "page_start": 84}, {"hadith_no": 130, "arabic": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لَا يُفْطِرُ أَيَّامَ الْبِيضِ فِي حَضَرٍ وَلَا سَفَرٍ. (ن)", "malayalam": "ഇബ്നുഅബ്ബാസ്(റ): യാത്രയിലായാലും അല്ലെങ്കിലും 'അയ്യാമുൽ ബീള്' (ചന്ദ്രമാസം 13, 14, 15) ദിവസങ്ങളിൽ റസൂൽ(സ) നോമ്പുപേക്ഷിക്കാറുണ്ടായിരുന്നില്ല. (ന)", "narrator_ml": "ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 28, "page_start": 84}, {"hadith_no": 131, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: لَا أَعْلَمُ نَبِيَّ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَرَأَ الْقُرْآنَ كُلَّهُ فِي لَيْلَةٍ، وَلَا قَامَ لَيْلَةً حَتَّى الصَّبَاحِ، وَلَا صَامَ شَهْرًا قَطُّ كَامِلًا غَيْرَ رَمَضَانَ. (ن)", "malayalam": "ആഇശ(റ): റമളാനിലൊഴികെ നബി(സ) ഒരു മാസം പൂർണമായും നോമ്പെടുക്കുകയോ രാത്രി പ്രഭാതം വരെ നിസ്ക്കരിക്കുകയോ ഒറ്റ രാത്രിയിൽ ഖുർആൻ പൂർണമായും പാരായണം ചെയ്യുകയോ ചെയ്തതായി എനിക്കറിയില്ല. (ന)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 28, "page_start": 84}, {"hadith_no": 132, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا، وَقَدْ سُئِلَتْ عَنْ صِيَامِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، قَالَتْ: كَانَ يَصُومُ حَتَّى نَقُولَ قَدْ صَامَ، وَيُفْطِرُ حَتَّى نَقُولَ قَدْ أَفْطَرَ، وَمَا صَامَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ شَهْرًا كَامِلًا مُنْذُ قَدِمَ الْمَدِينَةَ إِلَّا رَمَضَانَ. (ن)", "malayalam": "ആഇശ(റ): നബി(സ)യുടെ നോമ്പിനെകുറിച്ച് ചോദിക്കപ്പെട്ടപ്പോൾ അവർ പറഞ്ഞു: നബി(സ) നോമ്പെടുത്തിരിക്കുന്നു എന്ന് ഞങ്ങൾ പറയുന്നതുവരെ അവിടന്ന് നോമ്പെടുക്കുമായിരുന്നു. നോമ്പുപേക്ഷിച്ചിരിക്കുന്നു എന്നു ഞങ്ങൾ പറയുംവരെ നോമ്പുപേക്ഷിക്കുകയും ചെയ്യുമായിരുന്നു. മദീനയിൽ വന്നതുമുതൽ റമളാനിലല്ലാതെ ഒരു മാസം പൂർണമായും തിരുമേനി നോമ്പെടുത്തിട്ടില്ല. (ന)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 28, "page_start": 84}, {"hadith_no": 133, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: كَانَ أَحَبَّ الشُّهُورِ إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنْ يَصُومَهُ شَعْبَانُ، بَلْ كَانَ يَصِلُهُ بِرَمَضَانَ. (ن)", "malayalam": "ആഇശ(റ): റസൂൽ(സ)ക്ക് നോമ്പെടുക്കുന്നത് ഏറ്റവും ഇഷ്ടമുണ്ടായിരുന്ന മാസം ശഅ്ബാനായിരുന്നു. മാത്രമല്ല അതിനെ റമളാനിനോടു ചേർക്കാറുമുണ്ടായിരുന്നു. (ന)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 28, "page_start": 85}, {"hadith_no": 134, "arabic": "عَنْ أُمِّ سَلَمَةَ رَضِيَ اللَّهُ عَنْهَا: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ لَا يَصُومُ شَهْرَيْنِ مُتَتَابِعَيْنِ إِلَّا شَعْبَانَ وَرَمَضَانَ. (ن)", "malayalam": "ഉമ്മുസലമ(റ): ശഅ്ബാനിലും റമളാനിലുമല്ലാതെ വർഷത്തിൽ തുടർച്ചയായി രണ്ടുമാസം നബി(സ) നോമ്പെടുക്കുമായിരുന്നില്ല. (ന)", "narrator_ml": "ഉമ്മുസലമ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 28, "page_start": 85}, {"hadith_no": 135, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: لَمْ يَكُنْ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لِشَهْرٍ أَكْثَرَ صِيَامًا مِنْهُ لِشَعْبَانَ، كَانَ يَصُومُهُ أَوْ عَامَّتَهُ. وَفِي رِوَايَةٍ قَالَتْ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ شَعْبَانَ إِلَّا قَلِيلًا. وَفِي رِوَايَةٍ قَالَتْ: إِنَّ رَسُولَ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ كَانَ يَصُومُ شَعْبَانَ كُلَّهُ. (ن)", "malayalam": "ആഇശ(റ): അല്ലാഹുവിന്റെ റസൂൽ(സ) ശഅ്ബാനിൽ എടുത്തത്രയും നോമ്പ് മറ്റു മാസങ്ങളിൽ എടുത്തിട്ടില്ല. ശഅ്ബാനിൽ അവിടന്ന് നോമ്പെടുക്കാറുണ്ട്, അല്ലെങ്കിൽ പൂർണമായും നോമ്പ് എടുക്കാറുണ്ട്. മറ്റൊരു നിവേദനത്തിൽ: ശഅ്ബാനിൽ കുറഞ്ഞ ദിവസങ്ങളിലൊഴികെ റസൂൽ(സ) നോമ്പെടുത്തിരുന്നു. മറ്റൊരു നിവേദനത്തിൽ: ശഅ്ബാൻ പൂർണമായും നോമ്പെടുത്തിരുന്നു. (ന)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ قَالَتْ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ شَعْبَانَ إِلَّا قَلِيلًا.", "malayalam": "മറ്റൊരു നിവേദനത്തിൽ: ശഅ്ബാനിൽ കുറഞ്ഞ ദിവസങ്ങളിലൊഴികെ റസൂൽ(സ) നോമ്പെടുത്തിരുന്നു."}, {"seq": 2, "arabic": "وَفِي رِوَايَةٍ قَالَتْ: إِنَّ رَسُولَ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ كَانَ يَصُومُ شَعْبَانَ كُلَّهُ. (ن)", "malayalam": "മറ്റൊരു നിവേദനത്തിൽ: ശഅ്ബാൻ പൂർണമായും നോമ്പെടുത്തിരുന്നു. (ന)"}], "bab_seq": 28, "page_start": 85}, {"hadith_no": 136, "arabic": "عَنْ أُسَامَةَ بْنِ زَيْدٍ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: قُلْتُ: يَا رَسُولَ اللَّهِ، لَمْ أَرَكَ تَصُومُ شَهْرًا مِنَ الشُّهُورِ مَا تَصُومُ مِنْ شَعْبَانَ؟ قَالَ: \"ذَلِكَ شَهْرٌ يَغْفُلُ النَّاسُ عَنْهُ بَيْنَ رَجَبٍ وَرَمَضَانَ، وَهُوَ شَهْرٌ تُرْفَعُ فِيهِ الْأَعْمَالُ إِلَى رَبِّ الْعَالَمِينَ، فَأُحِبُّ أَنْ يُرْفَعَ عَمَلِي وَأَنَا صَائِمٌ\". (ن)", "malayalam": "ഉസാമതുബ്നു സൈദ്(റ): ഞാൻ ചോദിച്ചു: അല്ലാഹുവിന്റെ റസൂലേ, അങ്ങ് ശഅ്ബാനിൽ എടുക്കുന്നത്ര നോമ്പ് മറ്റു മാസങ്ങളിൽ എടുക്കുന്നത് ഞാൻ കണ്ടിട്ടില്ല? അവിടന്ന് പറഞ്ഞു: \"റമളാനിനും റജബിനും ഇടക്ക് ജനങ്ങൾ അശ്രദ്ധരാകുന്ന മാസമാണത്. ലോകരക്ഷിതാവിലേക്ക് കർമങ്ങൾ ഉയർത്തപ്പെടുന്ന മാസവുമാണത്. ഞാൻ നോമ്പുകാരനായിരിക്കെ എന്റെ കർമങ്ങൾ ഉയർത്തപ്പെടാൻ ഞാൻ ആഗ്രഹിക്കുന്നു.\" (ന)", "narrator_ml": "ഉസാമതുബ്നു സൈദ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 28, "page_start": 85}, {"hadith_no": 137, "arabic": "عَنْ أُسَامَةَ بْنِ زَيْدٍ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: قُلْتُ: يَا رَسُولَ اللَّهِ، إِنَّكَ تَصُومُ حَتَّى لَا تَكَادَ تُفْطِرَ، وَتُفْطِرُ حَتَّى لَا تَكَادَ أَنْ تَصُومَ، إِلَّا يَوْمَيْنِ: إِنْ دَخَلَا فِي صِيَامِكَ، وَإِلَّا صُمْتَهُمَا؟ قَالَ: \"أَيُّ يَوْمَيْنِ\". قُلْتُ: يَوْمَ الِاثْنَيْنِ وَيَوْمَ الْخَمِيسِ. قَالَ: \"ذَانِكَ يَوْمَانِ تُعْرَضُ فِيهِمَا الْأَعْمَالُ عَلَى رَبِّ الْعَالَمِينَ، فَأُحِبُّ أَنْ يُعْرَضَ عَمَلِي وَأَنَا صَائِمٌ\". (ن)", "malayalam": "ഉസാമതുബ്നു സൈദ്(റ): ഞാൻ തിരുമേനി(സ)യോട് ചോദിച്ചു: അല്ലാഹുവിന്റെ റസൂലേ, ഇനി നോമ്പു മുറിക്കുകയില്ലെന്ന് വരുവോളം അങ്ങ് വ്രതമെടുക്കുന്നു. ഇനി നോമ്പ് അനുഷ്ഠിക്കുകയില്ലെന്ന് വരുവോളം നോമ്പ് അനുഷ്ഠിക്കാതിരിക്കുന്നു. രണ്ടുദിനങ്ങളൊഴികെ. അവ രണ്ടും അങ്ങ് നോമ്പെടുത്തിട്ടല്ലാതെ പ്രവേശിക്കുകയില്ല. അവിടന്ന് ചോദിച്ചു. \"ഏതാണ് ആ ദിനങ്ങൾ?\" ഞാൻ പറഞ്ഞു: തിങ്കളും വ്യാഴവും. അവിടന്ന് അരുളി: \"ലോകരക്ഷിതാവിന് കർമങ്ങൾ സമർപ്പിക്കപ്പെടുന്ന രണ്ടു ദിനങ്ങളാണ് അവ. അതിനാൽ ഞാൻ നോമ്പുകാരനായിരിക്കേ എന്റെ കർമങ്ങൾ സമർപ്പിക്കപ്പെടുവാൻ ആഗ്രഹിക്കുന്നു.\" (ന)", "narrator_ml": "ഉസാമതുബ്നു സൈദ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 28, "page_start": 85}, {"hadith_no": 138, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: إِنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يَتَحَرَّى صِيَامَ الِاثْنَيْنِ وَالْخَمِيسِ. وَفِي رِوَايَةٍ: يَصُومُ الِاثْنَيْنِ وَالْخَمِيسَ. (ن)", "malayalam": "ആഇശ(റ): റസൂൽ(സ) തിങ്കൾ, വ്യാഴം നോമ്പുകൾക്ക് അമിതപ്രാധാന്യം കൽപിക്കാറുണ്ടായിരുന്നു. മറ്റൊരു നിവേദനത്തിൽ: വ്യാഴവും തിങ്കളും നോമ്പെടുക്കാറുണ്ടായിരുന്നു. (ന)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: يَصُومُ الِاثْنَيْنِ وَالْخَمِيسَ. (ن)", "malayalam": "മറ്റൊരു നിവേദനത്തിൽ: വ്യാഴവും തിങ്കളും നോമ്പെടുക്കാറുണ്ടായിരുന്നു. (ന)"}], "bab_seq": 28, "page_start": 85}, {"hadith_no": 139, "arabic": "عَنْ أُمِّ سَلَمَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ مِنْ كُلِّ شَهْرٍ ثَلَاثَةَ أَيَّامٍ: الِاثْنَيْنِ وَالْخَمِيسَ مِنْ هَذِهِ الْجُمُعَةِ، وَالِاثْنَيْنِ مِنَ الْمُقْبِلَةِ. (ن)", "malayalam": "ഉമ്മുസലമ(റ): റസൂൽ(സ) ഓരോ മാസത്തിലും മൂന്ന് ദിവസം നോമ്പനുഷ്ഠിക്കുമായിരുന്നു. ഒരാഴ്ചയിലെ തിങ്കളാഴ്ചയും വ്യാഴായ്ചയും, പിന്നീടുള്ള ആഴ്ചയിൽ വരുന്ന തിങ്കളാഴ്ചയും. (ന)", "narrator_ml": "ഉമ്മുസലമ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 28, "page_start": 86}, {"hadith_no": 140, "arabic": "عَنْ حَفْصَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِذَا أَخَذَ مَضْجَعَهُ جَعَلَ كَفَّهُ الْيُمْنَى تَحْتَ خَدِّهِ الْأَيْمَنِ، وَكَانَ يَصُومُ الِاثْنَيْنِ وَالْخَمِيسَ. (ن)", "malayalam": "ഹഫ്സ(റ): റസൂൽ(സ) ഉറങ്ങാൻ കിടന്നാൽ തന്റെ വലതു കൈപ്പത്തി വലതു കവിളിനു താഴെ വെക്കുമായിരുന്നു. റസൂൽ(സ) തിങ്കളും വ്യാഴവും നോമ്പെടുക്കുകയും ചെയ്യുമായിരുന്നു. (ന)", "narrator_ml": "ഹഫ്സ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 28, "page_start": 86}, {"hadith_no": 141, "arabic": "عَنْ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ ثَلَاثَةَ أَيَّامٍ مِنْ غُرَّةِ كُلِّ شَهْرٍ، وَقَلَّمَا يُفْطِرُ يَوْمَ الْجُمُعَةِ. (ن)", "malayalam": "അബ്ദുല്ലാഹിബ്നു മസ്ഊദ്(റ): എല്ലാ മാസവും വെളുത്ത മൂന്നു ദിനങ്ങളിൽ (അയ്യാമുൽ ബീള്: 13, 14, 15) റസൂൽ(സ) നോമ്പെടുക്കാറുണ്ടായിരുന്നു. വെള്ളിയാഴ്ചയിൽ നോമ്പുപേക്ഷിക്കൽ വിരളമായിരുന്നു. (ന)", "narrator_ml": "അബ്ദുല്ലാഹിബ്നു മസ്ഊദ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 28, "page_start": 86}, {"hadith_no": 142, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: أَمَرَنِي رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِرَكْعَتَيِ الضُّحَى، وَأَنْ لَا أَنَامَ إِلَّا عَلَى وِتْرٍ، وَصِيَامِ ثَلَاثَةِ أَيَّامٍ مِنَ الشَّهْرِ. (ن)", "malayalam": "അബൂഹുറൈറ(റ): രണ്ട് റക്അത് ളുഹാ നിസ്കരിക്കണമെന്നും വിത്ർ നിസ്കരിക്കാതെ ഉറങ്ങരുതെന്നും മാസത്തിൽ മൂന്നുദിവസം നോമ്പെടുക്കണമെന്നും റസൂൽ(സ) എന്നോട് കൽപിച്ചു. (ന)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 28, "page_start": 86}, {"hadith_no": 143, "arabic": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا، وَسُئِلَ عَنْ صِيَامِ عَاشُورَاءَ، قَالَ: مَا عَلِمْتُ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ صَامَ يَوْمًا يَتَحَرَّى فَضْلَهُ عَلَى الْأَيَّامِ إِلَّا هَذَا الْيَوْمَ، يَعْنِي شَهْرَ رَمَضَانَ وَيَوْمَ عَاشُورَاءَ. (ن)", "malayalam": "ഇബ്നുഅബ്ബാസ്(റ): ആശൂറാഅ് (മുഹർറം: 10) നോമ്പിനെക്കുറിച്ച് അദ്ദേഹം ചോദിക്കപ്പെട്ടു. അദ്ദേഹം പറഞ്ഞു: ഈ ദിവസത്തിലല്ലാതെ, വളരെ പ്രാധാന്യത്തോടുകൂടി മറ്റു ദിനങ്ങളിൽ നോമ്പെടുക്കുന്നതായി നബി(സ)യെ ഞാൻ കണ്ടിട്ടില്ല. അതായത് റമളാൻ മാസവും ആശൂറാഅ് ദിനവും. (ന)", "narrator_ml": "ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 28, "page_start": 86}, {"hadith_no": 144, "arabic": "عَنْ مُعَاوِيَةَ رَضِيَ اللَّهُ عَنْهُ، قَالَ يَوْمَ عَاشُورَاءَ وَهُوَ عَلَى الْمِنْبَرِ: يَا أَهْلَ الْمَدِينَةِ، أَيْنَ عُلَمَاؤُكُمْ؟ سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ فِي هَذَا الْيَوْمِ: \"إِنِّي صَائِمٌ، فَمَنْ شَاءَ أَنْ يَصُومَ فَلْيَصُمْ\". (ن)", "malayalam": "മുആവിയ(റ): ആശൂറാഅ് ദിനത്തിൽ മിമ്പറിൽനിന്ന് അദ്ദേഹം വിളിച്ചുപറഞ്ഞു: ഹേ, മദീനാ നിവാസികളേ, എവിടെയാണ് നിങ്ങളുടെ പണ്ഡിതന്മാർ? ഈ ദിനത്തിൽ റസൂൽ(സ) ഇങ്ങനെ പറയുന്നത് ഞാൻ കേട്ടിട്ടുണ്ട്: \"ഞാൻ ഇന്നു നോമ്പുകാരനാണ്; ആരെങ്കിലും നോമ്പെടുക്കാൻ ഉദ്ദേശിക്കുന്നുവെങ്കിൽ നോമ്പെടുത്തുകൊള്ളട്ടെ.\" (ന)", "narrator_ml": "മുആവിയ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 28, "page_start": 86}, {"hadith_no": 145, "arabic": "عَنْ أُمِّ سَلَمَةَ رَضِيَ اللَّهُ عَنْهَا: أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يَصُومُ يَوْمَ عَاشُورَاءَ، وَتِسْعًا مِنْ ذِي الْحِجَّةِ، وَثَلَاثَةَ أَيَّامٍ مِنَ الشَّهْرِ: أَوَّلَ اثْنَيْنِ مِنَ الشَّهْرِ وَخَمِيسَيْنِ. (ن)", "malayalam": "ഉമ്മുസലമ(റ): ആശൂറാഅ് ദിനത്തിലും ദുൽഹജ്ജ് മാസത്തിലെ ആദ്യ ഒമ്പതു ദിനത്തിലും മാസത്തിൽ മൂന്നു ദിനത്തിലും അതായത് മാസത്തിൽ ആദ്യത്തെ തിങ്കളാഴ്ചയും രണ്ടു വ്യാഴാഴ്ചകളിലും തിരുമേനി( സ) നോമ്പനുഷ്ഠിക്കാറുണ്ടായിരുന്നു. (ന)", "narrator_ml": "ഉമ്മുസലമ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 28, "page_start": 86}, {"hadith_no": 146, "arabic": "عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو رَضِيَ اللَّهُ عَنْهُمَا قَالَ: سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ: \"صَامَ نُوحٌ الدَّهْرَ، إِلَّا يَوْمَ الْفِطْرِ وَيَوْمَ الْأَضْحَى\". [ز: في إسناده ضعيف] (جه)", "malayalam": "അബ്ദുല്ലാഹിബ്നു അംറ്(റ): റസൂൽ(സ) പറയുന്നത് ഞാൻ കേട്ടു: \"നൂഹ്(അ) ഈദുൽ അള്ഹായും (ബലിപെരുന്നാൾ ദിനം) ഈദുൽ ഫിത്വറും ഒഴികെ വർഷം മുഴുവൻ നോമ്പെടുത്തിരുന്നു.\" (ഇതിന്റെ പരമ്പരയിൽ ഒരു ദുർബലനുണ്ട്). (ജ)", "narrator_ml": "അബ്ദുല്ലാഹിബ്നു അംറ്(റ)", "source_codes_ar": ["جه"], "grading_note_ml": "ഇതിന്റെ പരമ്പരയിൽ ഒരു ദുർബലനുണ്ട്", "grading_note_ar": "ز: في إسناده ضعيف", "explanation_ml": null, "variants": [], "bab_seq": 29, "page_start": 87}, {"hadith_no": 147, "arabic": "عَنْ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ- يَعْنِي مِنْ غُرَّةِ كُلِّ شَهْرٍ- ثَلَاثَةَ أَيَّامٍ. (د،ت،ن)", "malayalam": "ഇബ്നുമസ്ഊദ്(റ): നബി(സ) മൂന്ന് ദിവസം - എല്ലാ മാസവും വെളുത്തവാവു ദിനങ്ങളിൽ - നോമ്പനുഷ്ഠിക്കാറുണ്ട്. (ദ,തു,ന)", "narrator_ml": "ഇബ്നുമസ്ഊദ്(റ)", "source_codes_ar": ["د", "ت", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 30, "page_start": 87}, {"hadith_no": 148, "arabic": "عَنْ مُعَاذَةَ الْعَدَوِيَّةِ أَنَّهَا قَالَتْ: سَأَلْتُ عَائِشَةَ زَوْجَ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: أَكَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ مِنْ كُلِّ شَهْرٍ ثَلَاثَةَ أَيَّامٍ؟ قَالَتْ نَعَمْ، فَقُلْتُ لَهَا: مِنْ أَيِّ أَيَّامِ الشَّهْرِ كَانَ يَصُومُ؟ قَالَتْ: لَمْ يَكُنْ يُبَالِي مِنْ أَيِّ أَيَّامِ الشَّهْرِ يَصُومُ. (م،د،ت،ن،جه)", "malayalam": "മുആദതുൽ അദവിയ്യ(റ): നബി(സ)യുടെ ഭാര്യയായ ആഇശ(റ)യോട് ഞാൻ ചോദിച്ചു. നബി(സ) എല്ലാ മാസവും മൂന്ന് ദിനങ്ങളിൽ നോമ്പനുഷ്ഠിക്കാറുണ്ടായിരുന്നോ? അവർ പറഞ്ഞു: അതെ. ഞാൻ ചോദിച്ചു: മാസത്തിലെ ഏതു ദിവസങ്ങളിലായിരുന്നു അവിടന്ന് നോമ്പനുഷ്ഠിക്കാറുണ്ടായിരുന്നത്? ആഇശ(റ) പറഞ്ഞു: മാസത്തിൽ ഏതു ദിവസമെന്നത് അവിടന്ന് അത്ര കാര്യമാക്കാറില്ല. (മു,ദ,തു,ന,ജ)", "narrator_ml": "മുആദതുൽ അദവിയ്യ(റ)", "source_codes_ar": ["م", "د", "ت", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 30, "page_start": 87}, {"hadith_no": 149, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ مِنَ الشَّهْرِ: السَّبْتَ وَالْأَحَدَ وَالِاثْنَيْنِ، وَمِنَ الشَّهْرِ الْآخَرِ: الثُّلَاثَاءَ وَالْأَرْبِعَاءَ وَالْخَمِيسَ. (ت)", "malayalam": "ആഇശ(റ): റസൂൽ(സ) ഒരു മാസത്തിലെ ശനിയും, ഞായറും, തിങ്കളും ദിവസങ്ങളാണ് വ്രതമനുഷ്ഠിച്ചതെങ്കിൽ മറ്റൊരു മാസത്തിലെ ചൊവ്വ, ബുധൻ, വ്യാഴം എന്നീ ദിവസങ്ങളിലാവും വ്രതമനുഷ്ഠിക്കുക. (തു)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 30, "page_start": 87}, {"hadith_no": 150, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: أَمَرَنِي رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِثَلَاثٍ: بِنَوْمٍ عَلَى وِتْرٍ، وَالْغُسْلِ يَوْمَ الْجُمُعَةِ، وَصِيَامِ ثَلَاثَةِ أَيَّامٍ مِنْ كُلِّ شَهْرٍ. وَفِي رِوَايَةٍ: أَمَرَنِي رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِرَكْعَتَيِ الضُّحَى، وَأَنْ لَا أَنَامَ إِلَّا عَلَى وِتْرٍ، وَصِيَامِ ثَلَاثَةِ أَيَّامٍ مِنْ كُلِّ شَهْرٍ. (ن)", "malayalam": "അബൂഹുറൈറ(റ): നബി(സ) എന്നോട് മൂന്നു കാര്യങ്ങൾ കൽപിച്ചു: വിത്ർ നിസ്കരിച്ച് ഉറങ്ങുക, വെള്ളിയാഴ്ച ദിവസം കുളിക്കുക, മാസത്തിൽ മൂന്നുദിനം നോമ്പനുഷ്ഠിക്കുക. മറ്റൊരു നിവേദനം: എല്ലാ മാസവും മൂന്നു ദിവസം നോമ്പെടുക്കാനും വിത്റ് നിസ്കരിച്ചിട്ടല്ലാതെ ഉറങ്ങാതിരിക്കാനും ളുഹായുടെ രണ്ട് റക്അത് നിസ്കരിക്കാനും നബി(സ) എന്നോടു കൽപിച്ചു. (ന)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: أَمَرَنِي رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِرَكْعَتَيِ الضُّحَى، وَأَنْ لَا أَنَامَ إِلَّا عَلَى وِتْرٍ، وَصِيَامِ ثَلَاثَةِ أَيَّامٍ مِنْ كُلِّ شَهْرٍ. (ن)", "malayalam": "മറ്റൊരു നിവേദനം: എല്ലാ മാസവും മൂന്നു ദിവസം നോമ്പെടുക്കാനും വിത്റ് നിസ്കരിച്ചിട്ടല്ലാതെ ഉറങ്ങാതിരിക്കാനും ളുഹായുടെ രണ്ട് റക്അത് നിസ്കരിക്കാനും നബി(സ) എന്നോടു കൽപിച്ചു. (ന)"}], "bab_seq": 30, "page_start": 87}, {"hadith_no": 151, "arabic": "عَنْ أَبِي ذَرٍّ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"مَنْ صَامَ ثَلَاثَةَ أَيَّامٍ مِنَ الشَّهْرِ فَقَدْ صَامَ الدَّهْرَ كُلَّهُ\". ثُمَّ قَالَ: \"صَدَقَ اللَّهُ فِي كِتَابِهِ: {مَنْ جَاءَ بِالْحَسَنَةِ فَلَهُ عَشْرُ أَمْثَالِهَا} [الأنعام: ١٦٠]\". وَفِي رِوَايَةٍ: \"فَقَدْ تَمَّ صَوْمُ الشَّهْرِ. أَوْ: فَلَهُ صَوْمُ الشَّهْرِ\". (ت،جه)", "malayalam": "അബൂദർറ്(റ): റസൂൽ(സ) പറഞ്ഞു: \"ആരെങ്കിലും മാസം മൂന്നുദിവസം നോമ്പെടുത്താൽ അവൻ കൊല്ലം മുഴുക്കെ നോമ്പെടുത്തു.\" പിന്നെ നബി(സ) പറഞ്ഞു: \" 'ആരെങ്കിലും ഒരു നന്മ ചെയ്താൽ അവന് അതിന്റെ പത്തിരട്ടിയുണ്ടെന്ന അല്ലാഹുവിന്റെ വചനം എത്ര സത്യമാണ്.' \" മറ്റൊരു നിവേദനം: \"ഒരു മാസത്തെ വ്രതം പൂർത്തിയാക്കി.\" അല്ലെങ്കിൽ \"അവന് ഒരു മാസത്തെ വ്രതമുണ്ട്.\" (തു,ജ)", "narrator_ml": "അബൂദർറ്(റ)", "source_codes_ar": ["ت", "جه"], "grading_note_ml": null, "grading_note_ar": "الأنعام: ١٦٠", "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: \"فَقَدْ تَمَّ صَوْمُ الشَّهْرِ. أَوْ: فَلَهُ صَوْمُ الشَّهْرِ\". (ت،جه)", "malayalam": "മറ്റൊരു നിവേദനം: \"ഒരു മാസത്തെ വ്രതം പൂർത്തിയാക്കി.\" അല്ലെങ്കിൽ \"അവന് ഒരു മാസത്തെ വ്രതമുണ്ട്.\" (തു,ജ)"}], "bab_seq": 30, "page_start": 88}, {"hadith_no": 152, "arabic": "عَنْ عَمْرِو بْنِ شُرَحْبِيلَ الْهَمْدَانِيِّ، عَنْ رَجُلٍ مِنْ أَصْحَابِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: قِيلَ لِلنَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: رَجُلٌ يَصُومُ الدَّهْرَ؟ قَالَ: \"وَدِدْتُ أَنَّهُ لَمْ يَطْعَمِ الدَّهْرَ\". قَالُوا: فَثُلُثَيْهِ؟ قَالَ: \"أَكْثَرَ\". قَالُوا: فَنِصْفَهُ؟ قَالَ: \"أَكْثَرَ\". ثُمَّ قَالَ: \"أَلَا أُخْبِرُكُمْ بِمَا يُذْهِبُ وَحَرَ الصَّدْرِ؟ صَوْمُ ثَلَاثَةِ أَيَّامٍ مِنْ كُلِّ شَهْرٍ\". وَفِي رِوَايَةٍ: قَالَ: أَتَى رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ رَجُلٌ فَقَالَ: يَا رَسُولَ اللَّهِ، مَا تَقُولُ فِي رَجُلٍ صَامَ الدَّهْرَ كُلَّهُ؟ فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"وَدِدْتُ أَنَّهُ لَمْ يَطْعَمِ الدَّهْرَ شَيْئًا\". قَالَ: فَثُلُثَيْهِ؟ قَالَ: \"أَكْثَرَ\". قَالَ: فَنِصْفَهُ؟ قَالَ: \"أَكْثَرَ\". قَالَ: \"أَفَلَا أُخْبِرُكُمْ بِمَا يُذْهِبُ وَحَرَ الصَّدْرِ\". قَالُوا: بَلَى. قَالَ: \"صِيَامُ ثَلَاثَةِ أَيَّامٍ مِنْ كُلِّ شَهْرٍ\". (ن)", "malayalam": "റസൂൽ(സ)യുടെ അനുചരരിൽപെട്ട ഒരാളിൽനിന്ന് അംറുബ്നു ശുറഹ്ബീലുൽ ഹമദാനി(റ): വർഷം മുഴുവൻ നോമ്പെടുക്കുന്ന ഒരാളെക്കുറിച്ച് നബി(സ)യോട് ചോദിക്കപ്പെട്ടു. അവിടന്ന് പറഞ്ഞു: \"അവൻ വർഷത്തിൽ തീരേ ഭക്ഷിക്കുന്നില്ല എന്ന് ഞാൻ മനസ്സിലാക്കുന്നു.\" അവർ ചോദിച്ചു: വർഷത്തിൽ മൂന്നിൽ രണ്ടോ? അവിടന്നരുളി: \"വളരെ കൂടുതലാണ്.\" അവർ ചോദിച്ചു: അതിന്റെ പകുതിയോ? അവിടന്ന് പറഞ്ഞു: \"വളരെ കൂടുതലാണ്\". എന്നിട്ട് തിരുമേനി(സ) അരുളി: \"മനസ്സിന്റെ പക പോക്കിക്കളയുന്ന കാര്യം നിങ്ങൾക്കറിയിച്ചുതരട്ടെയോ? ഓരോ മാസത്തിലും മൂന്നു ദിവസം നോമ്പെടുക്കുക.\" മറ്റൊരു റിപ്പോർട്ട്: ഒരാൾ നബി(സ)യുടെ അടുത്ത് വന്ന് കാലം മുഴുവൻ നോമ്പനുഷ്ഠിക്കുന്ന ഒരാളെക്കുറിച്ചു താങ്കളുടെ അഭിപ്രായമെന്താണ് റസൂലേ? എന്ന് ചോദിച്ചു. അപ്പോൾ നബി(സ) പറഞ്ഞു: \"അദ്ദേഹം അത്രയും കാലം ഭക്ഷണമൊന്നും കഴിച്ചില്ലെന്ന് ഞാൻ മനസ്സിലാക്കുന്നു.\" അവർ ചോദിച്ചു: വർഷത്തിൽ മൂന്നിൽ രണ്ട് ഭാഗമോ? നബി(സ) പറഞ്ഞു: \"വളരെ കൂടുതലാണ്.\" അവർ ചോദിച്ചു: വർഷത്തിൽ പകുതിയോ? നബി(സ) പറഞ്ഞു: \"വളരെ കൂടുതലാണ്.\" ശേഷം നബി(സ) പറഞ്ഞു: \"മനസ്സിന്റെ ദേഷ്യം ഇല്ലാതാക്കിക്കളയുന്ന കാര്യം നിങ്ങൾക്കറിയിച്ചു തരട്ടെയോ?\" അവർ പറഞ്ഞു: അതെ. നബി(സ) പറഞ്ഞു: \"മാസത്തിൽ മൂന്ന് ദിവസം നോമ്പനുഷ്ഠിക്കുക.\" (ന)", "narrator_ml": "റസൂൽ(സ)യുടെ അനുചരരിൽപെട്ട ഒരാളിൽനിന്ന് അംറുബ്നു ശുറഹ്ബീലുൽ ഹമദാനി(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: قَالَ: أَتَى رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ رَجُلٌ فَقَالَ: يَا رَسُولَ اللَّهِ، مَا تَقُولُ فِي رَجُلٍ صَامَ الدَّهْرَ كُلَّهُ؟ فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"وَدِدْتُ أَنَّهُ لَمْ يَطْعَمِ الدَّهْرَ شَيْئًا\". قَالَ: فَثُلُثَيْهِ؟ قَالَ: \"أَكْثَرَ\". قَالَ: فَنِصْفَهُ؟ قَالَ: \"أَكْثَرَ\". قَالَ: \"أَفَلَا أُخْبِرُكُمْ بِمَا يُذْهِبُ وَحَرَ الصَّدْرِ\". قَالُوا: بَلَى. قَالَ: \"صِيَامُ ثَلَاثَةِ أَيَّامٍ مِنْ كُلِّ شَهْرٍ\". (ن)", "malayalam": "മറ്റൊരു നിവേദന്: ഒരാൾ നബി(സ)യുടെ അടുത്ത് വന്ന് കാലം മുഴുവൻ നോമ്പനുഷ്ഠിക്കുന്ന ഒരാളെക്കുറിച്ചു താങ്കളുടെ അഭിപ്രായമെന്താണ് റസൂലേ? എന്ന് ചോദിച്ചു. അപ്പോൾ നബി(സ) പറഞ്ഞു: \"അദ്ദേഹം അത്രയും കാലം ഭക്ഷണമൊന്നും കഴിച്ചില്ലെന്ന് ഞാൻ മനസ്സിലാക്കുന്നു.\" അവർ ചോദിച്ചു: വർഷത്തിൽ മൂന്നിൽ രണ്ട് ഭാഗമോ? നബി(സ) പറഞ്ഞു: \"വളരെ കൂടുതലാണ്.\" അവർ ചോദിച്ചു: വർഷത്തിൽ പകുതിയോ? നബി(സ) പറഞ്ഞു: \"വളരെ കൂടുതലാണ്.\" ശേഷം നബി(സ) പറഞ്ഞു: \"മനസ്സിന്റെ ദേഷ്യം ഇല്ലാതാക്കിക്കളയുന്ന കാര്യം നിങ്ങൾക്കറിയിച്ചു തരട്ടെയോ?\" അവർ പറഞ്ഞു: അതെ. നബി(സ) പറഞ്ഞു: \"മാസത്തി َى عَشْرَةَ\". قُلْتُ: يَا رَسُولَ اللَّهِ، فَقَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"لَا صَوْمَ فَوْقَ صَوْمِ دَاوُدَ، شَطْرَ الدَّهْرِ: صِيَامُ يَوْمٍ وَفِطْرُ يَوْمٍ\". (ن)", "malayalam": "അബ്ദുല്ലാഹിബ്നു അംറ്(റ): റസൂൽ(സ)യോട് എന്റെ നോമ്പിനെക്കുറിച്ച് ഉണർത്തപ്പെട്ടപ്പോൾ അവിടന്ന് എന്റെയടുത്തേക്കു വന്നു. തോലുകൊണ്ടുനിർമിച്ച മിതമായ വലിപ്പത്തിലുള്ള ഒരു തലയിണ ഞാൻ റസൂൽ(സ)ക്ക് നൽകി. അതിൽ നിറച്ചിരിക്കുന്നത് പനനാരാണ്. അവിടന്ന് തറയിലിരുന്നു. എന്റെയും അവിടത്തെയും ഇടയിലായിരുന്നു തലയിണ. അവിടന്ന് അരുളി: \"ഓരോ മാസവും മൂന്ന് ദിവസം (നോമ്പ്) പോരേ നിങ്ങൾക്ക്.\" ഞാൻ പറഞ്ഞു: അല്ലാഹുവിന്റെ റസൂലേ. അവിടന്ന് പറഞ്ഞു: \"അഞ്ച്.\" ഞാൻ പറഞ്ഞു: അല്ലാഹുവിന്റെ റസൂലേ. അവിടന്നരുളി: \"ഏഴ്.\" ഞാൻ പറഞ്ഞു: അല്ലാഹുവിന്റെ റസൂലേ. അവിടന്നരുളി: \"ഒമ്പത്.\" ഞാൻ പറഞ്ഞു: അല്ലാഹുവിന്റെ റസൂലേ. അവിടന്നരുളി: \"പതിനൊന്ന്.\" ഞാൻ പറഞ്ഞു: അല്ലാഹുവിന്റെ റസൂലേ. അപ്പോൾ അവിടന്നരുളി: \"ദാവൂദ്(അ)ന്റെ നോമ്പിനപ്പുറം ഒരു നോമ്പില്ല. കൊല്ലത്തിന്റെ പകുതിയാണത്. അഥവാ ഒരു ദിവസം നോമ്പെടുക്കുക, അടുത്ത ദിവസം നോമ്പുപേക്ഷിക്കുക.\" (ന)", "narrator_ml": "അബ്ദുല്ലാഹിബ്നു അംറ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 30, "page_start": 89}, {"hadith_no": 155, "arabic": "عَنْ عُثْمَانَ بْنِ أَبِي الْعَاصِ رَضِيَ اللَّهُ عَنْهُ قَالَ: سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ: \"صِيَامٌ حَسَنٌ ثَلَاثَةُ أَيَّامٍ مِنَ الشَّهْرِ\". (ن)", "malayalam": "ഉസ്മാനുബ്നു അബിൽ ആസ്(റ): റസൂൽ(സ) പറയുന്നത് ഞാൻ കേട്ടു: \"മാസത്തിലെ മൂന്നുദിവസത്തെ നോമ്പാണ് നല്ല നോമ്പ്.\" (ന)", "narrator_ml": "ഉസ്മാനുബ്നു അബിൽ ആസ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 30, "page_start": 89}, {"hadith_no": 156, "arabic": "عَنِ ابْنِ عُمَرَ رَضِيَ اللَّهُ عَنْهُمَا: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يَصُومُ ثَلَاثَةَ أَيَّامٍ مِنْ كُلِّ شَهْرٍ: يَوْمَ الِاثْنَيْنِ مِنْ أَوَّلِ الشَّهْرِ، وَالْخَمِيسَ الَّذِي يَلِيهِ، ثُمَّ الْخَمِيسَ الَّذِي يَلِيهِ. (ن)", "malayalam": "ഇബ്നുഉമർ(റ): എല്ലാ മാസവും മൂന്നു ദിവസം നബി(സ) നോമ്പെടുക്കാറുണ്ട്: മാസത്തിന്റെ ആദ്യത്തെ തിങ്കളാഴ്ച, തുടർന്നുവരുന്ന വ്യാഴാഴ്ച, പിന്നെ അതിനോടടുത്ത വ്യാഴാഴ്ചയും. (ന)", "narrator_ml": "ഇബ്നുഉമർ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 30, "page_start": 89}, {"hadith_no": 157, "arabic": "عَنْ حَفْصَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: أَرْبَعٌ لَمْ يَكُنْ يَدَعُهُنَّ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: صِيَامَ عَاشُورَاءَ، وَالْعَشْرَ، وَثَلَاثَةَ أَيَّامٍ مِنْ كُلِّ شَهْرٍ، وَرَكْعَتَيْنِ قَبْلَ الْغَدَاةِ. (ن)", "malayalam": "ഹഫ്സ(റ): നാലു കാര്യങ്ങൾ നബി(സ) ഉപേക്ഷിക്കാറില്ല. ആശൂറാഅ് നോമ്പ്, ദുൽഹജ്ജ് മാസത്തെ പത്ത് നോമ്പും, മാസത്തിലെ മൂന്ന് ദിവസത്തെ നോമ്പും, പ്രഭാതത്തിലെ സുബ്ഹിക്ക് മുമ്പുള്ള രണ്ടു റക്അത്തുകളും. (ന)", "narrator_ml": "ഹഫ്സ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 30, "page_start": 89}, {"hadith_no": 158, "arabic": "عَنْ أُمِّ سَلَمَةَ رَضِيَ اللَّهُ عَنْهَا: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يَصُومُ تِسْعًا مِنْ ذِي الْحِجَّةِ، وَيَوْمَ عَاشُورَاءَ، وَثَلَاثَةَ أَيَّامٍ مِنْ كُلِّ شَهْرٍ: أَوَّلَ اثْنَيْنِ مِنَ الشَّهْرِ، وَخَمِيسَيْنِ. وَفِي رِوَايَةٍ: قَالَتْ: كَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ الْعَشْرَ، وَثَلَاثَةَ أَيَّامٍ مِنْ كُلِّ شَهْرٍ: الِاثْنَيْنِ وَالْخَمِيسَ. وَفِي رِوَايَةٍ: قَالَتْ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَأْمُرُ بِصِيَامِ ثَلَاثَةِ أَيَّامٍ: أَوَّلِ خَمِيسٍ، وَالِاثْنَيْنِ، وَالِاثْنَيْنِ. (ن)", "malayalam": "ഉമ്മുസലമ(റ): ദുൽഹജ്ജിലെ ഒമ്പതു ദിവസവും ആശൂറാഅ് ദിവസവും എല്ലാ മാസവും മൂന്നു ദിവസവും, അഥവാ മാസത്തിലെ ആദ്യ തിങ്കളാഴ്ചയും രണ്ടു വ്യാഴാഴ്ചകളും, നബി(സ) നോമ്പനുഷ്ഠിച്ചിരുന്നു. മറ്റൊരു നിവേദനം: ദുൽഹജ്ജ് പത്തും എല്ലാ മാസവും മൂന്നു ദിവസവും, അഥവാ തിങ്കളാഴ്ചയും വ്യാഴാഴ്ചയും, നബി(സ) നോമ്പെടുക്കാറുണ്ട്. മറ്റൊരു നിവേദനം: ആദ്യത്തെ വ്യാഴാഴ്ചയും തുട ഇവരോടൊപ്പം ഭക്ഷിക്കുക.\" അപ്പോൾ അദ്ദേഹം പറഞ്ഞു: അല്ലാഹുവിന്റെ റസൂലേ, ഞാൻ നോമ്പുകാരനാണ്. റസൂൽ(സ) പറഞ്ഞു: \"വെളുത്തവാവു ദിനങ്ങളിൽ നോമ്പനുഷ്ഠിച്ചുകൂടായിരുന്നോ?\" അദ്ദേഹം ചോദിച്ചു: അതേതാണ്? നബി(സ) പറഞ്ഞു: \"പതിമൂന്ന്, പതിനാല്, പതിനഞ്ച്.\" (ന)", "narrator_ml": "മൂസബ്നു ത്വൽഹ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 30, "page_start": 90}, {"hadith_no": 160, "arabic": "عَنِ الْمِنْهَالِ: عَنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنَّهُ كَانَ يَأْمُرُ بِصِيَامِ الْبِيضِ: ثَلَاثَ عَشْرَةَ، وَأَرْبَعَ عَشْرَةَ، وَخَمْسَ عَشْرَةَ. وَيَقُولُ: \"هُوَ كَصَوْمِ الدَّهْرِ. أَوْ: كَهَيْئَةِ صَوْمِ الدَّهْرِ\". (د،ن،جه)", "malayalam": "മിൻഹാൽ(റ): നബി(സ) മാസത്തിലെ പതിമൂന്ന്, പതിനാല്, പതിനഞ്ച് എന്നീ ദിനങ്ങളിൽ (വെളുത്ത വാവു ദിനങ്ങളിൽ) നോമ്പനുഷ്ഠിക്കാൻ കൽപ്പിച്ചിരുന്നു. നബി(സ) പറഞ്ഞു: \"അത് കാലം മുഴുവൻ നോമ്പനുഷ്ഠിക്കുന്നത് പോലെയാണ്. അല്ലെങ്കിൽ അതേ രൂപത്തിലാണ്.\" (ദ,ന,ജ)", "narrator_ml": "മിൻഹാൽ(റ)", "source_codes_ar": ["د", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 31, "page_start": 90}, {"hadith_no": 161, "arabic": "عَنْ أَبِي ذَرٍّ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"يَا أَبَا ذَرٍّ، إِذَا صُمْتَ مِنَ الشَّهْرِ ثَلَاثَةَ أَيَّامٍ، فَصُمْ ثَلَاثَ عَشْرَةَ وَأَرْبَعَ عَشْرَةَ وَخَمْسَ عَشْرَةَ\". حَسَنٌ. (م،ت)", "malayalam": "അബൂദർറ് (റ): റസൂൽ(സ) പറഞ്ഞു: \"അബൂദർറേ, നീ ഒരു മാസത്തിൽ മൂന്നു ദിവസം വ്രതമനുഷ്ഠിക്കുകയാണെങ്കിൽ പതിമൂന്ന്, പതിനാല്, പതിനഞ്ച് എന്നീ ദിവസങ്ങളിലായിക്കൊള്ളട്ടെ.\" (മു,തു)", "narrator_ml": "അബൂദർറ് (റ)", "source_codes_ar": ["م", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 31, "page_start": 90}, {"hadith_no": 162, "arabic": "عَنْ أَبِي ذَرٍّ رَضِيَ اللَّهُ عَنْهُ قَالَ: جَاءَ أَعْرَابِيٌّ إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَمَعَهُ أَرْنَبٌ قَدْ شَوَاهَا، وَخُبْزٌ، فَوَضَعَهَا بَيْنَ يَدَيِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ ثُمَّ قَالَ: إِنِّي وَجَدْتُهَا تَدْمَى. فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لِأَصْحَابِهِ: \"لَا يَضُرُّ، كُلُوا\". وَقَالَ لِلْأَعْرَابِيِّ: \"كُلْ\". قَالَ: إِنِّي صَائِمٌ. قَالَ: \"صَوْمُ مَاذَا\". قَالَ: صَوْمُ ثَلَاثَةِ أَيَّامٍ مِنَ الشَّهْرِ. قَالَ: \"إِنْ كُنْتَ صَائِمًا فَعَلَيْكَ بِالْغُرِّ الْبِيضِ: ثَلَاثَ عَشْرَةَ وَأَرْبَعَ عَشْرَةَ وَخَمْسَ عَشْرَةَ\". (ن)", "malayalam": "അബൂദർറ്(റ): ഒരു ഗ്രാമവാസി നബി(സ)യുടെ അടുക്കലേക്ക് വേവിച്ച മുയലിറച്ചിയും പത്തിരിയുമായെത്തി നബി(സ)യുടെ മുന്നിൽ സമർപ്പിച്ചു. എന്നിട്ട് പറഞ്ഞു: ഇത് രക്തം പുരണ്ട നിലയിലാണ് എനിക്ക് കിട്ടിയത്. അപ്പോൾ നബി(സ) അനുയായികളോട് പറഞ്ഞു: \"നിങ്ങൾ ഭക്ഷിച്ചു കൊള്ളുക, പ്രശ്നമില്ല\". ഗ്രാമവാസിയോട് പറഞ്ഞു: \"നിങ്ങൾ ഭക്ഷിച്ചോളൂ.\" അയാൾ പറഞ്ഞു: ഞാൻ നോമ്പുകാരനാണ്. നബി(സ) ചോദിച്ചു: \"ഏത് നോമ്പാണ്?\" അയാൾ പറഞ്ഞു: മാസത്തിൽ അനുഷ്ഠിക്കുന്ന മൂന്ന് ദിവസത്തെ നോമ്പ്. നബി(സ) പറഞ്ഞു: \"നിങ്ങൾ നോമ്പനുഷ്ഠിക്കുന്നുവെങ്കിൽ വെളുത്തവാവു ദിനങ്ങളായ പതിമൂന്ന്, പതിനാല്, പതിനഞ്ച് എന്നീ ദിനങ്ങളിൽ നോമ്പനുഷ്ഠിക്കുക\". (ന)", "narrator_ml": "അബൂദർറ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 31, "page_start": 90}, {"hadith_no": 163, "arabic": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لَا يُفْطِرُ أَيَّامَ الْبِيضِ فِي حَضَرٍ وَلَا سَفَرٍ. (ن)", "malayalam": "ഇബ്നുഅബ്ബാസ്(റ): നബി(സ) യാത്ര വേളയിലും, അല്ലാത്തപ്പോഴും വെളുത്തവാവു ദിനങ്ങളിലെ നോമ്പ് ഉപേക്ഷിക്കാറില്ല. (ന)", "narrator_ml": "ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 31, "page_start": 91}, {"hadith_no": 164, "arabic": "عَنْ أَبِي قَتَادَةَ رَضِيَ اللَّهُ عَنْهُ: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ سُئِلَ عَنْ صَوْمِ يَوْمِ الِاثْنَيْنِ، فَقَالَ: \"فِيهِ وُلِدْتُ، وَفِيهِ أُنْزِلَ عَلَيَّ\". (م)", "malayalam": "അബൂഖതാദ(റ): തിങ്കളാഴ്ചയിലെ നോമ്പിനെപറ്റി നബി(സ)യോട് ചോദിക്കപ്പെട്ടു. അപ്പോൾ നബി(സ) പറഞ്ഞു: \"അന്നാണു ഞാൻ ജനിച്ചത്. അന്നാണ് എനിക്കു ഖുർആൻ ഇറക്കപ്പെട്ടത്.\" (മു)", "narrator_ml": "അബൂഖതാദ(റ)", "source_codes_ar": ["م"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 32, "page_start": 91}, {"hadith_no": 165, "arabic": "عَنْ حَفْصَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ ثَلَاثَةَ أَيَّامٍ مِنَ الشَّهْرِ: الِاثْنَيْنِ وَالْخَمِيسَ، وَالِاثْنَيْنِ مِنَ الْجُمُعَةِ الْأُخْرَى. (د،ن)", "malayalam": "ഹഫ്സ(റ): നബി(സ) മാസത്തിൽ മൂന്നു ദിവസം നോമ്പെടുക്കാറുണ്ട്; തിങ്കളാഴ്ചയും വ്യാഴാഴ്ചയും മറ്റൊരാഴ്ചയിലെ തിങ്കളാഴ്ചയും. (ദ,ന)", "narrator_ml": "ഹഫ്സ(റ)", "source_codes_ar": ["د", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 32, "page_start": 91}, {"hadith_no": 166, "arabic": "عَنْ مَوْلَى أُسَامَةَ بْنِ زَيْدٍ رَضِيَ اللَّهُ عَنْهُمَا: أَنَّهُ انْطَلَقَ مَعَ أُسَامَةَ إِلَى وَادِي الْقُرَى فِي طَلَبِ مَالٍ لَهُ، فَكَانَ يَصُومُ يَوْمَ الِاثْنَيْنِ وَيَوْمَ الْخَمِيسِ، فَقَالَ لَهُ مَوْلَاهُ: لِمَ تَصُومُ يَوْمَ الِاثْنَيْنِ وَيَوْمَ الْخَمِيسِ وَأَنْتَ شَيْخٌ كَبِيرٌ؟ فَقَالَ: إِنَّ نَبِيَّ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يَصُومُ يَوْمَ الِاثْنَيْنِ وَيَوْمَ الْخَمِيسِ، وَسُئِلَ عَنْ ذَلِكَ، فَقَالَ: \"إِنَّ أَعْمَالَ الْعِبَادِ تُعْرَضُ يَوْمَ الِاثْنَيْنِ وَيَوْمَ الْخَمِيسِ\". (د،ن)", "malayalam": "ഉസാമതുബ്നു സൈദ്(റ)വിന്റെ അടിമയിൽനിന്ന് നിവേദനം: അദ്ദേഹം ഉസാമ(റ)യോട് കൂടെ വാദിൽ ഖുറായിലേക്ക് തന്റെ സമ്പത്തന്വേഷിച്ചു പോയി. ഉസാമ(റ) തിങ്കളാഴ്ചയും വ്യാഴാഴ്ചയും നോമ്പെടുക്കാറുണ്ടായിരുന്നു. തന്റെ അടിമ ഉസാമ(റ)യോട് ചോദിച്ചു: വൃദ്ധനായിട്ടും എന്തിനാണു വ്യാഴാഴ്ചയും തിങ്കളാഴ്ചയും നോമ്പെടുക്കുന്നത്? അപ്പോൾ അദ്ദേഹം പറഞ്ഞു: നബി(സ) തിങ്കളാഴ്ചയും വ്യാഴാഴ്ചയും നോമ്പെടുക്കാറുണ്ട്. \"വ്യാഴാഴ്ചയും തിങ്കളാഴ്ചയും അടിമകളുടെ പ്രവർത്തനങ്ങൾ വെളിവാക്കപ്പെടുന്നു\"വെന്നാണ് നബി(സ) അതേപ്പറ്റി ചോദിക്കപ്പെട്ടപ്പോൾ പറഞ്ഞത്. (ദ,ന)", "narrator_ml": "ഉസാമതുബ്നു സൈദ്(റ)", "source_codes_ar": ["د", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 32, "page_start": 91}, {"hadith_no": 167, "arabic": "عَنْ هُنَيْدَةَ بْنِ خَالِدٍ الْخُزَاعِيِّ، عَنْ أُمِّهِ، قَالَتْ: دَخَلْتُ عَلَى أُمِّ سَلَمَةَ رَضِيَ اللَّهُ عَنْهَا فَسَأَلْتُهَا عَنِ الصِّيَامِ، فَقَالَتْ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَأْمُرُنِي أَنْ أَصُومَ ثَلَاثَةَ أَيَّامٍ مِنْ كُلِّ شَهْرٍ، أَوَّلُهَا الِاثْنَيْنِ وَالْخَمِيسِ. (د،ن)", "malayalam": "ഹുനൈദ(റ) തന്റെ ഉമ്മയിൽ നിന്ന് നിവേദനം: ഞാൻ ഉമ്മുസലമ(റ)യുടെ അടുത്ത് കടന്നുചെന്ന് അവരോട് നോമ്പിനെ സംബന്ധിച്ചു ആരാഞ്ഞു. അവർ പറഞ്ഞു: ഓരോ മാസവും മൂന്നുവീതം നോമ്പനുഷ്ഠിക്കാൻ റസൂൽ(സ) എന്നോട് കൽപിക്കാറുണ്ടായിരുന്നു. അതിൽ ആദ്യത്തേത് തിങ്കളും വ്യാഴവുമായിരിക്കും. (ദ,ന)", "narrator_ml": "ഹുനൈദ(റ)", "source_codes_ar": ["د", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 32, "page_start": 91}, {"hadith_no": 168, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ شَعْبَانَ وَرَمَضَانَ، وَيَتَحَرَّى الِاثْنَيْنِ وَالْخَمِيسَ. (ت،ن،جه)", "malayalam": "ആഇശ(റ): റമസാൻ, ശഅ്ബാൻ മാസങ്ങളിൽ റസൂൽ(സ) വ്രതമനുഷ്ഠിക്കുകയും തിങ്കൾ, വ്യാഴം ദിവസങ്ങളെ പ്രത്യേകം പരിഗണിക്കുകയും ചെയ്യുമായിരുന്നു. (തു,ന,ജ)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["ت", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 32, "page_start": 92}, {"hadith_no": 169, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ: أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يَصُومُ الِاثْنَيْنِ وَالْخَمِيسَ. فَقِيلَ: يَا رَسُولَ اللَّهِ، إِنَّكَ تَصُومُ الِاثْنَيْنِ وَالْخَمِيسَ؟ فَقَالَ: \"إِنَّ يَوْمَ الِاثْنَيْنِ وَالْخَمِيسِ يَغْفِرُ اللَّهُ فِيهِمَا لِكُلِّ مُسْلِمٍ إِلَّا مُهْتَجِرَيْنِ، يَقُولُ: دَعْهُمَا حَتَّى يَصْطَلِحَا\". (ت،جه)", "malayalam": "അബൂഹുറൈറ(റ): റസൂൽ(സ) തിങ്കൾ, വ്യാഴം ദിവസങ്ങളിൽ നോമ്പനുഷ്ഠിക്കാറുണ്ടായിരുന്നു. ആരോ പ്രവാചകർ(സ)യോട് ചോദിച്ചു: അല്ലാഹുവിന്റെ റസൂലേ, അവിടന്ന് തിങ്കൾ, വ്യാഴം ദിവസങ്ങളിൽ നോമ്പനുഷ്ഠിക്കുന്നുണ്ടല്ലോ? റസൂൽ(സ) പ്രതിവചിച്ചു: \"തിങ്കൾ, വ്യാഴം ദിവസങ്ങളിൽ അല്ലാഹു എല്ലാ മുസ്‌ലിംകൾക്കും പൊറുത്തുകൊടുക്കും, പരസ്പരം തെറ്റിപ്പിരിഞ്ഞവർക്കൊഴികെ. അല്ലാഹു പറയും: അവർ അനുരഞ്ജനത്തിലെത്തുന്നതുവരെ അവരുടെ കാര്യമങ്ങു വിട്ടേക്കുക.\" (തു,ജ)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["ت", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 32, "page_start": 92}, {"hadith_no": 170, "arabic": "عَنْ مُسْلِمٍ الْقُرَشِيِّ رَضِيَ اللَّهُ عَنْهُ قَالَ: سَأَلْتُ- أَوْ: سُئِلَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَنْ صِيَامِ الدَّهْرِ، فَقَالَ: \"إِنَّ لِأَهْلِكَ عَلَيْكَ حَقًّا\". ثُمَّ قَالَ: \"صُمْ رَمَضَانَ وَالَّذِي يَلِيهِ، وَكُلَّ أَرْبِعَاءَ وَخَمِيسٍ، فَإِذَا أَنْتَ قَدْ صُمْتَ الدَّهْرَ وَأَفْطَرْتَ\". (د،ت،ن)", "malayalam": "മുസ്‌ലിമുൽ ഖുറശീ(റ): നിത്യവ്രതത്തെ (വർഷം മുഴുവൻ) സംബന്ധിച്ച് ഞാൻ അല്ലെങ്കിൽ മറ്റാരോ തിരുദൂതർ(സ)യോടാരാഞ്ഞു. അവിടന്നരുളി: \"നിന്റെ കുടുംബത്തോട് നിനക്ക് കടമകളുണ്ട്.\" ശേഷം പറഞ്ഞു: \"അതിനാൽ റമസാനിലും അതിനോടടുത്ത ദിനങ്ങളിലും എല്ലാ ബുധൻ, വ്യാഴം ദിവസങ്ങളിലും വ്രതമനുഷ്ഠിക്കുക. എന്നാൽ, നീ കാലം മുഴുവൻ നോമ്പനുഷ്ഠിച്ചവനും നോമ്പു മുറിച്ചവനുമായി.\" (ദ,തു,ന)", "narrator_ml": "മുസ്‌ലിമുൽ ഖുറശീ(റ)", "source_codes_ar": ["د", "ت", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 32, "page_start": 92}, {"hadith_no": 171, "arabic": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَدِمَ الْمَدِينَةَ، فَوَجَدَ الْيَهُودَ صِيَامًا يَوْمَ عَاشُورَاءَ، فَقَالَ لَهُمْ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"مَا هَذَا الْيَوْمُ الَّذِي تَصُومُونَهُ\". قَالُوا: هَذَا يَوْمٌ عَظِيمٌ أَنْجَى اللَّهُ فِيهِ مُوسَى وَقَوْمَهُ، وَغَرَّقَ فِرْعَوْنَ وَقَوْمَهُ، فَصَامَهُ مُوسَى شُكْرًا، فَنَحْنُ نَصُومُهُ. فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"فَنَحْنُ أَحَقُّ وَأَوْلَى بِمُوسَى مِنْكُمْ\". فَصَامَهُ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَأَمَرَ بِصِيَامِهِ. (م)", "malayalam": "ഇബ്നുഅബ്ബാസ്(റ): റസൂൽ(സ) മദീനയിലെത്തി. ആശൂറാ ദിനത്തിൽ ജൂതർ വ്രതമനുഷ്ഠിക്കുന്നതായി നബി(സ)ക്കറിയാൻ സാധിച്ചു. റസൂൽ(സ) അവരോടു ചോദിച്ചു: \"നിങ്ങൾ വ്രതമനുഷ്ഠിക്കുന്ന ഈ ദിനത്തിന്റെ പ്രത്യേകതയെന്താണ്?\" അവർ പറഞ്ഞു: മൂസാനബിയെയും ജനതയെയും അല്ലാഹു രക്ഷിക്കുകയും ഫറോവയെയും തന്റെയാളുകളെയും അല്ലാഹു മുക്കിക്കൊല്ലുകയും ചെയ്ത മഹത്തായ ദിനമാണിത്. മൂസാ(അ) ഈ ദിനത്തിൽ നന്ദിപൂർവം വ്രതമനുഷ്ഠിച്ചു. അതിനാൽ ഞങ്ങളും നോമ്പനുഷ്ഠിക്കുന്നു. റസൂൽ(സ) അരുളി: \"മൂസ(അ)യോട് നിങ്ങളെക്കാൾ ബന്ധമുള്ളവർ ഞങ്ങളാണ്.\" അങ്ങനെ റസൂൽ(സ) അന്നു വ്രതമെടുക്കുകയും വ്രതമെടുക്കാൻ കൽപിക്കുകയും ചെയ്തു. (ബു,മു,ദ,ജ)", "narrator_ml": "ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["م"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 33, "page_start": 92}, {"hadith_no": 172, "arabic": "عَنْ عُبَيْدِ اللَّهِ بْنِ أَبِي يَزِيدَ: أَنَّهُ سَمِعَ ابْنَ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا وَسُئِلَ عَنْ صِيَامِ يَوْمِ عَاشُورَاءَ، فَقَالَ: مَا عَلِمْتُ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ صَامَ يَوْمًا يَطْلُبُ فَضْلَهُ عَلَى الْأَيَّامِ إِلَّا هَذَا الْيَوْمَ، وَلَا شَهْرًا إِلَّا هَذَا الشَّهْرَ. يَعْنِي رَمَضَانَ. (م)", "malayalam": "ഉബൈദുല്ലാഹിബ്നു അബീയസീദ്(റ): ആശൂറാ ദിനത്തിലെ നോമ്പിനെ സംബന്ധിച്ച് ഇബ്നുഅബ്ബാസ്(റ)വിനോടാരോ ചോദിച്ചപ്പോൾ ഇബ്നുഅബ്ബാസ്(റ) പറയുന്നത് അദ്ദേഹം കേട്ടു: ഇബ്നുഅബ്ബാസ്(റ) പറഞ്ഞു: മറ്റു ദിനങ്ങളെക്കാൾ കൂടുതൽ മഹത്വം തേടി ഈ ദിനമൊഴികെ മറ്റൊരു ദിനവും റസൂൽ(സ) നോമ്പനുഷ്ഠിച്ചതായി ഞാനറിഞ്ഞിട്ടില്ല. മറ്റു മാസങ്ങളേക്കാൾ കൂടുതൽ മഹത്വം തേടി ഈ മാസമൊഴികെ, അഥവാ റമളാനൊഴികെ, മറ്റൊരു മാസവും തിരുമേനി(സ) നോമ്പനുഷ്ഠിച്ചതായും ഞാനറിഞ്ഞിട്ടില്ല. (മു)", "narrator_ml": "ഉബൈദുല്ലാഹിബ്നു അബീയസീദ്(റ)", "source_codes_ar": ["م"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 33, "page_start": 93}, {"hadith_no": 173, "arabic": "عَنِ الرُّبَيِّعِ بِنْتِ مُعَوِّذِ بْنِ عَفْرَاءَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: أَرْسَلَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ غَدَاةَ عَاشُورَاءَ إِلَى قُرَى الْأَنْصَارِ الَّتِي حَوْلَ الْمَدِينَةِ: \"مَنْ كَانَ أَصْبَحَ صَائِمًا فَلْيُتِمَّ صَوْمَهُ، وَمَنْ كَانَ أَصْبَحَ مُفْطِرًا فَلْيُتِمَّ بَقِيَّةَ يَوْمِهِ\". فَكُنَّا بَعْدَ ذَلِكَ نَصُومُهُ وَنُصَوِّمُ صِبْيَانَنَا الصِّغَارَ مِنْهُمْ إِنْ شَاءَ اللَّهُ تَعَالَى، وَنَذْهَبُ إِلَى الْمَسْجِدِ فَنَجْعَلُ لَهُمُ اللُّعْبَةَ مِنَ الْعِهْنِ، فَإِذَا بَكَى أَحَدُهُمْ عَلَى الطَّعَامِ أَعْطَيْنَاهَا إِيَّاهُ عِنْدَ الْإِفْطَارِ. (م)", "malayalam": "റുബയ്യിഅ്(റ): ആശൂറാഅ് ദിനത്തിൽ മദീനക്കു ചുറ്റുമുള്ള അൻസാറുകളുടെ ഗ്രാമത്തിലേക്ക് ഇപ്രകാരം പറയാനായി റസൂൽ(സ) ആളെയയച്ചു: \"പ്രഭാതത്തിൽ ആരെങ്കിലും നോമ്പുകാരനാണെങ്കിൽ അവൻ അത് പൂർത്തിയാക്കട്ടെ. നോമ്പുകാരനല്ലെങ്കിൽ ദിവസത്തിന്റെ ബാക്കിഭാഗം അവൻ പൂർത്തിയാക്കട്ടെ.\" പിന്നീടുള്ള ആശൂറാ ദിനത്തിൽ ഞങ്ങൾ നോമ്പനുഷ്ഠിക്കുകയും കുട്ടികളെ നോമ്പെടുപ്പിക്കുകയും ചെയ്യുക പതിവായിരുന്നു. ഞങ്ങൾ പള്ളിയിൽ പോകുമ്പോൾ കുട്ടികൾക്കു കമ്പിളിയുടെ കളിക്കോപ്പുകൾ നൽകും. ആരെങ്കിലും ഭക്ഷണത്തിനായി കരഞ്ഞാൽ നോമ്പുതുറക്കുന്നതുവരെ കളിക്കോപ്പുകളാണ് നൽകുക. (മു)", "narrator_ml": "റുബയ്യിഅ്(റ)", "source_codes_ar": ["م"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 33, "page_start": 93}, {"hadith_no": 174, "arabic": "عَنْ عَبْدِ اللَّهِ بْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: حِينَ صَامَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَوْمَ عَاشُورَاءَ وَأَمَرَنَا بِصِيَامِهِ قَالُوا: يَا رَسُولَ اللَّهِ، إِنَّهُ يَوْمٌ تُعَظِّمُهُ الْيَهُودُ وَالنَّصَارَى؟ فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"فَإِذَا كَانَ الْعَامُ الْمُقْبِلُ صُمْنَا يَوْمَ التَّاسِعِ\". فَلَمْ يَأْتِ الْعَامُ الْمُقْبِلُ حَتَّى تُوُفِّيَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. (م،د)", "malayalam": "അബ്ദുല്ലാഹിബ്നു അബ്ബാസ്(റ): ആശൂറാദിനത്തിൽ നബിതിരുമേനി(സ) വ്രതമനുഷ്ഠിക്കുകയും അനുഷ്ഠിക്കാൻ ഞങ്ങളോട് കൽപിക്കുകയും ചെയ്തപ്പോൾ അനുചരർ ചോദിച്ചു: അല്ലാഹുവിന്റെ റസൂലേ, ഇത് ജൂതരും ക്രൈസ്തവരും ആദരിക്കുന്ന ദിനമല്ലേ? \"എങ്കിൽ അടുത്ത വർഷം നമുക്ക് മുഹർറം ഒമ്പതിനും നോമ്പനുഷ്ഠിക്കാം\" എന്ന് അവിടന്ന് പ്രതിവചിച്ചു. പക്ഷേ, അടുത്ത വർഷമായപ്പോഴേക്കും തിരുമേനി(സ) ഇഹലോകത്തോട് യാത്രപറഞ്ഞിരുന്നു. (മു,ദ)", "narrator_ml": "അബ്ദുല്ലാഹിബ്നു അബ്ബാസ്(റ)", "source_codes_ar": ["م", "د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 33, "page_start": 93}, {"hadith_no": 175, "arabic": "عَنِ الْحَكَمِ بْنِ الْأَعْرَجِ قَالَ: أَتَيْتُ ابْنَ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا وَهُوَ مُتَوَسِّدٌ رِدَاءَهُ فِي الْمَسْجِدِ الْحَرَامِ، فَسَأَلْتُهُ عَنْ صَوْمِ يَوْمِ عَاشُورَاءَ؟ فَقَالَ: إِذَا رَأَيْتَ هِلَالَ الْمُحَرَّمِ فَاعْدُدْ، فَإِذَا كَانَ يَوْمُ التَّاسِعِ فَأَصْبِحْ صَائِمًا. فَقُلْتُ: كَذَا كَانَ مُحَمَّدٌ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ؟ فَقَالَ: كَذَلِكَ كَانَ مُحَمَّدٌ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ. (م،د،ت،ن)", "malayalam": "ഹകമുബ്നുൽ അഅ്റജ്(റ): ഞാൻ ഇബ്നുഅബ്ബാസ്(റ)വിന്റെ അരികെ ചെന്നു. മസ്ജിദുൽ ഹറാമിൽ തന്റെ മേൽവസ്ത്രം തലയണയാക്കിക്കിടക്കുകയായിരുന്നു അദ്ദേഹം. ആശൂറാ ദിനത്തിലെ നോമ്പിനെ സംബന്ധിച്ച് ഞാനദ്ദേഹത്തോടാരാഞ്ഞു. അദ്ദേഹം പറഞ്ഞു: മുഹർറത്തിന്റെ മാസപ്പിറവി ദർശിച്ചതു മുതൽ നീ ദിനങ്ങൾ എണ്ണുകയും ഒമ്പതാം ദിവസമെത്തിയാൽ പ്രഭാതം മുതൽ വ്രതമനുഷ്ഠിക്കുകയും ചെയ്യുക. ഞാൻ ചോദിച്ചു: മുഹമ്മദ്നബി(സ) ഇങ്ങനെയാണോ നോമ്പനുഷ്ഠിച്ചിരുന്നത്? അദ്ദേഹം പറഞ്ഞു: അതെ, ഇപ്രകാരമായിരുന്നു നബി(സ)യുടെ നോമ്പ്. (മു,ദ,തു,ന)", "narrator_ml": "ഹകമുബ്നുൽ അഅ്റജ്(റ)", "source_codes_ar": ["م", "د", "ت", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 33, "page_start": 93}, {"hadith_no": 176, "arabic": "عَنْ عَبْدِ الرَّحْمَنِ بْنِ مَسْلَمَةَ، عَنْ عَمِّهِ: أَنَّ أَسْلَمَ أَتَتِ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"صُمْتُمْ يَوْمَكُمْ هَذَا\". قَالُوا: لَا، قَالَ: \"فَأَتِمُّوا بَقِيَّةَ يَوْمِكُمْ وَاقْضُوهُ\". قَالَ أَبُو دَاوُدَ: يَعْنِي يَوْمَ عَاشُورَاءَ. (د،ن)", "malayalam": "തന്റെ പിതൃവ്യനിൽനിന്ന് അബ്ദുറഹ്മാനുബ്നു മസ്‌ലമ(റ) നിവേദനം ചെയ്യുന്നു: അസ്‌ലമ ഗോത്രക്കാർ തിരുമേനി(സ)യുടെ അരികെ ചെന്നു. റസൂൽ(സ) ചോദിച്ചു: \"നിങ്ങളിന്നു വ്രതമെടുത്തിട്ടുണ്ടോ?\" ഇല്ല എന്ന് അവർ മറുപടി പറഞ്ഞു. അവിടന്ന് പറഞ്ഞു: \"ഈ ദിവസത്തെ ബാക്കിഭാഗം നിങ്ങൾ പൂർത്തിയാക്കുക. ശേഷമത് ഖളാഅ് വീട്ടുക.\" അബൂദാവൂദ്(റ) പറയുന്നു: ഇതുകൊണ്ടുദ്ദേശിക്കുന്നത് ആശൂറാ ദിനത്തിലെ വ്രതമാകുന്നു. (ദ,ന)", "narrator_ml": "തന്റെ പിതൃവ്യനിൽനിന്ന് അബ്ദുറഹ്മാനുബ്നു മസ്‌ലമ(റ)", "source_codes_ar": ["د", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 33, "page_start": 94}, {"hadith_no": 177, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: كَانَ يَوْمُ عَاشُورَاءَ تَصُومُهُ قُرَيْشٌ فِي الْجَاهِلِيَّةِ، وَكَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُهُ، فَلَمَّا قَدِمَ الْمَدِينَةَ صَامَهُ، وَأَمَرَ بِصِيَامِهِ، فَلَمَّا فُرِضَ رَمَضَانُ، تَرَكَ يَوْمَ عَاشُورَاءَ، فَمَنْ شَاءَ صَامَهُ، وَمَنْ شَاءَ تَرَكَهُ. وَفِي رِوَايَةٍ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"مَنْ شَاءَ فَلْيَصُمْهُ، وَمَنْ شَاءَ فَلْيُفْطِرْهُ\". (ق،ت)", "malayalam": "ആഇശ(റ): ഖുറൈശികൾ ജാഹിലിയ്യാ കാലത്ത് ആശൂറാ ദിനത്തിൽ നോമ്പനുഷ്ഠിക്കുമായിരുന്നു. നബി(സ)യും ആ ദിനത്തിൽ നോമ്പനുഷ്ഠിച്ചു കൊണ്ടിരുന്നു. അപ്രകാരം മദീനയിൽ വന്നപ്പോഴും നബി(സ) ആ നോമ്പനുഷ്ഠിക്കുകയും, ജനങ്ങളോട് അത് കൽപ്പിക്കുകയും ചെയ്തു. പിന്നീട് റമസാൻ വ്രതം നിർബന്ധമാക്കപ്പെട്ടപ്പോൾ ആശൂറാ ദിനത്തിലെ നോമ്പ് ഒഴിവാക്കുകയും ചെയ്തു. പിന്നീട് ഉദ്ദേശിച്ചവർ അനുഷ്ഠിക്കുകയും, ഉദ്ദേശ്യമുള്ളവർ ഒഴിവാക്കുകയും ചെയ്തു. മറ്റൊരു നിവേദനം: റസൂൽ(സ) പറഞ്ഞു: \"ഇഷ്ടമുള്ളവർ അന്ന് നോമ്പനുഷ്ഠിക്കുകയും ഇഷ്ടമുള്ളവർ മുറിക്കുകയും ചെയ്യട്ടെ.\" (ബു,മു,തു)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["ق", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"مَنْ شَاءَ فَلْيَصُمْهُ، وَمَنْ شَاءَ فَلْيُفْطِرْهُ\". (ق،ت)", "malayalam": "മറ്റൊരു നിവേദനം: റസൂൽ(സ) പറഞ്ഞു: \"ഇഷ്ടമുള്ളവർ അന്ന് നോമ്പനുഷ്ഠിക്കുകയും ഇഷ്ടമുള്ളവർ മുറിക്കുകയും ചെയ്യട്ടെ.\" (ബു,മു,തു)"}], "bab_seq": 33, "page_start": 94}, {"hadith_no": 178, "arabic": "عَنِ ابْنِ عُمَرَ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: كَانَ عَاشُورَاءُ يَوْمًا نَصُومُهُ فِي الْجَاهِلِيَّةِ، فَلَمَّا نَزَلَ رَمَضَانُ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"هَذَا يَوْمٌ مِنْ أَيَّامِ اللَّهِ، فَمَنْ شَاءَ صَامَهُ، وَمَنْ شَاءَ تَرَكَهُ\". (خ،د)", "malayalam": "ഇബ്നുഉമർ(റ): ആശൂറാ ദിനത്തിലെ നോമ്പ് ജാഹിലിയ്യാ കാലത്ത് ഞങ്ങളനുഷ്ഠിച്ചിരുന്നു. റമളാനിനെ സംബന്ധിച്ച കൽപ്പന വന്നപ്പോൾ റസൂൽ(സ) പറഞ്ഞു: \"ഇത് (ആശൂറാഅ്) അല്ലാഹുവിന്റെ വിശേഷദിനങ്ങളിൽപ്പെട്ട ഒരു ദിനമാണ്. ഉദ്ദേശിക്കുന്നവർ വ്രതമനുഷ്ഠിക്കട്ടെ, അല്ലാത്തവർ ഉപേക്ഷിക്കട്ടെ.\" (ബു,ദ)", "narrator_ml": "ഇബ്നുഉമർ(റ)", "source_codes_ar": ["خ", "د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 33, "page_start": 94}, {"hadith_no": 179, "arabic": "عَنْ أَبِي قَتَادَةَ رَضِيَ اللَّهُ عَنْهُ: أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"صِيَامُ يَوْمِ عَاشُورَاءَ: إِنِّي أَحْتَسِبُ عَلَى اللَّهِ أَنْ يُكَفِّرَ السَّنَةَ الَّتِي قَبْلَهُ\". (م،ت)", "malayalam": "അബൂഖതാദ(റ): നബി(സ) പറഞ്ഞു: \"ആശൂറാദിനത്തിലെ നോമ്പുകാരണം കഴിഞ്ഞ വർഷത്തെ ദോഷം മുഴുവൻ അല്ലാഹു പൊറുക്കുമെന്നു ഞാനാശിക്കുന്നു.\" (മു,തു)", "narrator_ml": "അബൂഖതാദ(റ)", "source_codes_ar": ["م", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 33, "page_start": 94}, {"hadith_no": 180, "arabic": "عَنْ مُحَمَّدِ بْنِ صَيْفِيٍّ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ لَنَا رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَوْمَ عَاشُورَاءَ: \"مِنْكُمْ أَحَدٌ طَعِمَ الْيَوْمَ\". قُلْنَا: مِنَّا طَعِمَ وَمِنَّا مَنْ لَمْ يَطْعَمْ. قَالَ: \"فَأَتِمُّوا بَقِيَّةَ يَوْمِكُمْ، مَنْ كَانَ طَعِمَ وَمَنْ لَمْ يَطْعَمْ. فَأَرْسِلُوا إِلَى أَهْلِ الْعَرُوضِ فَلْيُتِمُّوا بَقِيَّةَ يَوْمِهِمْ\". قَالَ: يَعْنِي أَهْلَ الْعَرُوضِ حَوْلَ الْمَدِينَةِ. (جه)", "malayalam": "മുഹമ്മദ്ബ്നു സ്വൈഫിയ്യ്(റ): റസൂൽ(സ) ആശൂറാദിനത്തിൽ ഞങ്ങളോട് ചോദിച്ചു: \"നിങ്ങളിലാരെങ്കിലും ഇന്ന് ഭക്ഷണം കഴിച്ചിട്ടുണ്ടോ?\" ഞങ്ങൾ പറഞ്ഞു: ഞങ്ങളിൽ ഭക്ഷിച്ചവരുമുണ്ട്, ഭക്ഷിക്കാത്തവരുമുണ്ട്. അപ്പോൾ തിരുമേനി(സ) അരുളി: \"ഭക്ഷിച്ചവരും ഭക്ഷിക്കാത്തവരും ഇന്നു ബാക്കിസമയം പൂർത്തിയാക്കിക്കൊള്ളുക. ദിവസത്തിൽനിന്നു ശേഷിക്കുന്ന സമയം പൂർത്തിയാക്കാൻ പരിസരവാസികളോട് പറയാൻ ഒരാളെ അയക്കുകയും ചെയ്യുക.\" നിവേദകൻ പറഞ്ഞു: നബി(സ) ഉദ്ദേശിച്ചത് മദീനക്ക് ചുറ്റുമധിവസിക്കുന്നവരേയാണ്. (ജ)", "narrator_ml": "മുഹമ്മദ്ബ്നു സ്വൈഫിയ്യ്(റ)", "source_codes_ar": ["جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 33, "page_start": 94}, {"hadith_no": 181, "arabic": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"لَئِنْ بَقِيتُ إِلَى قَابِلٍ لَأَصُومَنَّ الْيَوْمَ التَّاسِعَ\". فِي رِوَايَةٍ: مَخَافَةَ أَنْ يَفُوتَهُ عَاشُورَاءُ. (م،جه)", "malayalam": "ഇബ്നുഅബ്ബാസ്(റ): റസൂൽ(സ) അരുളി: \"അടുത്തവർഷം ഞാൻ ജീവിച്ചിരിക്കുകയാണെങ്കിൽ (മുഹർറമിലെ) ഒമ്പതാം ദിവസവും ഞാൻ വ്രതമനുഷ്ഠിക്കും.\" മറ്റൊരു റിപ്പോർട്ട്: ആശൂറാ നോമ്പ് നഷ്ടപ്പെടുമോ എന്ന ഭയത്താലാണത്. (മു,ജ)", "narrator_ml": "ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["م", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": null, "malayalam": "മറ്റൊരു നിവേദന്: ആശൂറാ നോമ്പ് നഷ്ടപ്പെടുമോ എന്ന ഭയത്താലാണത്. (മു,ജ)"}], "bab_seq": 33, "page_start": 95}, {"hadith_no": 182, "arabic": "عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو رَضِيَ اللَّهُ عَنْهُمَا: أَنَّهُ ذُكِرَ عِنْدَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَوْمُ عَاشُورَاءَ، فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"كَانَ يَوْمًا يَصُومُهُ أَهْلُ الْجَاهِلِيَّةِ، فَمَنْ أَحَبَّ مِنْكُمْ أَنْ يَصُومَهُ فَلْيَصُمْهُ، وَمَنْ كَرِهَهُ فَلْيَدَعْهُ\". (م،جه)", "malayalam": "അബ്ദുല്ലാഹിബ്നു അംറ്(റ): ആശൂറാദിനത്തെപ്പറ്റി റസൂൽ(സ)യുടെ സന്നിധിയിൽ പരാമർശിക്കപ്പെട്ടു. അവിടന്ന് അരുളി. \"അത് (ആശൂറാദിനം) ജാഹിലിയ്യാ കാലത്തെയാളുകൾ വ്രതമനുഷ്ഠിക്കുന്ന ദിനമായിരുന്നു. നിങ്ങളിലാരെങ്കിലും ആശൂറാ നോമ്പ് അനുഷ്ഠിക്കുന്നുവെങ്കിൽ അനുഷ്ഠിച്ചുകൊള്ളട്ടെ. വെറുക്കുന്നുവെങ്കിൽ ഉപേക്ഷിക്കട്ടെ.\" (മു,ജ)", "narrator_ml": "അബ്ദുല്ലാഹിബ്നു അംറ്(റ)", "source_codes_ar": ["م", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 33, "page_start": 95}, {"hadith_no": 183, "arabic": "عَنْ أَبِي قَتَادَةَ رَضِيَ اللَّهُ عَنْهُ: رَجُلٌ أَتَى النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ: كَيْفَ تَصُومُ؟ فَغَضِبَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مِنْ قَوْلِهِ، فَلَمَّا رَأَى عُمَرُ رَضِيَ اللَّهُ عَنْهُ غَضَبَهُ قَالَ: رَضِينَا بِاللَّهِ رَبًّا وَبِالْإِسْلَامِ دِينًا وَبِمُحَمَّدٍ نَبِيًّا، نَعُوذُ بِاللَّهِ مِنْ غَضَبِ اللَّهِ وَغَضَبِ رَسُولِهِ. فَجَعَلَ عُمَرُ رَضِيَ اللَّهُ عَنْهُ يُرَدِّدُ هَذَا الْكَلَامَ حَتَّى سَكَنَ غَضَبُهُ، فَقَالَ عُمَرُ: يَا رَسُولَ اللَّهِ، كَيْفَ بِمَنْ يَصُومُ الدَّهْرَ كُلَّهُ؟ قَالَ: \"لَا صَامَ وَلَا أَفْطَرَ\" أَوْ قَالَ: \"لَمْ يَصُمْ وَلَمْ يُفْطِرْ\". قَالَ: كَيْفَ مَنْ يَصُومُ يَوْمَيْنِ وَيُفْطِرُ يَوْمًا؟ قَالَ: \"وَيُطِيقُ ذَلِكَ أَحَدٌ\". قَالَ: كَيْفَ مَنْ يَصُومُ يَوْمًا وَيُفْطِرُ يَوْمًا؟ قَالَ: \"ذَاكَ صَوْمُ دَاوُدَ عَلَيْهِ السَّلَامُ\". قَالَ: كَيْفَ مَنْ يَصُومُ يَوْمًا وَيُفْطِرُ يَوْمَيْنِ؟ قَالَ: \"وَدِدْتُ أَنِّي طُوِّقْتُ ذَلِكَ\". ثُمَّ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"ثَلَاثٌ مِنْ كُلِّ شَهْرٍ، وَرَمَضَانُ إِلَى رَمَضَانَ، فَهَذَا صِيَامُ الدَّهْرِ كُلِّهِ. صِيَامُ يَوْمِ عَرَفَةَ: أَحْتَسِبُ عَلَى اللَّهِ أَنْ يُكَفِّرَ السَّنَةَ الَّتِي قَبْلَهُ وَالسَّنَةَ الَّتِي بَعْدَهُ، وَصِيَامُ يَوْمِ عَاشُورَاءَ: أَحْتَسِبُ عَلَى اللَّهِ أَنْ يُكَفِّرَ السَّنَةَ الَّتِي قَبْلَهُ\". (م)", "malayalam": "അബൂഖതാദ(റ): ഒരാൾ റസൂൽ(സ)യുടെ അടുത്തു ചെന്ന് ചോദിച്ചു: അങ്ങ് എങ്ങനെയാണ് വ്രതമെടുക്കാറുള്ളത്?\" ചോദ്യം കേട്ട റസൂൽ(സ) കോപാകുലനായി. അവിടത്തെ കോപം കണ്ട ഉമർ(റ) പറഞ്ഞു: അല്ലാഹുവിനെ രക്ഷിതാവായും ഇസ്‌ലാമിനെ മതമായും മുഹമ്മദ്(സ)യെ പ്രവാചകരായും ഞങ്ങൾ തൃപ്തിപ്പെട്ടിരിക്കുന്നു. അല്ലാഹുവിന്റെയും അവന്റെ തിരുദൂതരുടെയും കോപത്തിൽനിന്ന് അല്ലാഹുവിനോട് ഞങ്ങൾ കാവൽ തേടുന്നു. തിരുമേനി(സ)യുടെ കോപമടങ്ങുന്നതുവരെ ഉമർ(റ) അതാവർത്തിച്ചു. തുടർന്ന് ഉമർ(റ) ചോദിച്ചു: അല്ലാഹുവിന്റെ റസൂലേ, നിത്യവ്രതമെടുക്കുന്നവനെ സംബന്ധിച്ച് അവിടത്തെ അഭിപ്രായമെ ന്താണ്? അവിടന്ന് പ്രതിവചിച്ചു: \"അവൻ വ്രതമെടുത്തിട്ടില്ല; മുറിച്ചിട്ടുമില്ല.\" അല്ലെങ്കിൽ \"അവൻ നോമ്പെടുക്കുന്നുമില്ല, മുറിക്കുന്നുമില്ല.\" ഉമർ(റ) ചോദിച്ചു: രണ്ടുദിവസം നോമ്പെടുത്ത് ഒരു ദിവസം നോമ്പെടുക്കാത്തവനെങ്ങനെയാണ്? അവിടന്ന് പറഞ്ഞു: \"അതാർക്കെങ്കിലും കഴിയുമോ.\" ഒരു ദിവസം നോമ്പെടുക്കുകയും മറ്റൊരു ദിനം നോമ്പ് മുറിക്കുകയും ചെയ്യുന്നവനെപ്പറ്റി ഉമർ(റ) ചോദിച്ചു. \"അതാണ് ദാവൂദ്നബി(അ)യുടെ നോമ്പ്\" എന്നവിടന്ന് പ്രത്യുത്തരം നൽകി. ഉമർ(റ) ചോദിച്ചു: ഒരു ദിവസം നോമ്പെടുത്തു രണ്ടു ദിവസം നോമ്പു മുറിക്കുന്നവനെ സംബന്ധിച്ച് എന്താണ് അങ്ങയുടെ അഭിപ്രായം? നബി(സ) പറഞ്ഞു: \"അതിനെനിക്കു കഴിഞ്ഞിരുന്നെങ്കിൽ എന്നു ഞാനാഗ്രഹിക്കുന്നു.\" പിന്നീടവിടന്നരുളി: \"ഓരോ മാസത്തിലെ മൂന്നു ദിവസവും റമളാൻ മാസവും നോമ്പെടുക്കുകയാണെങ്കിൽ അത് എല്ലാ കാലത്തും നോമ്പെടുക്കുന്നതിനു തുല്യമാണ്. അറഫാദിനത്തിലെ വ്രതം കാരണമായി അല്ലാഹു കഴിഞ്ഞതും വരാനുള്ളതുമായ ഓരോ വർഷത്തെ ദോഷം പൊറുത്തുതരുമെന്ന് ഞാൻ ആശിക്കുന്നു. ആശൂറാ ദിനത്തിലെ നോമ്പ് കാരണമായി കഴിഞ്ഞ ഒരു വർഷത്തെ പാപം അല്ലാഹു പൊറുത്തുതരുമെന്ന് ഞാനാശിക്കുന്നു.\" (മു)", "narrator_ml": "അബൂഖതാദ(റ)", "source_codes_ar": ["م"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 34, "page_start": 95}, {"hadith_no": 184, "arabic": "عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ: عَنْ قَتَادَةَ بْنِ النُّعْمَانِ قَالَ: سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ: \"مَنْ صَامَ يَوْمَ عَرَفَةَ: غُفِرَ لَهُ سَنَةٌ أَمَامَهُ وَسَنَةٌ بَعْدَهُ\". (جه)", "malayalam": "അബൂസഈദിൽ ഖുദ്‌രി(റ) ഖതാദതുബ്നു നുഅ്മാൻ(റ)വിൽ നിന്ന് നിവേദനം: \"ആരെങ്കിലും അറഫാദിനത്തിലെ നോമ്പനുഷ്ഠിച്ചാൽ കഴിഞ്ഞു പോയതും വരാനിരിക്കുന്നതുമായ ഓരോ വർഷങ്ങളിലെ പാപങ്ങൾ അവന് പൊറുക്കപ്പെടുമെ\"ന്ന് റസൂൽ(സ) പറഞ്ഞതായി ഞാൻ കേട്ടു. (ജ)", "narrator_ml": "അബൂസഈദിൽ ഖുദ്‌രി(റ)", "source_codes_ar": ["جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 34, "page_start": 96}, {"hadith_no": 185, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَهَى عَنْ صَوْمِ يَوْمِ عَرَفَةَ بِعَرَفَةَ. (د،ن،جه)", "malayalam": "അബൂഹുറൈറ(റ): അറഫയിൽവെച്ച് അറഫ നോമ്പനുഷ്ഠിക്കുന്നതിനെ റസൂൽ(സ) വിലക്കി. (ദ,ന,ജ)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["د", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 35, "page_start": 96}, {"hadith_no": 186, "arabic": "عَنْ أُمِّ الْفَضْلِ بِنْتِ الْحَارِثِ رَضِيَ اللَّهُ عَنْهَا: أَنَّ نَاسًا تَمَارَوْا عِنْدَهَا يَوْمَ عَرَفَةَ فِي صَوْمِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، فَقَالَ بَعْضُهُمْ: هُوَ صَائِمٌ، وَقَالَ بَعْضُهُمْ: لَيْسَ بِصَائِمٍ، فَأَرْسَلَتْ إِلَيْهِ بِقَدَحِ لَبَنٍ وَهُوَ وَاقِفٌ عَلَى بَعِيرِهِ بِعَرَفَةَ، فَشَرِبَ. (ق،د،ت،ن)", "malayalam": "ഹാരിസിന്റെ പുത്രി ഉമ്മുൽഫള്ൽ(റ): അറഫാദിനത്തിൽ കുറച്ചാളുകൾ മഹതിയുടെ അടുക്കൽവന്ന് റസൂൽ(സ)യുടെ വ്രതത്തിന്റെ കാര്യത്തിൽ പരസ്പരം സംശയം പ്രകടിപ്പിച്ചു. ചിലർ പറഞ്ഞു: റസൂൽ(സ) നോമ്പുകാരനാണ്. ചിലർ പറഞ്ഞു: അല്ല. തൽസമയം മഹതി റസൂൽ(സ)ക്ക് ഒരു പാത്രം പാലുമായി ആളെ അയച്ചു. അവിടന്ന് അറഫയിൽ ഒരു ഒട്ടകത്തിന് സമീപം നിൽക്കുകയായിരുന്നു. തിരുമേനി(സ) ആ പാൽ കുടിച്ചു. (ബു,മു,ദ,തു,ന)", "narrator_ml": "ഹാരിസിന്റെ പുത്രി ഉമ്മുൽഫള്ൽ(റ)", "source_codes_ar": ["ق", "د", "ت", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 35, "page_start": 96}, {"hadith_no": 187, "arabic": "عَنِ ابْنِ عُمَرَ رَضِيَ اللَّهُ عَنْهُمَا، وَقَدْ سُئِلَ عَنْ صَوْمِ يَوْمِ عَرَفَةَ بِعَرَفَةَ؟ فَقَالَ: حَجَجْتُ مَعَ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَلَمْ يَصُمْهُ، وَمَعَ أَبِي بَكْرٍ فَلَمْ يَصُمْهُ، وَمَعَ عُمَرَ فَلَمْ يَصُمْهُ، وَمَعَ عُثْمَانَ فَلَمْ يَصُمْهُ. وَأَنَا لَا أَصُومُهُ، وَلَا آمُرُ بِهِ، وَلَا أَنْهَى عَنْهُ. حَسَنٌ. (ت)", "malayalam": "ഇബ്നുഉമർ(റ): അറഫയിൽ വെച്ച് അറഫാ നോമ്പെടുക്കുന്നതു സംബന്ധിച്ച ചോദ്യത്തിന് അദ്ദേഹം ഇപ്രകാരം മറുപടി പറഞ്ഞു: ഞാൻ റസൂൽ(സ)യോടൊപ്പം ഹജ്ജ് ചെയ്തു. പക്ഷേ, അവിടന്ന് അറഫാ നോമ്പനുഷ്ഠിച്ചില്ല. അബൂബകർ(റ)വിന്റെ കൂടെയും ഹജ്ജ് ചെയ്തു. അവരും അത് നോറ്റില്ല. ഉമർ(റ)വിന്റെ കൂടെയും ഹജ്ജ് ചെയ്തു. അവരുമത് നോറ്റിട്ടില്ല. ഉസ്മാൻ(റ)ന്റെ കൂടെയും ഞാൻ ഹജ്ജ് ചെയ്തു. പക്ഷേ, അവരും ആ നോമ്പനുഷ്ഠിച്ചില്ല. ഞാൻ ആ നോമ്പനുഷ്ഠിക്കുകയോ അത് കൽപിക്കുകയോ വിരോധിക്കുകയോ ചെയ്യില്ല. (തു)", "narrator_ml": "ഇബ്നുഉമർ(റ)", "source_codes_ar": ["ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 35, "page_start": 96}, {"hadith_no": 188, "arabic": "عَنْ مُجِيبَةَ الْبَاهِلِيَّةِ، عَنْ أَبِيهَا أَوْ عَمِّهَا- رَضِيَ اللَّهُ عَنْهُمَا- أَنَّهُ أَتَى رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، ثُمَّ انْطَلَقَ فَأَتَاهُ بَعْدَ سَنَةٍ وَقَدْ تَغَيَّرَتْ حَالُهُ وَهَيْئَتُهُ، فَقَالَ: يَا رَسُولَ اللَّهِ، أَمَا تَعْرِفُنِي؟ قَالَ: \"مَنْ أَنْتَ\". قَالَ: أَنَا الْبَاهِلِيُّ الَّذِي جِئْتُكَ عَامَ الْأَوَّلِ. قَالَ \"فَمَا غَيَّرَكَ، وَقَدْ كُنْتَ حَسَنَ الْهَيْئَةِ\". قَالَ: مَا أَكَلْتُ طَعَامًا إِلَّا بِلَيْلٍ مُنْذُ فَارَقْتُكَ. فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"لِمَ عَذَّبْتَ نَفْسَكَ\". ثُمَّ قَالَ: \"صُمْ شَهْرَ الصَّبْرِ وَيَوْمًا مِنْ كُلِّ شَهْرٍ\". قَالَ: زِدْنِي فَإِنَّ بِي قُوَّةً. قَالَ: \"صُمْ يَوْمَيْنِ\". قَالَ: زِدْنِي. قَالَ: \"صُمْ ثَلَاثَةَ أَيَّامٍ\". قَالَ: زِدْنِي. قَالَ: \"صُمْ مِنَ الْحُرُمِ وَاتْرُكْ، صُمْ مِنَ الْحُرُمِ وَاتْرُكْ\". وَقَالَ بِأَصَابِعِهِ الثَّلَاثَةِ فَضَمَّهَا ثُمَّ أَرْسَلَهَا. (د،ن،جه)", "malayalam": "മുജീബതുൽബാഹിലി(റ) തന്റെ പിതാവിൽ നിന്ന് അല്ലെങ്കിൽ പിതൃസഹോദരിനിൽ നിന്ന്: അദ്ദേഹം (പിതാവോ പിതൃസഹോദരനോ) ഒരിക്കൽ റസൂൽ(സ)യുടെ അരികെ ചെന്നു. പിന്നീട് തിരിച്ചുപോയി ഒരു വർഷത്തിനുശേഷം വീണ്ടും തിരുമേനി(സ)യുടെ അടുത്ത്വന്നു. ആ സമയത്ത് അദ്ദേഹത്തിന്റെ രൂപഭാവങ്ങൾ വളരെ വ്യത്യാസപ്പെട്ടിരുന്നു. അദ്ദേഹം ചോദിച്ചു: അല്ലാഹുവിന്റെ റസൂലേ, എന്നെ അറിയുമോ? നബി(സ) ചോദിച്ചു: \"നിങ്ങൾ ആരാണ്.\" അദ്ദേഹം പറഞ്ഞു: കഴിഞ്ഞവർഷം അങ്ങയുടെ അരികെ വന്നിരുന്ന ബാഹിലി ഗോത്രക്കാരനാണു ഞാൻ. നബി(സ) ചോദിച്ചു: \"വളരെ സുമുഖനായിരുന്ന നിന്നെ ഇത്ര മാറ്റം വരുത്തിയ കാര്യമെന്താണ്?\" അദ്ദേഹം പറഞ്ഞു: അങ്ങയെ വിട്ടുപിരിഞ്ഞതുമുതൽ ഞാൻ രാത്രി മാത്രമേ ഭക്ഷണം കഴിക്കാറുള്ളൂ. നബി(സ) പറഞ്ഞു: \"എന്തിനാണു നീ സ്വയം ശിക്ഷിക്കുന്നത്?\" ശേഷം അവിടന്നരുളി: \"ക്ഷമയുടെ മാസവും (റമസാൻ) എല്ലാ മാസത്തിൽനിന്നും ഒരു ദിവസവും വ്രതമെടുക്കുക.\" അദ്ദേഹം പറഞ്ഞു: ഇനിയും കൂടുതലാക്കിത്തരിക. കാരണം, എനിക്കതിനുള്ള ശേഷിയുണ്ട്. നബി(സ) പറഞ്ഞു: \"എങ്കിൽ രണ്ടു ദിവസം വ്രതമെടുക്കുക.\" അദ്ദേഹം പറഞ്ഞു: എനിക്കു കൂടുതലാക്കിത്തരിക. നബി(സ) പറഞ്ഞു: \"എങ്കിൽ മൂന്നുദിവസം വ്രതമനുഷ്ഠിക്കുക.\" അദ്ദേഹം പറഞ്ഞു: ഇനിയും എനിക്ക് ഏറ്റിത്തരിക. നബി(സ) പറഞ്ഞു: \"വിശുദ്ധമാസത്തിൽ വ്രതമെടുത്തുകൊള്ളുക, വ്രതം മുറിക്കുകയും ചെയ്യുക, വിശുദ്ധമാസത്തിൽ വ്രതമെടുക്കുകയും മുറിക്കുകയും ചെയ്യുക. വിശുദ്ധമാസത്തിൽ വ്രതമെടുക്കുകയും മുറിക്കുകയും ചെയ്യുക.\" അപ്പോൾ തിരുമേനി(സ) മൂന്നു വിരലുകൾ കൂട്ടിപ്പിടിക്കുകയും പിന്നീട് അയച്ചുവിടുകയും ചെയ്തു. (ദ,ന,ജ)", "narrator_ml": "മുജീബതുൽബാഹിലി(റ)", "source_codes_ar": ["د", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 36, "page_start": 97}, {"hadith_no": 189, "arabic": "عَنْ أَبِي مُجِيبَةَ الْبَاهِلِيِّ، عَنْ أَبِيهِ أَوْ عَنْ عَمِّهِ- رَضِيَ اللَّهُ عَنْهُمَا- قَالَ: أَتَيْتُ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقُلْتُ: يَا نَبِيَّ اللَّهِ، أَنَا الرَّجُلُ الَّذِي أَتَيْتُكَ عَامَ الْأَوَّلِ. قَالَ: \"فَمَا لِي أَرَى جِسْمَكَ نَاحِلًا\". قَالَ: يَا رَسُولَ اللَّهِ، مَا أَكَلْتُ طَعَامًا بِالنَّهَارِ، مَا أَكَلْتُهُ إِلَّا بِاللَّيْلِ. قَالَ: \"مَنْ أَمَرَكَ أَنْ تُعَذِّبَ نَفْسَكَ\". قُلْتُ: يَا رَسُولَ اللَّهِ، إِنِّي أَقْوَى. قَالَ: \"صُمْ شَهْرَ الصَّبْرِ وَيَوْمًا بَعْدَهُ\". قُلْتُ: إِنِّي أَقْوَى. قَالَ: \"صُمْ شَهْرَ الصَّبْرِ وَيَوْمَيْنِ بَعْدَهُ\". قُلْتُ: إِنِّي أَقْوَى. قَالَ: \"صُمْ شَهْرَ الصَّبْرِ وَثَلَاثَةَ أَيَّامٍ بَعْدَهُ، وَصُمْ أَشْهُرَ الْحُرُمِ\". (د،جه)", "malayalam": "അബുമുജീബതുൽ ബാഹിലി(റ): അദ്ദേഹത്തിന്റെ പിതാവ് അല്ലെങ്കിൽ പിതൃസഹോദരൻ പറഞ്ഞു: ഞാൻ നബി(സ)യുടെ അടുക്കൽ ചെന്ന് പറഞ്ഞു: അല്ലാഹുവിന്റെ റസൂലേ, ഞാൻ കഴിഞ്ഞവർഷം അങ്ങയുടെയടുക്കൽ വന്നയാളാണ്. നബി(സ) ചോദിച്ചു: \"നിന്റെ ശരീരം മെലിഞ്ഞു കാണുന്നല്ലോ?\" അദ്ദേഹം പറഞ്ഞു: അല്ലാഹുവിന്റെ റസൂലേ, ഞാൻ രാത്രിയിൽ കഴിക്കുന്ന ഭക്ഷണമൊഴിച്ചു പകലിൽ ഒന്നും കഴിക്കാറില്ല. നബി(സ) ചോദിച്ചു: \"നിന്റെ ശരീരത്തെ ശിക്ഷിക്കാൻ ആരാണ് നിന്നോട് കൽപ്പിച്ചത്.\" അദ്ദേഹം പറഞ്ഞു: അല്ലാഹുവിന്റെ റസൂലേ, ഞാൻ ശക്തനാണ്. നബി(സ) പറഞ്ഞു: \"നീ ക്ഷമയുടെ മാസം (റമസാൻ) മുഴുവനും, ശേഷമുള്ള മാസത്തിൽ ഒരു നോമ്പും അനുഷ്ഠിക്കുക.\" അദ്ദേഹം പറഞ്ഞു: എനിക്കതിലേറെ സാധിക്കും, നബി(സ) പറഞ്ഞു: \"റമളാൻ മുഴുവനും, ശേഷമുള്ള മാസങ്ങളിൽ രണ്ട് ദിവസവും നോമ്പനുഷ്ഠിക്കുക.\" അദ്ദേഹം പറഞ്ഞു: ഞാൻ ശക്തനാണ്. നബി(സ) പറഞ്ഞു: \"റമസാൻ മുഴുവനും, ശേഷമുള്ള മാസങ്ങളിൽ മൂന്ന് വീതവും, പവിത്രമാക്കപ്പെട്ട മാസങ്ങളിലും നോമ്പനുഷ്ഠിക്കുക.\" (ദ,ജ)", "narrator_ml": "അബുമുജീബതുൽ ബാഹിലി(റ)", "source_codes_ar": ["د", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 36, "page_start": 97}, {"hadith_no": 190, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"أَفْضَلُ الصِّيَامِ بَعْدَ شَهْرِ رَمَضَانَ شَهْرُ اللَّهِ الْمُحَرَّمُ، وَإِنَّ أَفْضَلَ الصَّلَاةِ بَعْدَ الْمَفْرُوضَةِ صَلَاةٌ مِنَ اللَّيْلِ\". (م،د،ت،ن،جه)", "malayalam": "അബൂഹുറൈറ(റ): റസൂൽ(സ) അരുളി: \"റമസാൻ മാസത്തിലെ നോമ്പ് കഴിഞ്ഞാൽ ഏറ്റവും മഹത്വമേറിയ നോമ്പ് മുഹർറം മാസത്തിലെ നോമ്പാണ്. ഫർള് നിസ്കാരങ്ങൾക്കുശേഷം ഏറ്റവും ശ്രേഷ്ഠമേറിയ നിസ്കാരം രാത്രി നിസ്കാരമാണ്.\" (മു,ദ,തു,ന,ജ)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["م", "د", "ت", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 37, "page_start": 98}, {"hadith_no": 191, "arabic": "عَنْ عَلِيٍّ رَضِيَ اللَّهُ عَنْهُ، وَقَدْ سَأَلَهُ رَجُلٌ فَقَالَ: أَيُّ شَهْرٍ تَأْمُرُنِي أَنْ أَصُومَ بَعْدَ شَهْرِ رَمَضَانَ؟ قَالَ لَهُ: مَا سَمِعْتُ أَحَدًا يَسْأَلُ عَنْ هَذَا إِلَّا رَجُلًا سَمِعْتُهُ يَسْأَلُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَأَنَا قَاعِدٌ عِنْدَهُ، فَقَالَ: يَا رَسُولَ اللَّهِ، أَيُّ شَهْرٍ تَأْمُرُنِي أَنْ أَصُومَ بَعْدَ شَهْرِ رَمَضَانَ؟ قَالَ: \"إِنْ كُنْتَ صَائِمًا بَعْدَ شَهْرِ رَمَضَانَ فَصُم الْمُحَرَّمَ، فَإِنَّهُ شَهْرُ اللَّهِ، فِيهِ يَوْمٌ تَابَ فِيهِ عَلَى قَوْمٍ، وَيَتُوبُ فِيهِ عَلَى قَوْمٍ آخَرِينَ\". حَسَنٌ. (ت)", "malayalam": "അലി(റ): ഒരാളവരോട് ചോദിച്ചു: റമളാനിലേതല്ലാത്ത ഏതു മാസത്തെ നോമ്പാണു നിങ്ങൾ എന്നോട് കൽപിക്കുന്നത്? അലി(റ) പറഞ്ഞു: ഇതിനെ സംബന്ധിച്ച് ചോദിക്കുന്ന ഒരാളെയല്ലാതെ ആരെയും ഞാൻ കേട്ടിട്ടില്ല, ഞാൻ അടുത്തുണ്ടായിരിക്കെ തിരുദൂതർ(സ)യോട് ഒരാൾ ചോദിക്കുന്നതായി ഞാൻ കേട്ടു. അല്ലാഹുവിന്റെ റസൂലേ, റമസാനല്ലാത്ത ഏതു മാസം ഞാൻ വ്രതമെടുക്കണമെന്നാണ് അവിടുന്നെന്നോട് കൽപിക്കുന്നത്? അവിടുന്നരുളി: \"റമളാനല്ലാത്ത വല്ല മാസവും വ്രതമെടുക്കാൻ ഉദ്ദേശിക്കുന്നെങ്കിൽ അത് മുഹർറത്തിലായിക്കൊള്ളട്ടെ. കാരണം, അത് അല്ലാഹുവിന്റെ മാസമാണ്. ഒരു ജനതക്കാകെ അല്ലാഹു മാപ്പുകൊടുത്ത ദിനമുണ്ടതിൽ, ഇനിയും പല ജനതക്കുമവൻ അതിൽ മാപ്പരുളും.\" (തു)", "narrator_ml": "അലി(റ)", "source_codes_ar": ["ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 37, "page_start": 98}, {"hadith_no": 192, "arabic": "عَنْ سَعِيدِ بْنِ جُبَيْرٍ، وَسُئِلَ عَنْ صِيَامِ رَجَبٍ؟ فَقَالَ: أَخْبَرَنِي ابْنُ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يَصُومُ حَتَّى نَقُولَ: لَا يُفْطِرُ، وَيُفْطِرُ حَتَّى نَقُولَ لَا يَصُومُ. (ق،د،ن،جه)", "malayalam": "സഈദുബ്നു ജുബൈർ: റജബിലെ നോമ്പിനെ സംബന്ധിച്ച് ചോദിക്കപ്പെട്ടപ്പോൾ അദ്ദേഹം പറഞ്ഞു: ഇബ്നുഅബ്ബാസ്(റ) എന്നോട് പറഞ്ഞു: റസൂൽ(സ) തീരേ നോമ്പുപേക്ഷിക്കുകയില്ല എന്ന് ഞങ്ങൾ പറയുവോളം റസൂൽ(സ) വ്രതമനുഷ്ഠിക്കുകയും, തീരേ വ്രതമനുഷ്ഠിക്കാറില്ല ഞങ്ങൾ എന്ന് പറയുവോളം വ്രതം ഉപേക്ഷിക്കുകയും ചെയ്യാറുണ്ടായിരുന്നു. (ബു,മു,ദ,ന,ജ)", "narrator_ml": "സഈദുബ്നു ജുബൈർ", "source_codes_ar": ["ق", "د", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 38, "page_start": 98}, {"hadith_no": 193, "arabic": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا: أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَهَى عَنْ صِيَامِ رَجَبٍ. (جه)", "malayalam": "ഇബ്നുഅബ്ബാസ്(റ): റസൂൽ(സ) റജബിലെ വ്രതം നിരോധിച്ചു. (ജ)", "narrator_ml": "ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 38, "page_start": 98}, {"hadith_no": 194, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ حَتَّى نَقُولَ لَا يُفْطِرُ، وَيُفْطِرُ حَتَّى نَقُولَ لَا يَصُومُ فَمَا رَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ اسْتَكْمَلَ صِيَامَ شَهْرٍ إِلَّا رَمَضَانَ، وَمَا رَأَيْتُهُ أَكْثَرَ صِيَامًا مِنْهُ فِي شَعْبَانَ. (خ)", "malayalam": "ആഇശ(റ): തീരേ നോമ്പ് മുറിക്കാറില്ല എന്ന് ഞങ്ങൾ ധരിക്കുവോളം റസൂൽ(സ) വ്രതമനുഷ്ഠിക്കുകയും തീരെ വ്രതമനുഷ്ഠിക്കാറില്ലെന്നു ധരിക്കുവോളം അവിടന്ന് വ്രതം ഉപേക്ഷിക്കാറുമുണ്ടായിരുന്നു. റമളാനല്ലാത്ത ഒരു മാസവും അവിടന്ന് പൂർണമായി വ്രതമനുഷ്ഠിക്കുന്നതായി ഞാൻ കണ്ടിട്ടില്ല. ശഅ്ബാനിലെ വ്രതത്തിന്റെയത്ര മറ്റൊരു സമയത്തും വ്രതമെടുക്കുന്നതായും റസൂൽ(സ)യെ ഞാൻ കണ്ടിട്ടില്ല. (ബു)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["خ"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 39, "page_start": 99}, {"hadith_no": 195, "arabic": "عَنْ عِمْرَانَ بْنِ حُصَيْنٍ رَضِيَ اللَّهُ عَنْهُمَا: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ لَهُ أَوْ لِآخَرَ: \"أَصُمْتَ مِنْ سُرَرِ شَعْبَانَ\". قَالَ: لَا. قَالَ: \"فَإِذَا أَفْطَرْتَ فَصُمْ يَوْمَيْنِ\". (م)", "malayalam": "ഇംറാനുബ്നു ഹുസ്വൈൻ(റ): റസൂൽ(സ) അദ്ദേഹത്തോട് അല്ലെങ്കിൽ വേറൊരാളോട് ചോദിച്ചു: \"ശഅ്ബാന്റെ അന്ത്യത്തിൽ നീ നോമ്പനുഷ്ഠിച്ചുവോ?\". ഇല്ല, എന്നായിരുന്നു മറുപടി. അവിടുന്നരുളി: \"റമളാൻവ്രതം കഴിഞ്ഞശേഷം നീ രണ്ടുദിവസം വ്രതമെടുക്കുക.\" (മു)", "narrator_ml": "ഇംറാനുബ്നു ഹുസ്വൈൻ(റ)", "source_codes_ar": ["م"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 39, "page_start": 99}, {"hadith_no": 196, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: كَانَ أَحَبَّ الشُّهُورِ إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنْ يَصُومَهُ شَعْبَانُ، ثُمَّ يَصِلُهُ بِرَمَضَانَ. (د،ن)", "malayalam": "ആഇശ(റ): വ്രതമെടുക്കാൻ തിരുമേനി(സ)ക്ക് ഏറ്റവും പ്രിയമുള്ള മാസം ശഅ്ബാനായിരുന്നു. പിന്നീട് ശഅ്ബാനിനെ റമളാനിനോട് ചേർക്കുകയും ചെയ്യും. (ദ,ന)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["د", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 39, "page_start": 99}, {"hadith_no": 197, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَتَحَفَّظُ مِنْ شَعْبَانَ مَا لَا يَتَحَفَّظُ مِنْ غَيْرِهِ، ثُمَّ يَصُومُ لِرُؤْيَةِ رَمَضَانَ، فَإِنْ غُمَّ عَلَيْهِ عَدَّ ثَلَاثِينَ يَوْمًا ثُمَّ صَامَ. (د)", "malayalam": "ആഇശ(റ): റസൂൽ(സ) 'ശഅ്ബാൻ' മാസത്തിൽ മറ്റുള്ള മാസങ്ങളേക്കാൾ സൂക്ഷ്മത പുലർത്തുമായിരുന്നു. പിന്നീടു 'റമളാൻ' ചന്ദ്രിക കണ്ടാൽ വ്രതമനുഷ്ഠിക്കും. മേഘാവൃതമായതുമൂലം ദർശനം അസാധ്യമായാൽ മുപ്പതു ദിനങ്ങൾ എണ്ണുകയും ശേഷം നോമ്പനുഷ്ഠിക്കുകയും ചെയ്യും.\" (ദ)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 39, "page_start": 99}, {"hadith_no": 198, "arabic": "عَنْ أُمِّ سَلَمَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: مَا رَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ شَهْرَيْنِ مُتَتَابِعَيْنِ إِلَّا أَنَّهُ كَانَ يَصِلُ شَعْبَانَ بِرَمَضَانَ. وفي رواية قَالَتْ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصِلُ شَعْبَانَ بِرَمَضَانَ. (ن)", "malayalam": "ഉമ്മുസലമ(റ): തുടർച്ചയായ രണ്ടുമാസം റസൂൽ(സ) വ്രതമനുഷ്ഠിക്കുന്നതായി ഞാൻ കണ്ടിട്ടില്ല. എങ്കിലും റമളാനിലേക്കു ശഅ്ബാൻ മാസത്തെ ചേർത്തി വ്രതമനുഷ്ഠിക്കാറുണ്ടായിരുന്നു. മറ്റൊരു നിവേദനത്തിൽ: മഹതി പറഞ്ഞു: റസൂൽ(സ) ശഅ്ബാനിനെ റമളാനിനോട് ചേർക്കുമായിരുന്നു. (ന)", "narrator_ml": "ഉമ്മുസലമ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ قَالَتْ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصِلُ شَعْبَانَ بِرَمَضَانَ. (ن)", "malayalam": "മറ്റൊരു നിവേദനത്തിൽ: മഹതി പറഞ്ഞു: റസൂൽ(സ) ശഅ്ബാനിനെ റമളാനിനോട് ചേർക്കുമായിരുന്നു. (ന)"}], "bab_seq": 39, "page_start": 99}, {"hadith_no": 199, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: لَقَدْ كَانَتْ إِحْدَانَا تُفْطِرُ فِي رَمَضَانَ، فَمَا تَقْدِرُ عَلَى أَنْ تَقْضِيَ حَتَّى يَدْخُلَ شَعْبَانُ، وَمَا كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ فِي شَهْرٍ مَا يَصُومُ فِي شَعْبَانَ، كَانَ يَصُومُهُ كُلَّهُ إِلَّا قَلِيلًا، بَلْ كَانَ يَصُومُهُ كُلَّهُ. (ن)", "malayalam": "ആഇശ(റ): ഞങ്ങളിൽ (സ്ത്രീകൾ) പലരും റമളാനിൽ നോമ്പു മുറിക്കാറുണ്ടായിരുന്നു. അങ്ങനെ ശഅ്ബാൻ വരുന്നതുവരെ അത് ഖളാഅ് വീട്ടാൻ പലപ്പോഴും കഴിയാറില്ല. റസൂൽ(സ) ശഅ്ബാനിൽ അനുഷ്ഠിക്കുന്നത്ര നോമ്പ് മറ്റൊരു മാസത്തിലും അനുഷ്ഠിക്കാറുണ്ടായിരുന്നില്ല. ചില ദിവസങ്ങളൊഴികെ ശഅ്ബാൻ മുഴുവനും വ്രതമനുഷ്ഠിക്കാറുണ്ടായിരുന്നു. അല്ല, മുഴുവൻ തന്നെയും അനുഷ്ഠിക്കാറുണ്ടായിരുന്നു. (ന)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 39, "page_start": 99}, {"hadith_no": 200, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: لَا أَعْلَمُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَرَأَ الْقُرْآنَ كُلَّهُ فِي لَيْلَةٍ، وَلَا قَامَ لَيْلَةً حَتَّى الصَّبَاحِ، وَلَا صَامَ شَهْرًا كَامِلًا قَطُّ غَيْرَ رَمَضَانَ. (ن)", "malayalam": "ആഇശ(റ): റസൂൽ(സ) രാത്രി മുഴുവൻ ഖുർആൻ പാരായണം ചെയ്യുന്നതായും പ്രഭാതം വരെ നിസ്കരിക്കുന്നതായും, റമളാനൊഴിച്ച് മറ്റു മാസങ്ങളിൽ പൂർണ്ണമായി നോമ്പനുഷ്ഠിക്കുന്നതായും ഞാൻ അറിഞ്ഞിട്ടില്ല.", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 39, "page_start": 100}, {"hadith_no": 201, "arabic": "عَنْ عَبْدِ اللَّهِ بْنِ شَقِيقٍ قَالَ: قُلْتُ لِعَائِشَةَ رَضِيَ اللَّهُ عَنْهَا: أَكَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُصَلِّي صَلَاةَ الضُّحَى؟ قَالَتْ: لَا، إِلَّا أَنْ يَجِيءَ مِنْ مَغِيبِهِ. قُلْتُ: هَلْ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ شَهْرًا كُلَّهُ؟ قَالَتْ: لَا، مَا عَلِمْتُ صَامَ شَهْرًا كُلَّهُ إِلَّا رَمَضَا

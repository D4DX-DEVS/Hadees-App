َلَا تَصُومُوا\". حَسَنٌ صَحِيحٌ. (د،ت)", "malayalam": "അബുഹുറൈറ(റ): റസൂൽ(സ) അരുളി: \"ശഅ്ബാനിന്റെ പകുതിയായാൽ പിന്നെ നിങ്ങൾ വ്രതമനുഷ്ഠിക്കരുത്.\" (ദ,തു)", "narrator_ml": "അബുഹുറൈറ(റ)", "source_codes_ar": ["د", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 40, "page_start": 100}, {"hadith_no": 203, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"إِذَا انْتَصَفَ شَعْبَانُ فَلَا تَصُومُوا\". (د،ت،جه)", "malayalam": "അബൂഹുറൈറ(റ): റസൂൽ(സ) അരുളി: \"ശഅ്ബാൻ പകുതിയായാൽ പിന്നീട് നിങ്ങൾ നോമ്പനുഷ്ഠിക്കരുത്.\" (ദ,തു,ജ)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["د", "ت", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 40, "page_start": 100}, {"hadith_no": 204, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"إِذَا كَانَ النِّصْفُ مِنْ شَعْبَانَ فَلَا صَوْمَ حَتَّى يَجِيءَ رَمَضَانُ\". (د،ت،جه)", "malayalam": "അബുഹുറൈറ(റ): റസൂൽ(സ) പറഞ്ഞു: \"ശഅ്ബാൻ പകുതിയായിക്കഴിഞ്ഞാൽ പിന്നെ റമളാൻ വരുന്നതു വരെ നോമ്പില്ല.\" (ദ,തു,ജ)", "narrator_ml": "അബുഹുറൈറ(റ)", "source_codes_ar": ["د", "ت", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 40, "page_start": 100}, {"hadith_no": 205, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: فَقَدْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لَيْلَةً، فَخَرَجْتُ فَإِذَا هُوَ بِالْبَقِيعِ، فَقَالَ: \"أَكُنْتِ تَخَافِينَ أَنْ يَحِيفَ اللَّهُ عَلَيْكِ وَرَسُولُهُ\". قُلْتُ: يَا رَسُولَ اللَّهِ، إِنِّي ظَنَنْتُ أَنَّكَ أَتَيْتَ بَعْضَ نِسَائِكَ. فَقَالَ: \"إِنَّ اللَّهَ عَزَّ وَجَلَّ يَنْزِلُ لَيْلَةَ النِّصْفِ مِنْ شَعْبَانَ إِلَى السَّمَاءِ الدُّنْيَا، فَيَغْفِرُ لِأَكْثَرَ مِنْ عَدَدِ شَعْرِ غَنَمِ كَلْبٍ\". (ت،جه)", "malayalam": "ആഇശ(റ): ഒരു രാത്രി ഞാൻ പ്രവാചകരെ(സ) കാണാതെയായി. അന്വേഷിച്ചുചെന്നപ്പോൾ റസൂൽ(സ) ജന്നത്തുൽ ബഖീഇൽ ഉണ്ടായിരുന്നു. അവിടന്ന് ചോദിച്ചു: \"അല്ലാഹുവും അവന്റെ ദൂതരും നിന്നോട് അന്യായം കാണിക്കുമെന്ന് നീ ഭയപ്പെടുന്നോ?\" ഞാൻ പറഞ്ഞു: അല്ലാഹുവിന്റെ റസൂലേ, ഞാൻ വിചാരിച്ചു അങ്ങ് ഏതെങ്കിലും ഭാര്യയുടെ അടുത്തുപോയതായിരിക്കുമെന്ന്. അപ്പോൾ അവിടന്നരുളി: \"ശഅ്ബാൻ പകുതിയുടെ രാവിൽ ഒന്നാം ആകാശത്തേക്ക് അല്ലാഹു അവതരിക്കും. എന്നിട്ട് കലബ് ഗോത്രക്കാരുടെ ആടുകളുടെ രോമത്തിന്റെ എണ്ണത്തേക്കാൾ അധികമാളുകൾക്കവൻ പൊറുത്തുകൊടുക്കും.\" (തു,ജ)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["ت", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 41, "page_start": 101}, {"hadith_no": 206, "arabic": "عَنْ عِمْرَانَ بْنِ حُصَيْنٍ رَضِيَ اللَّهُ عَنْهُمَا: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ لِرَجُلٍ: \"هَلْ صُمْتَ مِنْ سَرَرِ شَعْبَانَ شَيْئًا\". قَالَ: لَا، قَالَ: \"فَإِذَا أَفْطَرْتَ فَصُمْ يَوْمًا\". وَفِي رِوَايَةٍ: \"يَوْمَيْنِ\". (ق،د)", "malayalam": "ഇംറാനുബ്നു ഹുസൈൻ(റ): റസൂൽ(സ) ഒരാളോടു ചോദിച്ചു. \"നീ ശഅ്ബാന്റെ അവസാനത്തിൽ നോമ്പനുഷ്ഠിച്ചുവോ?\" അദ്ദേഹം പറഞ്ഞു: \"ഇല്ല.\" തിരുമേനി(സ) അരുളി: \"നീ നോമ്പനുഷ്ഠിച്ചില്ലെങ്കിൽ ഒരു ദിവസം നോമ്പനുഷ്ഠിക്കുക.\" മറ്റൊരു റിപ്പോർട്ടനുസരിച്ച്: \"രണ്ടു ദിവസം നോമ്പനുഷ്ഠിക്കുക.\" (ബു,മു,ദ)", "narrator_ml": "ഇംറാനുബ്നു ഹുസൈൻ(റ)", "source_codes_ar": ["ق", "د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: \"يَوْمَيْنِ\". (ق،د)", "malayalam": "മറ്റൊരു നിവേദനനുസരിച്ച്: \"രണ്ടു ദിവസം നോമ്പനുഷ്ഠിക്കുക.\" (ബു,മു,ദ)"}], "bab_seq": 42, "page_start": 101}, {"hadith_no": 207, "arabic": "عَنِ الْمُغِيرَةِ بْنِ فَرْوَةَ قَالَ: قَامَ مُعَاوِيَةُ فِي النَّاسِ بِدَيْرِ مِسْحَلٍ الَّذِي عَلَى بَابِ حِمْصَ، فَقَالَ: أَيُّهَا النَّاسُ، إِنَّا قَدْ رَأَيْنَا الْهِلَالَ يَوْمَ كَذَا وَكَذَا، وَأَنَا مُتَقَدِّمٌ بِالصِّيَامِ، فَمَنْ أَحَبَّ أَنْ يَفْعَلَهُ فَلْيَفْعَلْهُ. قَالَ: فَقَامَ إِلَيْهِ مَالِكُ بْنُ هُبَيْرَةَ السَّبَئِيُّ فَقَالَ: يَا مُعَاوِيَةُ، أَشَيْءٌ سَمِعْتَهُ مِنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، أَمْ شَيْءٌ مِنْ رَأْيِكَ؟ قَالَ: سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ: \"صُومُوا الشَّهْرَ وَسِرَّهُ\". (د)", "malayalam": "മുഗീറതുബ്നു ഫർവ(റ): 'ബാബു ഹിംസി'നടുത്തുള്ള 'ദൈർ മിസ്ഹൽ' എന്ന സ്ഥലത്ത് വെച്ച് മുആവിയ(റ) ജനങ്ങളെ അഭിസംബോധന ചെയ്തു. അദ്ദേഹം പറഞ്ഞു: ജനങ്ങളേ, ഇന്ന ദിവസം നാം ചന്ദ്രപ്പിറവി കണ്ടിരിക്കുന്നു. തീർച്ചയായും ഞാൻ മുൻകൂട്ടി നോമ്പെടുക്കുകയാണ്. ആരെങ്കിലും അത് ഇഷ്ടപ്പെടുന്നുവെങ്കിൽ അവൻ അത് ചെയ്യട്ടെ. മുഗീറ(റ) പറയുന്നു: അപ്പോൾ മാലികുബ്നു ഹുബൈറതുസ്സബഇയ്യ് എഴുന്നേറ്റു അദ്ദേഹത്തോടു ചോദിച്ചു: മുആവിയാ, ഇതു പ്രവാചകരിൽനിന്നു താങ്കൾ കേട്ടതോ, അതോ താങ്കളുടെ അഭിപ്രായമോ?\" മുആവിയ(റ) മറുപടി നൽകി: റസൂൽ(സ) പറയുന്നത് ഞാൻ കേട്ടിട്ടുണ്ട്: \"നിങ്ങൾ മാസത്തിന്റെ ആദ്യത്തിലും അവസാനത്തിലും നോമ്പനുഷ്ഠിക്കുക.\" (ദ)", "narrator_ml": "മുഗീറതുബ്നു ഫർവ(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 42, "page_start": 101}, {"hadith_no": 208, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: نَهَى رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَنْ تَعْجِيلِ صَوْمِ يَوْمٍ قَبْلَ الرُّؤْيَةِ. [ز:في إسناده ضعيف]. (جه)", "malayalam": "അബൂഹുറൈറ(റ): മാസപ്പിറവി ദർശനത്തിന് ഒരു ദിവസം മുമ്പ് നോമ്പ് തുടങ്ങുന്നത് റസൂൽ(സ) നിരോധിച്ചിട്ടുണ്ട്. (ഇതിന്റെ പരമ്പരയിൽ ഒരു ദുർബലനുണ്ട്). (ജ)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["جه"], "grading_note_ml": "ഇതിന്റെ പരമ്പരയിൽ ഒരു ദുർബലനുണ്ട്", "grading_note_ar": "ز:في إسناده ضعيف", "explanation_ml": null, "variants": [], "bab_seq": 42, "page_start": 101}, {"hadith_no": 209, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"أَحْصُوا هِلَالَ شَعْبَانَ لِرَمَضَانَ\". (ت)", "malayalam": "അബൂഹുറൈറ(റ): റസൂൽ(സ) പറഞ്ഞു: \"റമളാനിനുവേണ്ടി ശഅ്ബാൻ മാസചന്ദ്രികയെ നിങ്ങൾ ക്ലിപ്തമാക്കുക.\" (തു)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 43, "page_start": 102}, {"hadith_no": 210, "arabic": "عَنْ أُمِّ سَلَمَةَ رَضِيَ اللَّهُ عَنْهَا، عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: أَنَّهُ لَمْ يَكُنْ يَصُومُ مِنَ السَّنَةِ شَهْرًا تَامًّا إِلَّا شَعْبَانَ، يَصِلُهُ بِرَمَضَانَ. (د،ت،ن،جه)", "malayalam": "ഉമ്മുസലമ(റ): നബി(സ) വർഷത്തിൽ ശഅ്ബാൻ മാസത്തിലല്ലാതെ മാസം പൂർണ്ണമായും സുന്നത്ത് നോമ്പെടുക്കാറില്ല. ശഅ്ബാനിനെ നബി(സ) റമളാൻ മാസത്തോട് ചേർത്ത് അനുഷ്ഠിക്കുകയും ചെയ്യും. (ദ,തു,ന,ജ)", "narrator_ml": "ഉമ്മുസലമ(റ)", "source_codes_ar": ["د", "ت", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 44, "page_start": 102}, {"hadith_no": 211, "arabic": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"صُومُوا لِرُؤْيَتِهِ وَأَفْطِرُوا لِرُؤْيَتِهِ، فَإِنْ حَالَ بَيْنَكُمْ وَبَيْنَهُ سَحَابَةٌ أَوْ ظُلْمَةٌ فَأَكْمِلُوا الْعِدَّةَ عِدَّةَ شَعْبَانَ، وَلَا تَسْتَقْبِلُوا الشَّهْرَ اسْتِقْبَالًا، وَلَا تَصِلُوا رَمَضَانَ بِيَوْمٍ مِنْ شَعْبَانَ\". (ن)", "malayalam": "ഇബ്നുഅബ്ബാസ്(റ): റസൂൽ(സ) പറഞ്ഞു: \"നിങ്ങൾ മാസപ്പിറവി ദർശിച്ചാൽ നോമ്പനുഷ്ഠിക്കുക, അപ്രകാരം മാസപ്പിറവി ദർശിച്ചാൽ നോമ്പു മുറിക്കുക. കൂരിരുട്ടോ മേഘങ്ങളോ മാസം കാണുന്നതിന് നിങ്ങൾക്ക് തടസ്സമായാൽ ശഅബാൻ മാസത്തെ എണ്ണം കണക്കനുസരിച്ച് പൂർത്തീകരിക്കുക (മുപ്പത് പൂർത്തിയാക്കുക). റമളാനിനെ നോമ്പുകാരായി നിങ്ങൾ വരവേൽക്കരുത്. ശഅബാനിലെ ഒരു ദിനത്തെ റമളാനിനോട് കൂട്ടിച്ചേർക്കുകയും അരുത്\". (ന)", "narrator_ml": "ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 44, "page_start": 102}, {"hadith_no": 212, "arabic": "عَنْ أَبِي أَيُّوبَ رَضِيَ اللَّهُ عَنْهُ، صَاحِبِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"مَنْ صَامَ رَمَضَانَ، ثُمَّ أَتْبَعَهُ بِسِتٍّ مِنْ شَوَّالٍ، فَكَأَنَّمَا صَامَ الدَّهْرَ\". (م،د،ت،جه)", "malayalam": "അബൂഅയ്യൂബ്(റ): നബി(സ) പറയുന്നു: \"ആരെങ്കിലും റമളാൻ മാസം നോമ്പനുഷ്ഠിച്ച് അതോടൊപ്പം ശവ്വാലിലെ ആറു ദിവസം നോമ്പനുഷ്ഠിക്കുകയും ചെയ്താൽ നിശ്ചയം ഒരു വർഷം നോമ്പനുഷ്ഠിച്ചതുപോലെയായി.\" (മു,ദ,തു,ജ)", "narrator_ml": "അബൂഅയ്യൂബ്(റ)", "source_codes_ar": ["م", "د", "ت", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 45, "page_start": 102}, {"hadith_no": 213, "arabic": "عَنْ ثَوْبَانَ رَضِيَ اللَّهُ عَنْهُ، مَوْلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، عَنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنَّهُ قَالَ: \"مَنْ صَامَ سِتَّةَ أَيَّامٍ بَعْدَ الْفِطْرِ كَانَ تَمَامَ السَّنَةِ، مَنْ جَاءَ بِالْحَسَنَةِ فَلَهُ عَشْرُ أَمْثَالِهَا\". (جه)", "malayalam": "തിരുദൂതർ(സ)യുടെ മോചിതഅടിമ സൗബാൻ(റ): റസൂൽ(സ) പറഞ്ഞു: \"ചെറിയ പെരുന്നാളിനുശേഷം ആറുദിവസത്തെ നോമ്പനുഷ്ഠിച്ചാൽ അതു വർഷം പൂർണമായി വ്രതമനുഷ്ഠിച്ചപോലെയാണ്. വല്ലവനും നന്മ ചെയ്താൽ അവന്നതിന്റെ പത്തിരട്ടിയാണു പ്രതിഫലം.\" (ജ)", "narrator_ml": "തിരുദൂതർ(സ)യുടെ മോചിതഅടിമ സൗബാൻ(റ)", "source_codes_ar": ["جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 45, "page_start": 103}, {"hadith_no": 214, "arabic": "عَنْ أُسَامَةَ بْنِ زَيْدٍ رَضِيَ اللَّهُ عَنْهُمَا: كَانَ يَصُومُ أَشْهُرَ الْحُرُمِ، فَقَالَ لَهُ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"صُمْ شَوَّالًا\". فَتَرَكَ أَشْهُرَ الْحُرُمِ، ثُمَّ لَمْ يَزَلْ يَصُومُ شَوَّالًا حَتَّى مَاتَ. (جه)", "malayalam": "ഉസാമതുബ്നു സൈദ്(റ): വിശുദ്ധമാസങ്ങൾ മുഴുവൻ വ്രതമനുഷ്ഠിച്ചിരുന്ന അദ്ദേഹത്തോട് റസൂൽ(സ) പറഞ്ഞു: \"നീ ശവ്വാലിൽ വ്രതമനുഷ്ഠിക്കുക.\" പിന്നീടദ്ദേഹം വിശുദ്ധമാസങ്ങളിലെ നോമ്പുപേക്ഷിക്കുകയും ശവ്വാൽനോമ്പ് മരണംവരെ പതിവാക്കുകയും ചെയ്തിരുന്നു. (ജ)", "narrator_ml": "ഉസാമതുബ്നു സൈദ്(റ)", "source_codes_ar": ["جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 45, "page_start": 103}, {"hadith_no": 215, "arabic": "عَنْ هُنَيْدَةَ بْنِ خَالِدٍ الْخُزَاعِيِّ، عَنِ امْرَأَتِهِ، عَنْ بَعْضِ أَزْوَاجِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَتْ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ تِسْعَ ذِي الْحِجَّةِ، وَيَوْمَ عَاشُورَاءَ، وَثَلَاثَةَ أَيَّامٍ مِنْ كُلِّ شَهْرٍ: أَوَّلَ اثْنَيْنِ مِنَ الشَّهْرِ وَالْخَمِيسَ. (د،ن)", "malayalam": "ഹുനൈദതുബ്നു ഖാലിദുൽ ഖസാഈ(റ) തന്റെ ഭാര്യയിൽ നിന്ന് നിവേദനം ചെയ്യുന്നു: റസൂൽ(സ)യുടെ ഭാര്യമാരിലൊരാൾ ഇപ്രകാരം പറഞ്ഞു: റസൂൽ(സ) ദുൽഹജ്ജ് മാസത്തിലെ ഒമ്പതു ദിവസവും, ആശൂറാഅ് ദിനവും ഓരോ മാസത്തിലും മൂന്നു വീതം ദിവസവും, മാസത്തിലെ ആദ്യത്തെ രണ്ട് തിങ്കളും വ്യാഴവും വ്രതമനുഷ്ഠിക്കാറുണ്ടായിരുന്നു. (ദ,ന)", "narrator_ml": "ഹുനൈദതുബ്നു ഖാലിദുൽ ഖസാഈ(റ)", "source_codes_ar": ["د", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 46, "page_start": 103}, {"hadith_no": 216, "arabic": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"مَا مِنْ أَيَّامٍ: الْعَمَلُ الصَّالِحُ فِيهَا أَحَبُّ إِلَى اللَّهِ مِنْ هَذِهِ الْأَيَّامِ\" يَعْنِي أَيَّامَ الْعَشْرِ. قَالُوا: يَا رَسُولَ اللَّهِ، وَلَا الْجِهَادُ فِي سَبِيلِ اللَّهِ؟ قَالَ: \"وَلَا الْجِهَادُ فِي سَبِيلِ اللَّهِ، إِلَّا رَجُلٌ خَرَجَ بِنَفْسِهِ وَمَالِهِ فَلَمْ يَرْجِعْ مِنْ ذَلِكَ بِشَيْءٍ\". (خ،د،ت،جه)", "malayalam": "ഇബ്നുഅബ്ബാസ്(റ): റസൂൽ(സ) അരുളി: \"ഈ ദിവസങ്ങളിൽ (ദുൽഹജ്ജിലെ പത്ത്) സൽക്കർമങ്ങൾ അല്ലാഹുവിന് പ്രിയങ്കരമായതിനേക്കാൾ പ്രിയങ്കരമായ മറ്റു ദിവസങ്ങളില്ല.\" അനുചരർ ചോദിച്ചു: അല്ലാഹുവിന്റെ റസൂലേ, അല്ലാഹുവിന്റെ മാർഗത്തിലെ ധർമ്മസമരവും അത്രത്തോളം വരില്ലേ? നബി(സ) പറഞ്ഞു: \"ധർമ്മസമരവും അത്രത്തോളമെത്തില്ല, ഒരാളൊഴികെ. അയാൾ തന്റെ ശരീരവും സമ്പത്തുമായി യുദ്ധത്തിനിറങ്ങി, പക്ഷേ, ഒന്നും അയാൾക്ക് തിരിച്ചുലഭിച്ചില്ല.\" (ബു,ദ,തു,ജ)", "narrator_ml": "ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["خ", "د", "ت", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 46, "page_start": 103}, {"hadith_no": 217, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"مَا مِنْ أَيَّامِ الدُّنْيَا أَيَّامٌ أَحَبُّ إِلَى اللَّهِ سُبْحَانَهُ أَنْ يُتَعَبَّدَ لَهُ فِيهَا مِنْ أَيَّامِ الْعَشْرِ، وَإِنَّ صِيَامَ يَوْمٍ فِيهَا لَيَعْدِلُ صِيَامَ سَنَةٍ، وَلَيْلَةٍ فِيهَا بِلَيْلَةِ الْقَدْرِ\". (ت،جه)", "malayalam": "അബൂഹുറൈറ(റ): റസൂൽ(സ) പറഞ്ഞു: \"ദുൽഹജ്ജിലെ പത്ത് ദിവസങ്ങളേക്കാൾ ആരാധനകൾ അല്ലാഹു ഇഷ്ടപ്പെടുന്ന ഒരു ദിവസവുമില്ല. അതിൽ ഒരു ദിവസം നോമ്പെടുക്കൽ ഒരു വർഷം നോമ്പെടുക്കുന്നതിനും അതിലെ ഒരു രാത്രി ഖദ്റിന്റെ രാത്രിക്കും തുല്യമാണ്.\" (തു,ജ)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["ت", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 46, "page_start": 103}, {"hadith_no": 218, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: مَا رَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ صَائِمًا فِي الْعَشْرِ قَطُّ. (م،د،ت،ن،جه)", "malayalam": "ആഇശ(റ): ദുൽഹജ്ജ് പത്ത് ദിനങ്ങളിൽ നോമ്പനുഷ്ഠിച്ചതായി റസൂൽ(സ)യെ ഞാൻ തീരെ കണ്ടിട്ടില്ല. (മു,ദ,തു,ന,ജ)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["م", "د", "ت", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 47, "page_start": 104}, {"hadith_no": 219, "arabic": "عَنْ عَبْدِ اللَّهِ بن مَسْعُود رَضِيَ اللَّهُ عَنْهُمَا قَالَ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ مِنْ غُرَّةِ كُلِّ شَهْرٍ ثَلَاثَةَ أَيَّامٍ، وَقَلَّمَا كَانَ يُفْطِرُ يَوْمَ الْجُمُعَةِ. حَسَنٌ. (د،ت،ن،جه)", "malayalam": "അബ്ദുല്ലാഹിബ്നു മസ്ഊദ്(റ): നബി(സ) എല്ലാ മാസത്തിലെയും വെളുത്തവാവിന്റെ മൂന്നു ദിനങ്ങൾ നോമ്പനുഷ്ഠിക്കാറുണ്ട്. വെള്ളിയാഴ്ച ദിവസം വളരെകുറച്ചു മാത്രമാണ് നോമ്പെടുക്കാതിരുന്നത്. (ദ,തു,ന,ജ)", "narrator_ml": "അബ്ദുല്ലാഹിബ്നു മസ്ഊദ്(റ)", "source_codes_ar": ["د", "ت", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 48, "page_start": 104}, {"hadith_no": 220, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا أَنَّهَا سُئِلَتْ هَلْ كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَخْتَصُّ مِنَ الْأَيَّامِ شَيْئًا؟ قَالَتْ: لَا كَانَ عَمَلُهُ دِيمَةً وَأَيُّكُمْ يُطِيقُ مَا كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُطِيقُ. (خ)", "malayalam": "ആഇശ(റ): അവർ ചോദിക്കപ്പെട്ടു: ഏതെങ്കിലും ദിവസത്തെ നബി(സ) പ്രത്യേകമാക്കാറുണ്ടോ? അവർ പറഞ്ഞു: ഇല്ല, അവിടത്തെ കർമ്മങ്ങളെല്ലാം പതിവു ക്രമത്തിലായിരുന്നു. റസൂൽ(സ)ക്കു കഴിയുന്നത് ആർക്കാണ് കഴിയുക? (ബു.)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["خ"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 49, "page_start": 104}, {"hadith_no": 221, "arabic": "عَنْ جُوَيْرِيَةَ بِنْتِ الْحَارِثِ رَضِيَ اللَّهُ عَنْهَا أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ دَخَلَ عَلَيْهَا يَوْمَ الْجُمُعَةِ وَهِيَ صَائِمَةٌ، فَقَالَ: أَصُمْتِ أَمْسِ؟ قَالَتْ: لَا، قَالَ: أَتُرِيدِينَ أَنْ تَصُومِي غَدًا؟ قَالَتْ: لَا، قَالَ: فَأَفْطِرِي. (خ،د)", "malayalam": "ജുവൈരിയ ബിൻതുൽ ഹാരിസ്(റ): നബി(സ) ഒരു വെള്ളിയാഴ്ച അവരുടെ അടുത്ത്ചെന്നു. അവർ നോമ്പുകാരിയായിരുന്നു. നബി(സ) ചോദിച്ചു: \"ഇന്നലെ നിങ്ങൾ നോമ്പെടുത്തിരുന്നോ?\" അവർ പറഞ്ഞു: ഇല്ല. നബി(സ) ചോദിച്ചു: \"നാളെ നോമ്പെടുക്കാൻ ഉദ്ദേശിക്കുന്നുണ്ടോ?\" അവർ പറഞ്ഞു: ഇല്ല. നബി(സ) കൽപിച്ചു: \"എന്നാൽ നോമ്പു മുറിക്കൂ.\" (ബു,ദ)", "narrator_ml": "ജുവൈരിയ ബിൻതുൽ ഹാരിസ്(റ)", "source_codes_ar": ["خ", "د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 49, "page_start": 104}, {"hadith_no": 222, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"لَا تَخْتَصُّوا لَيْلَةَ الْجُمُعَةِ بِقِيَامٍ مِنْ بَيْنِ اللَّيَالِي، وَلَا تَخُصُّوا يَوْمَ الْجُمُعَةِ بِصِيَامٍ مِنْ بَيْنِ الْأَيَّامِ، إِلَّا أَنْ يَكُونَ فِي صَوْمٍ يَصُومُهُ أَحَدُكُمْ\". (م)", "malayalam": "അബൂഹുറൈറ(റ): നബി(സ) പറയുന്നു: \"രാത്രികളിൽനിന്ന് വെള്ളിയാഴ്ച രാത്രി നിസ്കാരംകൊണ്ട് നിങ്ങൾ പ്രത്യേകമാക്കരുത്. ദിവസങ്ങളിൽ വെള്ളിയാഴ്ച ദിനം നോമ്പുകൊണ്ടും പ്രത്യേകമാക്കരുത്. നിങ്ങൾ അനുഷ്ഠിച്ച് കൊണ്ടിരിക്കുന്നുവെങ്കിലൊഴികെ.\" (മു)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["م"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 49, "page_start": 104}, {"hadith_no": 223, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"لَا يَصُمْ أَحَدُكُمْ يَوْمَ الْجُمُعَةِ، إِلَّا أَنْ يَصُومَ قَبْلَهُ بِيَوْمٍ أَوْ بَعْدَهُ\". (ق،د،ت،جه)", "malayalam": "അബൂഹുറൈറ(റ): നബി(സ) പറഞ്ഞു: \"വെള്ളിയാഴ്ച ദിവസം നിങ്ങളാരും നോമ്പെടുക്കരുത്. അതിന് മുമ്പോ ശേഷമോ നോമ്പെടുത്താലല്ലാതെ.\" (ബു,മു,ദ,തു,ജ)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["ق", "د", "ت", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 49, "page_start": 104}, {"hadith_no": 224, "arabic": "عَنْ مُحَمَّدِ بْنِ عَبَّادِ بْنِ جَعْفَرٍ قَالَ: سَأَلْتُ جَابِرَ بْنَ عَبْدِ اللَّهِ- رَضِيَ اللَّهُ عَنْهُمَا- وَأَنَا أَطُوفُ بِالْبَيْتِ: أَنَهَى النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَنْ صِيَامِ يَوْمِ الْجُمُعَةِ؟ قَالَ: نَعَمْ، وَرَبِّ هَذَا الْبَيْتِ. (ق،جه)", "malayalam": "മുഹമ്മദുബ്നു അബ്ബാദുബ്നു ജഅ്ഫർ(റ): കഅ്ബയെ ത്വവാഫ് ചെയ്തുകൊണ്ടിരിക്കെ ഞാൻ ജാബിറുബ്നു അബ്ദില്ലാ(റ)വിനോട് ചോദിച്ചു: വെള്ളിയാഴ്ച ദിവസം നോമ്പനുഷ്ഠിക്കുന്നത് റസൂൽ(സ) വിലക്കിയിട്ടുണ്ടോ? അദ്ദേഹം പറഞ്ഞു: അതെ, ഈ കഅ്ബയുടെ നാഥനാണു സത്യം. (ബു,ജ)", "narrator_ml": "മുഹമ്മദുബ്നു അബ്ബാദുബ്നു ജഅ്ഫർ(റ)", "source_codes_ar": ["ق", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 49, "page_start": 105}, {"hadith_no": 225, "arabic": "عَنْ عَبْدِ اللَّهِ بْنِ بُسْرٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"لَا تَصُومُوا يَوْمَ السَّبْتِ إِلَّا فِيمَا افْتُرِضَ عَلَيْكُمْ، فَإِنْ لَمْ يَجِدْ أَحَدُكُمْ إِلَّا عُودَ عِنَبٍ أَوْ لِحَاءَ شَجَرَةٍ فَلْيَمُصَّهُ\". وفي رواية: عَنْ عَبْدِ اللَّهِ بْنِ بُسْرٍ، عَنْ أُخْتِهِ قَالَتْ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ .... فَذَكَرَ نَحْوَهُ. (د،ت،ن)", "malayalam": "അബ്ദുല്ലാഹിബ്നു ബുസ്ർ(റ): നബി(സ) പറഞ്ഞു: \"നിങ്ങൾക്ക് നിർബന്ധമാക്കപ്പെട്ടതല്ലാത്ത ഒരു നോമ്പും നിങ്ങൾ ശനിയാഴ്ച അനുഷ്ഠിക്കരുത്. നിങ്ങൾക്ക് മുന്തിരി വള്ളിയുടെ കൊള്ളിയോ, മറ്റേതെങ്കിലും വൃക്ഷത്തിന്റെ തൊലിയോ അല്ലാത്തത് കിട്ടാനില്ലെങ്കിൽ അതുപയോഗിച്ചെങ്കിലും നോമ്പു മുറിക്കുക.\"\nമറ്റൊരു നിവേദനത്തിൽ (തന്റെ സഹോദരിയിൽ നിന്ന്) അബ്ദുല്ലാഹിബ്നു ബുസ്ർ(റ): നബി(സ) പറഞ്ഞു: എന്നിട്ട് മുന്നെ പറഞ്ഞ പോലെ അവർ പറഞ്ഞു. (ദ,തു,ന,ജ)", "narrator_ml": "അബ്ദുല്ലാഹിബ്നു ബുസ്ർ(റ)", "source_codes_ar": ["د", "ت", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: عَنْ عَبْدِ اللَّهِ بْنِ بُسْرٍ، عَنْ أُخْتِهِ قَالَتْ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ .... فَذَكَرَ نَحْوَهُ. (د،ت،ن)", "malayalam": "മറ്റൊരു നിവേദനത്തിൽ (തന്റെ സഹോദരിയിൽ നിന്ന്) അബ്ദുല്ലാഹിബ്നു ബുസ്ർ(റ): നബി(സ) പറഞ്ഞു: എന്നിട്ട് മുന്നെ പറഞ്ഞ പോലെ അവർ പറഞ്ഞു. (ദ,തു,ന,ജ)"}], "bab_seq": 50, "page_start": 105}, {"hadith_no": 226, "arabic": "عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: كَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لَا يَخْرُجُ يَوْمَ الْفِطْرِ حَتَّى يَطْعَمَ تَمَرَاتٍ. (خ،جه)", "malayalam": "അനസുബ്നുമാലിക്(റ): ഫിത്വ്റിന്റെ (ചെറിയപെരുന്നാൾ) ദിവസം നബി(സ) കാരക്ക ഭക്ഷിക്കാതെ പുറത്തിറങ്ങുമായിരുന്നില്ല. (ബു,ജ)", "narrator_ml": "അനസുബ്നുമാലിക്(റ)", "source_codes_ar": ["خ", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 51, "page_start": 105}, {"hadith_no": 227, "arabic": "عَنِ ابْنِ عُمَرَ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: كَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لَا يَغْدُو يَوْمَ الْفِطْرِ حَتَّى يُغَدِّيَ أَصْحَابَهُ مِنْ صَدَقَةِ الْفِطْرِ. (جه)", "malayalam": "ഇബ്നുഉമർ(റ): നബി(സ) ചെറിയ പെരുന്നാൾ ദിവസം അവിടത്തെ അനുചരരെ ഫിത്വ്റിന്റെ സ്വദഖയിൽ (ഫിത്വ്റ് സകാത്) നിന്ന് ഭക്ഷിപ്പിച്ചല്ലാതെ പ്രഭാതത്തിൽ പുറത്തിറങ്ങാറില്ല. (ജ)", "narrator_ml": "ഇബ്നുഉമർ(റ)", "source_codes_ar": ["جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 51, "page_start": 105}, {"hadith_no": 228, "arabic": "عَنْ بُرَيْدَةَ رَضِيَ اللَّهُ عَنْهُ: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ لَا يَخْرُجُ يَوْمَ الْفِطْرِ حَتَّى يَأْكُلَ، وَكَانَ لَا يَأْكُلُ يَوْمَ النَّحْرِ حَتَّى يَرْجِعَ. (ت،جه)", "malayalam": "ബുറൈദ(റ): നബി(സ) ചെറിയപെരുന്നാൾദിനത്തിൽ ഭക്ഷിക്കാതെ പുറത്തിറങ്ങാറില്ല. എന്നാൽ ബലിപെരുന്നാളിന് പുറത്ത് പോയിവരുന്നത് വരെ ഒന്നും ഭക്ഷിക്കാറുണ്ടായിരുന്നില്ല. (തു,ജ)", "narrator_ml": "ബുറൈദ(റ)", "source_codes_ar": ["ت", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 51, "page_start": 105}, {"hadith_no": 229, "arabic": "عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ رَضِيَ اللَّهُ عَنْهُ قَالَ: نَهَى رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَنْ صِيَامِ يَوْمَيْنِ: يَوْمِ الْفِطْرِ، وَيَوْمِ الْأَضْحَى. وَعَنْ لِبْسَتَيْنِ: الصَّمَّاءِ، وَأَنْ يَحْتَبِيَ الرَّجُلُ فِي الثَّوْبِ الْوَاحِدِ. وَعَنِ الصَّلَاةِ فِي سَاعَتَيْنِ: بَعْدَ الصُّبْحِ، وَبَعْدَ الْعَصْرِ. (ق،د،ت)", "malayalam": "അബുസഈദിൽ ഖുദ്‌രി(റ): ഈദുൽഫിത്വ്ർ (ചെറിയ പെരുന്നാൾ), ഈദുൽഅള്ഹാ (ബലിപെരുന്നാൾ) എന്നീ രണ്ടുദിവസങ്ങളിൽ നോമ്പനുഷ്ഠിക്കുന്നത് റസൂൽ(സ) നിരോധിച്ചു. പിരടിയിലൂടെ വസ്ത്രം ധരിക്കൽ, ഒരൊറ്റ വസ്ത്രം കൊണ്ടു ചുറ്റിപ്പുതക്കൽ എന്നീ രണ്ട് വസ്ത്രധാരണാരീതിയും റസൂൽ(സ) വിലക്കി. സുബ്ഹ് നിസ്കാരത്തിന്റെ ശേഷം, അസ്ർ നിസ്കാരത്തിന്റെ ശേഷം എന്നിങ്ങനെ രണ്ടു നേരങ്ങളിൽ നിസ്കരിക്കുന്നതും റസൂൽ(സ) നിരോധിച്ചു. (ബു,മു,ദ,തു)", "narrator_ml": "അബുസഈദിൽ ഖുദ്‌രി(റ)", "source_codes_ar": ["ق", "د", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 51, "page_start": 106}, {"hadith_no": 230, "arabic": "عَنْ أَبِي عُبَيْدٍ - مَوْلَى عَبْدِ الرَّحْمَنِ بْنِ عَوْفٍ رَضِيَ اللَّهُ عَنْهُ - قَالَ: شَهِدْتُ عُمَرَ بْنَ الْخَطَّابِ رَضِيَ اللَّهُ عَنْهُ فِي يَوْمِ النَّحْرِ بَدَأَ بِالصَّلَاةِ قَبْلَ الْخُطْبَةِ، ثُمَّ قَالَ: سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَنْهَى عَنْ صَوْمِ هَذَيْنِ الْيَوْمَيْنِ: \"أَمَّا يَوْمُ الْفِطْرِ فَفِطْرُكُمْ مِنْ صَوْمِكُمْ وَعِيدٌ لِلْمُسْلِمِينَ، وَأَمَّا يَوْمُ الْأَضْحَى فَكُلُوا مِنْ لُحُومِ نُسُكِكُمْ\". حَسَنٌ صَحِيحٌ. (ق،د،ت،ن،جه)", "malayalam": "അബ്ദുർറഹ്മാൻ ബിൻ ഔഫ്(റ)വിന്റെ വിമോചിത അടിമ അബൂഉബൈദ(റ): അദ്ദേഹം പറയുന്നു: ഉമർ(റ)നോടൊത്ത് ഒരു ബലി പെരുന്നാൾ ദിവസം ഞാൻ പങ്കെടുത്തു. ഖുത്വ്ബയുടെ മുമ്പ് നിസ്കരിച്ചുകൊണ്ടാണദ്ദേഹം തുടങ്ങിയത്. തുടർന്നദ്ദേഹം പറഞ്ഞു: ഈ രണ്ടു ദിവസങ്ങളിൽ നോമ്പനുഷ്ഠിക്കുന്നത് റസൂൽ(സ) നിരോധിച്ചതായി ഞാൻ കേട്ടിട്ടുണ്ട്. \"ഈദുൽഫിത്വ്ർ (ചെറിയപെരുന്നാൾ), നിങ്ങളുടെ റമളാൻനോമ്പിൽ നിന്ന് വരിമിക്കലും മുസ്ലിംകളുടെ ഉത്സവവുമാണ്. ബലിപെരുന്നാൾ, അന്നു നിങ്ങൾ ബലിയറുത്ത മൃഗങ്ങളുടെ മാംസം ഭക്ഷിച്ചുകൊള്ളുക.\" (ബു,മു,ദ,തു,ന,ജ)", "narrator_ml": "അബ്ദുർറഹ്മാൻ ബിൻ ഔഫ്(റ)", "source_codes_ar": ["ق", "د", "ت", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 51, "page_start": 106}, {"hadith_no": 231, "arabic": "عَنْ عَائِشَةَ وَابْنِ عُمَرَ رَضِيَ اللَّهُ عَنْهُم قَالَا: لَمْ يُرَخَّصْ فِي أَيَّامِ التَّشْرِيقِ أَنْ يُصَمْنَ إِلَّا لِمَنْ لَمْ يَجِدِ الْهَدْيَ. (خ)", "malayalam": "ആഇശ(റ), ഇബ്നുഉമർ(റ): ബലിമൃഗം കൈവശമില്ലാത്ത ഹാജിമാർക്കല്ലാതെ അയ്യാമുത്തശ്‌രീഖിൽ നോമ്പനുഷ്ഠിക്കാൻ തിരുമേനി(സ) അനുവാദം നൽകിയിരുന്നില്ല. (ബു.)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["خ"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 52, "page_start": 106}, {"hadith_no": 232, "arabic": "عَنْ نُبَيْشَةَ الْهُذَلِيِّ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"أَيَّامُ التَّشْرِيقِ أَيَّامُ أَكْلٍ وَشُرْبٍ- وَفِي رِوَايَةٍ: وَذِكْرٍ لِلَّهِ\". (م)", "malayalam": "നുബൈശതുൽ ഹുദലി(റ): റസൂൽ(സ) പറഞ്ഞു: \"അയ്യാമുത്തശ്‌രീഖ് തിന്നാനും കുടിക്കാനുമുള്ള ദിവസമാണ്.\" മറ്റൊരു നിവേദനം: \"ദൈവികസ്മരണയുടേയും.\" (മു)", "narrator_ml": "നുബൈശതുൽ ഹുദലി(റ)", "source_codes_ar": ["م"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: وَذِكْرٍ لِلَّهِ\". (م)", "malayalam": "മറ്റൊരു നിവേദനം: \"ദൈവികസ്മരണയുടേയും.\" (മു)"}], "bab_seq": 52, "page_start": 106}, {"hadith_no": 233, "arabic": "عَنْ أَبِي مُرَّةَ مَوْلَى أُمِّ هَانِئٍ رَضِيَ اللَّهُ عَنْهُمَا: أَنَّهُ دَخَلَ مَعَ عَبْدِ اللَّهِ بْنِ عَمْرٍو رَضِيَ اللَّهُ عَنْهُمَا عَلَى أَبِيهِ عَمْرِو بْنِ الْعَاصِ فَقَرَّبَ إِلَيْهِمَا طَعَامًا، فَقَالَ: كُلْ، فَقَالَ: إِنِّي صَائِمٌ، فَقَالَ عَمْرٌو: كُلْ، فَهَذِهِ الْأَيَّامُ الَّتِي كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَأْمُرُنَا بِإِفْطَارِهَا وَيَنْهَانَا عَنْ صِيَامِهَا. قَالَ: وَهِيَ أَيَّامُ التَّشْرِيقِ. (د)", "malayalam": "ഉമ്മുഹാനിഅ്(റ)യുടെ വിമോചിത അടിമ അബൂമുർറ(റ): അദ്ദേഹം അബ്ദുല്ലാഹിബിൻ അംറ്(റ)വിനോടൊപ്പം അദ്ദേഹത്തിന്റെ പിതാവ് അംറുബ്നുൽ ആസ്(റ)വിനെ സമീപിച്ചു. അദ്ദേഹം അവർക്കു ഭക്ഷണം നൽകി, തിന്നാൻ പറഞ്ഞു. അപ്പോൾ അബ്ദുല്ല പറഞ്ഞു: ഞാൻ നോമ്പുകാരനാണ്. അന്നേരം അംറ്(റ) പറഞ്ഞു: കഴിക്കുക, റസൂൽ (സ) ഞങ്ങളോട് നോമ്പ് മുറിക്കാൻ കൽപിക്കുകയും നോമ്പനുഷ്ഠിക്കുന്നത് വിലക്കുകയും ചെയ്ത ദിവസങ്ങളാണിത്. നിവേദകൻ പറഞ്ഞു: അയ്യാമുത്തശ്‌രീഖ് ദിനങ്ങളായിരുന്നു അവ. (ദ)", "narrator_ml": "ഉമ്മുഹാനിഅ്(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 52, "page_start": 106}, {"hadith_no": 234, "arabic": "عَنْ عُقْبَةَ بْنِ عَامِرٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"يَوْمُ عَرَفَةَ وَيَوْمُ النَّحْرِ وَأَيَّامُ التَّشْرِيقِ عِيدُنَا أَهْلَ الْإِسْلَامِ، وَهِيَ أَيَّامُ أَكْلٍ وَشُرْبٍ\". (د،ت،ن)", "malayalam": "ഉഖ്ബതുബ്നു ആമിർ(റ): റസൂൽ(സ) പറഞ്ഞു: \"അറഫാദിനം, പെരുന്നാൾദിനം, അയ്യാമുത്തശ്‌രീഖ് എന്നീ ദിവസങ്ങൾ നാം മുസ്ലിംകളുടെ ഉൽസവ ദിനങ്ങളാണ്. അത് തിന്നാനും കുടിക്കാനുമുള്ള ദിവസങ്ങളാണ്.\" (ദ,തു,ന)", "narrator_ml": "ഉഖ്ബതുബ്നു ആമിർ(റ)", "source_codes_ar": ["د", "ت", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 52, "page_start": 107}, {"hadith_no": 235, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"أَيَّامُ مِنًى أَيَّامُ أَكْلٍ وَشُرْبٍ\". (جه)", "malayalam": "അബൂഹുറൈറ(റ): റസൂൽ(സ) പറഞ്ഞു: \"(ഹാജിമാർ) മിനയിൽ നിൽക്കുന്ന ദിവസങ്ങൾ തിന്നാനും കുടിക്കാനുമുള്ള ദിവസങ്ങളാണ്.\" (ജ)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 52, "page_start": 107}, {"hadith_no": 236, "arabic": "عَنْ بِشْرِ بْنِ سُحَيْمٍ رَضِيَ اللَّهُ عَنْهُ: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ خَطَبَ أَيَّامَ التَّشْرِيقِ فَقَالَ: \"لَا يَدْخُلُ الْجَنَّةَ إِلَّا نَفْسٌ مُسْلِمَةٌ، وَإِنَّ هَذِهِ الْأَيَّامَ أَيَّامُ أَكْلٍ وَشُرْبٍ\". (جه)", "malayalam": "ബിശ്റുബ്നു സുഹൈം(റ): റസൂൽ(സ) അയ്യാമുത്തശ്‌രീഖ് നാളിൽ നടത്തിയ പ്രഭാഷണത്തിൽ പറഞ്ഞു: \"മുസ്ലിമായ വ്യക്തിക്ക് മാത്രമേ സ്വർഗപ്രവേശം സാധ്യമാവുകയുള്ളൂ. ഈ ദിനങ്ങൾ തിന്നാനും കുടിക്കാനുമുള്ള ദിവസങ്ങളാണ്.\" (ജ)", "narrator_ml": "ബിശ്റുബ്നു സുഹൈം(റ)", "source_codes_ar": ["جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 52, "page_start": 107}, {"hadith_no": 237, "arabic": "عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ رَضِيَ اللَّهُ عَنْهُمَا: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَرَّ بِرَجُلٍ فِي ظِلِّ شَجَرَةٍ يُرَشُّ عَلَيْهِ الْمَاءُ، قَالَ: \"مَا بَالُ صَاحِبِكُمْ هَذَا\". قَالُوا: يَا رَسُولَ اللَّهِ، صَائِمٌ. قَالَ: \"إِنَّهُ لَيْسَ مِنَ الْبِرِّ أَنْ تَصُومُوا فِي السَّفَرِ، وَعَلَيْكُمْ بِرُخْصَةِ اللَّهِ الَّتِي رَخَّصَ لَكُمْ، فَاقْبَلُوهَا\". (ق،د،ن،جه))", "malayalam": "ജാബിറുബ്നു അബ്ദില്ല(റ): മരത്തണലിൽ ഇരിക്കുന്ന ഒരാളുടെ അരികിലൂടെ റസൂൽ(സ) നടന്നുപോയി. അദ്ദേഹത്തിന്റെ മേൽ വെള്ളം തെളിക്കപ്പെടുന്നുണ്ടായിരുന്നു. അന്നേരം തിരുമേനി(സ) ചോദിച്ചു: \"നിങ്ങളുടെ ഈ കൂട്ടുകാരനെന്തുപറ്റി?\" അവർ പറഞ്ഞു: പ്രവാചകരേ അയാൾ നോമ്പുകാരനാണ്. അപ്പോൾ തിരുമേനി(സ) പറഞ്ഞു: \"യാത്രയിൽ നിങ്ങൾ നോമ്പെടുക്കൽ പുണ്യകരമായ കാര്യമല്ല. നിങ്ങൾക്ക് അല്ലാഹു നൽകിയ ഇളവ് സ്വീകരിക്കുക. നിങ്ങളതനുവർത്തിക്കുക.\" (ബു,മു,ദ,ന,ജ)", "narrator_ml": "ജാബിറുബ്നു അബ്ദില്ല(റ)", "source_codes_ar": ["ق", "د", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 53, "page_start": 107}, {"hadith_no": 238, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا: أَنَّ حَمْزَةَ الْأَسْلَمِيَّ رَضِيَ اللَّهُ عَنْهُ سَأَلَ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ: يَا رَسُولَ اللَّهِ، إِنِّي رَجُلٌ أَسْرُدُ الصَّوْمَ، أَفَأَصُومُ فِي السَّفَرِ؟ قَالَ: \"صُمْ إِنْ شِئْتَ، وَأَفْطِرْ إِنْ شِئْتَ\". (ق،د،ت،ن،جه)", "malayalam": "ആഇശ(റ): ഹംസതുൽഅസ്ലമി(റ) റസൂൽ(സ)യോട് ചോദിച്ചു: പ്രവാചകരേ, തുടർച്ചയായി നോമ്പനുഷ്ഠിക്കുന്ന ഒരാളാണ് ഞാൻ. അതിനാൽ, യാത്രാവേളയിൽ ഞാൻ നോമ്പ് എടുക്കട്ടെയോ? തിരുമേനി(സ) പറഞ്ഞു: \"നീ ഉദ്ദേശിക്കുന്നുവെങ്കിൽ നോമ്പെടുത്തുകൊള്ളുക. നീ ഉദ്ദേശിക്കുന്നുവെങ്കിൽ ഒഴിവാക്കുകയും ചെയ്യുക.\" (ബു,മു,ദ,തു,ന,ജ)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["ق", "د", "ت", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 53, "page_start": 107}, {"hadith_no": 239, "arabic": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: سَافَرَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَصَامَ حَتَّى بَلَغَ عُسْفَانَ، ثُمَّ دَعَا بِإِنَاءٍ فَشَرِبَ نَهَارًا لِيَرَاهُ النَّاسُ، ثُمَّ أَفْطَرَ حَتَّى دَخَلَ مَكَّةَ، فَافْتَتَحَ مَكَّةَ فِي رَمَضَانَ. قَالَ ابْنُ عَبَّاسٍ: فَصَامَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي السَّفَرِ وَأَفْطَرَ، فَمَنْ شَاءَ صَامَ وَمَنْ شَاءَ أَفْطَرَ. (ق،د،ن)", "malayalam": "ഇബ്നുഅബ്ബാസ്(റ): റസൂൽ(സ) (മക്കാ യാത്രാവേളയിൽ) 'ഉസ്ഫാൻ' എന്ന സ്ഥലം എത്തുന്നതുവരെ നോമ്പെടുത്തുകൊണ്ട് യാത്ര ചെയ്തു. പിന്നെ ഒരു പാത്രം വെള്ളം ആവശ്യപ്പെട്ട് ജനങ്ങൾ കാൺകെ പകൽനേരത്ത് തന്നെ അത് കുടിച്ചു. (ഇത് റമളാൻ മാസത്തിലായിരുന്നു) അതിനുശേഷം മക്കയിൽ എത്തുന്നത്വരെ തിരുമേനി(സ) നോമ്പ് എടുത്തിരുന്നില്ല. അങ്ങനെ റമളാനിൽ മക്ക കീഴടക്കി. ഇബ്നുഅബ്ബാസ്(റ) പറയുന്നു: റസൂൽ(സ) യാത്രാവേളയിൽ നോമ്പ് എടുക്കുകയും ഒഴിവാക്കുകയും ചെയ്തിട്ടുണ്ട്. അതിനാൽ നോമ്പ് എടുക്കാനുദ്ദേശിക്കുന്നവർക്ക് നോമ്പ് എടുക്കുകയും നോമ്പ് ഒഴിവാക്കാനുദ്ദേശിക്കുന്നവർക്ക് ഒഴിവാക്കുകയും ചെയ്യാവുന്നതാണ്. (ബു,മു,ദ,ന)", "narrator_ml": "ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["ق", "د", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 53, "page_start": 108}, {"hadith_no": 240, "arabic": "عَنْ حَمْزَةَ بْنِ عَمْرٍو الأسلمي رَضِيَ اللَّهُ عَنْهُ أَنَّهُ قَالَ: يَا رَسُولَ اللَّهِ، أَجِدُ بِي قُوَّةً عَلَى الصِّيَامِ فِي السَّفَرِ، فَهَلْ عَلَيَّ جُنَاحٌ؟ فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"هِيَ رُخْصَةٌ مِنَ اللَّهِ عَزَّ وَجَلَّ، فَمَنْ أَخَذَ بِهَا فَحَسَنٌ، وَمَنْ أَحَبَّ أَنْ يَصُومَ فَلَا جُنَاحَ عَلَيْهِ\". (م،ن)", "malayalam": "ഹംസതുബ്നു അംറിൽ അസ്ലമി(റ): അദ്ദേഹം ചോദിച്ചു: പ്രവാചകരേ, യാത്രാവേളയിൽ നോമ്പെടുക്കാൻ എനിക്കു ശേഷിയുണ്ട്. അങ്ങനെ ചെയ്താൽ എന്റെ മേൽ കുറ്റമുണ്ടാകുമോ? തിരുമേനി(സ) പറഞ്ഞു: \"അത് അല്ലാഹുവിൽനിന്നുള്ള ഒരു ഇളവാണ്. അത് സ്വീകരിച്ചാൽ അതാണു നല്ലത്. ഇനി ആരെങ്കിലും നോമ്പെടുക്കാൻ ആഗ്രഹിക്കുന്നുവെങ്കിൽ അതിന്റെ പേരിൽ അവനു കുറ്റമുണ്ടാവില്ല.\" (മു,ന)", "narrator_ml": "ഹംസതുബ്നു അംറിൽ അസ്ലമി(റ)", "source_codes_ar": ["م", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 53, "page_start": 108}, {"hadith_no": 241, "arabic": "عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ رَضِيَ اللَّهُ عَنْهُ قَالَ: غَزَوْنَا مَعَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لِسِتٍّ عَشْرَةَ مَضَتْ مِنْ رَمَضَانَ، فَمِنَّا مَنْ صَامَ وَمِنَّا مَنْ أَفْطَرَ، فَلَمْ يَعِبِ الصَّائِمُ عَلَى الْمُفْطِرِ وَلَا الْمُفْطِرُ عَلَى الصَّائِمِ. (م)", "malayalam": "അബുസഈദിൽ ഖുദ്‌രി(റ): റമളാൻ പതിനാറിന് ഞങ്ങൾ പ്രവാചകരോടൊപ്പം യുദ്ധം ചെയ്തു. അന്നേരം നോമ്പ് എടുത്തവരും എടുക്കാത്തവരും ഞങ്ങളുടെ കൂട്ടത്തിൽ ഉണ്ടായിരുന്നു. എന്നാൽ, നോമ്പ് എടുത്തവൻ എടുക്കാത്തവനെയോ നോമ്പ് എടുക്കാത്തവൻ തിരിച്ചോ ആക്ഷേപിച്ചിരുന്നില്ല. (മു)", "narrator_ml": "അബുസഈദിൽ ഖുദ്‌രി(റ)", "source_codes_ar": ["م"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 53, "page_start": 108}, {"hadith_no": 242, "arabic": "عَنْ حَمْزَةَ الْأَسْلَمِيِّ رَضِيَ اللَّهُ عَنْهُ قَالَ: قُلْتُ يَا رَسُولَ اللَّهِ، إِنِّي صَاحِبُ ظَهْرٍ أُعَالِجُهُ: أُسَافِرُ عَلَيْهِ، وَأُكْرِيهِ، وَإِنَّهُ رُبَّمَا صَادَفَنِي هَذَا الشَّهْرُ - يَعْنِي رَمَضَانَ - وَأَنَا أَجِدُ الْقُوَّةَ، وَأَنَا شَابٌّ، وَأَجِدُ بِأَنْ أَصُومَ- يَا رَسُولَ اللَّهِ- أَهْوَنَ عَلَيَّ مِنْ أَنْ أُؤَخِّرَهُ فَيَكُونُ دَيْنًا، أَفَأَصُومُ يَا رَسُولَ اللَّهِ أَعْظَمُ لِأَجْرِي أَوْ أُفْطِرُ؟ قَالَ: \"أَيَّ ذَلِكَ شِئْتَ يَا حَمْزَةُ\". (م،د،ن)", "malayalam": "ഹംസതുൽ അസ്ലമി(റ): ഞാൻ ചോദിച്ചു: പ്രവാചകരേ, ഞാൻ ഒരു വാഹനം കൈകാര്യം ചെയ്യുന്നവനാണ്. അതിന്മേൽ ഞാൻ യാത്ര ചെയ്യുകയും അതിനെ ഞാൻ വാടകയ്ക്കു കൊടുക്കുകയും ചെയ്യുന്നു. എന്റെ യാത്രക്കിടെ ഈ മാസം - റമളാൻ - കടന്നുവന്നേക്കാം. അത് അനുഷ്ഠിക്കുവാൻ എനിക്കു കഴിവുണ്ട്. ഞാനൊരു യുവാവാണ്. പ്രവാചകരേ, നോമ്പെടുക്കുന്നത്, അതിനെ ഒരുകടമായി പിന്തിക്കുന്നതിനേക്കാൾ എനിക്ക് നിസ്സാരമായി തോന്നുന്നു. അതിനാൽ പ്രവാചകരേ, ഞാനതു നോൽക്കുകയാണോ ഒഴിവാക്കുകയാണോ കൂടുതൽ പ്രതിഫലം ലഭ്യമാവാനുള്ള മാർഗം? തിരുമേനി(സ) പറഞ്ഞു: \"ഹംസേ, നിനക്കിഷ്ടമുള്ളത് നീ പ്രവർത്തിച്ചോളൂ.\" (മു,ദ,ന)", "narrator_ml": "ഹംസതുൽ അസ്ലമി(റ)", "source_codes_ar": ["م", "د", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 53, "page_start": 108}, {"hadith_no": 243, "arabic": "عَنْ أَبِي سَعِيدٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: كُنَّا نُسَافِرُ مَعَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، فَمِنَّا الصَّائِمُ وَمِنَّا الْمُفْطِرِ، فَلَا يَجِدُ الْمُفْطِرُ عَلَى الصَّائِمِ وَلَا الصَّائِمُ عَلَى الْمُفْطِرِ. فَكَانُوا يَرَوْنَ أَنَّهُ مَنْ وَجَدَ قُوَّةً فَصَامَ فَحَسَنٌ، وَمَنْ وَجَدَ ضَعْفًا فَأَفْطَرَ فَحَسَنٌ. (م,ت)", "malayalam": "അബൂസഈദ്(റ): ഞങ്ങൾ നബി(സ)യോടൊപ്പം യാത്രചെയ്യുമ്പോൾ നോമ്പുള്ളവരും ഇല്ലാത്തവരും ഞങ്ങളുടെ കൂട്ടത്തിലുണ്ടയിരുന്നു. എന്നാൽ നോമ്പുള്ളവർ ഇല്ലാത്തവരെയോ ഇല്ലാത്തവർ ഉള്ളവരെയോ ആക്ഷേപിച്ചില്ല. കഴിവുള്ളവർ അനുഷ്ഠിക്കുന്നതും ബലഹീനർ ഒഴിവാക്കുന്നതും നല്ലതായി അവർ കാണുമായിരുന്നു. (മു,തു)", "narrator_ml": "അബൂസഈദ്(റ)", "source_codes_ar": ["م", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 53, "page_start": 108}, {"hadith_no": 244, "arabic": "عَنْ أَنَسٍ رَضِيَ اللهُ عَنْهُ قَالَ: كُنَّا مَعَ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي السَّفَرِ، فَمِنَّا الصَّائِمُ وَمِنَّا الْمُفْطِرُ، قَالَ: فَنَزَلْنَا مَنْزِلًا فِي يَوْمٍ حَارٍّ، أَكْثَرُنَا ظِلًّا صَاحِبُ الْكِسَاءِ، وَمِنَّا مَنْ يَتَّقِي الشَّمْسَ بِيَدِهِ، قَالَ: فَسَقَطَ الصُّوَّامُ وَقَامَ الْمُفْطِرُونَ، فَضَرَبُوا الْأَبْنِيَةَ وَسَقَوُا الرِّكَابَ، فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"ذَهَبَ الْمُفْطِرُونَ الْيَوْمَ بِالْأَجْرِ\". (م)", "malayalam": "അനസ്(റ): ഞങ്ങൾ പ്രവാചകർ(സ)യോടൊപ്പം ഒരു യാത്രയിലായിരുന്നു. ഞങ്ങളുടെ കൂട്ടത്തിൽ നോമ്പ് എടുത്തിരുന്നവരും നോമ്പ് ഒഴിവാക്കിയവരും ഉണ്ടായിരുന്നു. കഠിനചൂടുണ്ടായിരുന്ന ഒരു ദിവസം ഞങ്ങൾ ഒരു താവളത്തിൽ ഇറങ്ങി. കൂട്ടത്തിൽ പുതപ്പുണ്ടായിരുന്നവർക്കാണ് ഞങ്ങളുടെ ഇടയിൽ അധികം തണൽ ലഭിച്ചിരുന്നത്. കൈകൊണ്ടു വെയിൽ തടുത്തിരുന്നവരും ഉണ്ടായിരുന്നു. നോമ്പുണ്ടായിരുന്നവരെല്ലാം തളർന്നുവീണു. നോമ്പ് ഒഴിവാക്കിയിരുന്നവർ എഴുന്നേറ്റു തമ്പു കെട്ടുകയും വാഹനങ്ങൾക്ക് (മൃഗങ്ങൾ) വെള്ളം നൽകുകയും ചെയ്തു. അന്നേരം റസൂൽ(സ) പറഞ്ഞു: \"ഇന്ന് നോമ്പ് അനുഷ്ഠിക്കാത്തവരാണ് പ്രതിഫലം കരസ്ഥമാക്കിയത്.\" (മു)", "narrator_ml": "അനസ്(റ)", "source_codes_ar": ["م"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 53, "page_start": 109}, {"hadith_no": 245, "arabic": "عَنْ سَلَمَةَ بْنِ الْمُحَبَّقِ الْهُذَلِيِّ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"مَنْ كَانَتْ لَهُ حَمُولَةٌ تَأْوِي إِلَى شِبَعٍ فَلْيَصُمْ رَمَضَانَ حَيْثُ أَدْرَكَهُ\". وَفِي رِوَايَةٍ: \"مَنْ أَدْرَكَهُ رَمَضَانُ فِي السَّفَرِ...\" فَذَكَرَ مَعْنَاهُ. (د)", "malayalam": "സലമതുബ്നുൽ മുഹബ്ബഖിൽ ഹുദലി(റ): റസൂൽ(സ) പറഞ്ഞു: \"യാത്രാവേളയിൽ സുഖകരമായി യാത്ര ചെയ്യാവുന്ന വാഹനസൗകര്യമുള്ളവൻ, തന്റെ യാത്രയിൽ റമളാൻ ആഗതമായ സ്ഥലം മുതൽ നോമ്പ് എടുത്തുകൊള്ളട്ടെ.\" മറ്റൊരു നിവേദനത്തിൽ \"യാത്രാവേളയിൽ റമളാൻ ആഗതമായാൽ....\" എന്നാണുള്ളത്. (ദ)", "narrator_ml": "സലമതുബ്നുൽ മുഹബ്ബഖിൽ ഹുദലി(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: \"مَنْ أَدْرَكَهُ رَمَضَانُ فِي السَّفَرِ...\" فَذَكَرَ مَعْنَاهُ. (د)", "malayalam": "മറ്റൊരു നിവേദനത്തിൽ \"യാത്രാവേളയിൽ റമളാൻ ആഗതമായാൽ....\" എന്നാണുള്ളത്. (ദ)"}], "bab_seq": 53, "page_start": 109}, {"hadith_no": 246, "arabic": "عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ رَضِيَ اللهُ عَنْهُمَا: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ خَرَجَ إِلَى مَكَّةَ عَامَ الْفَتْحِ، فَصَامَ حَتَّى بَلَغَ كُرَاعَ الْغَمِيمِ، وَصَامَ النَّاسُ مَعَهُ. فَقِيلَ لَهُ: إِنَّ النَّاسَ قَدْ شَقَّ عَلَيْهِمُ الصِّيَامُ، وَإِنَّ النَّاسَ يَنْظُرُونَ فِيمَا فَعَلْتَ. فَدَعَا بِقَدَحٍ مِنْ مَاءٍ بَعْدَ الْعَصْرِ فَشَرِبَ، وَالنَّاسُ يَنْظُرُونَ إِلَيْهِ. فَأَفْطَرَ بَعْضُهُمْ وَصَامَ بَعْضُهُمْ، فَبَلَغَهُ أَنَّ نَاسًا صَامُوا، فَقَالَ: \"أُولَئِكَ الْعُصَاةُ\". حَسَنٌ صَحِيحٌ. (م,ت,ن)", "malayalam": "ജാബിറുബ്നു അബ്ദില്ല(റ): റസൂൽ(സ) മക്കാവിജയത്തിന്റെ വർഷം മക്കയിലേക്ക് യാത്ര പുറപ്പെട്ടപ്പോൾ കുറാഉൽഗമീം എന്ന സ്ഥലത്ത് എത്തുന്നതുവരെ നോമ്പ് എടുത്തിരുന്നു. തിരുമേനി(സ)യോടൊപ്പം ജനങ്ങളും നോമ്പ് എടുത്തിരുന്നു. അവിടത്തോട് പറയപ്പെട്ടു: ജനങ്ങൾക്ക് നോമ്പ് വല്ലാതെ പ്രയാസകരമായിരിക്കുന്നു, അങ്ങ് എന്താണ് ചെയ്യുന്നതെന്ന് നോക്കുകയാണവർ. അപ്പോൾ തിരുമേനി(സ), അസ്വറിന് ശേഷം, ഒരു കോപ്പ വെള്ളം കൊണ്ടുവരാൻ ആവശ്യപ്പെടുകയും ജനങ്ങൾ കാൺകെതന്നെ അത് കുടിക്കുകയും ചെയ്തു. ഇതു കണ്ട ചിലർ നോമ്പുമുറിക്കുകയും എന്നാൽ മറ്റു ചിലർ നോമ്പ് മുറിക്കാതിരിക്കുകയും ചെയ്തു. ചിലയാളുകൾ നോമ്പ് എടുത്തിരിക്കുന്നുവെന്നു തിരുമേനി(സ) അറിഞ്ഞപ്പോൾ അവിടന്ന് പറഞ്ഞു: \"അവരാണ് എതിർ പ്രവർത്തിച്ചവർ.\" (മു,തു,ന)", "narrator_ml": "ജാബിറുബ്നു അബ്ദില്ല(റ)", "source_codes_ar": ["م", "ت", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 53, "page_start": 109}, {"hadith_no": 247, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: أُتِيَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِطَعَامٍ بِمَرِّ الظَّهْرَانِ، فَقَالَ لِأَبِي بَكْرٍ وَعُمَرَ \"أَدْنِيَا فَكُلَا\". فَقَالَا: إِنَّا صَائِمَانِ. فَقَالَ: \"ارْحَلُوا لِصَاحِبَيْكُمْ، اعْمَلُوا لِصَاحِبَيْكُمْ\". (ن)", "malayalam": "അബൂഹുറൈറ(റ): ഒരു യാത്രയിൽ മർറുള്ളഹ്റാൻ എന്ന സ്ഥലത്ത് വെച്ച് പ്രവാചകൻ(സ)ക്ക് ഒരാൾ ഭക്ഷണം കൊണ്ടുവന്ന് കൊടുത്തു. അപ്പോൾ തിരുമേനി(സ) അബൂബക്കർ(റ), ഉമർ(റ) എന്നിവരോട് പറഞ്ഞു: \"നിങ്ങൾ രണ്ടുപേരും അടുത്തേക്കിരുന്ന് ഭക്ഷണം കഴിക്കുക.\" അന്നേരം അവർ പറഞ്ഞു: ഞങ്ങൾ രണ്ടുപേരും നോമ്പുകാരാണ്. അപ്പോൾ തിരുമേനി(സ) (മറ്റു അനുചരരോട്) പറഞ്ഞു: \"നിങ്ങളുടെ ഈ രണ്ടു കൂട്ടാളികളുടെ യാത്രയിൽ നിങ്ങൾ സഹായിക്കുക. നിങ്ങളുടെ ഈ രണ്ട് കൂട്ടുകാർക്കുവേണ്ടത് നിങ്ങൾ ചെയ്തുകൊടുക്കുക.\" (ന)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 53, "page_start": 109}, {"hadith_no": 248, "arabic": "عَنْ عَبْدِ الرَّحْمَنِ بْنِ عَوْفٍ رَضِيَ اللهُ عَنْهُ قَالَ: يُقَالُ: الصِّيَامُ فِي السَّفَرِ كَالْإِفْطَارِ فِي الْحَضَرِ. وَفِي رِوَايَةٍ عَنْهُ قَالَ: الصَّائِمُ فِي السَّفَرِ كَالْمُفْطِرِ فِي الْحَضَرِ. (ن,جه)", "malayalam": "അബ്ദുർറഹ്മാനുബ്നു ഔഫ്(റ): യാത്രാവേളയിൽ നോമ്പനുഷ്ഠിക്കുകയെന്നത്, യാത്രയിലല്ലാത്തപ്പോൾ നോമ്പ് ഒഴിവാക്കുന്നതുപോലെയാണ് എന്ന് പറയപ്പെടുന്നു. അദ്ദേഹത്തിൽനിന്നുതന്നെയുള്ള മറ്റൊരു നിവേദനത്തിൽ: യാത്രാവേളയിൽ നോമ്പനുഷ്ഠിക്കുന്നവൻ, യാത്രയിലല്ലാത്തപ്പോൾ നോമ്പ് ഒഴിവാക്കുന്നവനെപ്പോലെയാണ്. (ന,ജ)", "narrator_ml": "അബ്ദുർറഹ്മാനുബ്നു ഔഫ്(റ)", "source_codes_ar": ["ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ عَنْهُ قَالَ: الصَّائِمُ فِي السَّفَرِ كَالْمُفْطِرِ فِي الْحَضَرِ. (ن,جه)", "malayalam": "മറ്റൊരു നിവേദനത്തിൽ: യാത്രാവേളയിൽ നോമ്പനുഷ്ഠിക്കുന്നവൻ, യാത്രയിലല്ലാത്തപ്പോൾ നോമ്പ് ഒഴിവാക്കുന്നവനെപ്പോലെയാണ്. (ന,ജ)"}], "bab_seq": 53, "page_start": 110}, {"hadith_no": 249, "arabic": "عَنْ مُجَاهِدٍ، وَقَدْ سُئِلَ عَنِ الصَّوْمِ فِي السَّفَرِ؟ قَالَ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ وَيُفْطِرُ. وَفِي رِوَايَةٍ: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ صَامَ فِي شَهْرِ رَمَضَانَ وَأَفْطَرَ فِي السَّفَرِ. (ن)", "malayalam": "മുജാഹിദ്(റ): യാത്രാവേളയിൽ നോമ്പ് എടുക്കുന്നതിനെക്കുറിച്ച് അദ്ദേഹത്തോട് ചോദിച്ചപ്പോൾ അദ്ദേഹം പറഞ്ഞു: റസൂൽ(സ) നോമ്പനുഷ്ഠിക്കുകയും ഒഴിവാക്കുകയും ചെയ്യാറുണ്ടായിരുന്നു. മറ്റൊരു നിവേദനം: റസൂൽ(സ) റമളാൻ മാസത്തിൽ നോമ്പനുഷ്ഠിക്കുകയും യാത്രാവേളയിൽ ഒഴിവാക്കുകയും ചെയ്തിരുന്നു. (ന)", "narrator_ml": "മുജാഹിദ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ صَامَ فِي شَهْرِ رَمَضَانَ وَأَفْطَرَ فِي السَّفَرِ. (ن)", "malayalam": "മറ്റൊരു നിവേദനം: റസൂൽ(സ) റമളാൻ മാസത്തിൽ നോമ്പനുഷ്ഠിക്കുകയും യാത്രാവേളയിൽ ഒഴിവാക്കുകയും ചെയ്തിരുന്നു. (ന)"}], "bab_seq": 53, "page_start": 110}, {"hadith_no": 250, "arabic": "عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ– رَجُلٌ مِنْ بَنِي عَبْدِ اللَّهِ بْنِ كَعْبٍ إِخْوَةِ بَنِي قُشَيْرٍ– قَالَ: أَغَارَتْ عَلَيْنَا خَيْلٌ لِرَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، فَانْتَهَيْتُ– أَوْ قَالَ: فَانْطَلَقْتُ– إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَهُوَ يَأْكُلُ، فَقَالَ: \"اجْلِسْ فَأَصِبْ مِنْ طَعَامِنَا هَذَا\". فَقُلْتُ: إِنِّي صَائِمٌ، قَالَ: \"اجْلِسْ أُحَدِّثْكَ عَنِ الصَّلَاةِ وَعَنِ الصِّيَامِ، إِنَّ اللَّهَ تَعَالَى وَضَعَ شَطْرَ الصَّلَاةِ– أَوْ نِصْفَ الصَّلَاةِ– وَالصَّوْمَ: عَنِ الْمُسَافِرِ، وَعَنِ الْمُرْضِعِ، أَوِ: الْحُبْلَى\". وَاللَّهِ لَقَدْ قَالَهُمَا جَمِيعًا أَوْ أَحَدَهُمَا، قَالَ: فَتَلَهَّفَتْ نَفْسِي أَنْ لَا أَكُونَ أَكَلْتُ مِنْ طَعَامِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. (د,ت,ن,جه)", "malayalam": "ബനൂഖുശൈറിന്റെ സഹോദരങ്ങളായ അബ്ദുല്ലാഹിബിൻ കഅ്ബിന്റെ സന്തതികളിലൊരാളായ അനസുബ്നു മാലിക്(റ): റസൂൽ(സ)യുടെ ഒരു കുതിരസംഘം അബദ്ധത്തിൽ ഞങ്ങൾക്കെതിരിൽ ആക്രമണം നടത്തി. അന്നേരം ഞാൻ പ്രവാചകരുടെ അടുത്തേക്ക്പോയി. തിരുമേനി(സ) അപ്പോൾ ഭക്ഷണം കഴിക്കുകയായിരുന്നു. തിരുമേനി(സ) പറഞ്ഞു: \"നീ ഇരുന്ന് ഞങ്ങളുടെ ഈ ഭക്ഷണം കഴിക്കൂ.\" അപ്പോൾ ഞാൻ പറഞ്ഞു: ഞാൻ നോമ്പുകാരനാണ്. തിരുമേനി(സ) പറഞ്ഞു: \"നീ ഇരിക്കൂ, നിനക്ക് ഞാൻ നിസ്കാരത്തെയും നോമ്പിനേയും കുറിച്ച് പറഞ്ഞുതരാം. നിശ്ചയം അല്ലാഹുതആല, നിസ്കാരത്തിന്റെ പകുതിഭാഗവു tart": 111}, {"hadith_no": 254, "arabic": "عَنْ أَنَسِ بْنِ مَالِكٍ الْقُشَيْرِيِّ رَضِيَ اللهُ عَنْهُ: أَنَّهُ ذَهَبَ فِي إِبِلٍ لَهُ، فَانْتَهَى إِلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَهُوَ يَأْكُلُ، أَوْ قَالَ: يَطْعَمُ، فَقَالَ: \"ادْنُ فَكُلْ\". أَوْ قَالَ: \"ادْنُ فَاطْعَمْ\". فَقُلْتُ: إِنِّي صَائِمٌ. فَقَالَ: \"إِنَّ اللَّهَ عَزَّ وَجَلَّ وَضَعَ عَنِ الْمُسَافِرِ شَطْرَ الصَّلَاةِ وَالصِّيَامِ، وَعَنِ الْحَامِلِ وَالْمُرْضِعِ\". وَفِي رِوَايَةٍ: قَالَ: أَتَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي إِبِلٍ كَانَتْ لِي أُخِذَتْ، فَوَافَقْتُهُ وَهُوَ يَأْكُلُ، فَدَعَانِي إِلَى طَعَامِهِ، فَقُلْتُ: إِنِّي صَائِمٌ. فَقَالَ: \"ادْنُ أُخْبِرْكَ عَنْ ذَلِكَ، إِنَّ اللَّهَ وَضَعَ عَنِ الْمُسَافِرِ الصَّوْمَ وَشَطْرَ الصَّلَاةِ\". وَفِي رِوَايَةٍ: قَالَ: أَتَيْتُ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لِحَاجَةٍ، فَإِذَا هُوَ يَتَغَدَّى، قَالَ: \"هَلُمَّ إِلَى الْغَدَاءِ\". فَقُلْتُ: إِنِّي صَائِمٌ. قَالَ: \"هَلُمَّ أُخْبِرْكَ عَنِ الصَّوْمِ، إِنَّ اللَّهَ وَضَعَ عَنِ الْمُسَافِرِ نِصْفَ الصَّلَاةِ وَالصَّوْمَ، وَرَخَّصَ لِلْحُبْلَى وَالْمُرْضِعِ. (ن)", "malayalam": "അനസ്ബിൻ മാലിക് അൽഖുശൈരി(റ): അദ്ദേഹം, തന്റെ ഒരു ഒട്ടകത്തിന്റെ കാര്യം സംസാരിക്കാൻ റസൂൽ(സ)യെ സമീപിച്ചു. തിരുമേനി(സ) അന്നേരം ഭക്ഷണം കഴിക്കുകയായിരുന്നു. തിരുമേനി(സ) പറഞ്ഞു: \"നീ അടുത്തേക്ക് ഇരുന്ന്, ഭക്ഷണം കഴിക്കൂ.\" അന്നേരം ഞാൻ പറഞ്ഞു: ഞാൻ നോമ്പുകാരനാണ്. അന്നേരം തിരുമേനി(സ) പറഞ്ഞു: \"നിശ്ചയം അല്ലാഹുതആല, യാത്രക്കാരന് നിസ്കാരത്തിന്റെ പകുതിഭാഗവും നോമ്പും, ഗർഭിണിക്കും മുലയൂട്ടുന്ന സ്ത്രീക്കും നോമ്പും ഇളവുചെയ്തിരിക്കുന്നു.\" മറ്റൊരു നിവേദനം: പിടിക്കപ്പെട്ട എന്റെ ഒരു ഒട്ടകത്തിന്റെ കാര്യത്തിൽ സംസാരിക്കുന്നതിനുവേണ്ടി ഞാൻ പ്രവാചകർ(സ)യെ സമീപിച്ചു. ഞാൻ തിരുമേനി(സ)യെ കണ്ടനേരം തിരുമേനി(സ) ഭക്ഷണം കഴിക്കുകയായിരുന്നു. അവിടന്ന് എന്നെ ഭക്ഷണം കഴിക്കാൻ ക്ഷണിച്ചു. ഞാൻ പറഞ്ഞു: ഞാൻ നോമ്പുകാരനാണ്. അപ്പോൾ റസൂൽ(സ) പറഞ്ഞു: \"താങ്കൾ അടുത്തേക്കുവരൂ, അതേക്കുറിച്ചു ഞാൻ പറഞ്ഞുതരാം. തീർച്ചയായും അല്ലാഹു യാത്രക്കാരന് നോമ്പും നിസ്കാരത്തിന്റെ പകുതിയും ഇളവുചെയ്തിരിക്കുന്നു.\" മറ്റൊരു നിവേദനം: എന്റെ ഒരു ആവശ്യത്തിന് വേണ്ടി ഞാൻ റസൂൽ(സ)യുടെ അടുത്തുചെന്നു. അന്നേരം, അവിടന്ന് പ്രഭാതഭക്ഷണം കഴിക്കുകയായിരുന്നു. തിരുമേനി(സ) പറഞ്ഞു: \"ഭക്ഷണം കഴിക്കൂ.\" ഞാൻ പറഞ്ഞു: ഞാൻ നോമ്പുകാരനാണ്. അപ്പോൾ തിരുമേനി(സ) പറഞ്ഞു: \"വരൂ, താങ്കൾക്കു ഞാൻ നോമ്പിനെപ്പറ്റി പറഞ്ഞുതരാം, നിശ്ചയം അല്ലാഹു യാത്രക്കാരന് നിസ്കാരത്തിന്റെ പകുതിയും നോമ്പും ഒഴിവാക്കിക്കൊടുക്കുകയും ഗർഭിണിക്കും മുലയൂട്ടുന്ന പെണ്ണിനും ഇളവുനൽകുകയും ചെയ്തിരിക്കുന്നു.\" (ന)", "narrator_ml": "അനസ്ബിൻ മാലിക് അൽഖുശൈരി(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: قَالَ: أَتَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي إِبِلٍ كَانَتْ لِي أُخِذَتْ، فَوَافَقْتُهُ وَهُوَ يَأْكُلُ، فَدَعَانِي إِلَى طَعَامِهِ، فَقُلْتُ: إِنِّي صَائِمٌ. فَقَالَ: \"ادْنُ أُخْبِرْكَ عَنْ ذَلِكَ، إِنَّ اللَّهَ وَضَعَ عَنِ الْمُسَافِرِ الصَّوْمَ وَشَطْرَ الصَّلَاةِ\".", "malayalam": "മറ്റൊരു നിവേദനം: പിടിക്കപ്പെട്ട എന്റെ ഒരു ഒട്ടകത്തിന്റെ കാര്യത്തിൽ സംസാരിക്കുന്നതിനുവേണ്ടി ഞാൻ പ്രവാചകർ(സ)യെ സമീപിച്ചു. ഞാൻ തിരുമേനി(സ)യെ കണ്ടനേരം തിരുമേനി(സ) ഭക്ഷണം കഴിക്കുകയായിരുന്നു. അവിടന്ന് എന്നെ ഭക്ഷണം കഴിക്കാൻ ക്ഷണിച്ചു. ഞാൻ പറഞ്ഞു: ഞാൻ നോമ്പുകാരനാണ്. അപ്പോൾ റസൂൽ(സ) പറഞ്ഞു: \"താങ്കൾ അടുത്തേക്കുവരൂ, അതേക്കുറിച്ചു ഞാൻ പറഞ്ഞുതരാം. തീർച്ചയായും അല്ലാഹു യാത്രക്കാരന് നോമ്പും നിസ്കാരത്തിന്റെ പകുതിയും ഇളവുചെയ്തിരിക്കുന്നു.\""}, {"seq": 2, "arabic": "وَفِي رِوَايَةٍ: قَالَ: أَتَيْتُ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لِحَاجَةٍ، فَإِذَا هُوَ يَتَغَدَّى، قَالَ: \"هَلُمَّ إِلَى الْغَدَاءِ\". فَقُلْتُ: إِنِّي صَائِمٌ. قَالَ: \"هَلُمَّ أُخْبِرْكَ عَنِ الصَّوْمِ، إِنَّ اللَّهَ وَضَعَ عَنِ الْمُسَافِرِ نِصْفَ الصَّلَاةِ وَالصَّوْمَ، وَرَخَّصَ لِلْحُبْلَى وَالْمُرْضِعِ. (ن)", "malayalam": "മറ്റൊരു നിവേദനം: എന്റെ ഒരു ആവശ്യത്തിന് വേണ്ടി ഞാൻ റസൂൽ(സ)യുടെ അടുത്തുചെന്നു. അന്നേരം, അവിടന്ന് പ്രഭാതഭക്ഷണം കഴിക്കുകയായിരുന്നു. തിരുമേനി(സ) പറഞ്ഞു: \"ഭക്ഷണം കഴിക്കൂ.\" ഞാൻ പറഞ്ഞു: ഞാൻ നോമ്പുകാരനാണ്. അപ്പോൾ തിരുമേനി(സ) പറഞ്ഞു: \"വരൂ, താങ്കൾക്കു ഞാൻ നോമ്പിനെപ്പറ്റി പറഞ്ഞുതരാം, നിശ്ചയം അല്ലാഹു യാത്രക്കാരന് നിസ്കാരത്തിന്റെ പകുതിയും നോമ്പും ഒഴിവാക്കിക്കൊടുക്കുകയും ഗർഭിണിക്കും മുലയൂട്ടുന്ന പെണ്ണിനും ഇളവുനൽകുകയും ചെയ്തിരിക്കുന്നു.\" (ന)"}], "bab_seq": 53, "page_start": 111}, {"hadith_no": 255, "arabic": "عَنْ عَبْدِ اللَّهِ بْنِ الشِّخِّيرِ رَضِيَ اللهُ عَنْهُ قَالَ: كُنْتُ مُسَافِرًا، فَأَتَيْتُ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَأَنَا صَائِمٌ وَهُوَ يَأْكُلُ، قَالَ: \"هَلُمَّ\". قُلْتُ: إِنِّي صَائِمٌ. قَالَ: \"تَعَالَ، أَلَمْ تَعْلَمْ مَا وَضَعَ اللَّهُ عَنِ الْمُسَافِرِ\". قُلْتُ: وَمَا وَضَعَ عَنِ الْمُسَافِرِ؟ قَالَ: \"الصَّوْمَ وَنِصْفَ الصَّلَاةِ\". وَفِي رِوَايَةٍ قَالَ: كُنَّا نُسَافِرُ مَا شَاءَ اللَّهُ، فَأَتَيْنَا رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَهُوَ يَطْعَمُ، فَقَالَ: \"هَلُمَّ فَاطْعَمْ\". فَقُلْتُ: إِنِّي صَائِمٌ. فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"أُحَدِّثُكُمْ عَنِ الصِّيَامِ، إِنَّ اللَّهَ وَضَعَ عَنِ الْمُسَافِرِ الصَّوْمَ وَشَطْرَ الصَّلَاةِ\". (ن)", "malayalam": "അബ്ദുല്ലാഹിബ്നു ശിഖ്ഖീർ(റ): ഞാനൊരു യാത്രക്കാരനായിരുന്നു. അങ്ങനെ ഞാൻ നോമ്പുകാരനായി പ്രവാചകർ(സ)യുടെ അടുത്തുചെന്നു. തിരുമേനി(സ) അപ്പോൾ ഭക്ഷണം കഴിക്കുകയായിരുന്നു. തിരുമേനി(സ) പറഞ്ഞു: \"വരൂ.\" ഞാൻ പറഞ്ഞു: ഞാൻ നോമ്പുകാരനാണ്. അപ്പോൾ തിരുമേനി(സ) പറഞ്ഞു: \"വരൂ, യാത്രക്കാരന് അല്ലാഹു ഇളവുനൽകിയതിനെപ്പറ്റി നീയറിഞ്ഞിട്ടില്ലേ?\" ഞാൻ ചോദിച്ചു: യാത്രക്കാരന് എന്ത് ഇളവാണ് നൽകപ്പെട്ടിരിക്കുന്നത്? തിരുമേനി(സ) പറഞ്ഞു: \"നോമ്പും പകുതി നിസ്കാരവും.\" മറ്റൊരു നിവേദനം: ഞങ്ങൾ എവിടേക്കോ യാത്ര ചെയ്യുകയായിരുന്നു. അങ്ങനെ, റസൂൽ(സ) ഭക്ഷണം കഴിക്കുന്നവേളയിൽ ഞങ്ങൾ തിരുമേനി(സ)യെ സമീപിച്ചു. അപ്പോൾ, തിരുമേനി(സ) പറഞ്ഞു: \"വരൂ ഭക്ഷണം കഴിക്കൂ.\" ഞാൻ പറഞ്ഞു: ഞാൻ നോമ്പുകാരനാണ്. അപ്പോൾ റസൂൽ(സ) പറഞ്ഞു: \"നോമ്പിനെക്കുറിച്ച് നിങ്ങൾക്ക് ഞാൻ പറഞ്ഞുതരാം, അല്ലാഹു യാത്രക്കാരന് നോമ്പും പകുതി നിസ്കാരവും ഇളവുചെയ്തിരിക്കുന്നു.\" (ന)", "narrator_ml": "അബ്ദുല്ലാഹിബ്നു ശിഖ്ഖീർ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ قَالَ: كُنَّا نُسَافِرُ مَا شَاءَ اللَّهُ، فَأَتَيْنَا رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَهُوَ يَطْعَمُ، فَقَالَ: \"هَلُمَّ فَاطْعَمْ\". فَقُلْتُ: إِنِّي صَائِمٌ. فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"أُحَدِّثُكُمْ عَنِ الصِّيَامِ، إِنَّ اللَّهَ وَضَعَ عَنِ الْمُسَافِرِ الصَّوْمَ وَشَطْرَ الصَّلَاةِ\". (ن)", "malayalam": "മറ്റൊരു നിവേദനം: ഞങ്ങൾ എവിടേക്കോ യാത്ര ചെയ്യുകയായിരുന്നു. അങ്ങനെ, റസൂൽ(സ) ഭക്ഷണം കഴിക്കുന്നവേളയിൽ ഞങ്ങൾ തിരുമേനി(സ)യെ സമീപിച്ചു. അപ്പോൾ, തിരുമേനി(സ) പറഞ്ഞു: \"വരൂ ഭക്ഷണം കഴിക്കൂ.\" ഞാൻ പറഞ്ഞു: ഞാൻ നോമ്പുകാരനാണ്. അപ്പോൾ റസൂൽ(സ) പറഞ്ഞു: \"നോമ്പിനെക്കുറിച്ച് നിങ്ങൾക്ക് ഞാൻ പറഞ്ഞുതരാം, അല്ലാഹു യാത്രക്കാരന് നോമ്പും പകുതി നിസ്കാരവും ഇളവുചെയ്തിരിക്കുന്നു.\" (ന)"}], "bab_seq": 53, "page_start": 112}, {"hadith_no": 256, "arabic": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ خَرَجَ إِلَى مَكَّةَ فِي رَمَضَانَ فَصَامَ حَتَّى بَلَغَ الْكَدِيدَ، أَفْطَرَ، فَأَفْطَرَ النَّاسُ. (خ)", "malayalam": "ഇബ്നുഅബ്ബാസ്(റ): റസൂൽ(സ) റമളാനിൽ മക്കയിലേക്കു പുറപ്പെട്ടു. 'കദീദ്' എന്ന സ്ഥലം എത്തുന്നതുവരെ തിരുമേനി(സ) നോമ്പെടുത്തു. അവിടെയെത്തിയപ്പോൾ നോമ്പ് ഒഴിവാക്കി. അപ്പോൾ ജനങ്ങളും നോമ്പ് ഒഴിവാക്കി. (ബു)", "narrator_ml": "ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["خ"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 54, "page_start": 112}, {"hadith_no": 257, "arabic": "عَنْ عُبَيْدِ بْنِ جَبْرٍ قَالَ: كُنْتُ مَعَ أَبِي بَصْرَةَ الْغِفَارِيِّ رَضِيَ اللهُ عَنْهُ– صَاحِبِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ– فِي سَفِينَةٍ مِنَ الْفُسْطَاطِ فِي رَمَضَانَ، فَرُفِعَ، ثُمَّ قُرِّبَ غَدَاؤُهُ، فَلَمْ يُجَاوِزِ الْبُيُوتَ حَتَّى دَعَا بِالسُّفْرَةِ، قَالَ: اقْتَرِبْ، قُلْتُ: أَلَسْتَ تَرَى الْبُيُوتَ؟ قَالَ أَبُو بَصْرَةَ: أَتَرْغَبُ عَنْ سُنَّةِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ؟ فَأَكَلَ. (د)", "malayalam": "ഉബൈദുബ്നു ജബ്ർ(റ): ഞാൻ റസൂൽ(സ)യുടെ അനുചരൻ അബൂബസ്റതിൽ ഗിഫാരി(റ)യോടൊന്നിച്ച് ഒരു റമളാനിൽ ഫുസ്ഥാഥിൽനിന്നുള്ള ഒരു കപ്പലിലായിരുന്നു. കപ്പൽ യാത്രപുറപ്പെട്ടു, അപ്പോൾ ഭക്ഷണം കൊണ്ടുവരപ്പെട്ടു. വീടുകൾ വിട്ടുകടക്കുന്നതിനു (കാഴ്ചയിൽനിന്ന് മറയുന്നതിന്) മുമ്പുതന്നെ യാത്രാഭക്ഷണം കൊണ്ടുവരാൻ അദ്ദേഹം ആവശ്യപ്പെട്ടു. അദ്ദേഹം പറഞ്ഞു: താങ്കൾ അടുത്തിരിക്കൂ. ഞാൻ ചോദിച്ചു: താങ്കൾ വീടുകൾ കാണുന്നില്ലേ?. അപ്പോൾ അബൂബസ്റ(റ) പറഞ്ഞു: താങ്കൾ പ്രവാചകചര്യക്കു വിരുദ്ധമാണോ ആഗ്രഹിക്കുന്നത്? എന്നിട്ടദ്ദേഹം ഭക്ഷണം കഴിച്ചു. (ദ)", "narrator_ml": "ഉബൈദുബ്നു ജബ്ർ(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 54, "page_start": 112}, {"hadith_no": 258, "arabic": "عَنْ دِحْيَةَ بْنِ خَلِيفَةَ الْكَلْبِيِّ رَضِيَ اللهُ عَنْهُ: خَرَجَ مِنْ قَرْيَةٍ مِنْ دِمَشْقَ مَرَّةً إِلَى قَدْرِ قَرْيَةِ عُقْبَةَ مِنَ الْفُسْطَاطِ، وَذَلِكَ ثَلَاثَةُ أَمْيَالٍ، فِي رَمَضَانَ، ثُمَّ إِنَّهُ أَفْطَرَ وَأَفْطَرَ مَعَهُ نَاسٌ، وَكَرِهَ آخَرُونَ أَنْ يُفْطِرُوا، فَلَمَّا رَجَعَ إِلَى قَرْيَتِهِ قَالَ: وَاللَّهِ لَقَدْ رَأَيْتُ الْيَوْمَ أَمْرًا مَا كُنْتُ أَظُنُّ أَنِّي أَرَاهُ، إِنَّ قَوْمًا رَغِبُوا عَنْ هَدْيِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَأَصْحَابِهِ. يَقُولُ ذَلِكَ لِلَّذِينَ صَامُوا، ثُمَّ قَالَ عِنْدَ ذَلِكَ: اللَّهُمَّ اقْبِضْنِي إِلَيْكَ. (د)", "malayalam": "ദിഹ്യതുബിനു ഖലീഫതിൽകൽബി(റ): ഡമസ്കസിലെ ഒരു ഗ്രാമത്തിൽനിന്ന് ഫുസ്ത്വാതിലെ അഖബ ഗ്രാമത്തിന്റെ ദൂരപരിധിയിലേക്ക് റമളാനിൽ അദ്ദേഹം യാത്ര പുറപ്പെട്ടു. മൂന്നുമൈൽ ദൂരമായിരുന്നു അത്. അദ്ദേഹം നോമ്പ് ഒഴിവാക്കി. അദ്ദേഹത്തിന്റെ കൂടെ കുറച്ചുപേരും നോമ്പ് ഒഴിവാക്കി. എന്നാൽ മറ്റു ചിലർ നോമ്പ് ഒഴിവാക്കാൻ വിസമ്മതിച്ചു. തന്റെ ഗ്രാമത്തിലേക്കു മടങ്ങിയെത്തിയപ്പോൾ അദ്ദേഹം പറഞ്ഞു: അല്ലാഹുതന്നെ സത്യം, ഞാൻ കാണേണ്ടിവരുമെന്ന് ഒരിക്കലും നിനക്കാത്ത ഒന്നാണ് ഇന്നു ഞാൻ കണ്ടത്. കുറച്ചുപേർ, പ്രവാചകർ(സ)യുടെയും സ്വഹാബത്തിന്റെയും ചര്യയ്ക്കു വിരുദ്ധമായി ആഗ്രഹിക്കുന്നു. നോമ്പനുഷ്ഠിച്ചവരോടാണ് അദ്ദേഹം ഇങ്ങനെ പറഞ്ഞത്. എന്നിട്ടദ്ദേഹം പറഞ്ഞു: അല്ലാഹുവേ, എന്റെ റൂഹ് നിന്നിലേക്ക് എടുക്കേണമേ. (ദ)", "narrator_ml": "ദിഹ്യതുബിനു ഖലീഫതിൽകൽബി(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 54, "page_start": 113}, {"hadith_no": 259, "arabic": "عَنِ ابْنِ عُمَرَ رَضِيَ اللهُ عَنْهُمَا: كَانَ يَخْرُجُ إِلَى الْغَابَةِ، فَلَا يُفْطِرُ وَلَا يَقْصُرُ. (د)", "malayalam": "ഇബ്നുഉമർ(റ): അദ്ദേഹം കാട്ടിലേക്കു പുറപ്പെടാറുണ്ടായിരുന്നു. പക്ഷേ, അപ്പോഴൊന്നുമദ്ദേഹം നോമ്പ് ഒഴിവാക്കുകയോ നിസ്കാരം ഖസ്വ്റ് ആക്കുകയോ ചെയ്യുമായിരുന്നില്ല. (ദ)", "narrator_ml": "ഇബ്നുഉമർ(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 54, "page_start": 113}, {"hadith_no": 260, "arabic": "عَنِ ابْنِ عَبَّاسٍ قَالَ: خَرَجَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مِنَ الْمَدِينَةِ إِلَى مَكَّةَ حَتَّى بَلَغَ عُسْفَانَ، ثُمَّ دَعَا بِإِنَاءٍ فَرَفَعَهُ إِلَى فِيهِ لِيُرِيَهُ النَّاسَ، وَذَلِكَ فِي رَمَضَانَ، فَكَانَ ابْنُ عَبَّاسٍ يَقُولُ: قَدْ صَامَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَأَفْطَرَ، فَمَنْ شَاءَ صَامَ، وَمَنْ شَاءَ أَفْطَرَ. (ق,د,ن)", "malayalam": "ഇബ്നുഅബ്ബാസ്(റ): നബി(സ) മദീനയിൽ നിന്നും മക്കയിലേക്ക് പുറപ്പെട്ടു. 'ഉസ്ഫാനി'ലെത്തിയപ്പോൾ ഒരുപാത്രം വെള്ളംകൊണ്ടുവരാൻ പറയുകയും ജനങ്ങൾ കാൺകെ ഉയർത്തി അവിടത്തെ വായിലേക്കൊഴിക്കുകയും ചെയ്തു. ഇത് റമളാനിലായിരുന്നു. ഇബ്നുഅബ്ബാസ്(റ) പറയുമായിരുന്നു: നബി(സ) നോമ്പനുഷ്ഠിക്കുകയും ഒഴിവാക്കുകയും ചെയ്തിട്ടുണ്ട്. അതിനാൽ ഉദ്ദേശിക്കുന്നവർ നോമ്പനുഷ്ഠിക്കുകയും ഉദ്ദേശിക്കുന്നവർ ഒഴിവാക്കുകയും ചെയ്തു കൊള്ളട്ടെ. (ബു,മു,ദ,ന)", "narrator_ml": "ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["ق", "د", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 54, "page_start": 113}, {"hadith_no": 261, "arabic": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا: أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ خَرَجَ فِي رَمَضَانَ، فَصَامَ– وَفِي رِوَايَةٍ: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ صَامَ فِي السَّفَرِ – حَتَّى أَتَى قُدَيْدًا، ثُمَّ أُتِيَ– وَفِي رِوَايَةٍ: دَعَا– بِقَدَحٍ مِنْ لَبَنٍ فَشَرِبَ، وَأَفْطَرَ هُوَ وَأَصْحَابُهُ. وَفِي رِوَايَةٍ: صَامَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مِنَ الْمَدِينَةِ حَتَّى أَتَى قُدَيْدًا، ثُمَّ أَفْطَرَ حَتَّى أَتَى مَكَّةَ. (ن)", "malayalam": "ഇബ്നുഅബ്ബാസ്(റ): റസൂൽ(സ) ഒരു റമളാനിൽ യാത്ര പുറപ്പെടുകയും നോമ്പെടുക്കുകയും ചെയ്തു. മറ്റൊരു നിവേദനത്തിൽ: റസൂൽ(സ) യാത്രയിൽ നോമ്പെടുത്തു. അങ്ങനെ ഖുദൈദ് എന്ന സ്ഥലത്തെത്തി. അവിടെ എത്തിയപ്പോൾ ഒരു കോപ്പ പാൽ കൊണ്ടുവന്നുകൊടുത്തു. മറ്റൊരു നിവേദനം: തിരുമേനി(സ) ഒരു കോപ്പ പാൽ കൊണ്ടുവരാൻ ആവശ്യപ്പെട്ടു. അതു കുടിച്ചു. തിരുമേനി(സ)യും തന്റെ അനുചരന്മാരും നോമ്പ് ഒഴിവാക്കുകയും ചെയ്തു. മറ്റൊരു നിവേദനം: റസൂൽ(സ) മദീനയിൽനിന്നു ഖദീദ് എന്ന സ്ഥലത്ത് എത്തുന്നതുവരെ നോമ്പെടുക്കുകയും പിന്നെ അവിടെനിന്ന് മക്കയിലെത്തുന്നതുവരെ നോമ്പൊഴിവാക്കുകയും ചെയ്തു. (ന)", "narrator_ml": "ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ صَامَ فِي السَّفَرِ – حَتَّى أَتَى قُدَيْدًا، ثُمَّ أُتِيَ–", "malayalam": "മറ്റൊരു നിവേദനത്തിൽ: റസൂൽ(സ) യാത്രയിൽ നോമ്പെടുത്തു. അങ്ങനെ ഖുദൈദ് എന്ന സ്ഥലത്തെത്തി. അവിടെ എത്തിയപ്പോൾ ഒരു കോപ്പ പാൽ കൊണ്ടുവന്നുകൊടുത്തു."}, {"seq": 2, "arabic": "وَفِي رِوَايَةٍ: دَعَا– بِقَدَحٍ مِنْ لَبَنٍ فَشَرِبَ، وَأَفْطَرَ هُوَ وَأَصْحَابُهُ.", "malayalam": "മറ്റൊരു നിവേദനം: തിരുമേനി(സ) ഒരു കോപ്പ പാൽ കൊണ്ടുവരാൻ ആവശ്യപ്പെട്ടു. അതു കുടിച്ചു. തിരുമേനി(സ)യും തന്റെ അനുചരന്മാരും നോമ്പ് ഒഴിവാക്കുകയും ചെയ്തു."}, {"seq": 3, "arabic": "وَفِي رِوَايَةٍ: صَامَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مِنَ الْمَدِينَةِ حَتَّى أَتَى قُدَيْدًا، ثُمَّ أَفْطَرَ حَتَّى أَتَى مَكَّةَ. (ن)", "malayalam": "മറ്റൊരു നിവേദനം: റസൂൽ(സ) മദീനയിൽനിന്നു ഖദീദ് എന്ന സ്ഥലത്ത് എത്തുന്നതുവരെ നോമ്പെടുക്കുകയും പിന്നെ അവിടെനിന്ന് മക്കയിലെത്തുന്നതുവരെ നോമ്പൊഴിവാക്കുകയും ചെയ്തു. (ന)"}], "bab_seq": 54, "page_start": 113}, {"hadith_no": 262, "arabic": "عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ– رَجُلٌ مِنْ بَنِي عَبْدِ الْأَشْهَلِ– قَالَ: أَغَارَتْ عَلَيْنَا خَيْلُ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، فَأَتَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَهُوَ يَتَغَدَّى، فَقَالَ: \"ادْنُ فَكُلْ\". قُلْتُ: إِنِّي صَائِمٌ. قَالَ: \"اجْلِسْ أُحَدِّثْكَ عَنِ الصَّوْمِ. أَو: الصِّيَامِ. إِنَّ اللَّهَ عَزَّ وَجَلَّ وَضَعَ عَنِ الْمُسَافِرِ شَطْرَ الصَّلَاةِ، وَعَنِ الْمُسَافِرِ وَالْحَامِلِ وَالْمُرْضِعِ الصَّوْمَ. أَو: الصِّيَامَ\". وَاللَّهِ لَقَدْ قَالَهُمَا النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، كِلْتَاهُمَا أَوْ إِحْدَاهُمَا، فَيَا لَهْفَ نَفْسِي، فَهَلَّا كُنْتُ طَعِمْتُ مِنْ طَعَامِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. (د,ت,ن,جه)", "malayalam": "ബനുഅബ്ദിൽ അശ്ഹലിൽ പെട്ട അനസുബ്നു മാലിക്(റ): ഞങ്ങളുടെ മേൽ നബി(സ)യുടെ കുതിര ആക്രമണം നടത്തി. ഞാൻ നബി(സ)യുടെ അടുത്ത് ചെന്നു. അപ്പോൾ നബി(സ) ഭക്ഷണം കഴിച്ച് കൊണ്ടിരിക്കുകയായിരുന്നു. എന്നോട് റസൂൽ(സ) പറഞ്ഞു: \"അടുത്ത് വന്ന് ഭക്ഷിക്കൂ\" ഞാൻ പറഞ്ഞു: എനിക്ക് നോമ്പാണ്. നബി(സ) പറഞ്ഞു: \"താങ്കളിരിക്കൂ, ഞാൻ നോമ്പിനെക്കുറിച്ച് പറഞ്ഞു തരാം. നിശ്ചയം അല്ലാഹുതആല യാത്രക്കാരന് നിസ്കാരത്തിന്റെ പകുതിയും, യാത്രക്കാരൻ, ഗർഭിണി, മുലകൊടുക്കുന്ന സ്ത്രീ എന്നിവർക്ക് നോമ്പും ഇളവ് ചെയ്തിട്ടുണ്ട്.\" അദ്ദേഹം പറയുന്നു: അല്ലാഹുവാണെ, റസൂൽ(സ) രണ്ട് പേരെയും (ഗർഭണി, മുലയൂട്ടുന്നവൾ) ഒരുമിച്ചോ അല്ലെങ്കിൽ ഒരാളെ തനിച്ചോ ആണ് പറഞ്ഞത്. എന്റെ ദുഃഖമേ, നബി(സ)യുടെ ഭക്ഷണത്തിൽ നിന്ന് ഭക്ഷിച്ചിരുന്നെങ്കിലെന്ന് ഇപ്പോൾ എനിക്ക് തോന്നുന്നു. (ദ,തു,ന,ജ)", "narrator_ml": "ബനുഅബ്ദിൽ അശ്ഹലിൽ പെട്ട അനസുബ്നു മാലിക്(റ)", "source_codes_ar": ["د", "ت", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 55, "page_start": 114}, {"hadith_no": 263, "arabic": "عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ قَالَ: رَخَّصَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لِلْحُبْلَى الَّتِي تَخَافُ عَلَى نَفْسِهَا أَنْ تُفْطِرَ، وَلِلْمُرْضِعِ الَّتِي تَخَافُ عَلَى وَلَدِهَا. (جه)", "malayalam": "അനസുബ്നു മാലിക്(റ): ശരീരത്തിന് അനാരോഗ്യം വരുമെന്നു ഭയപ്പെടുന്ന ഗർഭിണിക്കും കുഞ്ഞിന്റെ അനാരോഗ്യം ഭയക്കുന്ന മുലയൂട്ടുന്ന സ്ത്രീക്കും നോമ്പൊഴിവാക്കാൻ അല്ലാഹുവിന്റെ റസൂൽ(സ) ഇളവു നൽകിയിരിക്കുന്നു.¹ (ജ)", "narrator_ml": "അനസുബ്നു മാലിക്(റ)", "source_codes_ar": ["جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": "¹ നോമ്പനുഷ്ഠിക്കാൻ സാധിക്കാത്തവൻ അതൊഴിവാക്കിയാൽ അതാണുത്തമം എന്നാണ് അവർ അഭിപ്രായപ്പെട്ടിരുന്നത്.", "variants": [], "bab_seq": 55, "page_start": 114}, {"hadith_no": 264, "arabic": "عَنْ مُعَاذَةَ الْعَدَوِيَّةِ: أَنَّ امْرَأَةً سَأَلَتْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا: أَتَقْضِي الْحَائِضُ الصَّلَاةَ إِذَا طَهُرَتْ؟ قَالَتْ: أَحَرُورِيَّةٌ أَنْتِ؟ كُنَّا نَحِيضُ عَلَى عَهْدِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ ثُمَّ نَطْهُرُ، فَيَأْمُرُنَا بِقَضَاءِ الصَّوْمِ وَلَا يَأْمُرُنَا بِقَضَاءِ الصَّلَاةِ. (ن)", "malayalam": "മുആദതുൽ അദവിയ്യ(റ): ഒരു സ്ത്രീ ആഇശ(റ)യോട് ചോദിച്ചു: ആർത്തവകാരി ശുദ്ധിയായാൽ നിസ്കാരം ഖളാഅ് വീട്ടേണ്ടതുണ്ടോ? ആഇശ(റ) ചോദിച്ചു: നീ ഖവാരിജി² വാദക്കാരിയാണോ? റസൂൽ(സ)യുടെ കാലത്ത് ഞങ്ങൾ ആർത്തവത്തിൽനിന്നു വിമുക്തരായാൽ നോമ്പു ഖളാഅ് വീട്ടാൻ റസൂൽ(സ) കൽപ്പിക്കുമായിരുന്നു. എന്നാൽ, നിസ്കാരം ഖളാഅ് വീട്ടാൻ കൽപ്പിക്കാറില്ല. (ന)", "narrator_ml": "മുആദതുൽ അദവിയ്യ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": "² ഹൈളിന്റെ കാര്യത്തിൽ കർക്കശ സ്വഭാവക്കാരായിരുന്നു ഖവാരിജുകൾ.", "variants": [], "bab_seq": 56, "page_start": 114}, {"hadith_no": 265, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: إِنْ كَانَ لَيَكُونُ عَلَيَّ الصِّيَامُ مِنْ رَمَضَانَ، فَمَا أَقْضِيهِ حَتَّى يَجِيءَ شَعْبَانُ. (ن)", "malayalam": "ആഇശ (റ): റമളാനിലെ വല്ല നോമ്പും ഖളാഅ് വീട്ടാനുണ്ടെങ്കിൽ അടുത്ത ശഅ്ബാൻ വരെ ഞാൻ ആ നോമ്പു ഖളാഅ് വീട്ടാറുണ്ടായിരുന്നില്ല. (ന)", "narrator_ml": "ആഇശ (റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 56, "page_start": 115}, {"hadith_no": 266, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"مَنْ نَزَلَ عَلَى قَوْمٍ فَلَا يَصُومَنَّ تَطَوُّعًا إِلَّا بِإِذْنِهِمْ\". مُنْكَرٌ. (ت,جه)", "malayalam": "ആഇശ(റ): റസൂൽ(സ) പറഞ്ഞു: \"ആരെങ്കിലും ഒരു സമൂഹത്തിനടുത്ത് അതിഥിയായി ചെന്നാൽ അവരുടെ സമ്മതപ്രകാരമല്ലാതെ സുന്നത്ത് നോമ്പ് അനുഷ്ഠിക്കരുത്.\" (തു,ജ)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["ت", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 57, "page_start": 115}, {"hadith_no": 267, "arabic": "عَنْ قَزَعَةَ قَالَ: أَتَيْتُ أَبَا سَعِيدٍ الْخُدْرِيَّ رَضِيَ اللهُ عَنْهُ وَهُوَ يُفْتِي النَّاسَ، وَهُمْ مُكِبُّونَ عَلَيْهِ، فَانْتَظَرْتُ خَلْوَتَهُ، فَلَمَّا خَلَا سَأَلْتُهُ عَنْ صِيَامِ رَمَضَانَ فِي السَّفَرِ؟ فَقَالَ: خَرَجْنَا مَعَ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي رَمَضَانَ عَامَ الْفَتْحِ، فَكَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ وَنَصُومُ، حَتَّى بَلَغَ مَنْزِلًا مِنَ الْمَنَازِلِ، فَقَالَ: \"إِنَّكُمْ قَدْ دَنَوْتُمْ مِنْ عَدُوِّكُمْ، وَالْفِطْرُ أَقْوَى لَكُمْ\". فَأَصْبَحْنَا: مِنَّا الصَّائِمُ وَمِنَّا الْمُفْطِرُ، قَالَ: ثُمَّ سِرْنَا فَنَزَلْنَا مَنْزِلًا، فَقَالَ: \"إِنَّكُمْ تُصَبِّحُونَ عَدُوَّكُمْ، وَالْفِطْرُ أَقْوَى لَكُمْ فَأَفْطِرُوا\". فَكَانَتْ عَزِيمَةً مِنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، قَالَ أَبُو سَعِيدٍ: ثُمَّ لَقَدْ رَأَيْتُنِي أَصُومُ مَعَ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَبْلَ ذَلِكَ وَبَعْدَ ذَلِكَ. (م,د,ت,ن)", "malayalam": "ഖസഅത്ത്(റ): ഞാൻ അബൂസഈദിൽ ഖുദ്രീ(റ)വിന്റെ അടുത്ത് ചെന്നപ്പോൾ അദ്ദേഹം ജനങ്ങൾക്ക് ഫത്വ നൽകുകയായിരുന്നു. ജനങ്ങൾ അദ്ദേഹത്തെ പൊതിഞ്ഞ് നിൽക്കുകയായിരുന്നു. അതുകൊണ്ട് അദ്ദേഹത്തെ ഒഴിഞ്ഞുകിട്ടാനായി ഞാൻ കാത്തിരുന്നു. ആളൊഴിഞ്ഞപ്പോൾ റമളാനിലെ യാത്ര വേളയിൽ നോമ്പനുഷ്ഠിക്കുന്നതിനെ കുറിച്ച് ഞാനദ്ദേഹത്തോട് ചോദിച്ചു. അപ്പോൾ അദ്ദേഹം പറഞ്ഞു: മക്കാവിജയവർഷം റമളാനിൽ ഞങ്ങൾ നബി(സ)യോടൊപ്പം യാത്ര ചെയ്യവെ നബി(സ)യും ഞങ്ങളും നോമ്പനുഷ്ഠിച്ചിരുന്നു. ആ വേളയിൽ ഇറങ്ങേണ്ട ഒരു സ്ഥലത്തെത്തിയപ്പോൾ നബി(സ) പറഞ്ഞു: \"നിങ്ങൾ നിങ്ങളുടെ ശത്രുവോട് അടുത്തിരിക്കുന്നതിനാൽ, നോമ്പൊഴിവാക്കലായിരിക്കും നിങ്ങൾക്ക് കൂടുതൽ ശക്തിപകരുക.\" ഞങ്ങളിൽ ചിലർ നോമ്പൊഴിവാക്കുകയും, ചിലർ അനുഷ്ഠിക്കുകയും ചെയ്തു. ഞങ്ങൾ യാത്ര തുടരുകയും, മറ്റൊരു സ്ഥലത്തിറങ്ങുകയും ചെയ്തപ്പോൾ നബി(സ) പറഞ്ഞു: \"നിശ്ചയം നിങ്ങൾ നിങ്ങളുടെ ശത്രുവോടടുത്തിരിക്കുന്നതിനാൽ, നോമ്പൊഴിവാക്കലായിരിക്കും നിങ്ങൾക്ക് കൂടുതൽ ശക്തിപകരുക. അതുകൊണ്ട് നിങ്ങൾ നോമ്പൊഴിവാക്കുക.\" അത് റസൂൽ(സ)യുടെ ഉറച്ച തീരുമാനമായിരുന്നു. അബൂസഈദ്(റ) പറയുന്നു: നബി(സ)യോടൊപ്പം അതിനു മുമ്പും ശേഷവും ഞാൻ നോമ്പനുഷ്ഠിച്ചിട്ടുണ്ട്. (മു,ദ,തു,ന)", "narrator_ml": "ഖസഅത്ത്(റ)", "source_codes_ar": ["م", "د", "ت", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 58, "page_start": 115}, {"hadith_no": 268, "arabic": "عَنْ عُمَرَ بْنِ الْخَطَّابِ رَضِيَ اللهُ عَنْهُ قَالَ: غَزَوْنَا مَعَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي رَمَضَانَ غَزْوَتَيْنِ: يَوْمَ بَدْرٍ وَالْفَتْحِ، فَأَفْطَرْنَا فِيهِمَا. (ت)", "malayalam": "ഉമറുബ്നുൽ ഖത്താബ്(റ): റമളാനിൽ റസൂൽ(സ)ക്കൊപ്പം ഞങ്ങൾ രണ്ട് യുദ്ധത്തിൽ പങ്കെടുത്തു; ബദ്ർ യുദ്ധത്തിലും മക്കാ വിജയദിനത്തിലും. അവ രണ്ടിലും ഞങ്ങൾ നോമ്പെടുത്തിരുന്നില്ല. (തു)", "narrator_ml": "ഉമറുബ്നുൽ ഖത്താബ്(റ)", "source_codes_ar": ["ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 58, "page_start": 116}, {"hadith_no": 269, "arabic": "عَنْ عَامِرِ بْنِ مَسْعُودٍ رَضِيَ اللهُ عَنْهُمَا، عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"الْغَنِيمَةُ الْبَارِدَةُ الصَّوْمُ فِي الشِّتَاءِ\". مُرْسَلٌ. (ت)", "malayalam": "ആമിറുബ്നുമസ്ഊദ്(റ): നബി(സ) പറഞ്ഞു: \"തണുത്ത (പ്രയാസരഹിതമായ) യുദ്ധമുതൽ ശൈത്യകാലത്തെ നോമ്പാകുന്നു.\" (തു)", "narrator_ml": "ആമിറുബ്നുമസ്ഊദ്(റ)", "source_codes_ar": ["ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 59, "page_start": 116}, {"hadith_no": 270, "arabic": "عَنْ أَنَسٍ رَضِيَ اللهُ عَنْهُ قَالَ: دَخَلَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَلَى أُمِّ سُلَيْمٍ فَأَتَتْهُ بِتَمْرٍ وَسَمْنٍ، قَالَ: \"أَعِيدُوا سَمْنَكُمْ فِي سِقَائِهِ وَتَمْرَكُمْ فِي وِعَائِهِ فَإِنِّي صَائِمٌ\". ثُمَّ قَامَ إِلَى نَاحِيَةٍ مِنَ الْبَيْتِ فَصَلَّى غَيْرَ الْمَكْتُوبَةِ فَدَعَا لِأُمِّ سُلَيْمٍ وَأَهْلِ بَيْتِهَا، فَقَالَتْ أُمُّ سُلَيْمٍ: يَا رَسُولَ اللَّهِ إِنَّ لِي خُوَيْصَّةً، قَالَ: \"مَا هِيَ؟\" قَالَتْ: خَادِمُكَ أَنَسٌ، فَمَا تَرَكَ خَيْرَ آخِرَةٍ وَلَا دُنْيَا إِلَّا دَعَا لِي بِهِ: \"اللَّهُمَّ ارْزُقْهُ مَالًا وَوَلَدًا وَبَارِكْ لَهُ فِيهِ\". فَإِنِّي لَمِنْ أَكْثَرِ الْأَنْصَارِ مَالًا. وَحَدَّثَتْنِي ابْنَتِي أُمَيْنَةُ أَنَّهُ دُفِنَ لِصُلْبِي مَقْدَمَ حَجَّاجٍ الْبَصْرَةَ بِضْعٌ وَعِشْرُونَ وَمِائَةٌ. (خ)", "malayalam": "അനസ്(റ): നബി(സ) ഉമ്മുസുലൈം(റ)യുടെ അടുത്ത് ചെന്നു. ഉമ്മുസുലൈം(റ) അൽപം കാരക്കയും നെയ്യും റസൂൽ(സ)ക്ക് കൊണ്ടുവന്ന് കൊടുത്തു. റസൂൽ(സ) പറഞ്ഞു: \"നിങ്ങൾ കൊണ്ടുവന്ന നെയ്യും കാരക്കയും അവയുടെ പാത്രങ്ങളിൽതന്നെ വെക്കുക. കാരണം, ഞാൻ നോമ്പുകാരനാണ്.\" പിന്നീട് റസൂൽ(സ) മുറിയുടെ ഒരു ഭാഗത്ത് നിന്ന് സുന്നത്ത് നിസ്കാരം നിർവ്വഹിച്ചു. ശേഷം ഉമ്മുസുലൈം(റ)ക്കും കുടുംബത്തിനും വേണ്ടി പ്രാർത്ഥിച്ചു. അപ്പോൾ ഉമ്മുസുലൈം(റ) പറഞ്ഞു: അല്ലാഹുവിന്റെ റസൂലേ, എനിക്കൊരു കുഞ്ഞുമോനുണ്ട്. റസൂൽ(സ) ചോദിച്ചു: \"ആരാണത്?\" ഉമ്മുസുലൈം(റ) പറഞ്ഞു: അങ്ങയുടെ സേവകൻ അനസ്. ഭൗതികവും പാരത്രികവുമായ എല്ലാ ഗുണങ്ങളെക്കൊണ്ടും റസൂൽ(സ) എനിക്കുവേണ്ടി പ്രാർത്ഥിച്ചു: \"അല്ലാഹുവേ, അനസിനു നീ സമ്പത്തും സന്താനവും നൽകേണമേ! അവയിൽ ബറകതും നൽകേണമേ!\" അക്കാരണത്താൽ ഞാൻ അൻസ്വാരികളിൽ ഏറ്റവും വലിയ സമ്പന്നരിൽപ്പെട്ടവനായി. ഹജ്ജാജ് ബസ്വറയിലെത്തിയപ്പോഴേക്കും എന്റെ സന്താന പരമ്പരയിൽ പെട്ട നൂറ്റിഇരുപതിലധികം പേർ മരിച്ചുപോയിരുന്നെന്ന് എന്റെ മകൾ ഉമൈന എന്നോടു പറഞ്ഞു. (ബു)", "narrator_ml": "അനസ്(റ)", "source_codes_ar": ["خ"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 60, "page_start": 116}, {"hadith_no": 271, "arabic": "عَنِ الرُّبَيِّعِ بِنْتِ مُعَوِّذٍ رَضِيَ اللهُ عَنْهَا قَالَتْ: أَرْسَلَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ غَدَاةَ عَاشُورَاءَ إِلَى قُرَى الْأَنْصَارِ: \"مَنْ أَصْبَحَ مُفْطِرًا فَلْيُتِمَّ بَقِيَّةَ يَوْمِهِ، وَمَنْ أَصْبَحَ صَائِمًا فَلْيَصُمْ\". قَالَتْ: فَكُنَّا نَصُومُهُ بَعْدُ وَنُصَوِّمُ صِبْيَانَنَا وَنَجْعَلُ لَهُمُ اللُّعْبَةَ مِنَ الْعِهْنِ فَإِذَا بَكَى أَحَدُهُمْ عَلَى الطَّعَامِ أَعْطَيْنَاهُ ذَلِكَ حَتَّى يَكُونَ عِنْدَ الْإِفْطَارِ. (خ)", "malayalam": "മുഅവ്വിദിന്റെ മകൾ റുബയ്യിഅ്(റ): ആശൂറാഇന്റെ പ്രഭാതത്തിൽ അൻസ്വാരീ ഗ്രാമങ്ങളിലേക്ക് റസൂൽ(സ) ഇപ്രകാരം സന്ദേശമയച്ചു: \"നോമ്പില്ലാത്തവൻ നോമ്പുകാരനായി ദിവസം പൂർത്തിയാക്കട്ടെ. നോമ്പുകാരനായി വല്ലവനും പ്രഭാതത്തിൽ എഴുന്നേറ്റാൽ അവൻ ആ നില തുടർന്നുപോവുകയും ചെയ്യട്ടെ.\" അതിനു ശേഷം ഞങ്ങൾ ആശൂറാ നോമ്പ് അനുഷ്ഠിക്കുകയും ഞങ്ങളുടെ കുട്ടികളെക്കൊണ്ട് അനുഷ്ഠിപ്പിക്കുകയും ചെയ്യാറുണ്ടായിരുന്നു. അവർക്കു രോമം കൊണ്ട് കളിപ്പാട്ടങ്ങളുണ്ടാക്കിക്കൊടുക്കും. വല്ല കുട്ടിയും ഭക്ഷണത്തിന് കരഞ്ഞാൽ നോമ്പു തുറക്കാൻ സമയമാകും വരെ കളിപ്പാട്ടങ്ങൾ കൊടുത്ത് ഞങ്ങളവരെ കളിപ്പിക്കും. (ബു)", "narrator_ml": "മുഅവ്വിദിന്റെ മകൾ റുബയ്യിഅ്(റ)", "source_codes_ar": ["خ"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 61, "page_start": 117}, {"hadith_no": 272, "arabic": "عَنْ أَبِي سَعِيدٍ رَضِيَ اللهُ عَنْهُ قَالَ: جَاءَتِ امْرَأَةٌ إِلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَنَحْنُ عِنْدَهُ فَقَالَتْ: يَا رَسُولَ اللَّهِ، إِنَّ زَوْجِي صَفْوَانَ بْنَ الْمُعَطَّلِ يَضْرِبُنِي إِذَا صَلَّيْتُ وَيُفَطِّرُنِي إِذَا صُمْتُ، وَلَا يُصَلِّي صَلَاةَ الْفَجْرِ حَتَّى تَطْلُعَ الشَّمْسُ؟ قَالَ: وَصَفْوَانُ عِنْدَهُ، قَالَ، فَسَأَلَهُ عَمَّا قَالَتْ: فَقَالَ: يَا رَسُولَ اللَّهِ، أَمَّا قَوْلُهَا: يَضْرِبُنِي إِذَا صَلَّيْتُ، فَإِنَّهَا تَقْرَأُ بِسُورَتَيْنِ وَقَدْ نَهَيْتُهَا. قَالَ: فَقَالَ: \"لَوْ كَانَتْ سُورَةً وَاحِدَةً لَكَفَتِ النَّاسَ\". وَأَمَّا قَوْلُهَا: يُفَطِّرُنِي، فَإِنَّهَا تَنْطَلِقُ فَتَصُومُ وَأَنَا رَجُلٌ شَابٌّ فَلَا أَصْبِرُ. فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَوْمَئِذٍ: \"لَا تَصُومُ امْرَأَةٌ إِلَّا بِإِذْنِ زَوْجِهَا\". وَأَمَّا قَوْلُهَا: إِنِّي لَا أُصَلِّي حَتَّى تَطْلُعَ الشَّمْسُ، فَإِنَّا أَهْلُ بَيْتٍ قَدْ عُرِفَ لَنَا ذَاكَ، لَا نَكَادُ نَسْتَيْقِظُ حَتَّى تَطْلُعَ الشَّمْسُ. قَالَ: \"فَإِذَا اسْتَيْقَظْتَ فَصَلِّ\". (د)", "malayalam": "അബൂസഈദ്(റ): ഒരു സ്ത്രീ പ്രവാചകസന്നിധിയിലെത്തി. ഞങ്ങളും അവിടെയുണ്ടായിരുന്നു. സ്ത്രീ ചോദിച്ചു: അല്ലാഹുവിന്റെ റസൂലേ, എന്റെ ഭർത്താവ് സ്വഫ്വാനുബ്നുൽ മുഅഥൽ(റ) ഞാൻ നിസ്കരിച്ചാൽ എന്നെ അടിക്കുന്നു. ഞാൻ നോമ്പനുഷ്ഠിച്ചാൽ എന്നെ നോമ്പു മുറിപ്പിക്കുന്നു. സൂര്യനുദിക്കുംവരെ അദ്ദേഹം സുബ്ഹിനിസ്കാരം നിർവ്വഹിക്കാറുമില്ല. നിവേദകൻ പറയുന്നു: സ്വഫ്വാൻ പ്രവാചകരുടെ സമീപമുണ്ട്. സ്ത്രീയുടെ പരാതിയെക്കുറിച്ച് സ്വഫ്വാൻ(റ)വിനോടു റസൂൽ(സ) അന്വേഷിച്ചു. അപ്പോൾ അദ്ദേഹം പറഞ്ഞു: അല്ലാഹുവിന്റെ റസൂലേ, നിസ്കാരം നിർവ്വഹിച്ചാൽ ഞാൻ അടിക്കാൻ കാരണം, അവൾ നിസ്കാരത്തിൽ രണ്ടു സൂറത് ഓതുന്നതിനാലാണ്. അങ്ങനെ ഓതുന്നത് ഞാൻ വിലക്കിയതാണ്. അപ്പോൾ റസൂൽ(സ) പറഞ്ഞു: \"ഒരു സൂറത് തന്നെ ജനങ്ങൾക്കു ധാരാളമാണ്.\" അവളുടെ നോമ്പു മുറിപ്പിക്കുന്നുവെന്ന് അവൾ പറയാൻ കാരണമിതാണ്; അവൾ പോയി നോമ്പു പിടിക്കുന്നു, ഞാനൊരു യുവാവല്ലേ. എനിക്ക് ക്ഷമിക്കാൻ കഴിയുന്നില്ല. തദവസരത്തിൽ റസൂൽ(സ) പറഞ്ഞു: \"ഒരു സ്ത്രീയും ഭർതൃസമ്മതമില്ലാതെ നോമ്പനുഷ്ഠിക്കരുത്.\" സൂര്യനുദിക്കുവോളം ഞാൻ സുബ്ഹിനിസ്കാരം നിർവ്വഹിക്കില്ല എന്ന് പറഞ്ഞല്ലോ, അത് ഞങ്ങളുടെ പതിവ് അങ്ങനെയാണ്. സൂര്യനുദിക്കും വരെ ഞങ്ങൾ എഴുന്നേൽക്കാറില്ല. റസൂൽ(സ) പറഞ്ഞു: \"എങ്കിൽ നീ ഉറക്കിൽനിന്നെണീറ്റാൽ നിസ്കരിക്കുക.\" (ദ)", "narrator_ml": "അബൂസഈദ്(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 62, "page_start": 117}, {"hadith_no": 273, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"لَا تَصُومُ الْمَرْأَةُ وَبَعْلُهَا شَاهِدٌ إِلَّا بِإِذْنِهِ، غَيْرَ رَمَضَانَ. وَلَا تَأْذَنُ فِي بَيْتِهِ وَهُوَ شَاهِدٌ إِلَّا بِإِذْنِهِ\". (ق,د,ت)", "malayalam": "അബൂഹുറൈറ(റ): റസൂൽ(സ) പറഞ്ഞു: \"ഭർത്താവ് സ്ഥലത്തുണ്ടായിരിക്കെ ഒരു പെണ്ണും, റമളാൻ മാസത്തിലല്ലാതെ അവന്റെ സമ്മതമില്ലാതെ നോമ്പനുഷ്ഠിക്കരുത്. അവനുണ്ടായിരിക്കേ അവന്റെ സമ്മതപ്രകാരമല്ലാതെ വീട്ടിലേക്ക് ഒരാൾക്കും പ്രവേശനാനുവാദം നൽകുകയുമരുത്.\" (ബു,മു,ദ,തു)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["ق", "د", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 62, "page_start": 118}, {"hadith_no": 274, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ: أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"مَنْ لَمْ يَدَعْ قَوْلَ الزُّورِ وَالْعَمَلَ بِهِ فَلَيْسَ لِلَّهِ حَاجَةٌ بِأَنْ يَدَعَ طَعَامَهُ وَشَرَابَهُ\". حَسَنٌ صَحِيحٌ. (خ,د,ت,ن,جه)", "malayalam": "അബൂഹുറൈറ(റ): നബി(സ) പറഞ്ഞു: \"അനാവശ്യവാക്കുകളും അനാവശ്യ പ്രവൃത്തികളും ഒഴിവാക്കാത്ത നോമ്പുകാരൻ അന്ന-പാനീയങ്ങൾ ഒഴിവാക്കുന്നതിൽ അല്ലാഹുവിന് യാതൊരു താൽപര്യവുമില്ല.\" (ബു,ദ,തു,ന,ജ)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["خ", "د", "ت", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 63, "page_start": 118}, {"hadith_no": 275, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"رُبَّ صَائِمٍ لَيْسَ لَهُ مِنْ صِيَامِهِ إِلَّا الْجُوعُ، وَرُبَّ قَائِمٍ لَيْسَ لَهُ مِنْ قِيَامِهِ إِلَّا السَّهَرُ\". [ز: في إسناده ضعيف] (جه)", "malayalam": "അബൂഹുറൈറ(റ): റസൂൽ(സ) പറഞ്ഞു: \"എത്ര നോമ്പുകാരുണ്ട്! അവരുടെ നോമ്പ് കൊണ്ട് അവർക്ക് വിശപ്പല്ലാതെ മറ്റൊന്നും തന്നെയില്ല. എത്ര നിസ്കാരക്കാരുണ്ട്! അവരുടെ രാത്രി നിസ്കാരം മൂലം അവർ ഉറക്കൊഴിച്ചതല്ലാതെ ഒരു ഫലവുമില്ല.\" (പരമ്പരയിൽ ദുർബലനുണ്ട്.) (ജ)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["جه"], "grading_note_ml": "പരമ്പരയിൽ ദുർബലനുണ്ട്.", "grading_note_ar": "ز: في إسناده ضعيف", "explanation_ml": null, "variants": [], "bab_seq": 63, "page_start": 118}, {"hadith_no": 276, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"إِذَا كَانَ يَوْمُ صَوْمِ أَحَدِكُمْ فَلَا يَرْفُثْ وَلَا يَجْهَلْ، وَإِنْ جَهِلَ عَلَيْهِ أَحَدٌ فَلْيَقُلْ: إِنِّي امْرُؤٌ صَائِمٌ\". (جه)", "malayalam": "അബൂഹുറൈറ(റ): റസൂൽ(സ) പറഞ്ഞു: \"നോമ്പുദിനത്തിൽ നിങ്ങളിലാരും തെറ്റായ പ്രവൃത്തികൾ ചെയ്യുകയോ അനാവശ്യ വാക്കുകൾ പറയുകയോ അരുത്. ഇനി വല്ലവനും അവനോട് അനാവശ്യം പറഞ്ഞാൽ ഞാൻ നോമ്പനുഷ്ഠിച്ച മനുഷ്യനാണെന്ന് പറഞ്ഞു കൊള്ളട്ടെ.\" (ജ)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 63, "page_start": 118}, {"hadith_no": 277, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: بَيْنَمَا نَحْنُ جُلُوسٌ عِنْدَ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِذْ جَاءَهُ رَجُلٌ فَقَالَ: يَا رَسُولَ اللَّهِ هَلَكْتُ، قَالَ: \"مَا لَكَ؟\". قَالَ: وَقَعْتُ عَلَى امْرَأَتِي فِي رَمَضَانَ وَأَنَا صَائِمٌ، فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"هَلْ تَجِدُ رَقَبَةً تَعْتِقُهَا؟\". قَالَ: لَا، قَالَ: \"فَهَلْ تَسْتَطِيعُ أَنْ تَصُومَ شَهْرَيْنِ مُتَتَابِعَيْنِ؟\". قَالَ: لَا، قَالَ: \"فَهَلْ تَجِدُ إِطْعَامَ سِتِّينَ مِسْكِينًا؟\". قَالَ: لَا، قَالَ: فَمَكَثَ عِنْدَ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَبَيْنَا نَحْنُ عَلي ذَلِكَ أُتِيَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِعَرَقٍ فِيهِ تَمْرٌ، وَالْعَرَقُ: الْمِكْتَلُ، قَالَ: \"أَيْنَ السَّائِلُ؟\". فَقَالَ: أَنَا، قَالَ: \"خُذْ هَذَا فَتَصَدَّقْ بِهِ\". فَقَالَ لَهُ الرَّجُلُ: أَعَلَي أَفْقَرَ مِنِّي يَا رَسُولَ اللَّهِ؟ فَوَاللهِ مَا بَيْنَ لَابَتَيْهَا، يُرِيدُ الْحَرَّتَيْنِ، أَهْلُ بَيْتٍ أَفْقَرُ مِنْ أَهْلِ بَيْتِي، فَضَحِكَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ حَتَّى بَدَتْ أَنْيَابُهُ، ثُمَّ قَالَ: \"أَطْعِمْهُ أَهْلَكَ\". (ق,د,ت)", "malayalam": "അബൂഹുറൈറ(റ): ഒരിക്കൽ ഞങ്ങൾ റസൂൽ(സ)യുടെ കൂടെ ഇരിക്കുകയായിരുന്നു. അപ്പോൾ ഒരു മനുഷ്യൻ നബി(സ)യുടെ അടുക്കൽ വന്ന് പറഞ്ഞു: അല്ലാഹുവിന്റെ റസൂലേ, ഞാൻ നശിച്ചു. തിരുമേനി(സ) ചോദിച്ചു: \"നിനക്കെന്തുപറ്റി?\" അദ്ദേഹം പറഞ്ഞു: ഞാൻ റമളാനിൽ (പകലിൽ) എന്റെ ഭാര്യയുമായി ബന്ധപ്പെട്ടു. തിരുമേനി(സ) ചോദിച്ചു: \"നിനക്ക് ഒരു അടിമയെ മോചിപ്പിക്കാൻ സാധിക്കുമോ?\" അദ്ദേഹം പറഞ്ഞു: ഇല്ല. തിരുമേനി(സ) ചോദിച്ചു: \"തുടർച്ചയായി രണ്ടുമാസം നോമ്പ് അനുഷ്ഠിക്കുവാൻ നിനക്ക് സാധിക്കുമോ?\" അദ്ദേഹം പറഞ്ഞു: ഇല്ല. തിരുമേനി(സ) ചോദിച്ചു: \"അറുപത് ദരിദ്രന്മാർക്ക് ആഹാരം കൊടുക്കുവാൻ നിനക്ക് സാധിക്കുമോ?\" അദ്ദേഹം പറഞ്ഞു: ഇല്ല. എന്നിട്ട് നിശബ്ദനായി പ്രവാചകരുടെ സമീപം നിന്നു. ഈ സമയം ഒരു കുട്ട കാരക്ക അവിടത്തെ സന്നിധിയിൽ കൊണ്ടുവരപ്പെട്ടു. \"ആ ചോദ്യക്കാരൻ എവിടെ?\" റസൂൽ(സ) അന്വേഷിച്ചു. ഞാൻ തന്നെ, ആഗതൻ പറഞ്ഞു. റസൂൽ(സ) പറഞ്ഞു: \"നീ ഇതു കൊണ്ടുപോയി ദാനം ചെയ്യുക.\" ആഗതൻ പ്രവാചകർ(സ)യോട് ചോദിച്ചു: എന്നെക്കാൾ ദരിദ്രനായവന്നാണോ നൽകേണ്ടത്, പ്രവാചകരേ? അല്ലാഹുവാണ! ഈ മദീനയുടെ കറുത്ത രണ്ട് കൽപ്രദേശങ്ങൾക്കിടയിൽ (അതിർത്തിക്കുള്ളിൽ) ഞങ്ങളേക്കാൾ ദരിദ്രരായ ഒരു വീട്ടുകാരുമില്ല. റസൂൽ(സ) ഇതുകേട്ട് തന്റെ അണപ്പല്ലുകൾ വെളിവാകുംവിധം ചിരിക്കുകയും തുടർന്ന്, \"നീ ഇതു കൊണ്ടുപോയി നിന്റെ വീട്ടുകാർക്കുതന്നെ കൊടുക്കുക\" എന്ന് പറയുകയും ചെയ്തു. (ബു,മു,ദ,തു)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["ق", "د", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 64, "page_start": 118}, {"hadith_no": 278, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: أَتَى رَجُلٌ إِلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي الْمَسْجِدِ فِي رَمَضَانَ، فَقَالَ: يَا رَسُولَ اللَّهِ، احْتَرَقْتُ، فَسَأَلَهُ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَا شَأْنُهُ؟ قَالَ: أَصَبْتُ أَهْلِي، قَالَ: \"تَصَدَّقْ\". قَالَ: وَاللَّهِ مَا لِي شَيْءٌ، وَلَا أَقْدِرُ عَلَيْهِ. قَالَ: \"اجْلِسْ\". فَجَلَسَ، فَبَيْنَمَا هُوَ عَلَى ذَلِكَ أَقْبَلَ رَجُلٌ يَسُوقُ حِمَارًا عَلَيْهِ طَعَامٌ، فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"أَيْنَ الْمُحْتَرِقُ آنِفًا\". فَقَامَ الرَّجُلُ، فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"تَصَدَّقْ بِهَذَا\". فَقَالَ: يَا رَسُولَ اللَّهِ، أَعَلَى غَيْرِنَا؟ فَوَاللَّهِ إِنَّا لَجِيَاعٌ، مَا لَنَا شَيْءٌ. قَالَ: \"كُلُوهُ\". وَفِي رِوَايَةٍ: فَأُتِيَ بِعَرَقٍ فِيهِ عِشْرُونَ صَاعًا. وَفِي رِوَايَةٍ: عَنِ الزُّهْرِيِّ، بِهَذَا الْحَدِيثِ بِمَعْنَاهُ، زَادَ: وَإِنَّمَا كَانَ هَذَا رُخْصَةً لَهُ خَاصَّةً، فَلَوْ أَنَّ رَجُلًا فَعَلَ ذَلِكَ– الْيَوْمَ– لَمْ يَكُنْ لَهُ بُدٌّ مِنَ التَّكْفِيرِ. وَفِي رِوَايَةٍ: أَنَّ رَجُلًا أَفْطَرَ فِي رَمَضَانَ، فَأَمَرَهُ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنْ يُعْتِقَ رَقَبَةً، أَوْ يَصُومَ شَهْرَيْنِ مُتَتَابِعَيْنِ، أَوْ يُطْعِمَ سِتِّينَ مِسْكِينًا، قَالَ: لَا أَجِدُ، فَقَالَ لَهُ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"اجْلِسْ\". فَأُتِيَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِعَرَقٍ فِيهِ تَمْرٌ، فَقَالَ: \"خُذْ هَذَا فَتَصَدَّقْ بِهِ\". فَقَالَ: يَا رَسُولَ اللَّهِ، مَا أَحَدٌ أَحْوَجُ مِنِّي. فَضَحِكَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ حَتَّى بَدَتْ أَنْيَابُهُ وَقَالَ لَهُ: \"كُلْهُ\". وَفِي رِوَايَةٍ: \"أَوْ تُعْتِقَ رَقَبَةً، أَوْ تَصُومَ شَهْرَيْنِ، أَوْ تُطْعِمَ سِتِّينَ مِسْكِينًا\". وَفِي رِوَايَةٍ: جَاءَ رَجُلٌ إِلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَفْطَرَ فِي رَمَضَانَ، بِهَذَا الْحَدِيثِ، قَالَ: فَأُتِيَ بِعَرَقٍ فِيهِ تَمْرٌ قَدْرُ خَمْسَةَ عَشَرَ صَاعًا، وَقَالَ فِيهِ: \"كُلْهُ أَنْتَ وَأَهْلُ بَيْتِكَ، وَصُمْ يَوْمًاوَاسْتَغْفِرِ اللَّهَ\". (ق,د,ن)", "malayalam": "ആഇശ(റ): റമളാനിൽ ഒരാൾ പള്ളിയിൽ വന്ന് പ്രവാചകരോട് പറഞ്ഞു: അല്ലാഹുവിന്റെ റസൂലേ, ഞാൻ കത്തിക്കരിഞ്ഞുപോയിരിക്കുന്നു! എന്താണ് കാര്യമെന്ന് റസൂൽ(സ) അന്വേഷിച്ചു. ആഗതൻ പറഞ്ഞു: ഞാനെന്റെ ഭാര്യയുമായി ബന്ധപ്പെട്ടു നബിയേ. റസൂൽ(സ) പറഞ്ഞു: \"എങ്കിൽ നീ വല്ലതും ദാനം ചെയ്യുക.\" അയാൾ പറഞ്ഞു: അല്ലാഹുവാണ! എന്റെ കയ്യിൽ ഒന്നുമില്ല. എനിക്കതിന്ന് കഴിയുകയുമില്ല. റസൂൽ(സ) അദ്ദേഹത്തോടിരിക്കാനാവശ്യപ്പെട്ടു. അയാൾ ഇരുന്നു. ആ അവസരം ഒരു മനുഷ്യൻ തന്റെ കഴുതപ്പുറത്ത് അൽപം ഭക്ഷണവുമായി വന്നു. റസൂൽ(സ) അന്വേഷിച്ചു: \"എവിടെ ആ കത്തിക്കരിഞ്ഞ മനുഷ്യൻ?\" അയാൾ എണീറ്റു. അപ്പോൾ റസൂൽ(സ) പറഞ്ഞു: \"നീ ഇതു ദാനം ചെയ്യുക.\" അയാൾ ചോദിച്ചു: അല്ലാഹുവിന്റെ റസൂലേ! മറ്റുള്ളവർക്കാണോ നൽകേണ്ടത്? അല്ലാഹുവാണ് സത്യം! ഞങ്ങൾ വളരെ പട്ടിണിയിലാണ്. ഞങ്ങളുടെ പക്കൽ ഒന്നുമില്ല. റസൂൽ(സ) അരുളി: \"എങ്കിൽ നിങ്ങൾ തന്നെ ഭക്ഷിച്ചുകൊള്ളുക.\" മറ്റൊരു നിവേദനം: അപ്പോൾ ഒരു കുട്ടയിൽ ഇരുപത് സ്വാഅ് കാരക്ക കൊണ്ടുവരപ്പെട്ടു. മറ്റൊരു നിവേദനം: ഇമാം സുഹ്രീയിൽനിന്ന് ഇതേ ഹദീസിന്റെ ആശയം വന്നിട്ടുണ്ട്. അതിൽ കൂടുതലായി ഇപ്രകാരം കാണാം: നിശ്ചയം ഇത് അയാൾക്കുള്ള ഒരു പ്രത്യേകമായ ആനുകൂല്യമായിരുന്നു. ഇക്കാലത്ത് ആരെങ്കിലും അതു പ്രവർത്തിച്ചാൽ പ്രായശ്ചിത്തം (കഫ്ഫാറത്) അല്ലാതെ മറ്റൊരു മാർഗമില്ല. മറ്റൊരു നിവേദനം: ഒരു മനുഷ്യൻ റമളാനിൽ നോമ്പ് മുറിച്ചു. ഒരടിമയെ മോചിപ്പിക്കുവാൻ റസൂൽ(സ) അയാളോടു കൽപിച്ചു. അതിനു കഴിയില്ലെങ്കിൽ രണ്ടുമാസം തുടർച്ചയായി നോമ്പ് അനുഷ്ഠിക്കുവാനും അല്ലെങ്കിൽ പാവപ്പെട്ട അറുപതുപേർക്ക് ഭക്ഷണം നൽകാനും റസൂൽ(സ) അരുളി. എനിക്ക് കഴിയില്ലെന്ന് അയാൾ പ്രവാചകരെ അറിയിച്ചു. റസൂൽ(സ) അയാളോട് ഇരിക്കുവാനാവശ്യപ്പെട്ടു. അപ്പോൾ പ്രവാചകസന്നിധിയിൽ ഒരു കുട്ട കാരക്ക കൊണ്ടുവരപ്പെട്ടു. അതു ദാനം ചെയ്യുവാൻ റസൂൽ(സ) അയാളോട് കൽപിച്ചു. അയാൾ പറഞ്ഞു: എന്നെക്കാൾ അതിന് ആവശ്യമുള്ളവരുണ്ടാവില്ല. ഇതുകേട്ടു റസൂൽ(സ) അവിടത്തെ അണപ്പല്ലുകൾ വെളിവാകുമാർ ചിരിക്കുകയും അത് ഭക്ഷിച്ചുകൊള്ളാൻ അയാളോടു പറയുകയും ചെയ്തു. മറ്റൊരു നിവേദനം: \"അല്ലെങ്കിൽ ഒരടിമയെ മോചിപ്പിക്കുക, അല്ലെങ്കിൽ രണ്ട് മാസം നോമ്പനുഷ്ഠിക്കുക, അതുമല്ലെങ്കിൽ പാവപ്പെട്ട അറുപത് പേർക്ക് ഭക്ഷണം നൽകുക.\" മറ്റൊരു നിവേദനം: റമളാനിൽ നോമ്പ്മുറിച്ച ഒരു വ്യക്തി റസൂൽ(സ)യുടെ സന്നിധിയിൽ വന്നു. പിന്നെ മേലുദ്ധരിച്ച അതേ ഹദീസ് തുടർന്നു പറയുന്നു: അപ്പോൾ ഒരു കുട്ടയിൽ പതിനഞ്ച് സ്വാഅ് കാരക്ക അവിടെ കൊണ്ടുവരപ്പെട്ടു. റസൂൽ(സ) പറഞ്ഞു: \"ഇത് നീയും നിന്റെ വീട്ടുകാരും ഭക്ഷിക്കുക. ഒരു ദിവസം നോമ്പനുഷ്ഠിക്കുകയും അല്ലാഹുവിനോടു പാപമോചനം തേടുകയും ചെയ്യുക.\" (ദ)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["ق", "د", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: فَأُتِيَ بِعَرَقٍ فِيهِ عِشْرُونَ صَاعًا.", "malayalam": "മറ്റൊരു നിവേദനം: അപ്പോൾ ഒരു കുട്ടയിൽ ഇരുപത് സ്വാഅ് കാരക്ക കൊണ്ടുവരപ്പെട്ടു."}, {"seq": 2, "arabic": "وَفِي رِوَايَةٍ: عَنِ الزُّهْرِيِّ، بِهَذَا الْحَدِيثِ بِمَعْنَاهُ، زَادَ: وَإِنَّمَا كَانَ هَذَا رُخْصَةً لَهُ خَاصَّةً، فَلَوْ أَنَّ رَجُلًا فَعَلَ ذَلِكَ– الْيَوْمَ– لَمْ يَكُنْ لَهُ بُدٌّ مِنَ التَّكْفِيرِ.", "malayalam": "മറ്റൊരു നിവേദനം: ഇമാം സുഹ്രീയിൽനിന്ന് ഇതേ ഹദീസിന്റെ ആശയം വന്നിട്ടുണ്ട്. അതിൽ കൂടുതലായി ഇപ്രകാരം കാണാം: നിശ്ചയം ഇത് അയാൾക്കുള്ള ഒരു പ്രത്യേകമായ ആനുകൂല്യമായിരുന്നു. ഇക്കാലത്ത് ആരെങ്കിലും അതു പ്രവർത്തിച്ചാൽ പ്രായശ്ചിത്തം (കഫ്ഫാറത്) അല്ലാതെ മറ്റൊരു മാർഗമില്ല."}, {"seq": 3, "arabic": "وَفِي رِوَايَةٍ: أَنَّ رَجُلًا أَفْطَرَ فِي رَمَضَانَ، فَأَمَرَهُ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنْ يُعْتِقَ رَقَبَةً، أَوْ يَصُومَ شَهْرَيْنِ مُتَتَابِعَيْنِ، أَوْ يُطْعِمَ سِتِّينَ مِسْكِينًا، قَالَ: لَا أَجِدُ، فَقَالَ لَهُ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"اجْلِسْ\". فَأُتِيَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِعَرَقٍ فِيهِ تَمْرٌ، فَقَالَ: \"خُذْ هَذَا فَتَصَدَّقْ بِهِ\". فَقَالَ: يَا رَسُولَ ا

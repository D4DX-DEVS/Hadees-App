ng_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 14, "page_start": 66}, {"hadith_no": 64, "arabic": "عَنْ أَنَسٍ رَضِيَ اللَّهُ عَنْهُ: أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"تَسَحَّرُوا، فَإِنَّ فِي السَّحُورِ بَرَكَةً\". حَسَنٌ صَحِيحٌ. (ق,ت,ن,جه)", "malayalam": "അനസ്(റ): നബി(സ) അരുളി. \"അത്താഴം കഴിക്കൂ, തീർച്ചയായും അതിൽ സമൃദ്ധിയുണ്ട്.\" (ബു,മു,തു,ന,ജ)", "narrator_ml": "അനസ്(റ)", "source_codes_ar": ["ق", "ت", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 14, "page_start": 66}, {"hadith_no": 65, "arabic": "عَنْ عَبْدِ اللَّهِ بْنِ الْحَارِثِ، عَنْ رَجُلٍ مِنْ أَصْحَابِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: دَخَلْتُ عَلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَهُوَ يَتَسَحَّرُ، فَقَالَ: \"إِنَّهَا بَرَكَةٌ أَعْطَاكُمُ اللَّهُ إِيَّاهَا، فَلَا تَدَعُوهُ\". (ن)", "malayalam": "പ്രവാചകാനുചരരിൽ ഒരാളെ ഉദ്ധരിച്ച് അബ്ദുല്ലാഹിബ്നുൽ ഹാരിസ്(റ): അത്താഴം കഴിച്ചുകൊണ്ടിരുന്ന നബി(സ)യുടെ അടുത്ത് ഞാൻ ചെന്നു. അവിടന്നരുളി: \"അത്താഴം അല്ലാഹു നിങ്ങൾക്ക് നൽകിയ പുണ്യഭക്ഷണമാണ്. അതിനാൽ നിങ്ങളത് ഉപേക്ഷിക്കരുത്.\" (ന)", "narrator_ml": "പ്രവാചകാനുചരരിൽ ഒരാളെ ഉദ്ധരിച്ച് അബ്ദുല്ലാഹിബ്നുൽ ഹാരിസ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 14, "page_start": 66}, {"hadith_no": 66, "arabic": "عَنِ الْمِقْدَامِ بْنِ مَعْدِيكَرِبَ رَضِيَ اللَّهُ عَنْهُ، عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"عَلَيْكُمْ بِغَدَاءِ السُّحُورِ، فَإِنَّهُ هُوَ الْغَدَاءُ الْمُبَارَكُ\". (ن)", "malayalam": "മിഖ്ദാമുബ്നു മഅ്ദീകരിബ(റ): റസൂൽ(സ) പറഞ്ഞു: \"അത്തായഭക്ഷണം നിങ്ങൾ കഴിക്കുക. നിശ്ചയം അതു പുണ്യമുള്ള ഭക്ഷണമാണ്.\" (ന.)", "narrator_ml": "മിഖ്ദാമുബ്നു മഅ്ദീകരിബ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 14, "page_start": 67}, {"hadith_no": 67, "arabic": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا، عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"اسْتَعِينُوا بِطَعَامِ السَّحَرِ عَلَى صِيَامِ النَّهَارِ، وَبِالْقَيْلُولَةِ عَلَى قِيَامِ اللَّيْلِ\". [ز: في إسناده ضعيف]. (جه)", "malayalam": "ഇബ്നുഅബ്ബാസ്(റ): റസൂൽ(സ) പറഞ്ഞു: \"പകൽ നോമ്പനുഷ്ഠിക്കാൻവേണ്ടി അത്താഴഭക്ഷണംകൊണ്ടും രാത്രി നിസ്കാരത്തിന് വേണ്ടി പകൽ ഉറക്കം (ഖൈലൂലത്) കൊണ്ടും സഹായം തേടുക. (പരമ്പരയിൽ ദുർബലനുണ്ട്). (ജ)", "narrator_ml": "ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["جه"], "grading_note_ml": "പരമ്പരയിൽ ദുർബലനുണ്ട്", "grading_note_ar": "ز: في إسناده ضعيف", "explanation_ml": null, "variants": [], "bab_seq": 14, "page_start": 67}, {"hadith_no": 68, "arabic": "عَنْ سَمُرَةَ بْنِ جُنْدُبٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"لَا يَغُرَّنَّكُمْ مِنْ سَحُورِكُمْ أَذَانُ بِلَالٍ، وَلَا بَيَاضُ الْأُفُقِ الْمُسْتَطِيلُ هَكَذَا، حَتَّى يَسْتَطِيرَ هَكَذَا\". وَحَكَاهُ حَمَّادٌ بِيَدَيْهِ، قَالَ: يَعْنِي مُعْتَرِضًا. (م,د,ت)", "malayalam": "സമുറതുബ്നു ജുൻദുബ്(റ): റസൂൽ(സ) പറഞ്ഞു: \"അത്താഴം കഴിക്കുന്നതിൽ നിന്ന് ബിലാൽ(റ)ന്റെ ബാങ്കും ഇപ്രകാരം നീളത്തിൽ നീണ്ടുകിടക്കുന്ന ചക്രവാള ധവളിമയും നിങ്ങളെ ആശയക്കുഴപ്പത്തിലാക്കാതിരിക്കട്ടെ. ഇപ്രകാരം അത് വ്യാപകമാകുന്നതുവരെ.\" ഇത് ഉദ്ധരിക്കുമ്പോൾ ഹമ്മാദ്(റ) (ഇമാം മുസലിമിന്റെ ഉസ്താദിന്റെ ഉസ്താദ്) തന്റെ കൈകൾ കൊണ്ട് ആംഗ്യരൂപേണ കാണിച്ചിരുന്നു. (മു,ദ,തു)", "narrator_ml": "സമുറതുബ്നു ജുൻദുബ്(റ)", "source_codes_ar": ["م", "د", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 15, "page_start": 67}, {"hadith_no": 69, "arabic": "عَنْ سَمُرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"لَا يَغُرَّنَّكُمْ أَذَانُ بِلَالٍ، وَلَا هَذَا الْبَيَاضُ، حَتَّى يَنْفَجِرَ الْفَجْرُ هَكَذَا وَهَكَذَا\" يَعْنِي مُعْتَرِضًا، قَالَ: وَبَسَطَ بِيَدَيْهِ يَمِينًا وَشِمَالًا مَادًّا يَدَيْهِ. (ن)", "malayalam": "സമുറത്(റ): റസൂൽ(സ) അരുളി. \"ബിലാൽ(റ)ന്റെ ബാങ്കും ഈ ധവളപ്രകാശവും നിങ്ങളെ വഞ്ചിക്കരുത്. ഇപ്രകാരവും ഇപ്രകാരവും ഫജ്റുസ്സ്വാദിഖ് പൊട്ടിവിടരുന്നതുവരെ.\" തിരുനബി(സ) ഉദ്ദേശിച്ചത് പരന്ന് പൊട്ടിവിടരുന്നതിനെയാണ്. സമുറത്(റ) പറയുന്നു: ഇത് പറയുമ്പോൾ തിരുനബി(സ) തന്റെ ഇരുകരവും ഇടത്തും വലത്തും വിടർത്തി നീട്ടിയിരുന്നു. (ന)", "narrator_ml": "സമുറത്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 15, "page_start": 67}, {"hadith_no": 70, "arabic": "عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: كَانَ لِرَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مُؤَذِّنَانِ: بِلَالٌ، وَابْنُ أُمِّ مَكْتُومٍ الْأَعْمَى، فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"إِنَّ بِلَالًا يُؤَذِّنُ بِلَيْلٍ، فَكُلُوا وَاشْرَبُوا حَتَّى يُؤَذِّنَ ابْنُ أُمِّ مَكْتُومٍ\". قَالَ: وَلَمْ يَكُنْ بَيْنَهُمَا إِلَّا أَنْ يَنْزِلَ هَذَا وَيَرْقَى هَذَا. (م)", "malayalam": "ഇബ്നുഉമർ(റ): റസൂൽ(സ)ക്കു രണ്ടു മുഅദ്ദിനുമാർ (ബാങ്ക് വിളിക്കുന്നവർ) ഉണ്ടായിരുന്നു, ബിലാൽ(റ)വും അന്ധനായ ഇബ്നു ഉമ്മിമക്തൂം(റ)വും. തിരുനബി(സ) അരുളി: \"നിശ്ചയം ബിലാൽ(റ) രാത്രിയിൽ ബാങ്കുകൊടുക്കും, അതിനുശേഷം ഇബ്നു ഉമ്മിമക്തൂം(റ) ബാങ്ക് വിളിമുഴക്കുന്നത് വരെ നിങ്ങൾക്ക് കുടിക്കുകയും തിന്നുകയും ചെയ്യാം.\" നിവേദകൻ പറയുന്നു: ഒരാൾ ഇറങ്ങുകയും മറ്റെയാൾ കയറുകയും ചെയ്യുന്ന സമയം മാത്രമായിരുന്നു അവ രണ്ടിന്റെയും ഇടയിലുള്ള അന്തരം. (മു)", "narrator_ml": "ഇബ്നുഉമർ(റ)", "source_codes_ar": ["م"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 15, "page_start": 67}, {"hadith_no": 71, "arabic": "عَنْ سَهْلِ بْنِ سَعْدٍ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: [لَمَّا] نَزَلَتْ هَذِهِ الْآيَةُ: {وَكُلُوا وَاشْرَبُوا حَتَّى يَتَبَيَّنَ لَكُمُ الْخَيْطُ الْأَبْيَضُ مِنَ الْخَيْطِ الْأَسْوَدِ} [البقرة:١٨٧] قَالَ: فَكَانَ الرَّجُلُ إِذَا أَرَادَ الصَّوْمَ رَبَطَ أَحَدُهُمْ فِي رِجْلَيْهِ الْخَيْطَ الْأَسْوَدَ وَالْخَيْطَ الْأَبْيَضَ، فَلَا يَزَالُ يَأْكُلُ وَيَشْرَبُ حَتَّى يَتَبَيَّنَ لَهُ رِئْيُهُمَا، فَأَنْزَلَ اللَّهُ بَعْدَ ذَلِكَ: {مِنَ الْفَجْرِ} فَعَلِمُوا أَنَّمَا يَعْنِي بِذَلِكَ اللَّيْلَ وَالنَّهَارَ. (م)", "malayalam": "സഹ്‌ലുബ്നു സഅ്ദ്(റ): 'വെളുത്ത നൂലിഴകൾ കറുത്ത ഇഴകളിൽനിന്നും വ്യക്തമായി ദർശിക്കുംവരെ നിങ്ങൾ തിന്നുകയും കുടിക്കുകയും ചെയ്യുക.' (അൽബഖറ: 187) എന്ന ഖുർആൻ സൂക്തം അവതരിച്ചപ്പോൾ നോമ്പ് ഉദ്ദേശിക്കുന്ന ആളുകൾ ഇരു കാലുകളിലും കറുത്തതും വെളുത്തതുമായ ഇഴകൾ ബന്ധിപ്പിക്കുമായിരുന്നു. അവയുടെ നിറം വ്യക്തമാകുന്നതുവരെ അവർ തിന്നുകയും കുടിക്കുകയും ചെയ്തിരുന്നു. അതിനുശേഷം 'പ്രഭാതത്തിലെ' എന്ന് അല്ലാഹു സൂക്തമിറക്കി. അതോടെ അല്ലാഹു ഉദ്ദേശിച്ചത് രാവും പകലുമാണെന്ന് അവർ മനസ്സിലാക്കി. (മു)", "narrator_ml": "സഹ്‌ലുബ്നു സഅ്ദ്(റ)", "source_codes_ar": ["م"], "grading_note_ml": null, "grading_note_ar": "البقرة:١٨٧", "explanation_ml": null, "variants": [], "bab_seq": 15, "page_start": 68}, {"hadith_no": 72, "arabic": "عَنْ عَدِيِّ بْنِ حَاتِمٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: لَمَّا نَزَلَتْ هَذِهِ الْآيَةُ: {حَتَّى يَتَبَيَّنَ لَكُمُ الْخَيْطُ الْأَبْيَضُ مِنَ الْخَيْطِ الْأَسْوَدِ} [البقرة:١٨٧] قَالَ: أَخَذْتُ عِقَالًا أَبْيَضَ وَعِقَالًا أَسْوَدَ، فَوَضَعْتُهُمَا تَحْتَ وِسَادَتِي، فَنَظَرْتُ فَلَمْ أَتَبَيَّنْ، فَذَكَرْتُ ذَلِكَ لِرَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَضَحِكَ، فَقَالَ: \"إِنَّ وِسَادَكَ إِذَنْ لَعَرِيضٌ طَوِيلٌ، إِنَّمَا هُوَ اللَّيْلُ وَالنَّهَارُ\". وَفِي رِوَايَةٍ: \"إِنَّمَا هُوَ سَوَادُ اللَّيْلِ وَبَيَاضُ النَّهَارِ\". (خ,د,ت)", "malayalam": "അദിയ്യുബ്നു ഹാതിം(റ): 'കറുത്തരേഖകളിൽനിന്ന് വെളുത്തരേഖകൾ നിങ്ങൾക്കു തെളിഞ്ഞുകാണുന്നതുവരെ' എന്ന ഖുർആൻ സൂക്തം അവതരിച്ചപ്പോൾ ഞാൻ വെളുത്തതും കറുത്തതുമായ ഓരോ നൂലുകൾ എടുത്ത് എന്റെ തലയിണക്ക് ചുവട്ടിൽ വെച്ച് ഞാൻ വീക്ഷിച്ചു. പക്ഷേ, അവ രണ്ടും വ്യക്തമായി ദർശിക്കാൻ സാധിച്ചില്ല. ഇത് പ്രവാചകൻ(സ)യെ ധരിപ്പിച്ചപ്പോൾ റസൂൽ(സ) ചിരിച്ചു. ഇങ്ങനെ പറയുകയും ചെയ്തു: \"അന്നേരം നിന്റെ തലയിണ വലിയതായിരുന്നു. (അദ്ദേഹത്തിന് പിണഞ്ഞ അബദ്ധത്തെ സൂചിപ്പിച്ചുകൊണ്ടാണ് ഇങ്ങനെ പറഞ്ഞത്), അത് രാവും പകലും മാത്രമാണ്.\" മറ്റൊരു ഉദ്ധരണിയിൽ: \"നിശ്ചയം അത് രാവിന്റെ കറുപ്പും പകലിന്റെ വെളുപ്പുമാണ്.\" (ബു,ദ,തു)", "narrator_ml": "അദിയ്യുബ്നു ഹാതിം(റ)", "source_codes_ar": ["خ", "د", "ت"], "grading_note_ml": null, "grading_note_ar": "البقرة:١٨٧", "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: \"إِنَّمَا هُوَ سَوَادُ اللَّيْلِ وَبَيَاضُ النَّهَارِ\". (خ,د,ت)", "malayalam": null}], "bab_seq": 15, "page_start": 68}, {"hadith_no": 73, "arabic": "عَنْ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"لَا يَمْنَعَنَّ أَحَدَكُمْ أَذَانُ بِلَالٍ مِنْ سُحُورِهِ، فَإِنَّهُ يُؤَذِّنُ– أَوْ قَالَ: يُنَادِي– لِيَرْجِعَ قَائِمُكُمْ، وَيَنْتَبِهَ نَائِمُكُمْ، وَلَيْسَ الْفَجْرُ أَنْ يَقُولَ هَكَذَا\" وَجَمَعَ كَفَّيْهِ \"حَتَّى يَقُولَ هَكَذَا\" وَمَدَّ بِأُصْبُعِهِ السَّبَّابَتَيْنِ. (ق,د,ن,جه)", "malayalam": "അബ്ദുല്ലാഹിബ്നു മസ്ഊദ്(റ): റസൂൽ(സ) പറഞ്ഞു: \"ബിലാൽ(റ)വിന്റെ ബാങ്ക് അത്താഴം കഴിക്കുന്നതിൽ നിന്ന് നിങ്ങളിലൊരാളെയും തടസ്സപ്പെടുത്താതിരിക്കട്ടെ. അദ്ദേഹം ബാങ്ക്‌വിളിക്കുന്നത് നിങ്ങളെ ഉറക്കിൽനിന്ന് ഉണർത്തുവാനും തഹജ്ജുദ് നിസ്കരിക്കുന്നവന് വിശ്രമിക്കുവാനും വേണ്ടിയാണ്\". റസൂൽ(സ) തന്റെ രണ്ട് മുൻകൈകൾ കൂട്ടിപ്പിടിച്ച് പറഞ്ഞു: \"ഇപ്രകാരം നീളത്തിൽ നീണ്ടുകിടക്കുന്നതല്ല ശരിയായ പ്രഭാതം.\" പിന്നെ റസൂൽ(സ) തന്റെ വിരൽ കൊണ്ട് രണ്ട് ചൂണ്ടുവിരലുകൾ നീട്ടി സൂചിപ്പിച്ചു. \"ഇപ്രകാരം (വിലങ്ങനെ) നീണ്ടുകിടക്കുന്നതാണ് ശരിയായ പ്രഭാതം\". (ബു,ദ,ന,ജ)", "narrator_ml": "അബ്ദുല്ലാഹിബ്നു മസ്ഊദ്(റ)", "source_codes_ar": ["ق", "د", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 15, "page_start": 68}, {"hadith_no": 74, "arabic": "عَنْ طَلْقٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"كُلُوا وَاشْرَبُوا، وَلَا يَهِيدَنَّكُمُ السَّاطِعُ الْمُصْعِدُ، فَكُلُوا وَاشْرَبُوا حَتَّى يَعْتَرِضَ لَكُمُ الْأَحْمَرُ\". (د,ت)", "malayalam": "ത്വൽഖ്(റ): റസൂൽ(സ) അരുളി: \"തിന്നോളൂ, കുടിച്ചോളൂ. നീണ്ട വെളുത്ത പ്രഭ നിങ്ങളെ അതിൽനിന്ന് തടയരുത്. ചക്രവാളത്തിൽ ചുവപ്പ് വരുന്നതുവരെ നിങ്ങൾക്ക് തിന്നുകയും കുടിക്കുകയും ചെയ്യാം.\" (ദ,തു)", "narrator_ml": "ത്വൽഖ്(റ)", "source_codes_ar": ["د", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 15, "page_start": 68}, {"hadith_no": 75, "arabic": "عَنْ أَنَسٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: تَسَحَّرَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَزَيْدُ بْنُ ثَابِتٍ، ثُمَّ قَامَا فَدَخَلَا فِي صَلَاةِ الصُّبْحِ. فَقِيلَ لِأَنَسٍ: كَمْ كَانَ بَيْنَ فَرَاغِهِمَا وَدُخُولِهِمَا فِي الصَّلَاةِ؟ قَالَ: قَدْرُ مَا يَقْرَأُ الْإِنْسَانُ خَمْسِينَ آيَةً. (ن)", "malayalam": "അനസ്(റ): സൈദുബ്നു സാബിത്(റ)വും റസൂൽ(സ)യും അത്താഴം കഴിച്ചു. പിന്നെ രണ്ടുപേരും എഴുന്നേറ്റ് സുബ്ഹി നിസ്കാരം തുടങ്ങി. നിസ്കാരപ്രവേശത്തിനും അത്താഴ വിരാമത്തിനും ഇടയിൽ അവർ എത്ര സമയമെടുത്തു എന്നൊരാൾ അനസ്(റ)വിനോട് ചോദിച്ചു. ഒരു മനുഷ്യന് അമ്പത് സൂക്തങ്ങൾ ഓതാനെടുക്കുന്ന സമയമെന്ന് അദ്ദേഹം മറുപടി പറഞ്ഞു. (ന)", "narrator_ml": "അനസ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 16, "page_start": 69}, {"hadith_no": 76, "arabic": "عَنْ أَنَسٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَذَلِكَ عِنْدَ السُّحُورِ: \"يَا أَنَسُ، إِنِّي أُرِيدُ الصِّيَامَ، أَطْعِمْنِي شَيْئًا\". فَأَتَيْتُهُ بِتَمْرٍ وَإِنَاءٍ فِيهِ مَاءٌ، وَذَلِكَ بَعْدَ مَا أَذَّنَ بِلَالٌ، فَقَالَ: \"يَا أَنَسُ، انْظُرْ رَجُلًا يَأْكُلُ مَعِي\". فَدَعَوْتُ زَيْدَ بْنَ ثَابِتٍ فَجَاءَ، فَقَالَ: إِنِّي قَدْ شَرِبْتُ شَرْبَةَ سَوِيقٍ، وَأَنَا أُرِيدُ الصِّيَامَ؟ فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"وَأَنَا أُرِيدُ الصِّيَامَ\". فَتَسَحَّرَ مَعَهُ، ثُمَّ قَامَ فَصَلَّى رَكْعَتَيْنِ، ثُمَّ خَرَجَ إِلَى الصَّلَاةِ. (ن)", "malayalam": "അനസ്(റ): അത്താഴസമയത്ത് റസൂൽ(സ) പറഞ്ഞു: \"ഓ അനസ്, ഞാൻ നോമ്പെടുക്കാൻ ഉദ്ദേശിക്കുന്നു. അൽപം ഭക്ഷണം വേണം.\" അൽപം കാരക്കയും വെള്ളവും ഞാൻ റസൂൽ(സ)ക്കു നൽകി. ബിലാൽ(റ)വിന്റെ ബാങ്കിനു ശേഷമായിരുന്നു അത്. നബി(സ) പറഞ്ഞു: \"ഓ അനസ്, എന്റെ കൂടെ ഭക്ഷണം കഴിക്കാവുന്ന ആരെങ്കിലും ഒരാളെ വിളിക്ക്.\" അപ്പോൾ ഞാൻ സൈദ്ബ്നു സാബിത്(റ)നെ ക്ഷണിച്ചു. ഉടനെ അദ്ദേഹം വന്നു. തുടർന്ന് അദ്ദേഹം പറഞ്ഞു: ഞാൻ പൊടിക്കഞ്ഞി കുടിച്ചിട്ടുണ്ട്. ഞാൻ നോമ്പെടുക്കാൻ ഉദ്ദേശിക്കുന്നു. റസൂൽ(സ) പറഞ്ഞു: \"എനിക്കും നോമ്പെടുക്കാൻ താൽപര്യമുണ്ട്.\" റസൂൽ(സ) സൈദ്(റ)വിനോട് കൂടെ അത്താഴം കഴിച്ചു. ശേഷം എഴുന്നേറ്റ് രണ്ട് റക്അത് നിസ്കരിച്ച് റസൂൽ(സ) സുബ്ഹി നിസ്കരിക്കാൻ പോയി. (ന)", "narrator_ml": "അനസ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 16, "page_start": 69}, {"hadith_no": 77, "arabic": "عَنْ زِرِّ بْنِ حُبَيْشٍ قَالَ: قُلْنَا لِحُذَيْفَةَ رَضِيَ اللَّهُ عَنْهُ: أَيَّ سَاعَةٍ تَسَحَّرْتَ مَعَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ؟ قَالَ: هُوَ النَّهَارُ، إِلَّا أَنَّ الشَّمْسَ لَمْ تَطْلُعْ. (ن)", "malayalam": "സിർറുബ്നു ഹുബൈശ്(റ): എപ്പോഴാണു താങ്കൾ നബി(സ)യോടൊപ്പം അത്താഴം കഴിച്ചതെന്ന് ഹുദൈഫ(റ)യോട് ഞങ്ങൾ ചോദിച്ചു. അതു പകൽതന്നെയായിരുന്നു, സൂര്യൻ ഉദിച്ചില്ലെന്നു മാത്രം എന്നദ്ദേഹം മറുപടി പറഞ്ഞു. (ന)", "narrator_ml": "സിർറുബ്നു ഹുബൈശ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 16, "page_start": 69}, {"hadith_no": 78, "arabic": "عَنْ زِرِّ بْنِ حُبَيْشٍ قَالَ: تَسَحَّرْتُ مَعَ حُذَيْفَةَ رَضِيَ اللَّهُ عَنْهُ ثُمَّ خَرَجْنَا إِلَى الصَّلَاةِ، فَلَمَّا أَتَيْنَا الْمَسْجِدَ صَلَّيْنَا رَكْعَتَيْنِ وَأُقِيمَتِ الصَّلَاةُ، وَلَيْسَ بَيْنَهُمَا إِلَّا هُنَيْهَةٌ. (ن)", "malayalam": "സിർറുബ്നു ഹുബൈശ്(റ): ഞാൻ ഹുദൈഫ(റ)യോടൊപ്പം അത്താഴം കഴിച്ചു. ശേഷം ഞങ്ങൾ നിസ്കരിക്കാൻ പോയി. പള്ളിയിൽ ചെന്ന് രണ്ട് റക്അത്ത് നിസ്കരിച്ചപ്പോഴേക്കും നിസ്കാരത്തിന് ഇഖാമത് വിളിച്ചു. അവ രണ്ടിനും ഇടയിൽ ചുരുങ്ങിയ സമയം മാത്രമേ ഉണ്ടായിരുന്നുള്ളൂ.\" (ന)", "narrator_ml": "സിർറുബ്നു ഹുബൈശ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 16, "page_start": 69}, {"hadith_no": 79, "arabic": "عَنْ أَبِي عَطِيَّةَ قَالَ: قُلْتُ لِعَائِشَةَ رَضِيَ اللَّهُ عَنْهَا: فِينَا رَجُلَانِ مِنْ أَصْحَابِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، أَحَدُهُمَا يُعَجِّلُ الْإِفْطَارَ وَيُؤَخِّرُ السُّحُورَ، وَالْآخَرُ يُؤَخِّرُ الْإِفْطَارَ وَيُعَجِّلُ السُّحُورَ؟ قَالَتْ: أَيُّهُمَا الَّذِي يُعَجِّلُ الْإِفْطَارَ وَيُؤَخِّرُ السُّحُورَ؟ قُلْتُ: عَبْدُ اللَّهِ بْنُ مَسْعُودٍ رَضِيَ اللَّهُ عَنْهُ. قَالَتْ: هَكَذَا كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصْنَعُ. (ن)", "malayalam": "അബൂഅതിയ്യ(റ): ഞാൻ ആഇശ(റ)യോട് പറഞ്ഞു: ഞങ്ങളുടെ കൂട്ടത്തിൽ നബി(സ)യുടെ അനുചരൻമാരിൽപെട്ട രണ്ടാളുകളുണ്ട്. ഒരാൾ നോമ്പുതുറ വേഗത്തിലാക്കുകയും അത്താഴം പിന്തിപ്പിക്കുകയും ചെയ്യുന്നു. മറ്റെയാൾ നോമ്പുതുറ പിന്തിപ്പിക്കുകയും അത്താഴം വേഗത്തിലാക്കുകയും ചെയ്യുന്നു. ആഇശ(റ) ചോദിച്ചു: നോമ്പുതുറ വേഗത്തിലാക്കുകയും അത്താഴം പിന്തിക്കുകയും ചെയ്യുന്നതാരാണ്? ഞാൻ പറഞ്ഞു: അബ്ദുല്ലാഹിബ്നു മസ്ഊദ്(റ). ആഇശ(റ) പറഞ്ഞു: ഇപ്രകാരമായിരുന്നു റസൂൽ(സ) ചെയ്തിരുന്നത്. (ന)", "narrator_ml": "അബൂഅതിയ്യ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 16, "page_start": 69}, {"hadith_no": 80, "arabic": "عَنْ أَبِي عَطِيَّةَ قَالَ: دَخَلْتُ أَنَا وَمَسْرُوقٌ عَلَى عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا، فَقُلْنَا لَهَا: يَا أُمَّ الْمُؤْمِنِينَ، رَجُلَانِ مِنْ أَصْحَابِ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: أَحَدُهُمَا يُعَجِّلُ الْإِفْطَارَ وَيُعَجِّلُ الصَّلَاةَ، وَالْآخَرُ يُؤَخِّرُ الْإِفْطَارَ وَيُؤَخِّرُ الصَّلَاةَ؟ فَقَالَتْ: أَيُّهُمَا يُعَجِّلُ الْإِفْطَارَ وَيُعَجِّلُ الصَّلَاةَ؟ قُلْنَا: عَبْدُ اللَّهِ بْنُ مَسْعُودٍ رَضِيَ اللَّهُ عَنْهُ. قَالَتْ: هَكَذَا كَانَ يَصْنَعُ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَالْآخَرُ أَبُو مُوسَى رَضِيَ اللَّهُ عَنْهُمَا. (ن)", "malayalam": "അബൂഅതിയ്യ(റ): ഞാനും മസ്റൂഖ്(റ)വും ആഇശ(റ)യുടെ അടുത്തെത്തി. ഞങ്ങൾ അവരോട് പറഞ്ഞു: ഓ ഉമ്മുൽമുഅ്മിനീൻ, സ്വഹാബികളിൽപെട്ട രണ്ടുപേരിൽ ഒരാൾ നിസ്കാരവും നോമ്പ്തുറയും വേഗത്തിലാക്കും. മറ്റെയാൾ നോമ്പുതുറയും നിസ്കാരവും പിന്തിപ്പിക്കും. നിസ്കാരവും നോമ്പ്തുറയും വേഗത്തിലാക്കുന്നയാൾ ആരാണെന്ന് അവർ ചോദിച്ചു. അബ്ദുല്ലാഹിബ്നു മസ്ഊദ്(റ)വാണതെന്ന് ഞങ്ങൾ മറുപടി പറഞ്ഞു. അപ്രകാരമാണ് റസൂൽ(സ) ചെയ്തിരുന്നതെന്ന് അവർ പറഞ്ഞു. അപരൻ അബൂമൂസാ(റ) ആണ്. (ന)", "narrator_ml": "അബൂഅതിയ്യ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 16, "page_start": 70}, {"hadith_no": 81, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"إِذَا سَمِعَ أَحَدُكُمُ النِّدَاءَ وَالْإِنَاءُ عَلَى يَدِهِ فَلَا يَضَعْهُ حَتَّى يَقْضِيَ حَاجَتَهُ مِنْهُ\". (د)", "malayalam": "അബൂഹുറൈറ(റ): റസൂൽ(സ) പറഞ്ഞു: \"ഭക്ഷണപ്പാത്രം കയ്യിലിരിക്കെ നിങ്ങളിലാരെങ്കിലും ബാങ്ക് കേൾക്കാനിടയായാൽ ആവശ്യനിർവ്വഹണത്തിനു ശേഷം മാത്രം അവൻ പാത്രം വെച്ചാൽ മതി.\" (ബിലാൽ(റ)വിന്റെ അത്താഴബാങ്കാണിത്, സുബ്ഹി ബാങ്ക് അല്ല ഇവിടെ ഉദ്ദേശ്യം). (ദ)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 17, "page_start": 70}, {"hadith_no": 82, "arabic": "عَنْ عَبْدِ اللَّهِ بْنِ أَبِي أَوْفَى رَضِيَ اللَّهُ عَنْهُمَا قَالَ: سِرْنَا مَعَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَهُوَ صَائِمٌ، فَلَمَّا غَرَبَتِ الشَّمْسُ قَالَ: \"يَا بِلَالُ، انْزِلْ فَاجْدَحْ لَنَا\". قَالَ: يَا رَسُولَ اللَّهِ، لَوْ أَمْسَيْتَ. قَالَ: \"انْزِلْ فَاجْدَحْ لَنَا\". قَالَ: يَا رَسُولَ اللَّهِ، إِنَّ عَلَيْكَ نَهَارًا. قَالَ: \"انْزِلْ فَاجْدَحْ لَنَا\". فَنَزَلَ فَجَدَحَ، فَشَرِبَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ ثُمَّ قَالَ: \"إِذَا رَأَيْتُمُ اللَّيْلَ قَدْ أَقْبَلَ مِنْ هَا هُنَا فَقَدْ أَفْطَرَ الصَّائِمُ\". وَأَشَارَ بِأُصْبُعِهِ قِبَلَ الْمَشْرِقِ. (ق,د,ت)", "malayalam": "അബ്ദുല്ലാഹിബ്നു അബീഔഫാ(റ): നോമ്പുകാരനായിരുന്ന റസൂൽ(സ)യുടെ കൂടെ ഞങ്ങൾ സഞ്ചരിച്ചു. സൂര്യൻ അസ്തമിച്ചപ്പോൾ തിരുനബി(സ) അരുളി. \"ഹേ ബിലാൽ, വാഹനമിറങ്ങി ഞങ്ങൾക്ക് പാനീയം തയ്യാറാക്കുക.\" വൈകുന്നേരമായിക്കോട്ടെ, തിരുദൂതരേ എന്നു ബിലാൽ(റ) തിരിച്ചു പറഞ്ഞു. റസൂൽ(സ) വീണ്ടും അരുളി: \"വാഹനമിറങ്ങി പാനീയം പാകംചെയ്തു തരിക.\" പകൽ ഇനിയുമുണ്ടല്ലോ തിരുദൂതരേ, എന്ന് ബിലാൽ(റ) വീണ്ടും തിരിച്ച് ചോദിച്ചു. നബി(സ) പറഞ്ഞു: \"വാഹനമിറങ്ങി പാനീയം പാകം ചെയ്തു തരിക.\" ബിലാൽ(റ) ഇറങ്ങി ഭക്ഷണം പാകം ചെയ്തു. റസൂൽ(സ) അത് കുടിച്ചു. കിഴക്കിലേക്കു വിരൽചൂണ്ടി റസൂൽ(സ) അരുളി. \"ഇവിടെ നിന്നും രാവ് ആരംഭിക്കുന്നതു കണ്ടാൽ നോമ്പുകാരന് നോമ്പു മുറിക്കാം.\" (ബു,മു,ദ,തു)", "narrator_ml": "അബ്ദുല്ലാഹിബ്നു അബീഔഫാ(റ)", "source_codes_ar": ["ق", "د", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 18, "page_start": 70}, {"hadith_no": 83, "arabic": "عَنْ أَسْمَاءَ بِنْتِ أَبِي بَكْرٍ رَضِيَ اللَّهُ عَنْهُمَا قَالَتْ: أَفْطَرْنَا يَوْمًا فِي رَمَضَانَ فِي غَيْمٍ، فِي عَهْدِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، ثُمَّ طَلَعَتِ الشَّمْسُ. قِيلَ: أُمِرُوا بِالْقَضَاءِ؟ قِيلَ: وَبُدٌّ مِنْ ذَلِكَ. (خ,د,جه)", "malayalam": "അസ്മാഉബിൻത് അബീബകർ(റ): തിരുദൂതർ(സ)യുടെ കാലത്ത് മേഘമുള്ള ഒരു റമളാൻ ദിനത്തിൽ ഞങ്ങൾ നോമ്പ്മുറിച്ചു. പിന്നെ സൂര്യൻ വെളിവായി. അതു ഖളാഅ് വീട്ടാൻ കൽപിക്കപ്പെട്ടോ എന്നൊരാൾ ചോദിച്ചു. അത് അനിവാര്യമല്ലല്ലോ എന്ന് മറുപടി നൽകപ്പെട്ടു. (ബു,ദ,ജ)", "narrator_ml": "അസ്മാഉബിൻത് അബീബകർ(റ)", "source_codes_ar": ["خ", "د", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 18, "page_start": 71}, {"hadith_no": 84, "arabic": "عَنْ عُمَرَ بْنِ الْخَطَّابِ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"إِذَا أَقْبَلَ اللَّيْلُ وَأَدْبَرَ النَّهَارُ وَغَابَتِ الشَّمْسُ فَقَدْ أَفْطَرْتَ\". (ق,د,ت,ن)", "malayalam": "ഉമറുബ്നുൽ ഖത്താബ്(റ): റസൂൽ(സ) അരുളി: \"രാത്രി മുന്നിട്ട് വരികയും, പകൽ പിന്നിട്ട് പോവുകയും, സൂര്യൻ അസ്തമിക്കുകയും ചെയ്താൽ നിങ്ങൾ നോമ്പ് മുറിച്ചു.\" (ബു,മു,ദ,തു,ന)", "narrator_ml": "ഉമറുബ്നുൽ ഖത്താബ്(റ)", "source_codes_ar": ["ق", "د", "ت", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 18, "page_start": 71}, {"hadith_no": 85, "arabic": "عَنْ سَهْلِ بْنِ سَعْدٍ رَضِيَ اللَّهُ عَنْهُ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"لَا يَزَالُ النَّاسُ بِخَيْرٍ مَا عَجَّلُوا الْفِطْرَ\". (ق,ت,جه)", "malayalam": "സഹ്‌ലുബ്നു സഅ്ദ് (റ): റസൂൽ(സ) പറഞ്ഞു: \"നോമ്പുതുറ വേഗത്തിലാക്കുന്ന കാലത്തോളം ജനങ്ങൾ നന്മയിലായിരിക്കും.\" (ബു,മു,തു,ജ)", "narrator_ml": "സഹ്‌ലുബ്നു സഅ്ദ് (റ)", "source_codes_ar": ["ق", "ت", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 19, "page_start": 71}, {"hadith_no": 86, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ، عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"لَا يَزَالُ الدِّينُ ظَاهِرًا مَا عَجَّلَ النَّاسُ الْفِطْرَ، لِأَنَّ الْيَهُودَ وَالنَّصَارَى يُؤَخِّرُونَ\". (د,جه)", "malayalam": "അബൂഹുറൈറ(റ): തിരുനബി(സ) പറഞ്ഞു: \"ജനങ്ങൾ നോമ്പ് തുറക്കുന്നതിൽ ധൃതികാണിക്കുന്ന കാലത്തോളം ദീൻ പരസ്യമായിക്കൊണ്ടേയിരിക്കും. ജൂതരും ക്രിസ്ത്യാനികളും നോമ്പുതുറ പിന്തിക്കുന്നവരാണ്.\" (ദ,ജ)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["د", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 19, "page_start": 71}, {"hadith_no": 87, "arabic": "عَنْ أَبِي عَطِيَّةَ قَالَ: دَخَلْتُ عَلَى عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا أَنَا وَمَسْرُوقٌ، فَقُلْنَا: يَا أُمَّ الْمُؤْمِنِينَ، رَجُلَانِ مِنْ أَصْحَابِ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، أَحَدُهُمَا يُعَجِّلُ الْإِفْطَارَ وَيُعَجِّلُ الصَّلَاةَ، وَالْآخَرُ يُؤَخِّرُ الْإِفْطَارَ وَيُؤَخِّرُ الصَّلَاةَ؟ قَالَتْ: أَيُّهُمَا يُعَجِّلُ الْإِفْطَارَ وَيُعَجِّلُ الصَّلَاةَ؟ فَقُلْنَا: عَبْدُ اللَّهِ، قَالَتْ: كَذَلِكَ كَانَ يَصْنَعُ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. (م,د,ت,ن)", "malayalam": "അബൂഅതിയ്യ(റ): ഞാനും മസ്റൂഖു(റ)ം ആഇശ(റ)യുടെ വീട്ടിൽ ചെന്നു. ഞങ്ങൾ പറഞ്ഞു: ഉമ്മുൽ മുഅ്മിനീൻ, നബി(സ)യുടെ അനുചരരിൽപ്പെട്ട രണ്ടാളുകൾ, ഒരാൾ നോമ്പുതുറയും നിസ്കാരവും വേഗത്തിലാക്കുന്നു. മറ്റെയാൾ നോമ്പുതുറയും നിസ്കാരവും വൈകിക്കുന്നു. ആഇശ(റ) ചോദിച്ചു: നോമ്പുതുറയും നിസ്കാരവും വേഗത്തിൽ ചെയ്യുന്നത് ആരാണ്? ഞങ്ങൾ പറഞ്ഞു: അബ്ദുല്ല. ആഇശ(റ) പറഞ്ഞു: അപ്രകാരമായിരുന്നു നബി(സ) ചെയ്തിരുന്നത്. (മു,ദ,തു,ന)", "narrator_ml": "അബൂഅതിയ്യ(റ)", "source_codes_ar": ["م", "د", "ت", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 19, "page_start": 71}, {"hadith_no": 88, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"قَالَ اللَّهُ عَزَّ وَجَلَّ: أَحَبُّ عِبَادِي إِلَيَّ أَعْجَلُهُمْ فِطْرًا\". حَسَنٌ. (ت)", "malayalam": "അബൂഹുറൈറ(റ): റസൂൽ(സ) പറഞ്ഞു: \"അല്ലാഹു പറയുന്നു: എന്റെ അടിമകളിൽ എനിക്കേറ്റവും സ്നേഹമുള്ളവർ നോമ്പ്തുറക്കുന്നതിൽ ധൃതി കാണിക്കുന്നവരാണ്.\" (തു)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 19, "page_start": 72}, {"hadith_no": 89, "arabic": "عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُفْطِرُ عَلَى رُطَبَاتٍ قَبْلَ أَنْ يُصَلِّيَ، فَإِنْ لَمْ تَكُنْ رُطَبَاتٌ فَعَلَى تَمَرَاتٍ، فَإِنْ لَمْ تَكُنْ حَسَا حَسَوَاتٍ مِنْ مَاءٍ. (د,ت)", "malayalam": "അനസ്(റ): റസൂൽ(സ) നിസ്കരിക്കുന്നതിനു മുമ്പ് ഈത്തപ്പഴങ്ങൾകൊണ്ട് നോമ്പു മുറിക്കാറുണ്ടായിരുന്നു. ഈത്തപ്പഴം ലഭിച്ചില്ലെങ്കിൽ കാരക്ക. കാരക്കയില്ലെങ്കിൽ കുറച്ച് വെള്ളം കുടിക്കും. (ദ,തു)", "narrator_ml": "അനസ്(റ)", "source_codes_ar": ["د", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 20, "page_start": 72}, {"hadith_no": 90, "arabic": "عَنْ أُمِّ هَانِئٍ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: كُنْتُ قَاعِدَةً عِنْدَ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَأُتِيَ بِشَرَابٍ فَشَرِبَ مِنْهُ، ثُمَّ نَاوَلَنِي فَشَرِبْتُ مِنْهُ. فَقُلْتُ: إِنِّي أَذْنَبْتُ، فَاسْتَغْفِرْ لِي. فَقَالَ: \"وَمَا ذَاكِ\". قَالَتْ: كُنْتُ صَائِمَةً فَأَفْطَرْتُ. فَقَالَ: \"أَمِنْ قَضَاءٍ كُنْتِ تَقْضِينَهُ\". قَالَتْ: لَا. قَالَ: \"فَلَا يَضُرُّكِ\". وَفِي رِوَايَةٍ: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ دَخَلَ عَلَيْهَا، فَدَعَى بِشَرَابٍ فَشَرِبَ، ثُمَّ نَاوَلَهَا فَشَرِبَتْ، فَقَالَتْ: يَا رَسُولَ اللَّهِ، أَمَا إِنِّي كُنْتُ صَائِمَةً. فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"الصَّائِمُ الْمُتَطَوِّعُ أَمِينُ– وَفِي رِوَايَةٍ: أَمِيرُ– نَفْسِهِ، إِنْ شَاءَ صَامَ وَإِنْ شَاءَ أَفْطَرَ\". (د,ت)", "malayalam": "ഉമ്മുഹാനിഅ്(റ): ഞാൻ റസൂൽ(സ)യുടെ അടുത്തിരിക്കെ പാനീയം കൊണ്ടുവരപ്പെടുകയും തിരുനബി(സ) അതിൽനിന്ന് കുടിക്കുകയും ചെയ്തു. പിന്നെ എനിക്ക് തന്നു. ഞാനും കുടിച്ചു. ഞാൻ പറഞ്ഞു: ഞാൻ പാപം ചെയ്തിട്ടുണ്ട്. അതിന് അങ്ങ് എനിക്കുവേണ്ടി മാപ്പിരക്കണം. \"അതെന്താണെ\"ന്നു തിരുനബി(സ) ചോദിച്ചു. ഞാൻ നോമ്പുമുറിച്ചു എന്നവർ പറഞ്ഞു: \"കടമുള്ള നോമ്പായിരുന്നോ നീ നോറ്റത്?\" തിരുനബി(സ) വീണ്ടും ചോദിച്ചു. അല്ലെന്ന് അവർ പറഞ്ഞു. റസൂൽ(സ) പറഞ്ഞു \"എങ്കിൽ നിനക്കത് ദോഷം ചെയ്യില്ല.\"\nമറ്റൊരു നിവേദനം: റസൂൽ(സ) അവരുടെ അടുത്ത്ചെന്ന് പാനീയം ആവശ്യപ്പെട്ടു, അങ്ങനെ അത്കുടിച്ചു, പിന്നെ അവർക്ക് നൽകി, അവരും കുടിച്ചു. തുടർന്ന് അവർ പറഞ്ഞു: അല്ലാഹുവിന്റെ റസൂലേ, ഞാൻ നോമ്പുകാരി ആയിരുന്നല്ലോ. തിരുനബി(സ) പറഞ്ഞു: \"ഐച്ഛിക നോമ്പുകാരൻ നിർഭയനാണ് - മറ്റൊരു നിവേദനം: അവൻ അവന്റെ ദേഹത്തിന്റെ അധിപനാണ് - അവനുദ്ദേശിച്ചാൽ നോമ്പു പിടിക്കാം. ഉദ്ദേശിച്ചാൽ മുറിക്കുകയും ചെയ്യാം.\" (ദ,തു)", "narrator_ml": "ഉമ്മുഹാനിഅ്(റ)", "source_codes_ar": ["د", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ دَخَلَ عَلَيْهَا، فَدَعَى بِشَرَابٍ فَشَرِبَ، ثُمَّ نَاوَلَهَا فَشَرِبَتْ، فَقَالَتْ: يَا رَسُولَ اللَّهِ، أَمَا إِنِّي كُنْتُ صَائِمَةً. فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"الصَّائِمُ الْمُتَطَوِّعُ أَمِينُ–", "malayalam": "മറ്റൊരു നിവേദനം: റസൂൽ(സ) അവരുടെ അടുത്ത്ചെന്ന് പാനീയം ആവശ്യപ്പെട്ടു, അങ്ങനെ അത്കുടിച്ചു, പിന്നെ അവർക്ക് നൽകി, അവരും കുടിച്ചു. തുടർന്ന് അവർ പറഞ്ഞു: അല്ലാഹുവിന്റെ റസൂലേ, ഞാൻ നോമ്പുകാരി ആയിരുന്നല്ലോ. തിരുനബി(സ) പറഞ്ഞു: \"ഐച്ഛിക നോമ്പുകാരൻ നിർഭയനാണ് -"}, {"seq": 2, "arabic": "وَفِي رِوَايَةٍ: أَمِيرُ– نَفْسِهِ، إِنْ شَاءَ صَامَ وَإِنْ شَاءَ أَفْطَرَ\". (د,ت)", "malayalam": "മറ്റൊരു നിവേദനം: അവൻ അവന്റെ ദേഹത്തിന്റെ അധിപനാണ് - അവനുദ്ദേശിച്ചാൽ നോമ്പു പിടിക്കാം. ഉദ്ദേശിച്ചാൽ മുറിക്കുകയും ചെയ്യാം.\" (ദ,തു)"}], "bab_seq": 20, "page_start": 72}, {"hadith_no": 91, "arabic": "عَنْ سَلْمَانَ بْنِ عَامِرٍ الضَّبِّيِّ: عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"إِذَا أَفْطَرَ أَحَدُكُمْ فَلْيُفْطِرْ عَلَى تَمْرٍ، فَإِنَّهُ بَرَكَةٌ، فَمَنْ لَمْ يَجِدْ فَلْيُفْطِرْ عَلَى مَاءٍ فَإِنَّهُ طَهُورٌ\". (د,ت,ن,جه)", "malayalam": "സൽമാനുബ്നു ആമിരിള്ളബിയ്യ്(റ): നബി(സ) പറഞ്ഞു: \"നിങ്ങൾ നോമ്പ് മുറിക്കുന്നെങ്കിൽ കാരക്ക കൊണ്ട് മുറിക്കുക, നിശ്ചയം അതിൽ സമൃദ്ധിയുണ്ട്. കാരക്ക ലഭിക്കാത്തവർ വെള്ളം കൊണ്ട് മുറിക്കുക. നിശ്ചയം അത് ശുദ്ധിയുള്ളതും ശുദ്ധീകരിക്കാൻ ഉതകുന്നതുമാകുന്നു.\" (ദ,തു,ന,ജ)", "narrator_ml": "സൽമാനുബ്നു ആമിരിള്ളബിയ്യ്(റ)", "source_codes_ar": ["د", "ت", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 20, "page_start": 72}, {"hadith_no": 92, "arabic": "عَنِ ابْنِ عُمَرَ رَضِيَ اللَّهُ عَنْهُمَا: كَانَ يَقْبِضُ عَلَى لِحْيَتِهِ فَيَقْطَعُ مَا زَادَ عَلَى الْكَفِّ، وَقَالَ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِذَا أَفْطَرَ قَالَ: \"ذَهَبَ الظَّمَأُ، وَابْتَلَّتِ الْعُرُوقُ، وَثَبَتَ الْأَجْرُ إِنْ شَاءَ اللَّهُ\". (د)", "malayalam": "ഇബ്നുഉമർ(റ): അദ്ദേഹം തന്റെ താടിരോമം കൈകൊണ്ടു പിടിക്കുകയും അതിൽ ഒതുങ്ങാത്തത് വെട്ടിനീക്കുകയും ചെയ്യും. അദ്ദേഹം പറയുന്നു: നോമ്പു തുറക്കുന്ന അവസരത്തിൽ റസൂൽ(സ) പറയാറുണ്ടായിരുന്നു: \"ദാഹം ശമിച്ചു. ഞരമ്പുകൾ നനഞ്ഞു. അല്ലാഹു നിനച്ചാൽ പ്രതിഫലവും ഉറപ്പായി.\" (ദ)", "narrator_ml": "ഇബ്നുഉമർ(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 21, "page_start": 73}, {"hadith_no": 93, "arabic": "عَنْ مُعَاذِ بْنِ زُهْرَةَ: أَنَّهُ بَلَغَهُ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ إِذَا أَفْطَرَ قَالَ: \"اللَّهُمَّ لَكَ صُمْتُ، وَعَلَى رِزْقِكَ أَفْطَرْتُ\". (مرسل) (د)", "malayalam": "മുആദുബ്നു സുഹ്റ(റ): തിരുനബി(സ) നോമ്പു തുറക്കുമ്പോൾ ഇങ്ങനെ പറയാറുണ്ടായിരുന്നു എന്ന വിവരം അദ്ദേഹത്തിന് ലഭിച്ചു: \"അല്ലാഹുവേ, നിനക്കുവേണ്ടി ഞാൻ നോമ്പനുഷ്ടിച്ചു. നിന്റെ ഭക്ഷണം കൊണ്ട് നോമ്പ് തുറക്കുകയും ചെയ്തു.\" (ദ)", "narrator_ml": "മുആദുബ്നു സുഹ്റ(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 21, "page_start": 73}, {"hadith_no": 94, "arabic": "عَنْ زَيْدِ بْنِ خَالِدٍ الْجُهَنِيِّ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"مَنْ فَطَّرَ صَائِمًا كَانَ لَهُ مِثْلُ أَجْرِهِمْ، مِنْ غَيْرِ أَنْ يَنْقُصَ مِنْ أُجُورِهِمْ شَيْئًا\". (ت,جه)", "malayalam": "സൈദുബ്നു ഖാലിദിൽ ജുഹനി(റ): റസൂൽ(സ) പറഞ്ഞു: \"നോമ്പു തുറക്കുന്നവരുടെ പ്രതിഫലത്തിനു തുല്യമായ പ്രതിഫലം തുറപ്പിക്കുന്നവനും ലഭിക്കും. അവരുടേതിൽനിന്ന് ഒന്നും കുറയാതെത്തന്നെ.\" (തു,ജ)", "narrator_ml": "സൈദുബ്നു ഖാലിദിൽ ജുഹനി(റ)", "source_codes_ar": ["ت", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 22, "page_start": 73}, {"hadith_no": 95, "arabic": "عَنْ عَبْدِ اللَّهِ بْنِ الزُّبَيْرِ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: أَفْطَرَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عِنْدَ سَعْدِ بْنِ مُعَاذٍ، فَقَالَ: \"أَفْطَرَ عِنْدَكُمُ الصَّائِمُونَ، وَأَكَلَ طَعَامَكُمُ الْأَبْرَارُ، وَصَلَّتْ عَلَيْكُمُ الْمَلَائِكَةُ\". [ز: في سنده ضعيف] (جه)", "malayalam": "അബ്ദുല്ലാഹിബ്നു സുബൈർ(റ): സഅ്ദുബ്നു മുആദ്(റ)ന്റെ അടുത്ത്നിന്ന് റസൂൽ(സ) നോമ്പു തുറന്നു. തുടർന്ന് നബി(സ) അരുളി. \"നിങ്ങളുടെ അടുത്തുനിന്ന് നോമ്പുകാർ നോമ്പ് തുറന്നു. ഗുണവാന്മാർ നിങ്ങളുടെ ഭക്ഷണം കഴിച്ചു. മലക്കുകൾ നിങ്ങൾക്കുവേണ്ടി പ്രാർത്ഥിച്ചു.\" (ഇതിന്റെ പരമ്പരയിൽ ദുർബലനുണ്ട്) (ജ.)", "narrator_ml": "അബ്ദുല്ലാഹിബ്നു സുബൈർ(റ)", "source_codes_ar": ["جه"], "grading_note_ml": "ഇതിന്റെ പരമ്പരയിൽ ദുർബലനുണ്ട്", "grading_note_ar": "ز: في سنده ضعيف", "explanation_ml": null, "variants": [], "bab_seq": 22, "page_start": 73}, {"hadith_no": 96, "arabic": "عَنْ سِنَانِ بْنِ سَنَّةَ الْأَسْلَمِيِّ رَضِيَ اللَّهُ عَنْهُ - صَاحِبِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ - قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"الطَّاعِمُ الشَّاكِرُ لَهُ مِثْلُ أَجْرِ الصَّائِمِ الصَّابِرِ\". (جه)", "malayalam": "റസൂൽ(സ)യുടെ അനുചരനായ സിനാനുബ്നു സന്നതൽ അസ്ലമി(റ): റസൂൽ(സ) പറഞ്ഞു: \"കഴിച്ച ഭക്ഷണത്തിനു നന്ദിയുള്ളവന് ക്ഷമയുള്ള നോമ്പുകാരന്റെ പ്രതിഫലമുണ്ട്.\" (ജ)", "narrator_ml": "റസൂൽ(സ)യുടെ അനുചരനായ സിനാനുബ്നു സന്നതൽ അസ്ലമി(റ)", "source_codes_ar": ["جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 23, "page_start": 73}, {"hadith_no": 97, "arabic": "عَنْ أُمِّ عُمَارَةَ بِنْتِ كَعْبٍ الْأَنْصَارِيَّةِ رَضِيَ اللَّهُ عَنْهَا: أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ دَخَلَ عَلَيْهَا فَقَدَّمَتْ إِلَيْهِ طَعَامًا، فَقَالَ: \"كُلِي\". فَقَالَتْ: إِنِّي صَائِمَةٌ. فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"إِنَّ الصَّائِمَ تُصَلِّي عَلَيْهِ الْمَلَائِكَةُ إِذَا أُكِلَ عِنْدَهُ حَتَّى يَفْرُغُوا\". وَرُبَّمَا قَالَ: \"حَتَّى يَشْبَعُوا\". حَسَنٌ صَحِيحٌ. (ت)", "malayalam": "ഉമ്മുഉമാറ ബിൻത് കഅ്ബുൽ അൻസാരിയ്യ(റ): തിരുനബി(സ) അവരുടെ അടുത്ത് ചെന്നപ്പോൾ അവർ റസൂൽ(സ)ക്ക് ഭക്ഷണം വിളമ്പി. തിരുനബി(സ) പറഞ്ഞു: \"നീ ഭക്ഷിക്കൂ.\" അവർ പറഞ്ഞു: ഞാൻ നോമ്പുകാരിയാണ്. അപ്പോൾ റസൂൽ(സ) പറഞ്ഞു: \"നോമ്പുകാരന്റെ അടുത്തുനിന്ന് ഭക്ഷിച്ചാൽ അവൻ വിരമിക്കും വരെ മലക്കുകൾ നോമ്പുകാരനുവേണ്ടി പ്രാർത്ഥിക്കും.\" ഒരുപക്ഷേ ഇങ്ങനെയാകും തിരുനബി(സ) പറഞ്ഞത്: \"അവന്റെ (ഭക്ഷിക്കുന്നവന്റെ) വയറുനിറയും വരെ.\" (തു)", "narrator_ml": "ഉമ്മുഉമാറ ബിൻത് കഅ്ബുൽ അൻസാരിയ്യ(റ)", "source_codes_ar": ["ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 24, "page_start": 74}, {"hadith_no": 98, "arabic": "عَنْ أُمِّ عُمَارَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: أَتَانَا رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَرَّبْنَا إِلَيْهِ طَعَامًا، فَكَانَ بَعْضُ مَنْ عِنْدَهُ صَائِمًا، فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"الصَّائِمُ إِذَا أُكِلَ عِنْدَهُ الطَّعَامُ صَلَّتْ عَلَيْهِ الْمَلَائِكَةُ\". (ت,جه)", "malayalam": "ഉമ്മുഉമാറ(റ): റസൂൽ(സ) ഞങ്ങളുടെ അടുത്തുവന്നപ്പോൾ അവിടത്തേക്ക് ഞങ്ങൾ ഭക്ഷണം വിളമ്പി. അവിടത്തോടൊപ്പം ചില നോമ്പുകാരും ഉണ്ടായിരുന്നു. അപ്പോൾ തിരുനബി(സ) പറഞ്ഞു: \"നോമ്പുകാരന്റെ സമീപത്ത് വെച്ച് ആരെങ്കിലും ഭക്ഷണം കഴിച്ചാൽ നോമ്പുകാരനുവേണ്ടി മലക്കുകൾ പ്രാർത്ഥിക്കും.\" (തു,ജ)", "narrator_ml": "ഉമ്മുഉമാറ(റ)", "source_codes_ar": ["ت", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 24, "page_start": 74}, {"hadith_no": 99, "arabic": "عَنْ بُرَيْدَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لِبِلَالٍ: \"الْغَدَاءَ يَا بِلَالُ\". فَقَالَ: إِنِّي صَائِمٌ. قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"نَأْكُلُ أَرْزَاقَنَا، وَفَضْلُ رِزْقِ بِلَالٍ فِي الْجَنَّةِ. أَشَعَرْتَ - يَا بِلَالُ - أَنَّ الصَّائِمَ تُسَبِّحُ عِظَامُهُ وَتَسْتَغْفِرُ لَهُ الْمَلَائِكَةُ مَا أُكِلَ عِنْدَهُ\". [ز: في إسناده راو متفق علي تضعيفه] (جه)", "malayalam": "ബുറൈദ(റ): റസൂൽ(സ) ബിലാലി(റ)നോട് പറഞ്ഞു: \"ബിലാലെ, പ്രഭാതഭക്ഷണം എടുക്കൂ.\" അദ്ദേഹം പറഞ്ഞു: ഞാൻ നോമ്പുകാരനാണ്. റസൂൽ(സ) പറഞ്ഞു: \"നമ്മുടെ ഭക്ഷണം നാം കഴിക്കുന്നു. ബിലാലിന്റെ ഭക്ഷണം സ്വർഗത്തിൽ അവശേഷിക്കുന്നു. ബിലാലെ, നിനക്കറിയുമോ, നോമ്പുകാരന്റെ സമീപത്തുവെച്ച് ഭക്ഷണം കഴിച്ച് കൊണ്ടിരിക്കുന്ന സമയത്തോളം, അവന്റെ എല്ലുകൾ തസ്ബീഹ് ചൊല്ലുകയും മലക്കുകൾ അവനുവേണ്ടി മാപ്പിരക്കുകയും ചെയ്യും.\" (ഇതിന്റെ പരമ്പരയിൽ ഏകോപിതമായി ദൗർബല്യം ആരോപിക്കപ്പെട്ട ഒരു വ്യക്തിയുണ്ട്). (ജ)", "narrator_ml": "ബുറൈദ(റ)", "source_codes_ar": ["جه"], "grading_note_ml": null, "grading_note_ar": "ز: في إسناده راو متفق علي تضعيفه", "explanation_ml": null, "variants": [], "bab_seq": 24, "page_start": 74}, {"hadith_no": 100, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ، قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"إِذَا دُعِيَ أَحَدُكُمْ فَلْيُجِبْ، فَإِنْ كَانَ مُفْطِرًا فَلْيَطْعَمْ، وَإِنْ كَانَ صَائِمًا فَلْيُصَلِّ\". (م,د,ت,ن)", "malayalam": "അബൂഹുറൈറ(റ): റസൂൽ(സ) പറഞ്ഞു: \"നിങ്ങൾ സദ്യക്കു ക്ഷണിക്കപ്പെട്ടാൽ ക്ഷണം സ്വീകരിക്കുക. നോമ്പില്ലാത്തവനാണെങ്കിൽ ഭക്ഷണം കഴിക്കുക. നോമ്പുകാരനാണെങ്കിൽ പ്രാർത്ഥിക്കുക.\" (മു,ദ,തു,ന)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["م", "د", "ت", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 25, "page_start": 74}, {"hadith_no": 101, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ، عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"إِذَا دُعِيَ أَحَدُكُمْ وَهُوَ صَائِمٌ فَلْيَقُلْ: إِنِّي صَائِمٌ\". حَسَنٌ صَحِيحٌ. (م,د,ت,ن,جه)", "malayalam": "അബൂഹുറൈറ(റ): റസൂൽ(സ) പറഞ്ഞു: \"നോമ്പുകാരൻ സദ്യക്ക് ക്ഷണിക്കപ്പെട്ടാൽ ഞാൻ നോമ്പുകാരനാണെന്ന് അവൻ മറുപടി പറയട്ടെ.\" (മു,ദ,തു,ന,ജ)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["م", "د", "ت", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 25, "page_start": 74}, {"hadith_no": 102, "arabic": "عَنْ جَابِرٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"مَنْ دُعِيَ إِلَى طَعَامٍ وَهُوَ صَائِمٌ فَلْيُجِبْ، فَإِنْ شَاءَ طَعِمَ وَإِنْ شَاءَ تَرَكَ\". (م,جه)", "malayalam": "ജാബിർ(റ): റസൂൽ(സ) പറഞ്ഞു: \"സദ്യക്കുള്ള ക്ഷണം നോമ്പുകാരൻ സ്വീകരിക്കണം. അവനുദ്ദേശിച്ചാൽ ഭക്ഷണം കഴിക്കാം. അല്ലെങ്കിൽ ഉപേക്ഷിക്കാം.\" (മു,ജ)", "narrator_ml": "ജാബിർ(റ)", "source_codes_ar": ["م", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 25, "page_start": 75}, {"hadith_no": 103, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ حَتَّى نَقُولَ لَا يُفْطِرُ، وَيُفْطِرُ حَتَّى نَقُولَ لَا يَصُومُ. وَمَا رَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ اسْتَكْمَلَ صِيَامَ شَهْرٍ قَطُّ إِلَّا رَمَضَانَ، وَمَا رَأَيْتُهُ فِي شَهْرٍ أَكْثَرَ صِيَامًا مِنْهُ فِي شَعْبَانَ. (خ,د,ن,جه)", "malayalam": "ആഇശ(റ): തിരുമേനി(സ) ഇനി നോമ്പുപേക്ഷിക്കില്ല എന്ന് ഞങ്ങൾ പറയുംവരെ റസൂൽ(സ) നോമ്പെടുക്കാറുണ്ടായിരുന്നു. ഇനി നോമ്പെടുക്കില്ല എന്ന് ഞങ്ങൾ പറയും വരെ റസൂൽ(സ) നോമ്പ് ഒഴിവാക്കിയിരുന്നു. റമളാനിലൊഴികെ ഒരു മാസം പൂർണമായും റസൂൽ(സ) നോമ്പെടുക്കുന്നത് ഞാൻ കണ്ടിട്ടില്ല. ശഅ്ബാനിലേതിനേക്കാൾ കൂടുതലായി മറ്റൊരു മാസത്തിൽ റസൂൽ(സ) നോമ്പെടുക്കുന്നതും ഞാൻ കണ്ടിട്ടില്ല. (ബു,ദ,ന,ജ)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["خ", "د", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 26, "page_start": 75}, {"hadith_no": 104, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا فِي رِوَايَةٍ زِيَادَةٌ وَكَانَ يَقُولُ: \"خُذُوا مِنَ الْعَمَلِ مَا تُطِيقُونَ، فَإِنَّ اللَّهَ لَا يَمَلُّ حَتَّى تَمَلُّوا\". وَأَحَبُّ الصَّلَاةِ إِلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَا دُووِمَ عَلَيْهِ وَإِنْ قَلَّتْ، وَكَانَ إِذَا صَلَّى صَلَاةً دَاوَمَ عَلَيْهَا. (خ)", "malayalam": "ആഇശ(റ)യിൽ നിന്നുള്ള മറ്റൊരു റിപ്പോർട്ട്: തിരുമേനി(സ) ഇങ്ങനെ പറയാറുണ്ടായിരുന്നു. \"നിങ്ങളുടെ കഴിവിനനുസരിച്ചുള്ള ആരാധനാകർമ്മങ്ങൾ മാത്രം സ്വീകരിക്കുക. നിങ്ങൾക്കു മടുപ്പു തോന്നാത്ത കാലം വരെയും അല്ലാഹുവിനും മടുപ്പു തോന്നുകയില്ല.\" പതിവായി അനുവർത്തിക്കുന്ന ആരാധനകളാണ് തിരുമേനി(സ)ക്ക് ഇഷ്ടം. അതെത്ര ചുരുങ്ങിയാലും. ഒരു നിസ്കാരം തുടങ്ങിവെച്ചാൽ തിരുമേനി(സ) അതു പതിവാക്കാറുണ്ടായിരുന്നു. (ബു.)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["خ"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": null, "malayalam": "മറ്റൊരു നിവേദന്: തിരുമേനി(സ) ഇങ്ങനെ പറയാറുണ്ടായിരുന്നു. \"നിങ്ങളുടെ കഴിവിനനുസരിച്ചുള്ള ആരാധനാകർമ്മങ്ങൾ മാത്രം സ്വീകരിക്കുക. നിങ്ങൾക്കു മടുപ്പു തോന്നാത്ത കാലം വരെയും അല്ലാഹുവിനും മടുപ്പു തോന്നുകയില്ല.\" പതിവായി അനുവർത്തിക്കുന്ന ആരാധനകളാണ് തിരുമേനി(സ)ക്ക് ഇഷ്ടം. അതെത്ര ചുരുങ്ങിയാലും. ഒരു നിസ്കാരം തുടങ്ങിവെച്ചാൽ തിരുമേനി(സ) അതു പതിവാക്കാറുണ്ടായിരുന്നു. (ബു.)"}], "bab_seq": 26, "page_start": 75}, {"hadith_no": 105, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: نَهَى رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَنِ الْوِصَالِ فِي الصَّوْمِ، فَقَالَ لَهُ رَجُلٌ مِنَ الْمُسْلِمِينَ: إِنَّكَ تُوَاصِلُ يَا رَسُولَ اللَّهِ، قَالَ: \"وَأَيُّكُمْ مِثْلِي إِنِّي أَبِيتُ يُطْعِمُنِي رَبِّي وَيَسْقِينِ\"، فَلَمَّا أَبَوْا أَنْ يَنْتَهُوا عَنِ الْوِصَالِ وَاصَلَ بِهِمْ يَوْمًا ثُمَّ يَوْمًا ثُمَّ رَأَوُا الْهِلَالَ، فَقَالَ: \"لَوْ تَأَخَّرَ لَزِدْتُكُمْ\". كَالتَّنْكِيلِ لَهُمْ حِينَ أَبَوْا أَنْ يَنْتَهُوا، وَفِي رِوَايَةٍ عَنْهُ قَالَ لَهُمْ: \"فَاكْلَفُوا مِنَ الْعَمَلِ مَا تُطِيقُونَ\". (ق)", "malayalam": "അബൂഹുറൈറ(റ): നോമ്പുമുറിക്കാതെ തുടർച്ചയായി നോമ്പ് അനുഷ്ഠിക്കുന്നത് റസൂൽ(സ) നിരോധിച്ചു. മുസ്ലിംകളിൽപെട്ട ഒരു വ്യക്തി റസൂൽ(സ)യോടു ചോദിച്ചു: ദൈവദൂതരേ, അവിടന്ന് വ്രതങ്ങൾ ചേർത്ത് അനുഷ്ഠിക്കുന്നുല്ലോ. റസൂൽ(സ) പ്രതിവചിച്ചു: \"എന്നെപ്പോലെ നിങ്ങളിൽ ആരുണ്ട്? ഞാൻ രാത്രി ഉറങ്ങുമ്പോൾ എന്റെ നാഥൻ എനിക്ക് ആഹാരവും പാനീയവും നൽകുന്നു.\" അവർക്ക് അതിൽനിന്നു വിരമിക്കാൻ മനസ്സില്ലെന്നു കണ്ടപ്പോൾ അവരെയും കൂട്ടി തിരുമേനി(സ) രണ്ടുദിവസം നോമ്പനുഷ്ഠിച്ചു. പിന്നീടവർ ചന്ദ്രപ്പിറവി കണ്ടു. \"മാസപ്പിറവി കാണാൻ വൈകിയിരുന്നെങ്കിൽ ഇതിലുമധികം ദിവസം നിങ്ങൾക്കു ഞാൻ നോമ്പുണ്ടാക്കിത്തരുമായിരുന്നു\"വെന്ന് തിരുമേനി(സ) പറഞ്ഞു. ഒരു പകലിലധികം നോമ്പനുഷ്ഠിക്കരുതെന്നു തിരുമേനി(സ) അരുളിയത് അവർ കൂട്ടാക്കാതിരുന്നതിൽ പ്രതിഷേധമെന്ന നിലക്കാണ് റസൂൽ(സ) ഇതു പറഞ്ഞത്. അബൂഹുറൈറ(റ)വിൽനിന്നുള്ള മറ്റൊരു ഉദ്ധരണിയിൽ ഇങ്ങനെ വന്നിട്ടുണ്ട്: \"നിങ്ങളുടെ കഴിവനുസരിച്ചുള്ള സൽകർമ്മങ്ങളുടെ ബാധ്യത മാത്രം നിങ്ങളേറ്റെടുക്കുക.\" (ബു,മു)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["ق"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ عَنْهُ قَالَ لَهُمْ: \"فَاكْلَفُوا مِنَ الْعَمَلِ مَا تُطِيقُونَ\". (ق)", "malayalam": null}], "bab_seq": 26, "page_start": 75}, {"hadith_no": 106, "arabic": "عَنْ أَبِي سَعِيدٍ الْخُدْرِي رَضِيَ اللَّهُ عَنْهُ: أَنَّهُ سَمِعَ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ: \"لَا تُوَاصِلُوا، فَأَيُّكُمْ إِذَا أَرَادَ أَنْ يُوَاصِلَ فَلْيُوَاصِلْ حَتَّى السَّحَرِ\". قَالُوا: فَإِنَّكَ تُوَاصِلُ؟ قَالَ: \"إِنِّي لَسْتُ كَهَيْئَتِكُمْ، إِنَّ لِي مُطْعِمًا يُطْعِمُنِي وَسَاقِيًا يَسْقِينِي\". (خ,د)", "malayalam": "അബൂസഈദുൽ ഖുദ്‌രി(റ): റസൂൽ(സ) പറയുന്നത് അദ്ദേഹം കേട്ടു: \"നിങ്ങൾ തുടർച്ചയായി നോമ്പനുഷ്ഠിക്കരുത്. ആരെങ്കിലും നോമ്പുമുറിക്കാതെ തുടരാനുദ്ദേശിക്കുകയാണെങ്കിൽ അത്താഴസമയം വരെ അവൻ തുടർന്നുകൊള്ളട്ടെ.\" അവർ ചോദിച്ചു: അവിടുന്ന് വ്രതം മുറിക്കാതെ തുടരുന്നല്ലോ? തിരുമേനി(സ) മറുപടി പറഞ്ഞു: \"ഞാൻ നിങ്ങളെപ്പോലെയല്ല. തീർച്ചയായും എനിക്ക് കുടിപ്പിക്കുന്നവനും ഭക്ഷിപ്പിക്കുന്നവനുമുണ്ട്.\" (ബു,ദ)", "narrator_ml": "അബൂസഈദുൽ ഖുദ്‌രി(റ)", "source_codes_ar": ["خ", "د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 26, "page_start": 76}, {"hadith_no": 107, "arabic": "عَنْ أَنَسٍ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"لَا تُوَاصِلُوا\". قَالُوا: فَإِنَّكَ تُوَاصِلُ يَا رَسُولَ اللَّهِ، قَالَ: \"إِنِّي لَسْتُ كَأَحَدِكُمْ، إِنَّ رَبِّي يُطْعِمُنِي وَيَسْقِينِي\". (ق,ت)", "malayalam": "അനസ്(റ): റസൂൽ(സ) പറഞ്ഞു: \"നിങ്ങൾ തുടർച്ചയായി നോമ്പനുഷ്ഠിക്കരുത്.\" അവർ ചോദിച്ചു: റസൂലേ, അങ്ങ് തുടർച്ചയായി നോമ്പനുഷ്ഠിക്കുന്നുവല്ലോ? റസൂൽ(സ) പറഞ്ഞു: \"ഞാൻ നിങ്ങളെപ്പോലെയല്ല, എന്റെ റബ്ബ് എനിക്ക് ഭക്ഷണവും വെള്ളവും നൽകുന്നു.\" (ബു,മു,തു,)", "narrator_ml": "അനസ്(റ)", "source_codes_ar": ["ق", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 26, "page_start": 76}, {"hadith_no": 108, "arabic": "عَنْ أُمِّ سَلَمَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: مَا رَأَيْتُ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ شَهْرَيْنِ مُتَتَابِعَيْنِ إِلَّا شَعْبَانَ وَرَمَضَانَ. حَسَنٌ. (د,ت,ن)", "malayalam": "ഉമ്മുസലമ(റ): റമളാൻ മാസവും ശഅബാൻ മാസവുമൊഴികെ തുടർച്ചയായി രണ്ടുമാസം റസൂൽ(സ) വ്രതമനുഷ്ഠിച്ചതായി ഞാൻ കണ്ടിട്ടില്ല. (ദ,തു,ന)", "narrator_ml": "ഉമ്മുസലമ(റ)", "source_codes_ar": ["د", "ت", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 26, "page_start": 76}, {"hadith_no": 109, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا، وَقَدْ سُئِلَتْ عَنْ صِيَامِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ؟ فَقَالَتْ: كَانَ يَصُومُ شَعْبَانَ كُلَّهُ حَتَّى يَصِلَهُ بِرَمَضَانَ. (ت,ن,جه)", "malayalam": "ആഇശ(റ): പ്രവാചകരു(സ)ടെ വ്രതത്തെ കുറിച്ച് ചോദിക്കപ്പെട്ടപ്പോൾ മഹതി പ്രതിവചിച്ചു. റമളാൻ മാസത്തോട് ചേർക്കുവോളം ശഅബാൻ മുഴുവൻ തിരുമേനി(സ) നോമ്പ് അനുഷ്ഠിച്ചിരുന്നു. (തു,ന,ജ.)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["ت", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 26, "page_start": 76}, {"hadith_no": 110, "arabic": "عَنْ أَبِي جُحَيْفَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: آخَى النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بَيْنَ سَلْمَانَ وَأَبِي الدَّرْدَاءِ رَضِيَ اللَّهُ عَنْهُمَا فَزَارَ سَلْمَانُ أَبَا الدَّرْدَاءِ، فَرَأَى أُمَّ الدَّرْدَاءِ مُتَبَذِّلَةً، فَقَالَ لَهَا: مَا شَأْنُكِ؟ قَالَتْ: أَخُوكَ أَبُو الدَّرْدَاءِ لَيْسَ لَهُ حَاجَةٌ فِي الدُّنْيَا، فَجَاءَ أَبُو الدَّرْدَاءِ فَصَنَعَ لَهُ طَعَامًا، فَقَالَ: كُلْ، قَالَ: فَإِنِّي صَائِمٌ، قَالَ: مَا أَنَا بِآكِلٍ حَتَّى تَأْكُلَ، فَأَكَلَ. فَلَمَّا كَانَ اللَّيْلُ ذَهَبَ أَبُو الدَّرْدَاءِ يَقُومُ، قَالَ: نَمْ فَنَامَ، ثُمَّ ذَهَبَ يَقُومُ، فَقَالَ: نَمْ، فَلَمَّا كَانَ مِنْ آخِرِ اللَّيْلِ قَالَ سَلْمَانُ: قُمِ الْآنَ، فَصَلَّيَا، فَقَالَ لَهُ سَلْمَانُ: إِنَّ لِرَبِّكَ عَلَيْكَ حَقًّا، وَلِنَفْسِكَ عَلَيْكَ حَقًّا، وَلِأَهْلِكَ عَلَيْكَ حَقًّا، فَأَعْطِ كُلَّ ذِي حَقٍّ حَقَّهُ، فَأَتَى النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَذَكَرَ ذَلِكَ لَهُ فَقَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"صَدَقَ سَلْمَانُ\". (خ)", "malayalam": "അബുജുഹൈഫ(റ): സൽമാൻ(റ), അബുദ്ദർദാഅ്(റ) എന്നിവർക്കിടയിൽ തിരുമേനി(സ) സാഹോദര്യ ബന്ധം സ്ഥാപിച്ചു. സൽമാൻ(റ) അബുദ്ദർദാഅ്(റ)വിനെ സന്ദർശിച്ചു. അപ്പോൾ ഉമ്മുദർദാഅ് മോടിയിലും സൗന്ദര്യത്തിലും ശ്രദ്ധിക്കാത്തതായി അദ്ദേഹം കണ്ടു. നിങ്ങൾക്കെന്തുപറ്റി? അദ്ദേഹം അന്വേഷിച്ചു. താങ്കളുടെ സഹോദരൻ അബുദ്ദർദാഅ്(റ)ന് ഐഹിക കാര്യങ്ങളിൽ യാതൊരു പ്രതിപത്തിയുമില്ല എന്നവർ മറുപടി പറഞ്ഞു. അതിനിടക്ക് അബുദ്ദർദാഅ്(റ) വന്നു. ഉടനെ അദ്ദേഹത്തിനു ഭക്ഷണം തയ്യാറാക്കി. സൽമാൻ(റ) പറഞ്ഞു: നിങ്ങളും കഴിച്ചുകൊള്ളുക. അബുദ്ദർദാഅ്(റ) പറഞ്ഞു: ഞാൻ നോമ്പുകാരനാണ്. സൽമാൻ(റ) പറഞ്ഞു: നിങ്ങൾ തിന്നാതെ ഞാൻ തിന്നൂല. അപ്പോൾ അബുദ്ദർദാഅ്(റ) തിന്നു. രാത്രിയായപ്പോൾ അബുദ്ദർദാഅ്(റ) നിസ്കരിക്കാൻ തുടങ്ങി. താങ്കൾ പോയി കിടന്നുറങ്ങുക എന്ന് സൽമാനുപദേശിച്ചു. അപ്പോഴദ്ദേഹം പോയി കിടന്നുറങ്ങി. വീണ്ടും എഴുന്നേറ്റ് നിസ്കരിക്കാൻ തുടങ്ങി. പോയി കിടന്നുറങ്ങുക എന്ന് സൽമാനുപദേശിച്ചു. രാത്രിയുടെ അന്ത്യയാമങ്ങളിൽ അദ്ദേഹം അബുദ്ദർദാഇനെ വിളിച്ചു പറഞ്ഞു: ഇപ്പോൾ എഴുന്നേറ്റു നിസ്കരിക്കുക. അങ്ങനെ അവരൊന്നിച്ചു നിസ്കരിച്ചു. തുടർന്ന് സൽമാൻ(റ) പറഞ്ഞു: നിങ്ങൾക്ക് നിങ്ങളുടെ നാഥനോട് ഒരു കടപ്പാടുണ്ട്. നിങ്ങൾക്ക് നിങ്ങളുടെ ശരീരത്തോട് ഒരു കടപ്പാടുണ്ട്. നിങ്ങൾക്ക് നിങ്ങളുടെ ഭാര്യയോട് ഒരു കടപ്പാടുണ്ട്. അതിനാൽ എല്ലാവരോടുമുള്ള കടപ്പാടുകൾ നിറവേറ്റുക. സൽമാൻ(റ) തിരുമേനി(സ)യുടെ സന്നിധിയിൽ ചെന്ന് വിവരങ്ങൾ പറഞ്ഞു. \"സൽമാൻ(റ) പറഞ്ഞത് സത്യമെ\"ന്ന് അവിടന്ന് പ്രതികരിച്ചു. (ബു)", "narrator_ml": "അബുജുഹൈഫ(റ)", "source_codes_ar": ["خ"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 26, "page_start": 76}, {"hadith_no": 111, "arabic": "عَنْ عَبْدِ اللَّهِ بْنِ عَمْرِو بْنِ الْعَاصِ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: بَلَغَ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنِّي أَصُومُ أَسْرُدُ، وَأُصَلِّي اللَّيْلَ، فَإِمَّا أَرْسَلَ إِلَيَّ وَإِمَّا لَقِيتُهُ، فَقَالَ: \"أَلَمْ أُخْبَرْ أَنَّكَ تَصُومُ وَلَا تُفْطِرُ وَتُصَلِّي اللَّيْلَ؟ فَلَا تَفْعَلْ، فَإِنَّ لِعَيْنِكَ حَظًّا، وَلِنَفْسِكَ حَظًّا، وَلِأَهْلِكَ حَظًّا. فَصُمْ وَأَفْطِرْ، وَصَلِّ وَنَمْ، وَصُمْ مِنْ كُلِّ عَشَرَةِ أَيَّامٍ يَوْمًا، وَلَكَ أَجْرُ تِسْعَةٍ\". قَالَ: إِنِّي أَجِدُنِي أَقْوَى مِنْ ذَلِكَ يَا نَبِيَّ اللَّهِ، قَالَ: \"فَصُمْ صِيَامَ دَاوُدَ عَلَيْهِ السَّلَامُ\". قَالَ: وَكَيْفَ كَانَ دَاوُدُ يَصُومُ يَا نَبِيَّ اللَّهِ؟ قَالَ: \"كَانَ يَصُومُ يَوْمًا وَيُفْطِرُ يَوْمًا، وَلَا يَفِرُّ إِذَا لَاقَى\". قَالَ: مَنْ لِي بِهَذِهِ يَا نَبِيَّ اللَّهِ؟. قَالَ عَطَاءٌ: فَلَا أَدْرِي كَيْفَ ذَكَرَ صِيَامَ الْأَبَدِ، فَقَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"لَا صَامَ مَنْ صَامَ الْأَبَدَ، لَا صَامَ مَنْ صَامَ الْأَبَدَ\". (م,ن)", "malayalam": "അബ്ദുല്ലാഹിബ്നു അംരിബ്നിൽ ആസ്(റ): ഞാൻ രാത്രിയിൽ നിസ്കരിക്കുകയും തുടർച്ചയായി നോമ്പനുഷ്ഠിക്കുകയും ചെയ്യുന്നകാര്യം നബി(സ) അറിഞ്ഞു. അങ്ങനെയിരിക്കെ എന്റെയടുത്തേക്ക് ആളെ അയച്ചു, അല്ലെങ്കിൽ ഞാനുമായി കണ്ടുമുട്ടി. നബി(സ) പറഞ്ഞു: \"നിങ്ങൾ തുടർച്ചയായി മുറിക്കാതെ നോമ്പനുഷ്ഠിക്കുകയും, രാത്രി നിസ്കരിക്കുകയും ചെയ്യുന്നതായി അറിഞ്ഞു. അപ്രകാരം ചെയ്യരുത്. നിങ്ങളുടെ കണ്ണിനും ശരീരത്തിനും കുടുംബത്തിനും ചില കടപ്പാടുകളുണ്ട്. അതുകൊണ്ട് നോമ്പനുഷ്ഠിക്കുകയും മുറിക്കുകയും ചെയ്യുക, നിസ്കരിക്കുകയും ഉറങ്ങുകയും ചെയ്യുക. എല്ലാ പത്ത് ദിവസത്തിലും ഒരു ദിവസം നോമ്പനുഷ്ഠിക്കുക. എന്നാൽ ബാക്കി ഒൻപതിന്റെയും പ്രതിഫലം നിങ്ങൾക്ക് ലഭിക്കും.\" അബ്ദുല്ലാ(റ) പറഞ്ഞു: എനിക്കതിലേറെ ചെയ്യാൻ കഴിവുണ്ട്, പ്രവാചകരെ. നബി(സ) പറഞ്ഞു: \"എന്നാൽ നിങ്ങൾ ദാവൂദ്നബി(അ)ന്റെ നോമ്പനുഷ്ഠിക്കുക.\" അദ്ദേഹം ചോദിച്ചു. ദാവൂദ്(അ)ന്റെ നോമ്പ് എപ്രകാരമാണ്, പ്രവാചകരെ. നബി(സ) പറഞ്ഞു: \"ഒരു ദിവസം നോമ്പനുഷ്ഠിക്കുകയും, അടുത്ത ദിവസം നോമ്പുപേക്ഷിക്കുകയും ചെയ്യും. ശത്രുവിനെ കണ്ടാൽ അദ്ദേഹം പിൻമാറില്ല.\" അബ്ദുല്ലാ(റ) പറഞ്ഞു: പ്രവാചകരെ, ആരാണ് എനിക്കിതുകൊണ്ട് ജാമ്യം നിൽക്കുക. അത്വാഅ്(റ) പറയുന്നു: കാലം മുഴുവൻ നോമ്പനുഷ്ഠിക്കുന്നതിനെക്കുറിച്ച് റസൂൽ(സ) എന്തുകൊണ്ടാണ് പറഞ്ഞതെന്ന് എനിക്കറിയില്ല. നബി(സ) പറഞ്ഞു: \"കാലം മുഴുവൻ നോമ്പനുഷ്ഠിക്കുന്നവർക്ക് നോമ്പില്ല. കാലം മുഴുവൻ നോമ്പനുഷ്ഠിക്കുന്നവർ നോമ്പനുഷ്ഠിച്ചിട്ടില്ല.\" (മു,ന)", "narrator_ml": "അബ്ദുല്ലാഹിബ്നു അംരിബ്നിൽ ആസ്(റ)", "source_codes_ar": ["م", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 26, "page_start": 77}, {"hadith_no": 112, "arabic": "عَنْ عَبْدِ اللَّهِ بْنِ شَقِيقٍ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: قُلْتُ لِعَائِشَةَ رَضِيَ اللَّهُ عَنْهَا: أَكَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَصُومُ شَهْرًا كُلَّهُ؟ قَالَتْ: مَا عَلِمْتُهُ صَامَ شَهْرًا كُلَّهُ إِلَّا رَمَضَانَ، وَلَا أَفْطَرَهُ كُلَّهُ حَتَّى يَصُومَ مِنْهُ، حَتَّى مَضَى لِسَبِيلِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. (م)", "malayalam": "അബ്ദുല്ലാഹിബ്നു ശഖീഖ്(റ): ഞാൻ ആഇശ(റ)യോട് ചോദിച്ചു: മാസം മുഴുവൻ നബി(സ) നോമ്പ് അനുഷ്ഠിച്ചിരുന്നോ? അവർ മറുപടി നൽകി: റമളാനിലല്ലാതെ നബി(സ) മാസം മുഴുവനും നോമ്പെടുത്തതായി എനിക്കറിയില്ല. ഒരു മാസവും നോമ്പെടുക്കാതിരുന്നിട്ടുമില്ല. വിയോഗം വരെ അങ്ങനെയായിരുന്നു. (മു.)", "narrator_ml": "അബ്ദുല്ലാഹിബ്നു ശഖീഖ്(റ)", "source_codes_ar": ["م"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 26, "page_start": 77}, {"hadith_no": 113, "arabic": "عَنْ أَبِي قَتَادَةَ رَضِيَ اللَّهُ عَنْهُ: أَنَّ رَجُلًا أَتَى النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ: يَا رَسُولَ اللَّهِ، كَيْفَ تَصُومُ؟ فَغَضِبَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مِنْ قَوْلِهِ، فَلَمَّا رَأَى ذَلِكَ عُمَرُ رَضِيَ اللَّهُ عَنْهُ قَالَ: رَضِينَا بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ نَبِيًّا، نَعُوذُ بِاللَّهِ مِنْ غَضَبِ اللَّهِ وَغَضَبِ رَسُولِهِ. فَلَمْ يَزَلْ عُمَرُ رَضِيَ اللَّهُ عَنْهُ يُرَدِّدُهَا حَتَّى سَكَنَ غَضَبُ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، فَقَالَ: يَا رَسُولَ اللَّهِ، كَيْفَ بِمَنْ يَصُومُ الدَّهْرَ كُلَّهُ؟ قَالَ: \"لَا صَامَ وَلَا أَفْطَرَ. أَوْ: لَمْ يَصُمْ وَلَمْ يُفْطِرْ. أَوْ: مَا صَامَ وَلَا أَفْطَرَ\". قَالَ: يَا رَسُولَ اللَّهِ، كَيْفَ بِمَنْ يَصُومُ يَوْمَيْنِ وَيُفْطِرُ يَوْمًا؟ قَالَ: \"أَوَ يُطِيقُ ذَلِكَ أَحَدٌ\". قَالَ: يَا رَسُولَ اللَّهِ، فَكَيْفَ بِمَنْ يَصُومُ يَوْمًا وَيُفْطِرُ يَوْمًا؟ قَالَ: \"ذَلِكَ صَوْمُ دَاوُدَ عَلَيْهِ السَّلَامُ\". قَالَ: يَا رَسُولَ اللَّهِ، فَكَيْفَ بِمَنْ يَصُومُ يَوْمًا وَيُفْطِرُ يَوْمَيْنِ؟ قَالَ: \"وَدِدْتُ أَنِّي طُوِّقْتُ ذَلِكَ\". ثُمَّ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"ثَلَاثٌ مِنْ كُلِّ شَهْرٍ، وَرَمَضَانُ إِلَى رَمَضَانَ، فَهَذَا صِيَامُ الدَّهْرِ كُلِّهِ. وَصِيَامُ عَرَفَةَ: إِنِّي أَحْتَسِبُ عَلَى اللَّهِ أَنْ يُكَفِّرَ السَّنَةَ الَّتِي قَبْلَهُ وَالسَّنَةَ الَّتِي بَعْدَهُ. وَصَوْمُ يَوْمِ عَاشُورَاءَ: إِنِّي أَحْتَسِبُ عَلَى اللَّهِ أَنْ يُكَفِّرَ السَّنَةَ الَّتِي قَبْلَهُ\". وَفِي رِوَايَةٍ: قَالَ: يَا رَسُولَ اللَّهِ، أَرَأَيْتَ صَوْمَ يَوْمِ الِاثْنَيْنِ وَيَوْمِ الْخَمِيسِ؟ قَالَ: \"فِيهِ وُلِدْتُ، وَفِيهِ أُنْزِلَ عَلَيَّ الْقُرْآنُ\". (ق,د,ت,ن,جه)", "malayalam": "അബൂഖതാദ(റ): ഒരിക്കൽ നബി(സ)യുടെ അടുക്കൽ വന്ന് ഒരാൾ ചോദിച്ചു: അല്ലാഹുവിന്റെ റസൂലേ, എങ്ങനെയാണ് അവിടന്ന് നോമ്പെടുക്കാറുള്ളത്? അദ്ദേഹത്തിന്റെ ചോദ്യം കാരണം നബി(സ) കോപിച്ചു. നബി(സ) ദേഷ്യപ്പെട്ടതു കണ്ടപ്പോൾ ഉമർ(റ) പറഞ്ഞു: ഞങ്ങൾ അല്ലാഹുവിനെ രക്ഷിതാവായും ഇസ്ലാമിനെ മതമായും മുഹമ്മദ് നബി(സ)യെ നബിയായും തൃപ്തിപ്പെട്ടിരിക്കുന്നു. അല്ലാഹുവിന്റെ കോപത്തിൽനിന്നും അവന്റെ പ്രവാചകന്റെ കോപത്തിൽനിന്നും ഞങ്ങൾ അല്ലാഹുവിങ്കൽ അഭയം തേടുന്നു. നബി(സ)യുടെ കോപം അവസാനിക്കുംവരെ ഉമർ(റ) ഇത് ആവർത്തിച്ചു. ശേഷം ഉമർ(റ) ചോദിച്ചു: അല്ലാഹുവിന്റെ റസൂലേ, കാലാകാലം നോമ്പെടുക്കുന്നവന്റെ അവസ്ഥയെന്താണ്? നബി(സ) പറഞ്ഞു: \"അവർ നോമ്പെടുക്കുകയോ, നോമ്പ് തുറക്കുകയോ ചെയ്തിട്ടില്ല. അല്ലെങ്കിൽ നോമ്പനുഷ്ഠിക്കുകയോ മുറിക്കുകയോ ചെയ്തിട്ടില്ല.\" ഉമർ(റ) ചോദിച്ചു: രണ്ട് ദിവസം നോമ്പെടുക്കുകയും ഒരു ദിവസം നോമ്പെടുക്കാതിരിക്കുകയും ചെയ്യുന്നവന്റെ അവസ്ഥയെന്താണ്? നബി(സ) പറഞ്ഞു: \"ആർക്കെങ്കിലും അത് സാധിക്കുമോ?\" ഉമർ(റ) ചോദിച്ചു: ഒരു ദിവസം നോമ്പെടുക്കുകയും ഒരു ദിവസം നോമ്പ് എടുക്കാതിരിക്കുകയും ചെയ്യുന്നവന്റെ അവസ്ഥയെന്താണ്? നബി(സ) പറഞ്ഞു: \"അതാണ് ദാവൂദ് നബി(അ)യുടെ നോമ്പ്.\" ഉമർ(റ) ചോദിച്ചു: ഒരു ദിവസം നോമ്പെടുത്ത് രണ്ടു ദിനങ്ങൾ നോമ്പെടുക്കാതിരിക്കുന്നവന്റെ അവസ്ഥയോ? നബി(സ) പറഞ്ഞു: \"അങ്ങനെ ചെയ്യാൻ എനിക്ക് സാധിക്കട്ടെ എന്ന് ഞാൻ ആഗ്രഹിക്കുന്നു.\" തുടർന്ന് നബി(സ) പറഞ്ഞു: \"ഓരോ മാസവും മൂന്ന് ദിവസങ്ങളും റമദാൻ മാസവും നോമ്പെടുത്താൽ അത് എല്ലാ കാലത്തും നോമ്പെടുത്തതിന് തുല്യമാണ്. അറഫയുടെ നോമ്പെടുത്താൽ അതിനു മുമ്പും പിമ്പുമുള്ള വർഷങ്ങളിലെ പാപങ്ങൾ അല്ലാഹു പൊറുത്തുകൊടുക്കുമെന്ന് ഞാൻ വിചാരിക്കുന്നു. ആശൂറാഅ് നോമ്പെടുത്താൽ മുമ്പുള്ള ഒരു വർഷത്തെ പാപം അല്ലാഹു പൊറുത്തുകൊടുക്കുമെന്നു ഞാൻ പ്രതീക്ഷിക്കുന്നു.\"\nമറ്റൊരു നിവേദനത്തിൽ: ഉമർ(റ) ചോദിച്ചു: തിങ്കളാഴ്ചയിലെയും വ്യാഴാഴ്ചയിലെയും നോമ്പിനെപ്പറ്റി അവിടന്ന് എന്തുപറയുന്നു? നബി(സ) പറഞ്ഞു: \"അന്നേദിവസമാണ് ഞാൻ ജനിച്ചത്. എനിക്ക് ഖുർആൻ അവതരിച്ചതും അന്നാണ്.\" (ബു,മു,ദ,തു,ന,ജ)", "narrator_ml": "അബൂഖതാദ(റ)", "source_codes_ar": ["ق", "د", "ت", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: قَالَ: يَا رَسُولَ اللَّهِ، أَرَأَيْتَ صَوْمَ يَوْمِ الِاثْنَيْنِ وَيَوْمِ الْخَمِيسِ؟ قَالَ: \"فِيهِ وُلِدْتُ، وَفِيهِ أُنْزِلَ عَلَيَّ الْقُرْآنُ\". (ق,د,ت,ن,جه)", "malayalam": "മറ്റൊരു നിവേദനത്തിൽ: ഉമർ(റ) ചോദിച്ചു: തിങ്കളാഴ്ചയിലെയും വ്യാഴാഴ്ചയിലെയും നോമ്പിനെപ്പറ്റി അവിടന്ന് എന്തുപറയുന്നു? നബി(സ) പറഞ്ഞു: \"അന്നേദിവസമാണ് ഞാൻ ജനിച്ചത്. എനിക്ക് ഖുർആൻ അവതരിച്ചതും അന്നാണ്.\" (ബു,മു,ദ,തു,ന,ജ)"}], "bab_seq": 26, "page_start": 78}, {"hadith_no": 114, "arabic": "عَنْ عَبْدِ اللَّهِ بْنِ عَمْرِو بْنِ الْعَاصِ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: لَقِيَنِي رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، فَقَالَ: \"أَلَمْ أُحَدَّثْ أَنَّكَ تَقُولُ: لَأَقُومَنَّ اللَّيْلَ، وَلَأَصُومَنَّ النَّهَارَ\". قَالَ: نَعَمْ يَا رَسُولَ اللَّهِ، قَدْ قُلْتُ ذَاكَ. قَالَ: \"قُمْ وَنَمْ، وَصُمْ وَأَفْطِرْ، وَصُمْ مِنْ كُلِّ شَهْرٍ ثَلَاثَةَ أَيَّامٍ، وَذَاكَ مِثْلُ صِيَامِ الدَّهْرِ\". قَالَ: قُلْتُ: يَا رَسُولَ اللَّهِ، إِنِّي أُطِيقُ أَفْضَلَ مِنْ ذَلِكَ؟ قَالَ: \"فَصُمْ يَوْمًا وَأَفْطِرْ يَوْمَيْنِ\". قَالَ: فَقُلْتُ: إِنِّي أُطِيقُ أَفْضَلَ مِنْ ذَلِكَ؟ قَالَ: \"فَصُمْ يَوْمًا وَأَفْطِرْ يَوْمًا، وَهُوَ أَعْدَلُ الصِّيَامِ، وَهُوَ صِيَامُ دَاوُدَ\". قُلْتُ: إِنِّي أُطِيقُ أَفْضَلَ مِنْ ذَلِكَ؟ فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"لَا أَفْضَلَ مِنْ ذَلِكَ\". (ق,د,ن)", "malayalam": "അബ്ദുല്ലാഹിബ്നു അംറ്(റ): നബി(സ) എന്നെ കണ്ടുമുട്ടിയപ്പോൾ ചോദിച്ചു: \"രാത്രിമുഴുവൻ നിസ്കരിക്കുമെന്നും പകൽമുഴുവൻ നോമ്പെടുക്കുമെന്നും നിങ്ങൾ പറഞ്ഞതായി എനിക്ക് വിവരം കിട്ടിയല്ലോ?\" അദ്ദേഹം പറഞ്ഞു: അതെ, റസൂലെ, ഞാനങ്ങനെ പറഞ്ഞിരുന്നു. നബി(സ) പറഞ്ഞു: \"നിസ്കരിക്കുകയും ഉറങ്ങുകയും ചെയ്യുക. നോമ്പെടുക്കുകയും നോമ്പെടുക്കാതിരിക്കുകയും ചെയ്യുക. മാസത്തിൽ മൂന്ന് ദിവസം നോമ്പെടുക്കുക. അതു കാലം മുഴുവൻ നോമ്പെടുത്തതുപോലെയാണ്.\" അദ്ദേഹം പറയുന്നു: ഞാൻ പറഞ്ഞു: റസൂലെ, അതിനേക്കാൾ ചെയ്യാൻ എനിക്കാവും. നബി(സ) പറഞ്ഞു: \"ഒരുദിവസം നോമ്പെടുത്ത് രണ്ടുദിവസം നോമ്പെടുക്കാതിരിക്കുക.\" അദ്ദേഹം പറയുന്നു: ഞാൻ പറഞ്ഞു: അതിനേക്കാൾ ചെയ്യാൻ എനിക്കാവും? നബി(സ) പറഞ്ഞു: \"ഒരുദിവസം നോമ്പെടുത്ത് ഒരുദിവസം നോമ്പെടുക്കാതിരിക്കുക. അതാണ് മിതമായ നോമ്പ്. ദാവൂദ്(അ)മിന്റെ നോമ്പത്രെ അത്.\" ഞാൻ പറഞ്ഞു: അതിനേക്കാൾ ചെയ്യാൻ എനിക്കാവും? നബി(സ) പറഞ്ഞു: \"അതിനേക്കാൾ ശ്രേഷ്ഠമായി ഒന്നുമില്ല.\" (ബു,മു,ദ,ന)", "narrator_ml": "അബ്ദുല്ലാഹിബ്നു അംറ്(റ)", "source_codes_ar": ["ق", "د", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 26, "page_start": 78}, {"hadith_no": 115, "arabic": "وَقَالَ فِي هَذِهِ الرِّوَايَةِ، فَكَانَ عَبْدُ اللَّهِ يَقُولُ بَعْدَ مَا كَبِرَ: يَا لَيْتَنِي قَبِلْتُ رُخْصَةَ النَّبِيِّ صَلَّى اللَّه  null, "variants": [], "bab_seq": 26, "page_start": 79}, {"hadith_no": 117, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا: أَنَّ حَمْزَةَ بْنَ عَمْرٍو الْأَسْلَمِيَّ - رَضِيَ اللَّهُ عَنْهُ - سَأَلَ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ: يَا رَسُولَ اللَّهِ، إِنِّي رَجُلٌ أَسْرُدُ الصَّوْمَ، أَفَأَصُومُ فِي السَّفَرِ؟ قَالَ: \"صُمْ إِنْ شِئْتَ، أَوْ أَفْطِرْ إِنْ شِئْتَ\". (ن)", "malayalam": "ആഇശ(റ): ഹംസതുബ്നു അംറുൽ അസ്ലമി(റ) നബി(സ)യോട് ചോദിച്ചു: പ്രവാചകരേ ഞാൻ എന്നും നോമ്പനുഷ്ഠിക്കുന്നവനാണ്. യാത്രയിലും ഞാൻ നോമ്പെടുക്കണോ? നബി(സ) പറഞ്ഞു: \"നീ ഉദ്ദേശിക്കുന്നുവെങ്കിൽ നോമ്പെടുക്കുക അല്ലെങ്കിൽ നോമ്പെടുക്കാതിരിക്കുക.\" (ന)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 26, "page_start": 79}, {"hadith_no": 118, "arabic": "عَنْ عَبْدِ اللَّهِ بْنِ عَمْرو رَضِيَ اللَّهُ عَنْهُمَا قَالَ: ذَكَرْتُ لِلنَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ الصَّوْمَ، فَقَالَ: \"صُمْ مِنْ كُلِّ عَشَرَةِ أَيَّامٍ يَوْمًا، وَلَكَ أَجْرُ تِلْكَ التِّسْعَةِ\". فَقُلْتُ: إِنِّي أَقْوَى مِنْ ذَلِكَ. قَالَ: \"صُمْ مِنْ كُلِّ تِسْعَةِ أَيَّامٍ يَوْمًا، وَلَكَ أَجْرُ تِلْكَ الثَّمَانِيَةِ\". قُلْتُ: إِنِّي أَقْوَى مِنْ ذَلِكَ. قَالَ: \"فَصُمْ مِنْ كُلِّ ثَمَانِيَةِ أَيَّامٍ يَوْمًا، وَلَكَ أَجْرُ تِلْكَ السَّبْعَةِ\". قُلْتُ: إِنِّي أَقْوَى مِنْ ذَلِكَ. قَالَ: فَلَمْ يَزَلْ حَتَّى قَالَ: \"صُمْ يَوْمًا وَأَفْطِرْ يَوْمًا\". (ن)", "malayalam": "അബ്ദുല്ലാഹിബ്നു അംറ്(റ): നബി(സ)യോട് വ്രതത്തെക്കുറിച്ച് ഞാൻ സംസാരിച്ചു. അവിടന്ന് അരുളി: \"ഓരോ പത്തിലും ഒരു ദിവസം നീ വ്രതമെടുക്കുക, നിനക്കു ബാക്കി ഒമ്പതു ദിവസത്തിന്റെയും പ്രതിഫലം ലഭിക്കും.\" അപ്പോൾ ഞാൻ പറഞ്ഞു: ഞാൻ അതിനേക്കാൾ ശക്തനാണ്. നബി(സ) അരുളി: \"ഒമ്പതിൽ ഒരു ദിവസം വ്രതമെടുക്കുക. ബാക്കി എട്ടിന്റെയും പ്രതിഫലം നിനക്കുണ്ട്.\" ഞാൻ പറഞ്ഞു: ഞാൻ അതിനേക്കാൾ കഴിവുള്ളവനാണ്. നബി(സ) അരുളി: \"ഓരോ എട്ടിലും ഒരു ദിവസം വ്രതമെടുക്കുക, ബാക്കി ഏഴിന്റെയും പ്രതിഫലം നിനക്കുണ്ട്.\" ഞാൻ പറഞ്ഞു: ഞാൻ അതിനേക്കാളും കഴിവുള്ളവനാണ്. \"ഒരുദിവസം നോമ്പെടുക്കുകയും അടുത

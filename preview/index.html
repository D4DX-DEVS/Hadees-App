للَّهِ، مَا أَحَدٌ أَحْوَجُ مِنِّي. فَضَحِكَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ حَتَّى بَدَتْ أَنْيَابُهُ وَقَالَ لَهُ: \"كُلْهُ\".", "malayalam": "മറ്റൊരു നിവേദനം: ഒരു മനുഷ്യൻ റമളാനിൽ നോമ്പ് മുറിച്ചു. ഒരടിമയെ മോചിപ്പിക്കുവാൻ റസൂൽ(സ) അയാളോടു കൽപിച്ചു. അതിനു കഴിയില്ലെങ്കിൽ രണ്ടുമാസം തുടർച്ചയായി നോമ്പ് അനുഷ്ഠിക്കുവാനും അല്ലെങ്കിൽ പാവപ്പെട്ട അറുപതുപേർക്ക് ഭക്ഷണം നൽകാനും റസൂൽ(സ) അരുളി. എനിക്ക് കഴിയില്ലെന്ന് അയാൾ പ്രവാചകരെ അറിയിച്ചു. റസൂൽ(സ) അയാളോട് ഇരിക്കുവാനാവശ്യപ്പെട്ടു. അപ്പോൾ പ്രവാചകസന്നിധിയിൽ ഒരു കുട്ട കാരക്ക കൊണ്ടുവരപ്പെട്ടു. അതു ദാനം ചെയ്യുവാൻ റസൂൽ(സ) അയാളോട് കൽപിച്ചു. അയാൾ പറഞ്ഞു: എന്നെക്കാൾ അതിന് ആവശ്യമുള്ളവരുണ്ടാവില്ല. ഇതുകേട്ടു റസൂൽ(സ) അവിടത്തെ അണപ്പല്ലുകൾ വെളിവാകുമാർ ചിരിക്കുകയും അത് ഭക്ഷിച്ചുകൊള്ളാൻ അയാളോടു പറയുകയും ചെയ്തു."}, {"seq": 4, "arabic": "وَفِي رِوَايَةٍ: \"أَوْ تُعْتِقَ رَقَبَةً، أَوْ تَصُومَ شَهْرَيْنِ، أَوْ تُطْعِمَ سِتِّينَ مِسْكِينًا\".", "malayalam": "മറ്റൊരു നിവേദനം: \"അല്ലെങ്കിൽ ഒരടിമയെ മോചിപ്പിക്കുക, അല്ലെങ്കിൽ രണ്ട് മാസം നോമ്പനുഷ്ഠിക്കുക, അതുമല്ലെങ്കിൽ പാവപ്പെട്ട അറുപത് പേർക്ക് ഭക്ഷണം നൽകുക.\""}, {"seq": 5, "arabic": "وَفِي رِوَايَةٍ: جَاءَ رَجُلٌ إِلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَفْطَرَ فِي رَمَضَانَ، بِهَذَا الْحَدِيثِ، قَالَ: فَأُتِيَ بِعَرَقٍ فِيهِ تَمْرٌ قَدْرُ خَمْسَةَ عَشَرَ صَاعًا، وَقَالَ فِيهِ: \"كُلْهُ أَنْتَ وَأَهْلُ بَيْتِكَ، وَصُمْ يَوْمًاوَاسْتَغْفِرِ اللَّهَ\". (ق,د,ن)", "malayalam": "മറ്റൊരു നിവേദനം: റമളാനിൽ നോമ്പ്മുറിച്ച ഒരു വ്യക്തി റസൂൽ(സ)യുടെ സന്നിധിയിൽ വന്നു. പിന്നെ മേലുദ്ധരിച്ച അതേ ഹദീസ് തുടർന്നു പറയുന്നു: അപ്പോൾ ഒരു കുട്ടയിൽ പതിനഞ്ച് സ്വാഅ് കാരക്ക അവിടെ കൊണ്ടുവരപ്പെട്ടു. റസൂൽ(സ) പറഞ്ഞു: \"ഇത് നീയും നിന്റെ വീട്ടുകാരും ഭക്ഷിക്കുക. ഒരു ദിവസം നോമ്പനുഷ്ഠിക്കുകയും അല്ലാഹുവിനോടു പാപമോചനം തേടുകയും ചെയ്യുക.\" (ദ)"}], "bab_seq": 64, "page_start": 119}, {"hadith_no": 279, "arabic": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا: {وَعَلَى الَّذِينَ يُطِيقُونَهُ فِدْيَةٌ طَعَامُ مِسْكِينٍ}. فَكَانَ مَنْ شَاءَ مِنْهُمْ أَنْ يَفْتَدِيَ بِطَعَامِ مِسْكِينٍ افْتَدَى، وَتَمَّ لَهُ صَوْمُهُ، فَقَالَ: {فَمَنْ تَطَوَّعَ خَيْرًا فَهُوَ خَيْرٌ لَهُ وَأَنْ تَصُومُوا خَيْرٌ لَكُمْ} وَقَالَ: {فَمَنْ شَهِدَ مِنْكُمُ الشَّهْرَ فَلْيَصُمْهُ وَمَنْ كَانَ مَرِيضًا أَوْ عَلَى سَفَرٍ فَعِدَّةٌ مِنْ أَيَّامٍ أُخَرَ} [البقرة:١٨٤] (خ,د,ت,ن)", "malayalam": "ഇബ്നുഅബ്ബാസ്(റ): 'നോമ്പിന് സാധിക്കുന്നവർക്ക് അതിനുപകരമായി ഒരു പാവപ്പെട്ടവനുള്ള ഭക്ഷണം പ്രായശ്ചിത്തമായി നൽകേണ്ടതാണ്.' (അൽബഖറ:183) എന്ന സൂക്തം ഇറങ്ങിയ സന്ദർഭം സഹാബാക്കളിൽ നോമ്പിനുപകരം പാവപ്പെട്ടവന് ഭക്ഷണംനൽകി പ്രായശ്ചിത്തം ചെയ്യാൻ ഉദ്ദേശിച്ചവർ അതു ചെയ്തു. അതോടെ അവരുടെ നോമ്പ് പൂർണമായിരുന്നു. ശേഷം ഇബ്നുഅബ്ബാസ്(റ) ഈ സൂക്തം ഓതി: 'എന്നാൽ ആരെങ്കിലും സ്വയംസന്നദ്ധനായി കൂടുതൽ നന്മ ചെയ്താൽ അതവനു ഗുണകരമാകുന്നു, നിങ്ങൾ നോമ്പനുഷ്ഠിക്കലാണ് നിങ്ങൾക്കേറ്റവുമുത്തമം.' ഇബ്നുഅബ്ബാസ്(റ) തുടർന്നു: 'അതുകൊണ്ട് നിങ്ങളിൽ ആർ ആ മാസത്തിൽ സന്നിഹിതരാണോ അവർ ആ മാസം വ്രതമനുഷ്ഠിക്കേണ്ടതാണ്. ആരെങ്കിലും രോഗിയാവുകയോ യാത്രയിലാവുകയോ ചെയ്താൽ പകരം അത്രയും എണ്ണം നോമ്പെടുക്കേണ്ടതാണ്.' (അൽബഖറ: 184) (ബു,ദ,തു,ന)", "narrator_ml": "ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["خ", "د", "ت", "ن"], "grading_note_ml": null, "grading_note_ar": "البقرة:١٨٤", "explanation_ml": null, "variants": [], "bab_seq": 64, "page_start": 120}, {"hadith_no": 280, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"مَنْ أَفْطَرَ يَوْمًا مِنْ رَمَضَانَ، مِنْ غَيْرِ رُخْصَةٍ، لَمْ يُجْزِهِ صِيَامُ الدَّهْرِ\". (د,ت,جه)", "malayalam": "അബൂഹുറൈറ(റ): റസൂൽ(സ) പറഞ്ഞു: \"റമളാനിലെ ഒരു നോമ്പ് ഒരു കാരണവുമില്ലാതെ ആരെങ്കിലും മുറിച്ചാൽ കാലം മുഴുവൻ നോമ്പനുഷ്ഠിച്ചാലും അതിന് പകരമാവുകയില്ല.\" (ദ,തു,ജ)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["د", "ت", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 64, "page_start": 120}, {"hadith_no": 281, "arabic": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا قَالَ: أُثْبِتَتْ لِلْحُبْلَى وَالْمُرْضِعِ. (د)", "malayalam": "ഇബ്നുഅബ്ബാസ്(റ): മേൽസൂക്തം ഗർഭിണികൾക്കും മുലയൂട്ടുന്ന സ്ത്രീകൾക്കുമുള്ള ആനുകൂല്യമാണ്. (ദ)", "narrator_ml": "ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 65, "page_start": 121}, {"hadith_no": 282, "arabic": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا: {وَعَلَى الَّذِينَ يُطِيقُونَهُ فِدْيَةٌ طَعَامُ مِسْكِينٍ} قَالَ: كَانَتْ رُخْصَةً لِلشَّيْخِ الْكَبِيرِ وَالْمَرْأَةِ الْكَبِيرَةِ، وَهُمَا يُطِيقَانِ الصِّيَامَ: أَنْ يُفْطِرَا وَيُطْعِمَا مَكَانَ كُلِّ يَوْمٍ مِسْكِينًا، وَالْحُبْلَى وَالْمُرْضِعُ إِذَا خَافَتَا- يَعْنِي عَلَى أَوْلَادِهِمَا- أَفْطَرَتَا وَأَطْعَمَتَا. (د)", "malayalam": "ഇബ്നുഅബ്ബാസ്(റ): 'നോമ്പനുഷ്ഠിക്കാൻ സാധിക്കുന്നവർക്ക് അതിനുപകരമായി ഒരു പാവപ്പെട്ടവനു ഭക്ഷണം പ്രായശ്ചിത്തമായി നൽകേണ്ടതാണ്' എന്ന സൂക്തത്തിലെ ആനുകൂല്യം പ്രായംചെന്ന വൃദ്ധന്മാർക്കും സ്ത്രീകൾക്കും ഉള്ളതാണ്. അവർക്കു നോമ്പ് അനുഷ്ഠിക്കാൻ കഴിയുമ്പോൾ തന്നെ നോമ്പു മുറിക്കാം. ഓരോ ദിവസത്തിനും പകരമായി അവർ ഒരു പാവപ്പെട്ടവന്ന് ഭക്ഷണം നൽകണം. ഗർഭിണിയും മുലയൂട്ടുന്ന സ്ത്രീയും വല്ല അപകടവും (നോമ്പ് മൂലം കുട്ടികളുടെ മേൽ ബാധിക്കാവുന്ന) ഭയന്നാൽ അവർക്കും നോമ്പ് മുറിക്കാം; ഭക്ഷണം നൽകിയാൽ മതി. (ദ)", "narrator_ml": "ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 65, "page_start": 121}, {"hadith_no": 283, "arabic": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا فِي قَوْلِهِ عَزَّ وَجَلَّ: {وَعَلَى الَّذِينَ يُطِيقُونَهُ فِدْيَةٌ طَعَامُ مِسْكِينٍ} يُطِيقُونَهُ: يُكَلَّفُونَهُ. {فِدْيَةٌ طَعَامُ مِسْكِينٍ} وَاحِدٍ {فَمَنْ تَطَوَّعَ خَيْرًا} طَعَامُ مِسْكِينٍ آخَرَ، لَيْسَتْ بِمَنْسُوخَةٍ. {فَهُوَ خَيْرٌ لَهُ وَأَنْ تَصُومُوا خَيْرٌ لَكُمْ} لَا يُرَخَّصُ فِي هَذَا إِلَّا لِلَّذِي لَا يُطِيقُ الصِّيَامَ، أَوْ مَرِيضٍ لَا يُشْفَى. (ن)", "malayalam": "മേൽസൂക്തത്തിന്റെ വിശദീകരണത്തിൽ ഇബ്നുഅബ്ബാസ്(റ) പറഞ്ഞു: 'യുത്വീഖൂനഹു' എന്നാൽ 'പ്രയാസപ്പെടുക' എന്നാണുദ്ദേശ്യം. 'മിസ്കീൻ' എന്നതുകൊണ്ട് 'ഒരു പാവപ്പെട്ടവൻ' എന്നാണ് വിവക്ഷ. 'സ്വയം സന്നദ്ധനായി കൂടുതൽ നന്മ ചെയ്യാൻ ഉദ്ദേശിച്ചാൽ' എന്നതുകൊണ്ട് മറ്റൊരു പാവപ്പെട്ടവനും കൂടി ഭക്ഷണം നൽകുക എന്നാണുദ്ദേശ്യം. ആ സൂക്തം ദുർബലമാക്കപ്പെട്ടിട്ടില്ല. എന്നാൽ, 'നിങ്ങൾ നോമ്പനുഷ്ഠിക്കലാണ് നിങ്ങൾക്കു കൂടുതൽ ഗുണകരം'. ഇതിൽ നോമ്പനുഷ്ഠിക്കാൻ കഴിയാത്തവർക്കും മാറാരോഗികൾക്കുമല്ലാതെ ഈ ആനുകൂല്യം ബാധകമല്ല. (ന)", "narrator_ml": "മേൽസൂക്തത്തിന്റെ വിശദീകരണത്തിൽ ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 65, "page_start": 121}, {"hadith_no": 284, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: كُنْتُ أَنَا وَحَفْصَةُ صَائِمَتَيْنِ، فَعُرِضَ لَنَا طَعَامٌ اشْتَهَيْنَاهُ، فَأَكَلْنَا مِنْهُ. فَجَاءَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَبَدَرَتْنِي إِلَيْهِ حَفْصَةُ، وَكَانَتِ ابْنَةَ أَبِيهَا، فَقَالَتْ: يَا رَسُولَ اللَّهِ، إِنَّا كُنَّا صَائِمَتَيْنِ، فَعُرِضَ لَنَا طَعَامٌ اشْتَهَيْنَاهُ فَأَكَلْنَا مِنْهُ؟ قَالَ: \"اقْضِيَا يَوْمًا آخَرَ مَكَانَهُ\". (د,ت)", "malayalam": "ആഇശ(റ): ഞാനും ഹഫ്സ(സ)യും നോമ്പുകാരായിരുന്നു. അപ്പോൾ ഞങ്ങൾക്കിഷ്ടപ്പെട്ട ഒരു ഭക്ഷണം ഞങ്ങൾക്ക് കൊണ്ടുവരപ്പെട്ടു, അങ്ങനെ ഞങ്ങളതിൽനിന്നു ഭക്ഷിച്ചു. അപ്പോൾ റസൂൽ(സ) അവിടെ വന്നു, ഹഫ്സ എന്റെ മുമ്പേപോയി പ്രവാചകർ(സ)യോട് ഇക്കാര്യം അറിയിച്ചു. ഹഫ്സ(റ) പിതാവിന്റെ മകളായിരുന്നു. (തന്റെ പിതാവായ ഉമർ(റ)വിന്റെ അതേ സ്വഭാവക്കാരിയായിരുന്നു എന്നർത്ഥം) ഹഫ്സ(റ) പറഞ്ഞു: അല്ലാഹുവിന്റെ റസൂലേ, ഞങ്ങൾ ഇരുവരും നോമ്പുകാരായിരുന്നു. അങ്ങനെയിരിക്കെ ഞങ്ങൾക്കിഷ്ടപ്പെട്ട ഭക്ഷണം ലഭിച്ചപ്പോൾ ഞങ്ങൾ അതിൽനിന്നു ഭക്ഷിച്ചു. ഞങ്ങളെന്ത് ചെയ്യണം? റസൂൽ(സ) പറഞ്ഞു: \"അതിന് പകരമായി നിങ്ങൾ മറ്റൊരു ദിവസം ഖളാഅ് വീട്ടുക.\" (ദ,തു)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["د", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 66, "page_start": 121}, {"hadith_no": 285, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: مَا كُنْتُ أَقْضِي مَا يَكُونُ عَلَيَّ مِنْ رَمَضَانَ إِلَّا فِي شَعْبَانَ، حَتَّى تُوُفِّيَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. (ق,د,ت,ن,جه)", "malayalam": "ആഇശ(റ): നബി(സ) വഫാതാകും വരെ, എനിക്ക് റമളാനിൽ ഒഴിവായ നോമ്പുകൾ അടുത്ത ശഅ്ബാനിലല്ലാതെ ഞാൻ വീട്ടാറുണ്ടായിരുന്നില്ല. (ബു,മു,ദ,തു,ന,ജ)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["ق", "د", "ت", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 66, "page_start": 122}, {"hadith_no": 286, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: كُنَّا نَحِيضُ عِنْدَ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَيَأْمُرُنَا بِقَضَاءِ الصَّوْمِ. (ت,جه)", "malayalam": "ആഇശ(റ): നബി(സ)യോടൊപ്പം കഴിയവെ ഞങ്ങൾക്ക് ആർത്തവമുണ്ടാവുകയും നോമ്പു ഖളാഅ് വീട്ടാൻ ഞങ്ങളോട് നബി(സ) കൽപ്പിക്കുകയും ചെയ്യാറുണ്ടായിരുന്നു. (തു,ജ)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["ت", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 66, "page_start": 122}, {"hadith_no": 287, "arabic": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا قَالَ: جَاءَ رَجُلٌ إِلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ: يَا رَسُولَ اللَّهِ إِنَّ أُمِّي مَاتَتْ وَعَلَيْهَا صَوْمُ شَهْرٍ أَفَأَقْضِيهِ عَنْهَا؟ قَالَ: \"نَعَمْ، فَدَيْنُ اللَّهِ أَحَقُّ أَنْ يُقْضَى\". (ق,د,ت,جه)", "malayalam": "ഇബ്നുഅബ്ബാസ്(റ): ഒരാൾ പ്രവാചകസവിധത്തിൽ വന്നു പറഞ്ഞു: പ്രവാചകരേ, എന്റെ മാതാവ് മരണപ്പെട്ടു, അവർക്കു ഒരു മാസത്തെ നോമ്പു ഖളാഅ് വീട്ടാനുണ്ട്. ഉമ്മയുടെ നോമ്പ് അവർക്കുവേണ്ടി ഞാൻ ഖളാഅ്വീട്ടട്ടെയോ? റസൂൽ(സ) പറഞ്ഞു: \"അതെ, അല്ലാഹുവിനുള്ള കടംതന്നെയാണു വീട്ടാൻ കൂടുതൽ അർഹമായത്.\" (ബു,മു,ദ,തു,ജ)", "narrator_ml": "ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["ق", "د", "ت", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 67, "page_start": 122}, {"hadith_no": 288, "arabic": "عَنْ بُرَيْدَةَ رَضِيَ اللهُ عَنْهُ قَالَ: بَيْنَا أَنَا جَالِسٌ عِنْدَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِذْ أَتَتْهُ امْرَأَةٌ فَقَالَتْ: إِنِّي تَصَدَّقْتُ عَلَى أُمِّي بِجَارِيَةٍ، وَإِنَّهَا مَاتَتْ، قَالَ: فَقَالَ: \"وَجَبَ أَجْرُكِ، وَرَدَّهَا عَلَيْكِ الْمِيرَاثُ\". قَالَتْ: يَا رَسُولَ اللَّهِ، إِنَّهُ كَانَ عَلَيْهَا صَوْمُ شَهْرٍ، أَفَأَصُومُ عَنْهَا؟ قَالَ: \"صُومِي عَنْهَا\". قَالَتْ: إِنَّهَا لَمْ تَحُجَّ قَطُّ، أَفَأَحُجُّ عَنْهَا؟ قَالَ: \"حُجِّي عَنْهَا\". (م)", "malayalam": "ബുറൈദ(റ): ഞാൻ റസൂൽ(സ)യുടെ സമീപം ഇരിക്കെ ഒരു സ്ത്രീ വന്ന്പറഞ്ഞു: ഞാൻ എന്റെ മരണപ്പെട്ടുപോയ ഉമ്മക്ക് വേണ്ടി ഒരു അടിമസ്ത്രീയെ ദാനം ചെയ്തിരിക്കുന്നു. റസൂൽ(സ) പറഞ്ഞു: \"ദാനം ചെയ്തതിന്റെ പ്രതിഫലം നിനക്ക് തീർച്ചയായും ലഭിക്കുന്നതാണ്. അതിനു പുറമേ നീ ദാനം ചെയ്ത ആ അടിമസ്ത്രീ നിനക്ക് അനന്തരാവകാശമായി ലഭിക്കുകയും ചെയ്തു.\" അവൾ ചോദിച്ചു: അല്ലാഹുവിന്റെ റസൂലേ! എന്റെ മാതാവിന് ഒരു മാസത്തെ നോമ്പു കടമുണ്ട്. അവർക്കുവേണ്ടി ഞാൻ അത് നോറ്റുവീട്ടട്ടെയോ? തിരുമേനി(സ) അരുളി: \"നീ അതു നോറ്റുവീട്ടുക.\" അവർ ചോദിച്ചു. എന്റെ മാതാവ് ഹജ്ജ് ചെയ്തിട്ടേയില്ല. ഞാൻ അവർക്കുവേണ്ടി ഹജ്ജ് ചെയ്യട്ടെയോ? തിരുമേനി(സ) അരുളി: \"നീ അവർക്കുവേണ്ടി ഹജ്ജ് ചെയ്തുകൊള്ളുക.\" (മു)", "narrator_ml": "ബുറൈദ(റ)", "source_codes_ar": ["م"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 67, "page_start": 122}, {"hadith_no": 289, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"مَنْ مَاتَ وَعَلَيْهِ صِيَامٌ، صَامَ عَنْهُ وَلِيُّهُ\". (ق)", "malayalam": "ആഇശ(റ): റസൂൽ(സ) പറഞ്ഞു: നോമ്പ് വീട്ടേണ്ട ബാധ്യതയുണ്ടായിരിക്കെ ഒരാൾ മരിച്ചാൽ അയാളുടെ വലിയ്യ് (സംരക്ഷകൻ) അത് വീട്ടണം.\" (ബു,മു)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["ق"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 67, "page_start": 122}, {"hadith_no": 290, "arabic": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا قَالَ: إِذَا مَرِضَ الرَّجُلُ فِي رَمَضَانَ، ثُمَّ مَاتَ وَلَمْ يَصُمْ، أُطْعِمَ عَنْهُ وَلَمْ يَكُنْ عَلَيْهِ قَضَاءٌ، وَإِنْ كَانَ عَلَيْهِ نَذْرٌ قَضَى عَنْهُ وَلِيُّهُ. (د)", "malayalam": "ഇബ്നുഅബ്ബാസ്(റ): റമളാനിൽ ഒരാൾ രോഗബാധിതനാകുകയും നോമ്പനുഷ്ഠിക്കാതെ അവൻ മരണപ്പെടുകയും ചെയ്താൽ അവനുവേണ്ടി ഭക്ഷണം ദാനം ചെയ്തുകൊള്ളട്ടെ. അവന്ന് ഖളാഅ് വീട്ടൽ നിർബന്ധമില്ല. അവൻ നേർച്ചയാക്കിയ വല്ല നോമ്പും ഉണ്ടെങ്കിൽ അവനുവേണ്ടി അവന്റെ വലിയ്യ് (ഉത്തരവാദപ്പെട്ടവൻ) അത് നോറ്റുകൊള്ളട്ടെ. (ദ)", "narrator_ml": "ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 67, "page_start": 123}, {"hadith_no": 291, "arabic": "عَنِ ابْنِ عُمَرَ رَضِيَ اللهُ عَنْهُمَا، عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"مَنْ مَاتَ وَعَلَيْهِ صِيَامُ شَهْرٍ فَلْيُطْعَمْ عَنْهُ مَكَانَ كُلِّ يَوْمٍ مِسْكِينًا\". قَالَ التِّرْمِذِيُّ: وَالصَّحِيحُ عَنِ ابْنِ عُمَرَ مَوْقُوفٌ قَوْلُهُ. (ت,جه)", "malayalam": "ഇബ്നുഉമർ(റ): നബി(സ) പറഞ്ഞു: \"ഒരു മാസത്തെ നോമ്പ് ബാധ്യതയുണ്ടായിരിക്കെ ഒരാൾ മരണപ്പെട്ടാൽ അവനുവേണ്ടി ഓരോ ദിവസത്തിനും പകരം ഓരോ പാവപ്പെട്ടവന് ഭക്ഷണം കൊടുത്തുകൊള്ളട്ടെ.\" തുർമുദി പറയുന്നു: ഈ ഹദീസിലെ വാക്യങ്ങൾ ഇബ്നുഉമർ(റ)വിൽ നിന്നും 'മൗഖൂഫ്' ആണെന്നാണ് പ്രബലാഭിപ്രായം. (തു,ജ)", "narrator_ml": "ഇബ്നുഉമർ(റ)", "source_codes_ar": ["ت", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 67, "page_start": 123}, {"hadith_no": 292, "arabic": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا قَالَ: جَاءَتِ امْرَأَةٌ إِلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَتْ: يَا رَسُولَ اللَّهِ، إِنَّ أُخْتِي مَاتَتْ وَعَلَيْهَا صِيَامُ شَهْرَيْنِ مُتَتَابِعَيْنِ؟ قَالَ: \"أَرَأَيْتِ لَوْ كَانَ عَلَى أُخْتِكِ دَيْنٌ أَكُنْتِ تَقْضِينَهُ\". قَالَتْ: بَلَى. قَالَ: \"فَحَقُّ اللَّهِ أَحَقُّ\". (ق,د,ت,جه)", "malayalam": "ഇബ്നുഅബ്ബാസ്(റ): ഒരു സ്ത്രീ പ്രവാചകസന്നിധിയിൽ വന്ന് പറഞ്ഞു: അല്ലാഹുവിന്റെ റസൂലേ, എന്റെ സഹോദരി മരണപ്പെട്ടു. അവൾക്ക് തുടർച്ചയായ രണ്ടുമാസത്തെ നോമ്പു നോറ്റുവീട്ടാനുണ്ട്. റസൂൽ(സ) പ്രതിവചിച്ചു: \"നിന്റെ സഹോദരിക്ക് കടമുണ്ടെങ്കിൽ നീ അതു വീട്ടുമോ?\" അവൾ പറഞ്ഞു: അതെ. റസൂൽ(സ) പറഞ്ഞു: \"എന്നാൽ അല്ലാഹുവുമായുള്ള ബാധ്യതയാണ് വീട്ടുവാൻ ഏറ്റവും അർഹമായത്.\" (ബു,മു,ദ,തു,ജ)", "narrator_ml": "ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["ق", "د", "ت", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 67, "page_start": 123}, {"hadith_no": 293, "arabic": "عَنْ أَبِي سَلَمَةَ رَضِيَ اللهُ عَنْهُ قَالَ: سَمِعْتُ عَائِشَةَ رَضِيَ اللهُ عَنْهَا تَقُولُ: كَانَ يَكُونُ عَلَيَّ الصَّوْمُ مِنْ رَمَضَانَ، فَمَا أَسْتَطِيعُ أَنْ أَقْضِيَهُ إِلَّا فِي شَعْبَانَ، الشُّغْلُ مِنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، أَوْ: بِرَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. (م)", "malayalam": "അബൂസലമ(റ): ആഇശ(റ) പറയുന്നത് ഞാൻ കേട്ടു: റമളാനിലെ നോമ്പുകളെനിക്ക് ഖളാഅ് വീട്ടാനുണ്ടാകുമായിരുന്നു. ശഅ്ബാനിലല്ലാതെ അതിനെ ഖളാഅ് വീട്ടാൻ എനിക്ക് സാധിക്കാറില്ല. തിരുമേനിക്കുവേണ്ടിയുള്ള ചില പ്രവർത്തികളിൽ മുഴുകിയതായിരുന്നു കാരണം. അല്ലെങ്കിൽ, റസൂൽ(സ)യുടെ കാരണത്താൽ. (മു)", "narrator_ml": "അബൂസലമ(റ)", "source_codes_ar": ["م"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 68, "page_start": 123}, {"hadith_no": 294, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"مَنْ أَفْطَرَ يَوْمًا مِنْ رَمَضَانَ، مِنْ غَيْرِ رُخْصَةٍ وَلَا مَرَضٍ، لَمْ يَقْضِ عَنْهُ صَوْمُ الدَّهْرِ كُلِّهِ وَإِنْ صَامَهُ\". (د,ت,جه)", "malayalam": "അബൂഹുറൈറ(റ): നബി(സ) പറഞ്ഞു: \"ഒരാൾ ഇളവില്ലാതെയും, രോഗമില്ലാതെയും റമളാനിൽ നോമ്പൊഴിവാക്കിയാൽ പിന്നീടുള്ള കാലം മുഴുവൻ നോമ്പനുഷ്ഠിച്ചാലും അതിന് പകരമായി വീടുകയില്ല.\" (ദ,തു,ജ)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["د", "ت", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 69, "page_start": 124}, {"hadith_no": 295, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: جَاءَ رَجُلٌ إِلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ: يَا رَسُولَ اللَّهِ، إِنِّي أَكَلْتُ وَشَرِبْتُ نَاسِيًا وَأَنَا صَائِمٌ؟ فَقَالَ: \"اللَّهُ أَطْعَمَكَ وَسَقَاكَ\". (ق,د,ت,ن)", "malayalam": "അബൂഹുറൈറ(റ): ഒരാൾ റസൂൽ(സ)യുടെ അടുത്ത് വന്നുപറഞ്ഞു: അല്ലാഹുവിന്റെ ദൂതരേ, നോമ്പുകാരനായി ഞാൻ മറന്ന് ഭക്ഷണപാനീയങ്ങൾ കഴിച്ചു. റസൂൽ(സ) പ്രതിവചിച്ചു: \"നിന്നെ ഭക്ഷിപ്പിച്ചവനും കുടിപ്പിച്ചവനും അല്ലാഹുവാണ്.\" (ബു,മു,ദ,തു,ന)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["ق", "د", "ت", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 70, "page_start": 124}, {"hadith_no": 296, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"مَنْ أَكَلَ أَوْ شَرِبَ نَاسِيًا فَلَا يُفْطِرْ، فَإِنَّمَا هُوَ رِزْقٌ رَزَقَهُ اللَّهُ\" حَسَنٌ صَحِيحٌ. (ق,ت)", "malayalam": "അബൂഹുറൈറ(റ): റസൂൽ(സ) പറഞ്ഞു: \"മറന്ന് ഭക്ഷിക്കുകയും കുടിക്കുകയും ചെയ്തവൻ നോമ്പ് മുറിക്കരുത്. നിശ്ചയം അല്ലാഹു അവനു നൽകിയ ഭക്ഷണമാണത്.\" (ബു,മു,തു)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["ق", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 70, "page_start": 124}, {"hadith_no": 297, "arabic": "عَنْ أَسْمَاءَ بِنْتِ أَبِي بَكْرٍ رَضِيَ اللهُ عَنْهُمَا قَالَتْ: أَفْطَرْنَا عَلَى عَهْدِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي يَوْمِ غَيْمٍ، ثُمَّ طَلَعَتِ الشَّمْسُ. قُلْتُ لِهِشَامٍ: أُمِرُوا بِالْقَضَاءِ؟ قَالَ: فَلَا بُدَّ مِنْ ذَلِكَ. (خ,د,جه)", "malayalam": "അസ്മാഅ്(റ): തിരുദൂതർ(സ)യുടെ കാലത്ത് മേഘാവൃതമായ ഒരു ദിനത്തിൽ ഞങ്ങൾ നോമ്പു തുറന്നു. ശേഷം സൂര്യൻ വെളിവായി. ഞാൻ ഹിശാമിനോട് ചോദിച്ചു: ഖളാഅ് വീട്ടാൻ അവർ കൽപിക്കപ്പെട്ടുവോ? ഹിശാം(റ) പറഞ്ഞു: അതുകൊണ്ട് കുഴപ്പമില്ല. (ബു,ദ,ജ)", "narrator_ml": "അസ്മാഅ്(റ)", "source_codes_ar": ["خ", "د", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 70, "page_start": 124}, {"hadith_no": 298, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُقَبِّلُ وَهُوَ صَائِمٌ، وَيُبَاشِرُ وَهُوَ صَائِمٌ، وَلَكِنَّهُ كَانَ أَمْلَكَ لِإِرْبِهِ. (ق,د,ن,جه)", "malayalam": "ആഇശ(റ): നബി(സ) നോമ്പുകാരനായിരിക്കെ ചുംബിക്കുകയും തൊട്ടുരുമ്മുകയും ചെയ്യാറുണ്ട്. നബി(സ) ഏറ്റവും കൂടുതൽ വികാരം നിയന്ത്രിക്കാൻ കഴിയുന്നവരായിരുന്നു. (ബു,മു,ദ,ന,ജ)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["ق", "د", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 71, "page_start": 124}, {"hadith_no": 299, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: كَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُقَبِّلُ فِي شَهْرِ الصَّوْمِ. (م,د,ت,جه)", "malayalam": "ആഇശ(റ): നോമ്പുമാസത്തിൽ നബി(സ) ചുംബിക്കാറുണ്ടായിരുന്നു. (മു,ദ,തു,ജ)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["م", "د", "ت", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 71, "page_start": 124}, {"hadith_no": 300, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُقَبِّلُنِي وَهُوَ صَائِمٌ وَأَنَا صَائِمَةٌ. (د)", "malayalam": "ആഇശ(റ): ഞാനും നബി(സ)യും നോമ്പുകാരായിരിക്കെ നബി(സ) എന്നെ ചുംബിക്കാറുണ്ടായിരുന്നു. (ദ)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 71, "page_start": 125}, {"hadith_no": 301, "arabic": "عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ رَضِيَ اللهُ عَنْهُمَا قَالَ: قَالَ عُمَرُ بْنُ الْخَطَّابِ رَضِيَ اللهُ عَنْهُ: هَشَشْتُ فَقَبَّلْتُ وَأَنَا صَائِمٌ، فَقُلْتُ: يَا رَسُولَ اللَّهِ، صَنَعْتُ الْيَوْمَ أَمْرًا عَظِيمًا، قَبَّلْتُ وَأَنَا صَائِمٌ؟ قَالَ: \"أَرَأَيْتَ لَوْ مَضْمَضْتَ مِنَ الْمَاءِ وَأَنْتَ صَائِمٌ\". قُلْتُ: لَا بَأْسَ بِهِ. قَالَ: \"فَمَهْ\". (د)", "malayalam": "ജാബിറുബ്നു അബ്ദില്ല(റ): ഉമറുബ്നുൽ ഖത്വാബ്(റ) പറഞ്ഞു: ഞാൻ നോമ്പുകാരനായിരിക്കെ വളരെയധികം വികാരോന്മത്തനാവുകയും ചുംബിക്കുകയും ചെയ്തു. എന്നിട്ടു ഞാൻ പറഞ്ഞു: അല്ലാഹുവിന്റെ റസൂലേ, ഞാനിന്നു വളരെ ഗൗരവമേറിയ ഒരു കാര്യം ചെയ്തു. നോമ്പുകാരനായിരിക്കെ ഞാൻ ചുംബിച്ചു. റസൂൽ(സ) ചോദിച്ചു: \"നീ നോമ്പുകാരനായിരിക്കെ വായിൽ വെള്ളം കൊപ്ലിച്ചാൽ എങ്ങനെയാവും\" ഞാൻ പറഞ്ഞു: ഒരു പ്രശ്നവുമില്ല. റസൂൽ(സ) പറഞ്ഞു: \"എന്നാൽ ഇതും പ്രശ്നമല്ല\" (ദ)", "narrator_ml": "ജാബിറുബ്നു അബ്ദില്ല(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 71, "page_start": 125}, {"hadith_no": 302, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا: أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يُقَبِّلُهَا وَهُوَ صَائِمٌ، وَيَمُصُّ لِسَانَهَا. (د)", "malayalam": "ആഇശ(റ): നബി(സ) നോമ്പുകാരനായിരിക്കെ മഹതിയെ ചുംബിക്കുകയും മഹതിയുടെ നാവ് ഊമ്പുകയും ചെയ്യാറുണ്ടായിരുന്നു. (ദ)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 71, "page_start": 125}, {"hadith_no": 303, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ: أَنَّ رَجُلًا سَأَلَ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَنِ الْمُبَاشَرَةِ لِلصَّائِمِ فَرَخَّصَ لَهُ، وَأَتَاهُ آخَرُ فَسَأَلَهُ فَنَهَاهُ، فَإِذَا الَّذِي رَخَّصَ لَهُ شَيْخٌ، وَالَّذِي نَهَاهُ شَابٌّ. (د)", "malayalam": "അബൂഹുറൈറ(റ): ഒരാൾ നബി(സ)യോട് നോമ്പുകാരൻ ഭാര്യയുമായി തൊട്ടുരുമ്മുന്നതിനെപ്പറ്റി ചോദിച്ചു. നബി(സ) അയാൾക്ക് ഇളവു ചെയ്തു. മറ്റൊരാൾ വന്ന് നബിയോട് അതേ കാര്യത്തെപ്പറ്റി ചോദിച്ചു. അപ്പോൾ നബി(സ) അദ്ദേഹത്തെ വിലക്കി. റസൂൽ(സ) ഇളവു ചെയ്ത മനുഷ്യൻ വയസ്സനും, വിലക്കിയവൻ യുവാവുമായിരുന്നു. (ദ)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 72, "page_start": 125}, {"hadith_no": 304, "arabic": "عَنْ مَيْمُونَةَ بِنْتِ سَعْدٍ رَضِيَ اللهُ عَنْهَا- مَوْلَاةِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ- قَالَتْ: سُئِلَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَنْ رَجُلٍ قَبَّلَ امْرَأَتَهُ وَهُمَا صَائِمَانِ؟ قَالَ: \"قَدْ أَفْطَرَا\". [ز: في سنده ضعيف ومجهول] (جه)", "malayalam": "നബി(സ)യുടെ അടിമയായിരുന്ന മൈമൂനബിൻത് സഅദ്(റ): നോമ്പുകാരനായനിലയിൽ തന്റെ ഭാര്യയെ ചുംബിച്ച ഒരുത്തനെക്കുറിച്ച് നബി(സ) ചോദിക്കപ്പെട്ടു. നബി(സ) പറഞ്ഞു: \"രണ്ടാളും നോമ്പു മുറിച്ചു.\" (നിവേദക പരമ്പരയിൽ ദുർബ്ബലനും അജ്ഞാതനുമുണ്ട്) (ജ)", "narrator_ml": "നബി(സ)യുടെ അടിമയായിരുന്ന മൈമൂനബിൻത് സഅദ്(റ)", "source_codes_ar": ["جه"], "grading_note_ml": "നിവേദക പരമ്പരയിൽ ദുർബ്ബലനും അജ്ഞാതനുമുണ്ട്", "grading_note_ar": "ز: في سنده ضعيف ومجهول", "explanation_ml": null, "variants": [], "bab_seq": 72, "page_start": 125}, {"hadith_no": 305, "arabic": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا قَالَ: رُخِّصَ لِلْكَبِيرِ الصَّائِمِ فِي الْمُبَاشَرَةِ، وَكُرِهَ لِلشَّابِّ. [ز: في سنده ضعيف] (جه)", "malayalam": "ഇബ്നുഅബ്ബാസ്(റ): വയസ്സായ നോമ്പുകാരന് ഭാര്യയുമായി തൊട്ടുരുമ്മുന്നതിൽ ഇളവ് നൽകപ്പെട്ടു. യുവാവിനു കറാഹത്താക്കപ്പെട്ടു. (പരമ്പരയിൽ ദുർബലനുണ്ട്) (ജ)", "narrator_ml": "ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["جه"], "grading_note_ml": "പരമ്പരയിൽ ദുർബലനുണ്ട്", "grading_note_ar": "ز: في سنده ضعيف", "explanation_ml": null, "variants": [], "bab_seq": 72, "page_start": 125}, {"hadith_no": 306, "arabic": "عَنِ الْبَرَاءِ رَضِيَ اللهُ عَنْهُ قَالَ: كَانَ أَصْحَابُ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِذَا كَانَ الرَّجُلُ صَائِمًا فَحَضَرَ الْإِفْطَارُ فَنَامَ قَبْلَ أَنْ يُفْطِرَ لَمْ يَأْكُلْ لَيْلَتَهُ وَلَا يَوْمَهُ حَتَّى يُمْسِيَ، وَإِنَّ قَيْسَ بْنَ صِرْمَةَ الْأَنْصَارِيَّ كَانَ صَائِمًا فَلَمَّا حَضَرَ الْإِفْطَارُ أَتَى امْرَأَتَهُ فَقَالَ لَهَا: أَعِنْدَكِ طَعَامٌ؟ قَالَتْ: لَا، وَلَكِنْ أَنْطَلِقُ فَأَطْلُبُ لَكَ وَكَانَ يَوْمَهُ يَعْمَلُ فَغَلَبَتْهُ عَيْنَاهُ فَجَاءَتْهُ امْرَأَتُهُ، فَلَمَّا رَأَتْهُ قَالَتْ: خَيْبَةً لَكَ، فَلَمَّا انْتَصَفَ النَّهَارُ غُشِيَ عَلَيْهِ فَذُكِرَ ذَلِكَ لِلنَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَنَزَلَتْ هَذِهِ الْآيَةُ: {أُحِلَّ لَكُمْ لَيْلَةَ الصِّيَامِ الرَّفَثُ إِلَى نِسَائِكُمْ} فَفَرِحُوا بِهَا فَرَحًا شَدِيدًا، وَنَزَلَتْ: {وَكُلُوا وَاشْرَبُوا حَتَّى يَتَبَيَّنَ لَكُمُ الْخَيْطُ الْأَبْيَضُ مِنَ الْخَيْطِ الْأَسْوَدِ}. (خ)", "malayalam": "ബറാഅ്(റ): മുഹമ്മദ്(സ)യുടെ അനുചരരിൽ ആരെങ്കിലും ഒരാൾ നോമ്പുനോൽക്കുകയും നോമ്പു മുറിക്കുന്ന സമയമെത്തുകയും എന്നാൽ നോമ്പുതുറക്കാതെ ഉറങ്ങുകയും ചെയ്താൽ (പിറ്റേ ദിവസം) വൈകുന്നേരമാവുന്നതുവരെ രാവും പകലും ഭക്ഷിക്കാറില്ല. ഖൈസുബ്നു സിർമതിൽ അൻസാരി(റ) ഒരിക്കൽ നോമ്പുനോറ്റു. നോമ്പു തുറക്കുന്ന സമയമായപ്പോൾ അദ്ദേഹം ഭാര്യയുടെ അടുത്തുപോയി ചോദിച്ചു. നിന്റെയടുക്കൽ ഭക്ഷണമുണ്ടോ? അവർ പറഞ്ഞു: ഇല്ല. പക്ഷേ ഞാൻ പോയി നിങ്ങൾക്കുവേണ്ടി അന്വേഷിച്ചുനോക്കാം. ഖൈസുബ്നു സിർമത്(റ) പകൽ ജോലിചെയ്യുന്നവരായിരുന്നു. അതുകാരണം അദ്ദേഹം ഉറങ്ങിപ്പോയി. ഭാര്യ തിരിച്ചുവന്നു അദ്ദേഹത്തെ കണ്ടപ്പോൾ പറഞ്ഞു: നിങ്ങളുടെ നിർഭാഗ്യം. ഉച്ചയായപ്പോൾ അദ്ദേഹം ബോധം കെട്ടു. വിവരം നബി(സ)യോടു പറഞ്ഞു. അപ്പോൾ ഈ ആയത് ഇറങ്ങി. 'നോമ്പിന്റെ രാത്രിയിൽ നിങ്ങൾക്കു നിങ്ങളുടെ സ്ത്രീകളുമായി സംയോഗം അനുവദിക്കപ്പെട്ടിരിക്കുന്നു.' അപ്പോൾ അനുചരർ ഈ ആയത് കൊണ്ടു വളരെയധികം സന്തോഷിച്ചു. വീണ്ടും ആയത് ഇറങ്ങി. 'കറുത്ത നൂലിൽനിന്നു വെളുത്ത നൂൽ (ഫജ്റുസ്സ്വാദിഖ്) വെളിവാകുന്നതുവരെ നിങ്ങൾ തിന്നുകയും കുടിക്കുകയും ചെയത് കൊള്ളുക.' (ബു)", "narrator_ml": "ബറാഅ്(റ)", "source_codes_ar": ["خ"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 73, "page_start": 126}, {"hadith_no": 307, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا: أَنَّ رَجُلًا جَاءَ إِلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَسْتَفْتِيهِ وَهِيَ تَسْمَعُ مِنْ وَرَاءِ الْبَابِ، فَقَالَ: يَا رَسُولَ اللَّهِ تُدْرِكُنِي الصَّلَاةُ وَأَنَا جُنُبٌ، أَفَأَصُومُ؟ فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"وَأَنَا تُدْرِكُنِي الصَّلَاةُ وَأَنَا جُنُبٌ فَأَصُومُ\". فَقَالَ: لَسْتَ مِثْلَنَا يَا رَسُولَ اللَّهِ، قَدْ غَفَرَ اللَّهُ لَكَ مَا تَقَدَّمَ مِنْ ذَنْبِكَ وَمَا تَأَخَّرَ. فَقَالَ: \"وَاللَّهِ إِنِّي لَأَرْجُو أَنْ أَكُونَ أَخْشَاكُمْ لِلَّهِ، وَأَعْلَمَكُمْ بِمَا أَتَّقِي\". (م)", "malayalam": "ആഇശ(റ): റസൂൽ(സ)യുടെ അടുക്കൽ സംശയനിവാരണത്തിന് ഒരാൾ വന്നു. ആഇശ ബീവി(റ) വാതിലിനു പിന്നിൽനിന്നു കേൾക്കുന്നുണ്ട്. അയാൾ ചോദിച്ചു: അല്ലാഹുവിന്റെ റസൂലേ, ഞാൻ ജനാബതുകാരനായിരിക്കെ സുബ്ഹി നിസ്കാരസമയം എത്തി. എനിക്കു നോമ്പു പറ്റുമോ? റസൂൽ(സ) പറഞ്ഞു: \"ഞാൻ ജനാബതുകാരനായിരിക്കെ സുബ്ഹി നിസ്കാര സമയമാവുകയും ഞാൻ നോമ്പു നോൽക്കുകയും ചെയ്യുന്നു.\" അപ്പോൾ അദ്ദേഹം പറഞ്ഞു: അല്ലാഹുവിന്റെ റസൂലേ, അവിടന്ന് ഞങ്ങളെപ്പോലെയല്ല. അങ്ങയുടെ കഴിഞ്ഞതും വരാനിരിക്കുന്നതുമായ പാപങ്ങൾ അല്ലാഹു പൊറുത്തിരിക്കുന്നു. അപ്പോൾ റസൂൽ(സ) പറഞ്ഞു: \"അല്ലാഹുതന്നെയാണ് സത്യം, നിശ്ചയം നിങ്ങളെക്കാൾ അല്ലാഹുവിനെ ഭയപ്പെടുന്നവനും സൂക്ഷിക്കേണ്ട കാര്യങ്ങൾ അറിയുന്നവനും ഞാനാകണമെന്ന് ഞാൻ ആഗ്രഹിക്കുന്നു.\" (മു)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["م"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 74, "page_start": 126}, {"hadith_no": 308, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا: أَنَّ رَجُلًا قَالَ لِرَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَهُوَ وَاقِفٌ عَلَى الْبَابِ: يَا رَسُولَ اللَّهِ، إِنِّي أُصْبِحُ جُنُبًا، وَأَنَا أُرِيدُ الصِّيَامَ؟ فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"وَأَنَا أُصْبِحُ جُنُبًا وَأَنَا أُرِيدُ الصِّيَامَ، فَأَغْتَسِلُ وَأَصُومُ\". فَقَالَ الرَّجُلُ: يَا رَسُولَ اللَّهِ، إِنَّكَ لَسْتَ مِثْلَنَا، قَدْ غَفَرَ اللَّهُ لَكَ مَا تَقَدَّمَ مِنْ ذَنْبِكَ وَمَا تَأَخَّرَ. فَغَضِبَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَقَالَ: \"وَاللَّهِ إِنِّي لَأَرْجُو أَنْ أَكُونَ أَخْشَاكُمْ لِلَّهِ وَأَعْلَمَكُمْ بِمَا أَتَّبِعُ\". (م,د)", "malayalam": "ആഇശ(റ): വാതിൽക്കൽ നിന്നു ഒരാൾ റസൂൽ(സ)യോട് ചോദിച്ചു: അല്ലാഹുവിന്റെ റസൂലേ, ഞാൻ ജനാബതുകാരനായി നേരം പുലരുന്നു, ഞാൻ നോമ്പ് ഉദ്ദേശിക്കുകയും ചെയ്യുന്നു? അപ്പോൾ അല്ലാഹുവിന്റെ റസൂൽ(സ) പറഞ്ഞു: \"ഞാനും ജനാബതുകാരനായി നേരം പുലരുകയും, നോമ്പ് ഉദ്ദേശിക്കുകയും ചെയ്യാറുണ്ട്. ഞാൻ കുളിക്കും, നോമ്പു നോൽക്കും.\" അപ്പോൾ അയാൾ പറഞ്ഞു: അല്ലാഹുവിന്റെ റസൂലേ, അങ്ങ് ഞങ്ങളെപ്പോലെയല്ല. അങ്ങയുടെ മുൻകഴിഞ്ഞതും വരാനിരിക്കുന്നതുമായ പാപങ്ങൾ അല്ലാഹു അങ്ങേക്ക് പൊറുത്തുതന്നിട്ടുണ്ട്. അപ്പോൾ റസൂൽ(സ) ദേഷ്യത്തോടെ പറഞ്ഞു: \"അല്ലാഹു തന്നെയാണ് സത്യം, നിങ്ങളേക്കാൾ ഞാൻ പിൻപറ്റുന്ന ഒന്നുകൊണ്ട് ഏറ്റവും അറിയുന്നവനും അല്ലാഹുവിനെ ഏറ്റവും ഭയപ്പെടുന്നവനും ആവണമെന്ന് ഞാൻ ആഗ്രഹിക്കുന്നു.\" (മു,ദ)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["م", "د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 74, "page_start": 127}, {"hadith_no": 309, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: لَا وَرَبِّ الْكَعْبَةِ، مَا أَنَا قُلْتُ: \"مَنْ أَصْبَحَ وَهُوَ جُنُبٌ فَلْيُفْطِرْ\". مُحَمَّدٌ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَهُ. (جه)", "malayalam": "അബൂഹുറൈറ(റ): കഅബയുടെ നാഥനാണ് സത്യം. \"ആരെങ്കിലും ജനാബത്തുകാരനായി പ്രഭാതമായാൽ അവൻ നോമ്പു മുറിക്കണമെന്നു\" ഞാൻ ഒരിക്കലും പറഞ്ഞിട്ടില്ല. മുഹമ്മദ് നബി(സ)യാണത് പറഞ്ഞത്. (ജ)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 74, "page_start": 127}, {"hadith_no": 310, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: كَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَبِيتُ جُنُبًا، فَيَأْتِيهِ بِلَالٌ فَيُؤْذِنُهُ بِالصَّلَاةِ فَيَقُومُ فَيَغْتَسِلُ، فَأَنْظُرُ إِلَى تَحَدُّرِ الْمَاءِ مِنْ رَأْسِهِ، ثُمَّ يَخْرُجُ فَأَسْمَعُ صَوْتَهُ فِي صَلَاةِ الْفَجْرِ. قَالَ مُطَرِّفٌ: فَقُلْتُ لِعَامِرٍ: أَفِي رَمَضَانَ؟ قَالَ: رَمَضَانُ وَغَيْرُهُ سَوَاءٌ. (جه)", "malayalam": "ആഇശ(റ): ജനാബതുകാരനായി നബി(സ) രാത്രി കഴിച്ചുകൂട്ടാറുണ്ട്. നബിയുടെ അടുക്കൽ ബിലാൽ(റ) വരുകയും നബി(സ)യെ സുബ്ഹി നിസ്കാരത്തിന്റെ സമയം അറിയിക്കുകയും ചെയ്യും. ഉടനെ റസൂൽ(സ) എഴുന്നേൽക്കുകയും കുളിക്കുകയും ചെയ്യും. അവിടത്തെ തലയിൽനിന്നു വെള്ളം ഒലിച്ചിറങ്ങുന്നത് ഞാൻ നോക്കിനില്ക്കും. പിന്നെ റസൂലുല്ലാഹി(സ) പുറപ്പെടും. അവിടത്തെ സുബ്ഹി നിസ്കാരത്തിലെ ശബ്ദം ഞാൻ കേൾക്കും. മുത്വർരിഫ് പറഞ്ഞു: ഞാൻ ആമിർ(റ)വിനോട് ചോദിച്ചു: അത് റമളാനിലാണോ? ആമിർ(റ) പറഞ്ഞു: റമളാനും അല്ലാത്തമാസവും സമമാണ്. (ജ)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 74, "page_start": 127}, {"hadith_no": 311, "arabic": "عَنْ نَافِعٍ رَضِيَ اللهُ عَنْهُ قَالَ: سَأَلْتُ أُمَّ سَلَمَةَ- رَضِيَ اللهُ عَنْهَا- عَنِ الرَّجُلِ يُصْبِحُ وَهُوَ جُنُبٌ، يُرِيدُ الصَّوْمَ؟ قَالَتْ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُصْبِحُ جُنُبًا مِنَ الْوِقَاعِ، لَا مِنِ احْتِلَامٍ، ثُمَّ يَغْتَسِلُ وَيُتِمُّ صَوْمَهُ. (جه)", "malayalam": "നാഫിഅ്(റ): നോമ്പെടുക്കാൻ ഉദ്ദേശിക്കുന്ന, ജനാബത്തുകാരനായി പ്രഭാതമായ ഒരാളെപ്പറ്റി ഉമ്മുസലമ(റ)യോട് ഞാൻ ചോദിച്ചു. അവർ പറഞ്ഞു: റസൂൽ(സ) സ്വപ്നസ്ഖലനം കാരണത്താലല്ല, സംയോഗം കാരണമായി ജനാബത്തുകാരനായ നിലയിൽ പ്രഭാതമാകാറുണ്ട്. പിന്നെ അവിടന്ന് കുളിക്കുകയും നോമ്പു പൂർത്തിയാക്കുകയും ചെയ്യും. (ജ)", "narrator_ml": "നാഫിഅ്(റ)", "source_codes_ar": ["جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 74, "page_start": 127}, {"hadith_no": 312, "arabic": "عَنْ عَامِرِ بْنِ رَبِيعَةَ رَضِيَ اللهُ عَنْهُ قَالَ: رَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَسْتَاكُ وَهُوَ صَائِمٌ، مَا لَا أَعُدُّ وَلَا أُحْصِي. (د,ت)", "malayalam": "ആമിറുബ്നു റബീഅ(റ): എണ്ണിത്തിട്ടപ്പെടുത്താനും കണക്കാക്കാനും കഴിയാത്തത്ര തവണ റസൂൽ(സ) നോമ്പുകാരനായി പല്ലു ശുദ്ധിയാക്കുന്നത് ഞാൻ കണ്ടിട്ടുണ്ട്. (ദ,തു)", "narrator_ml": "ആമിറുബ്നു റബീഅ(റ)", "source_codes_ar": ["د", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 75, "page_start": 128}, {"hadith_no": 313, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"مِنْ خَيْرِ خِصَالِ الصَّائِمِ السِّوَاكُ\". [ز: في إسناده ضعيف] (جه)", "malayalam": "ആഇശ(റ): റസൂൽ(സ) പറഞ്ഞു: \"പല്ലു ശുദ്ധിയാക്കൽ നോമ്പുകാരന്റെ നല്ല കാര്യങ്ങളിൽപെട്ടതാണ്.\" (പരമ്പരയിൽ ഒരു ദുർബലനുണ്ട്) (ജ)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["جه"], "grading_note_ml": "പരമ്പരയിൽ ഒരു ദുർബലനുണ്ട്", "grading_note_ar": "ز: في إسناده ضعيف", "explanation_ml": null, "variants": [], "bab_seq": 75, "page_start": 128}, {"hadith_no": 314, "arabic": "عَنْ أَبِي بَكْرِ بْنِ عَبْدِ الرَّحْمَنِ رَضِيَ اللهُ عَنْهَا، عَنْ بَعْضِ أَصْحَابِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: رَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَمَرَ النَّاسَ فِي سَفَرِهِ عَامَ الْفَتْحِ بِالْفِطْرِ، وَقَالَ: \"تَقَوَّوْا لِعَدُوِّكُمْ\". وَصَامَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. قَالَ أَبُو بَكْرٍ: قَالَ الَّذِي حَدَّثَنِي: لَقَدْ رَأَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِالْعَرْجِ يَصُبُّ عَلَى رَأْسِهِ الْمَاءَ وَهُوَ صَائِمٌ مِنَ الْعَطَشِ، أَوْ مِنَ الْحَرِّ. (د,ن)", "malayalam": "നബി(സ)യുടെ ചില അനുചരരിൽനിന്ന് അബൂബക്റുബ്നു അബ്ദുറഹ്മാൻ(റ): മക്കാ വിജയവർഷം ഒരു യാത്രയിൽ റസൂൽ(സ) ജനങ്ങളോട് നോമ്പുമുറിക്കാൻ കൽപ്പിക്കുന്നതു ഞാൻ കണ്ടു. റസൂൽ(സ) പറഞ്ഞു: \"ശത്രുക്കളെ നേരിടാൻ നിങ്ങൾ ശക്തി സംഭരിക്കുക.\" റസൂൽ(സ) നോമ്പു നോൽക്കുകയും ചെയ്തു. അബൂബക്കർ പറയുന്നു: എന്നോടു ഈ ഹദീസ് പറഞ്ഞയാൾ പറഞ്ഞു: നോമ്പുകാരനായ റസൂൽ(സ) ദാഹം കാരണം, അല്ലെങ്കിൽ ചൂടിന്റെ കാഠിന്യത്താൽ, അർജ് എന്ന സ്ഥലത്തുവെച്ചു അവിടത്തെ തലയിൽ വെള്ളം ഒഴിക്കുന്നത് ഞാൻ കണ്ടിട്ടുണ്ട്. (ദ,ന)", "narrator_ml": "നബി(സ)യുടെ ചില അനുചരരിൽനിന്ന് അബൂബക്റുബ്നു അബ്ദുറഹ്മാൻ(റ)", "source_codes_ar": ["د", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 76, "page_start": 128}, {"hadith_no": 315, "arabic": "عَنْ لَقِيطِ بْنِ صَبِرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قُلْتُ: يَا رَسُولَ اللَّهِ، أَخْبِرْنِي عَنِ الْوُضُوءِ؟ قَالَ: \"أَسْبِغِ الْوُضُوءَ، وَخَلِّلْ بَيْنَ الْأَصَابِعِ، وَبَالِغْ فِي الِاسْتِنْشَاقِ إِلَّا أَنْ تَكُونَ صَائِمًا\". حَسَنٌ صَحِيحٌ. (د,ت,ن)", "malayalam": "ലഖീതുബ്നു സ്വബ്റത്(റ): ഞാൻ ചോദിച്ചു: അല്ലാഹുവിന്റെ റസൂലേ, വുളൂഇനെകുറിച്ച് എനിക്കു പറഞ്ഞുതരുമോ? നബി(സ) പറഞ്ഞു: \"വുളൂഅ് നീ പൂർണ്ണമായ രീതിയിൽ ചെയ്യുക. വിരലുകൾക്കിടയിൽ നീ തിക്കകറ്റുക, നീ നോമ്പുകാരനല്ലെങ്കിൽ മൂക്കിൽ വെള്ളം കയറ്റുന്നതിൽ മികവു കാണിക്കുക.\" (ദ,തു,ന)", "narrator_ml": "ലഖീതുബ്നു സ്വബ്റത്(റ)", "source_codes_ar": ["د", "ت", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 77, "page_start": 128}, {"hadith_no": 316, "arabic": "عَنْ مَعْبَدِ بْنِ هَوْذَةَ رَضِيَ اللهُ عَنْهُ، عَنْ أَبِيهِ عَنْ جَدِّهِ عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنَّهُ أَمَرَ بِالْإِثْمِدِ الْمُرَوَّحِ عِنْدَ النَّوْمِ، وَقَالَ: \"لِيَتَّقِهِ الصَّائِمُ\". (د)", "malayalam": "തന്റെ വല്യുപ്പയിൽ നിന്ന് പിതാവ് വഴി മഅ്ബദുബ്നു ഹൗദത്ത്(റ): ഉറങ്ങാനൊരുങ്ങുമ്പോൾ കസ്തൂരി ഗന്ധം ചേർക്കപ്പെട്ട സുറുമയിടാൻ നബി(സ) കൽപിച്ചു. എന്നിട്ട് അവിടന്ന് പറഞ്ഞു: \"നോമ്പുകാരൻ സൂക്ഷിച്ചു കൊള്ളട്ടെ.\" (ദ)", "narrator_ml": "തന്റെ വല്യുപ്പയിൽ നിന്ന് പിതാവ് വഴി മഅ്ബദുബ്നു ഹൗദത്ത്(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 78, "page_start": 129}, {"hadith_no": 317, "arabic": "عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ: أَنَّهُ كَانَ يَكْتَحِلُ وَهُوَ صَائِمٌ. (د)", "malayalam": "അനസുബ്നു മാലിക്(റ): നോമ്പുകാരനായിരിക്കെ അദ്ദേഹം സുറുമ ഇടാറുണ്ടായിരുന്നു. (ദ)", "narrator_ml": "അനസുബ്നു മാലിക്(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 78, "page_start": 129}, {"hadith_no": 318, "arabic": "عَنِ الْأَعْمَشِ قَالَ: مَا رَأَيْتُ أَحَدًا مِنْ أَصْحَابِنَا يَكْرَهُ الْكُحْلَ لِلصَّائِمِ، وَكَانَ إِبْرَاهِيمُ يُرَخِّصُ أَنْ يَكْتَحِلَ الصَّائِمُ بِالصَّبِرِ. (د)", "malayalam": "അഅ്മശ്: നോമ്പുകാരൻ സുറുമ ഉപയോഗിക്കുന്നത് വെറുക്കുന്നവരായി നമ്മുടെ സഹചാരികളിൽ ആരുമുണ്ടായിരുന്നില്ല. നോമ്പുകാരൻ കറ്റുവാഴനീര് കൊണ്ടു സുറുമ ഇടുന്നതിനെ ഇബ്റാഹീം അനുവദിക്കുമായിരുന്നു. (ദ)", "narrator_ml": "അഅ്മശ്", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 78, "page_start": 129}, {"hadith_no": 319, "arabic": "عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ قَالَ: جَاءَ رَجُلٌ إِلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ: اشْتَكَتْ عَيْنِي، أَفَأَكْتَحِلُ وَأَنَا صَائِمٌ؟ قَالَ: \"نَعَمْ\". (ت)", "malayalam": "അനസുബ്നു മാലിക്(റ): ഒരാൾ റസൂൽ(സ)യുടെ അരികിൽവന്നു പറഞ്ഞു: എന്റെ കണ്ണിനു രോഗം ബാധിച്ചിരിക്കുന്നു, നോമ്പുകാരനായിരിക്കെ എനിക്കു സുറുമ ഉപയോഗിക്കാൻ പറ്റുമോ? റസൂൽ(സ) പറഞ്ഞു: \"അതേ.\" (തു)", "narrator_ml": "അനസുബ്നു മാലിക്(റ)", "source_codes_ar": ["ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 78, "page_start": 129}, {"hadith_no": 320, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: اكْتَحَلَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَهُوَ صَائِمٌ. [ز: في سنده ضعيف] (جه)", "malayalam": "ആഇശ(റ): നോമ്പുകാരനായിരിക്കെ റസൂൽ(സ) സുറുമ ഉപയോഗിച്ചിരുന്നു. (പരമ്പരയിൽ ദുർബലനുണ്ട്) (ജ)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["جه"], "grading_note_ml": "പരമ്പരയിൽ ദുർബലനുണ്ട്", "grading_note_ar": "ز: في سنده ضعيف", "explanation_ml": null, "variants": [], "bab_seq": 78, "page_start": 129}, {"hadith_no": 321, "arabic": "عَنْ شَدَّادِ بْنِ أَوْسٍ رَضِيَ اللهُ عَنْهُ: بَيْنَمَا هُوَ يَمْشِي مَعَ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ... فَذَكَرَ نَحْوَهُ. وَفِي رِوَايَةٍ: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَتَى عَلَى رَجُلٍ بِالْبَقِيعِ، وَهُوَ يَحْتَجِمُ، وَهُوَ آخِذٌ بِيَدِي، لِثَمَانَ عَشْرَةَ خَلَتْ مِنْ رَمَضَانَ، فَقَالَ: \"أَفْطَرَ الْحَاجِمُ وَالْمَحْجُومُ\". (د,ت,ن,جه)", "malayalam": "ശദ്ദാദുബ്നു ഔസ്(റ): അദ്ദേഹം പ്രവാചകർ(സ)യുടെ കൂടെ നടക്കുന്നതിനിടെ..... മുമ്പ് പറഞ്ഞ ഹദീസ് ഉദ്ധരിച്ചു. മറ്റൊരു നിവേദനം: റമളാനിന്റെ പതിനെട്ടാം ദിവസം റസൂൽ(സ) എന്റെ കരംപിടിച്ചു ബഖീഇലെ കൊമ്പുവെക്കുന്ന ഒരാളുടെ അടുക്കലേക്കു പോയി. എന്നിട്ട് പറഞ്ഞു: \"കൊമ്പുവെച്ചവനും വെക്കപ്പെട്ടവനും വ്രതം മുറിച്ചു.\" (ദ,തു,ന,ജ)", "narrator_ml": "ശദ്ദാദുബ്നു ഔസ്(റ)", "source_codes_ar": ["د", "ت", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَتَى عَلَى رَجُلٍ بِالْبَقِيعِ، وَهُوَ يَحْتَجِمُ، وَهُوَ آخِذٌ بِيَدِي، لِثَمَانَ عَشْرَةَ خَلَتْ مِنْ رَمَضَانَ، فَقَالَ: \"أَفْطَرَ الْحَاجِمُ وَالْمَحْجُومُ\". (د,ت,ن,جه)", "malayalam": "മറ്റൊരു നിവേദനം: റമളാനിന്റെ പതിനെട്ടാം ദിവസം റസൂൽ(സ) എന്റെ കരംപിടിച്ചു ബഖീഇലെ കൊമ്പുവെക്കുന്ന ഒരാളുടെ അടുക്കലേക്കു പോയി. എന്നിട്ട് പറഞ്ഞു: \"കൊമ്പുവെച്ചവനും വെക്കപ്പെട്ടവനും വ്രതം മുറിച്ചു.\" (ദ,തു,ന,ജ)"}], "bab_seq": 79, "page_start": 129}, {"hadith_no": 322, "arabic": "عَنْ أَنَسٍ رَضِيَ اللهُ عَنْهُ قَالَ: مَا كُنَّا نَدَعُ الْحِجَامَةَ لِلصَّائِمِ إِلَّا كَرَاهِيَةَ الْجَهْدِ. (خ,د)", "malayalam": "അനസ്(റ): ബുദ്ധിമുട്ട് വെറുത്താലല്ലാതെ നോമ്പുകാരന് കൊമ്പുവെക്കുന്നതിനെ ഞങ്ങൾ ഉപേക്ഷിക്കാറില്ല. (ബു,ദ)*", "narrator_ml": "അനസ്(റ)", "source_codes_ar": ["خ", "د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": "*രോഗിക്ക് വിഷമമില്ലെങ്കിൽ കൊമ്പുവെക്കാവുന്നതാണ്", "variants": [], "bab_seq": 79, "page_start": 129}, {"hadith_no": 323, "arabic": "عَنْ عَبْدِ الرَّحْمَنِ ابْنِ أَبِي لَيْلَى: حَدَّثَنِي رَجُلٌ مِنْ أَصْحَابِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَهَى عَنِ الْحِجَامَةِ وَالْمُوَاصَلَةِ وَلَمْ يُحَرِّمْهُمَا، إِبْقَاءً عَلَى أَصْحَابِهِ، فَقِيلَ لَهُ: يَا رَسُولَ اللَّهِ، إِنَّكَ تُوَاصِلُ إِلَى السَّحَرِ؟ فَقَالَ: \"إِنِّي أُوَاصِلُ إِلَى السَّحَرِ، وَرَبِّي يُطْعِمُنِي وَيَسْقِينِي\". (د)", "malayalam": "അബ്ദുറഹ്മാനുബ്നു അബീലൈല(റ): റസൂൽ(സ)യുടെ ഒരു അനുചരൻ എന്നോട് പറഞ്ഞു: നബി(സ) കൊമ്പുവെക്കലും നോമ്പ് ചേർത്തനുഷ്ഠിക്കലും വിരോധിച്ചിട്ടുണ്ടെങ്കിലും അനുചരർ ചെയ്യാൻ പാടില്ലെന്ന രീതിയിൽ നിഷിദ്ധമാക്കിയിട്ടില്ല. നബി(സ) ചോദിക്കപ്പെട്ടു: അല്ലാഹുവിന്റെ റസൂലേ, അങ്ങ് അത്താഴം വരെ ചേർത്ത് നോൽക്കുന്നല്ലോ? നബി(സ) പറഞ്ഞു: \"നിശ്ചയം ഞാൻ അത്താഴംവരെ ചേർത്തനുഷ്ഠിക്കുന്നു. എന്റെ രക്ഷിതാവെനിക്ക് ഭക്ഷണപാനീയങ്ങൾ നൽകുന്നു\". (ദ)", "narrator_ml": "അബ്ദുറഹ്മാനുബ്നു അബീലൈല(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 79, "page_start": 130}, {"hadith_no": 324, "arabic": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا قَالَ: احْتَجَمَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ- وَفِي رِوَايَةٍ: بَيْنَ مَكَّةَ وَالْمَدِينَةِ- وَهُوَ مُحْرِمٌ صَائِمٌ. وَفِي رِوَايَةٍ: أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ احْتَجَمَ وَهُوَ صَائِمٌ. حَسَنٌ صَحِيحٌ. (خ,ت)", "malayalam": "ഇബ്നുഅബ്ബാസ്(റ): നോമ്പുകാരനും ഇഹ്റാം ചെയ്തവരുമായിരിക്കെ - ഒരു നിവേദനത്തിൽ: മക്കയുടേയും മദീനയുടേയും മധ്യേ - റസൂൽ(സ) കൊമ്പുവെച്ചു. മറ്റൊരു നിവേദനം: നോമ്പുകാരനായിരിക്കെ നബി(സ) കൊമ്പുവെച്ചിരുന്നു. (ബു,തു)", "narrator_ml": "ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["خ", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: بَيْنَ مَكَّةَ وَالْمَدِينَةِ- وَهُوَ مُحْرِمٌ صَائِمٌ.", "malayalam": "മറ്റൊരു നിവേദനം: നോമ്പുകാരനായിരിക്കെ നബി(സ) കൊമ്പുവെച്ചിരുന്നു. (ബു,തു)"}, {"seq": 2, "arabic": "وَفِي رِوَايَةٍ: أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ احْتَجَمَ وَهُوَ صَائِمٌ. حَسَنٌ صَحِيحٌ. (خ,ت)", "malayalam": null}], "bab_seq": 79, "page_start": 130}, {"hadith_no": 325, "arabic": "عَنْ مَعْدَانَ بْنِ طَلْحَةَ: أَنَّ أَبَا الدَّرْدَاءِ رَضِيَ اللهُ عَنْهُ حَدَّثَهُ: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَاءَ فَأَفْطَرَ، فَلَقِيتُ ثَوْبَانَ مَوْلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي مَسْجِدِ دِمَشْقَ، فَقُلْتُ: إِنَّ أَبَا الدَّرْدَاءِ حَدَّثَنِي أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَاءَ فَأَفْطَرَ؟ قَالَ: صَدَقَ، وَأَنَا صَبَبْتُ لَهُ وَضُوءَهُ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. (د,ت)", "malayalam": "മഅ്ദാനുബ്നു ത്വൽഹ(റ): അബുദ്ദർദാഅ്(റ) എനിക്ക് ഹദീസ് പറഞ്ഞുതന്നു: റസൂൽ(സ) ഛർദ്ദിച്ചപ്പോൾ നോമ്പു മുറിച്ചു. റസൂൽ(സ)യുടെ വിമോചിത അടിമയായ സൗബാൻ(റ)വിനെ ഡമസ്കസിലെ പള്ളിയിൽവെച്ച് കണ്ടപ്പോൾ അബുദ്ദർദാഅ്(റ) എനിക്കു പറഞ്ഞുതന്ന റസൂൽ(സ) ഛർദ്ദിച്ചപ്പോൾ നോമ്പുമുറിച്ചു എന്ന ഹദീസിനെകുറിച്ചു ഞാൻ ചോദിച്ചു. സൗബാൻ(റ) പറഞ്ഞു: സത്യമാണ്, ഞാനായിരുന്നു റസൂൽ(സ)ക്ക് വുളൂഇന്റെ വെള്ളം ഒഴിച്ചുകൊടുത്തിരുന്നത്. (ദ,തു)", "narrator_ml": "മഅ്ദാനുബ്നു ത്വൽഹ(റ)", "source_codes_ar": ["د", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 80, "page_start": 130}, {"hadith_no": 326, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ: أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"مَنْ ذَرَعَهُ الْقَيْءُ فَلَيْسَ عَلَيْهِ قَضَاءٌ، وَمَنِ اسْتَقَاءَ عَمْدًا فَلْيَقْضِ\". (د,ت)", "malayalam": "അബൂഹുറൈറ(റ): റസൂൽ(സ) പറഞ്ഞു: \"ഛർദ്ദി ഉണ്ടായവൻ നോമ്പ് ഖളാഅ് വീട്ടേണ്ടതില്ല. എന്നാൽ, ഉണ്ടാക്കിഛർദ്ദിച്ചവൻ നോമ്പ് ഖളാഅ് വീട്ടേണ്ടതാണ്.\" (ദ,തു)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["د", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 80, "page_start": 130}, {"hadith_no": 327, "arabic": "عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"ثَلَاثٌ لَا يُفْطِرْنَ الصَّائِمَ: الْحِجَامَةُ وَالْقَيْءُ وَالِاحْتِلَامُ\". (ت)", "malayalam": "അബീസഈദിനിൽ ഖുദ്രി(റ): റസൂൽ(സ) പറയുന്നു: \"മൂന്നു കാര്യങ്ങൾ നോമ്പു മുറിക്കുകയില്ല; കൊമ്പുവെക്കലും ഛർദ്ദിയും സ്വപ്നസ്ഖലനവും\". (തു)", "narrator_ml": "അബീസഈദിനിൽ ഖുദ്രി(റ)", "source_codes_ar": ["ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 80, "page_start": 130}, {"hadith_no": 328, "arabic": "عَنْ زَيْدِ بْنِ أَسْلَمَ الْعَدَوِيِّ، عَنْ رَجُلٍ مِنْ أَصْحَابِهِ، عَنْ رَجُلٍ مِنْ أَصْحَابِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"لَا يُفْطِرُ مَنْ قَاءَ، وَلَا مَنِ احْتَلَمَ، وَلَا مَنِ احْتَجَمَ\". (د,ت)", "malayalam": "നബി(സ)യുടെ ഒരു അനുചരനിൽനിന്ന് തന്റെ സുഹൃത്ത് നിവേദനം ചെയ്യുന്നതായി സൈദുബ്നു അസ്ലമിൽ അദവീ(റ): റസൂൽ(സ) പറഞ്ഞു: \"കൊമ്പുവെച്ചവനും, സ്വപ്നസ്ഖലനം ഉണ്ടായവനും, സ്വമേധയാ ഛർദ്ദി ഉണ്ടായവനും നോമ്പ് മുറിച്ചിട്ടില്ല\". (ദ,തു)", "narrator_ml": null, "source_codes_ar": ["د", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 80, "page_start": 131}, {"hadith_no": 329, "arabic": "عَنْ فَضَالَةَ بْنِ عُبَيْدٍ الْأَنْصَارِيِّ رَضِيَ اللهُ عَنْهُ: أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ خَرَجَ عَلَيْهِمْ فِي يَوْمٍ كَانَ يَصُومُهُ، فَدَعَا بِإِنَاءٍ فَشَرِبَ. فَقُلْنَا: يَا رَسُولَ اللَّهِ، إِنَّ هَذَا يَوْمٌ كُنْتَ تَصُومُهُ؟ قَالَ: \"أَجَلْ، وَلَكِنِّي قِئْتُ\". [ز: في سنده انقطاع، ومدلس عنعنه] (جه)", "malayalam": "ഫളാലതുബ്നു ഉബൈദിൽ അൻസ്വാരി(റ): ഒരു ദിവസം റസൂൽ(സ) നോമ്പുനോറ്റ് അവരുടെ അടുത്തേക്ക് ചെന്നു. അപ്പോൾ ഒരു പാത്രം (വെള്ളം) കൊണ്ടുവരാൻ ആവശ്യപ്പെട്ടു. അതിൽനിന്ന് കുടിച്ചു. അപ്പോൾ ഞങ്ങൾ ചോദിച്ചു: തിരുദൂതരേ, തീർച്ചയായും ഈ ദിനത്തിൽ അങ്ങ് നോമ്പുകാരനായിരുന്നല്ലോ? റസൂൽ(സ) പറഞ്ഞു: \"അതെ, പക്ഷേ ഞാൻ ഛർദ്ദിച്ചു.\" ഇതിന്റെ പരമ്പരയിൽ നിവേദകർക്കിടയിൽ ഇടമുറിഞ്ഞിട്ടുണ്ട്. (ജ)", "narrator_ml": "ഫളാലതുബ്നു ഉബൈദിൽ അൻസ്വാരി(റ)", "source_codes_ar": ["جه"], "grading_note_ml": null, "grading_note_ar": "ز: في سنده انقطاع، ومدلس عنعنه", "explanation_ml": null, "variants": [], "bab_seq": 80, "page_start": 131}, {"hadith_no": 330, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"مَنْ صَامَ رَمَضَانَ وَقَامَهُ- إِيمَانًا وَاحْتِسَابًا- غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ. وَمَنْ قَامَ لَيْلَةَ الْقَدْرِ إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ\". صَحِيحٌ. (ق,ن)", "malayalam": "അബൂഹുറൈറ(റ): റസൂൽ(സ) പറഞ്ഞു: \"ആരെങ്കിലും റമളാൻ മാസത്തിൽ പ്രതിഫലേച്ഛയോടെയും വിശ്വാസത്തോടെയും നിന്ന് നിസ്കരിക്കുകയും നോമ്പനുഷ്ഠിക്കുകയും ചെയ്താൽ അവന്റെ മുൻകഴിഞ്ഞ പാപങ്ങൾ പൊറുക്കപ്പെടും. വല്ലവനും ലൈലതുൽ ഖദ്റിൽ കൂലി ആഗ്രഹിച്ചും വിശ്വാസത്തോടെയും രാത്രി നിന്നു നിസ്കരിച്ചാൽ അവന്റെ മുൻകഴിഞ്ഞ പാപങ്ങളെല്ലാം പൊറുക്കപ്പെടും.\" (ബു,മു,ന)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["ق", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 81, "page_start": 131}, {"hadith_no": 331, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ خَرَجَ فِي جَوْفِ اللَّيْلِ يُصَلِّي فِي الْمَسْجِدِ، فَصَلَّى بِالنَّاسِ، قَالَتْ: فَكَانَ يُرَغِّبُهُمْ فِي قِيَامِ رَمَضَانَ مِنْ غَيْرِ أَنْ يَأْمُرَهُمْ بِعَزِيمَةٍ، وَيَقُولُ: \"مَنْ قَامَ لَيْلَةَ الْقَدْرِ- وَفِي رِوَايَةٍ: مَنْ قَامَ رَمَضَانَ- إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ\". قَالَ: فَتُوُفِّيَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَالْأَمْرُ عَلَى ذَلِكَ. (خ,ن)", "malayalam": "ആഇശ(റ): റസൂൽ(സ) അർദ്ധരാത്രിയിൽ പള്ളിയിലേക്കു നിസ്കരിക്കാൻ പുറപ്പെട്ടു. സഹചാരികളൊത്ത് അവിടന്ന് നിസ്കാരം നിർവ്വഹിച്ചു. കണിശമായ കൽപനയില്ലാതെ റമളാനിലെ നിസ്കാരത്തിന് തിരുമേനി(സ) അവരെ പ്രേരിപ്പിക്കും. അവിടന്ന് പറഞ്ഞു: \"ഖദ്റിന്റെ രാത്രിയിൽ - മറ്റൊരഭിപ്രായത്തിൽ റമളാനിൽ - പ്രതിഫലേച്ഛയോടെയും വിശ്വാസത്തോടെയും നിശാനിസ്കാരം നിർവ്വഹിച്ചാൽ മുൻകാലങ്ങളിൽ അവൻ ചെയ്ത പാപങ്ങൾ പൊറുക്കപ്പെടും.\" നിവേദകൻ പറയുന്നു: കാര്യം അപ്രകാരം ആയിരിക്കെയാണ് റസൂൽ(സ) വഫാത്തായത്. (ബു,ന)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["خ", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: مَنْ قَامَ رَمَضَانَ- إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ\". قَالَ: فَتُوُفِّيَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَالْأَمْرُ عَلَى ذَلِكَ. (خ,ن)", "malayalam": null}], "bab_seq": 81, "page_start": 131}, {"hadith_no": 332, "arabic": "عَنْ أَبِي ذَرٍّ رَضِيَ اللهُ عَنْهُ قَالَ: صُمْنَا مَعَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، فَلَمْ يُصَلِّ بِنَا حَتَّى بَقِيَ سَبْعٌ مِنَ الشَّهْرِ، فَقَامَ بِنَا حَتَّى ذَهَبَ ثُلُثُ اللَّيْلِ، ثُمَّ لَمْ يَقُمْ بِنَا فِي السَّادِسَةِ وَقَامَ بِنَا فِي الْخَامِسَةِ حَتَّى ذَهَبَ شَطْرُ اللَّيْلِ، فَقُلْنَا لَهُ: يَا رَسُولَ اللَّهِ، لَوْ نَفَّلْتَنَا بَقِيَّةَ لَيْلَتِنَا هَذِهِ؟ فَقَالَ: \"إِنَّهُ مَنْ قَامَ مَعَ الْإِمَامِ حَتَّى يَنْصَرِفَ كُتِبَ لَهُ قِيَامُ لَيْلَةٍ\". (ت)", "malayalam": "അബൂദർറ്(റ): ഞങ്ങൾ റസൂൽ(സ)യുടെ കൂടെ നോമ്പുനോറ്റു. മാസത്തിലെ ഏഴുദിവസം ബാക്കിയാകുവോളം അവിടന്ന് ഞങ്ങൾക്ക് ഇമാമായി നിസ്കരിച്ചില്ല. അപ്പോൾ (23 കഴിഞ്ഞപ്പോൾ) അവിടന്ന് രാത്രിയുടെ മൂന്നിലൊന്നു കഴിയുവോളം നിസ്കരിച്ചു. പിന്നെ ആറാംദിനം നിസ്കരിച്ചില്ല. അഞ്ചാം ദിനം രാത്രിയുടെ പകുതി കഴിയുന്നതുവരെ നിസ്കരിച്ചു. അപ്പോൾ ഞങ്ങൾ അവിടത്തോട് പറഞ്ഞു: അല്ലാഹുവിന്റെ റസൂലേ, ഈ രാത്രിയിലെ ബാക്കി സമയം കൂടി താങ്കൾ ഞങ്ങൾക്കു വിട്ടുതന്നിരുന്നെങ്കിൽ. അപ്പോൾ അവിടന്ന് പറഞ്ഞു: \"പിരിയുന്നതുവരെ ഇമാമിനോടൊപ്പം ഒരാൾ നിസ്കരിച്ചാൽ ഒരു രാത്രിയിലെ നിസ്കാരം മുഴുവൻ അവന് എഴുതപ്പെടുന്നതാണ്.\" (തു)", "narrator_ml": "അബൂദർറ്(റ)", "source_codes_ar": ["ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 82, "page_start": 132}, {"hadith_no": 333, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُرَغِّبُ فِي قِيَامِ رَمَضَانَ مِنْ غَيْرِ أَنْ يَأْمُرَهُمْ بِعَزِيمَةٍ، وَيَقُولُ: \"مَنْ قَامَ رَمَضَانَ- إِيمَانًا وَاحْتِسَابًا- غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ\". فَتُوُفِّيَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَالْأَمْرُ عَلَى ذَلِكَ، ثُمَّ كَانَ الْأَمْرُ كَذَلِكَ فِي خِلَافَةِ أَبِي بَكْرٍ، وَصَدْرًا مِنْ خِلَافَةِ عُمَرَ عَلَى ذَلِكَ. حَسَنٌ صَحِيحٌ. (م,د,ت)", "malayalam": "അബൂഹുറൈറ(റ): കണിശമായ കൽപനകൂടാതെ റമളാനിലെ നിസ്കാരത്തെ റസൂൽ(സ) പ്രേരിപ്പിച്ചിരുന്നു. \"പ്രതിഫലേച്ഛയോടെയും വിശ്വാസത്തോടെയും റമളാനിലെ നിസ്കാരം നിർവ്വഹിച്ചവരുടെ മുൻപാപങ്ങൾ പൊറുക്കപ്പെട്ടു\"മെന്നു തിരുമേനി(സ) പറഞ്ഞു. റസൂൽ(സ)യുടെ വഫാത്തിന്റെ സമയത്തും അബൂബക്കർ(റ)ന്റെ ഖിലാഫതിന്റെ കാലത്തും ഉമർ(റ)വിന്റെ ഖിലാഫത്തിന്റെ തുടക്കംവരെയും കാര്യം ഇപ്രകാരം തുടരുകയുണ്ടായി. (മു,ദ,തു)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["م", "د", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 82, "page_start": 132}, {"hadith_no": 334, "arabic": "عَنِ النَّضْرِ بْنِ شَيْبَانَ: أَنَّهُ لَقِيَ أَبَا سَلَمَةَ بْنَ عَبْدِ الرَّحْمَنِ فَقَالَ لَهُ: حَدِّثْنِي بِأَفْضَلِ شَيْءٍ سَمِعْتَهُ يُذْكَرُ فِي شَهْرِ رَمَضَانَ. فَقَالَ أَبُو سَلَمَةَ: حَدَّثَنِي عَبْدُ الرَّحْمَنِ بْنُ عَوْفٍ رَضِيَ اللهُ عَنْهُ، عَنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنَّهُ ذَكَرَ شَهْرَ رَمَضَانَ فَفَضَّلَهُ عَلَى الشُّهُورِ، وَقَالَ: \"مَنْ قَامَ رَمَضَانَ إِيمَانًا وَاحْتِسَابًا خَرَجَ مِنْ ذُنُوبِهِ كَيَوْمِ وَلَدَتْهُ أُمُّهُ\". قَالَ النَّسَائِيُّ: هَذَا خَطَأٌ، وَالصَّوَابُ: أَبُو سَلَمَةَ عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ. (ن)", "malayalam": "നള്റുബ്നു ശൈബാൻ(റ): അബൂസലമതുബ്നു അബ്ദുറഹ്മാൻ(റ)വിനെ അദ്ദേഹം കണ്ടുമുട്ടി. അദ്ദേഹത്തോട് പറഞ്ഞു: റമളാൻ മാസത്തെക്കുറിച്ച് നിങ്ങൾ കേട്ട ശ്രേഷ്ഠമായ കാര്യം അറിയിച്ചുതരിക. അബൂസലമ(റ) പ്രതിവചിച്ചു: റസൂൽ(സ) റമളാനിനെക്കുറിച്ച് പരാമർശിക്കുകയും റമളാൻ മാസം മറ്റു മാസങ്ങളേക്കാൾ ശ്രേഷ്ഠമാണെന്ന് പറയുകയും \"ആരെങ്കിലും പ്രതിഫലേച്ഛയോടെയും വിശ്വാസത്തോടെയും റമളാനിലെ നിസ്കാരം നിർവ്വഹിച്ചാൽ, തന്നെ മാതാവ് പ്രസവിച്ച ദിവസത്തെപ്പോലെ, പാപങ്ങളിൽനിന്ന് അവൻ മുക്തനാകുന്നതാണ്.\" എന്ന് നബി(സ) പറയുകയും ചെയ്തുവെന്ന് അബ്ദുർറഹ്മാനുബ്നു ഔഫ്(റ) എന്നോട് പറഞ്ഞു. നസാഈ പറയുന്നു: ഇത് തെറ്റാണ്.

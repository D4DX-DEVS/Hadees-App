<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hadeeth Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Sans+Malayalam:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --card:#fffdf8; --ink:#1f2421; --muted:#6b706b; --line:#e4ded0;
  --accent:#1f6b52; --accent-soft:#e3efe9; --warn:#9a5b12; --warn-soft:#fbefdc; --chip:#efeadd;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121614; --card:#1a201d; --ink:#e8ebe6; --muted:#9aa29c; --line:#2a332e;
  --accent:#5fc19b; --accent-soft:#1d3229; --warn:#e3a95a; --warn-soft:#33281a; --chip:#242b27; }}
:root[data-theme="dark"]{
  --bg:#121614; --card:#1a201d; --ink:#e8ebe6; --muted:#9aa29c; --line:#2a332e;
  --accent:#5fc19b; --accent-soft:#1d3229; --warn:#e3a95a; --warn-soft:#33281a; --chip:#242b27; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Malayalam",system-ui,sans-serif;font-size:15px;line-height:1.75}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px 48px}
header{position:sticky;top:0;background:var(--bg);padding:14px 0 10px;z-index:2;border-bottom:1px solid var(--line)}
.crumb{font-size:12px;color:var(--muted)}
.crumb a{color:var(--accent);text-decoration:none;cursor:pointer}
h1{font-size:20px;margin:2px 0 8px;font-weight:600}
input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.list{list-style:none;padding:0;margin:12px 0}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
.row:hover{border-color:var(--accent)}
.num{flex:none;min-width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:13px}
.row .t{flex:1;min-width:0}
.row .ar{font-family:Amiri,serif;direction:rtl;text-align:right;font-size:17px;color:var(--muted);line-height:1.6}
.meta{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.badge{background:var(--accent);color:#fff;border-radius:8px;padding:2px 10px;font-weight:600;font-size:13px}
.arabic{font-family:Amiri,serif;direction:rtl;text-align:right;font-size:22px;line-height:2.05;margin:6px 0 12px}
.narr{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 10px;font-size:12px;margin-bottom:6px}
.ml{white-space:pre-line}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--bg)}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:6px 10px;font-size:13px;margin-top:10px}
.note{border-left:3px solid var(--accent);padding:4px 10px;margin-top:10px;font-size:13px;color:var(--muted)}
details{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
summary{cursor:pointer;color:var(--accent);font-size:13px}
.var{margin:8px 0;padding:8px 10px;background:var(--bg);border-radius:8px}
.var .arabic{font-size:19px;margin:0 0 4px}
.rel a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600}
.legend{font-size:11px;color:var(--muted);margin-top:24px}
.schema{font-size:11px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:6px 10px;margin-top:6px;font-family:ui-monospace,monospace}
.hl{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <header>

    <h1 id="title"></h1>
    <input type="search" id="q" placeholder="തിരയുക / بحث (Malayalam or Arabic, harakat ignored)">
  </header>
  <main id="main"></main>
</div>

r": "بَابٌ: فِي الْمُعْتَكِفِ يَزُورُهُ أَهْلُهُ فِي الْمَسْجِدِ", "page": 141}, {"no": 94, "ml": "ഇഅ്തികാഫിരിക്കുന്നവൻ രോഗിയെ സന്ദർശിക്കലും ജനാസയിൽ പങ്കെടുക്കലും", "ar": "بَابٌ: فِي الْمُعْتَكِفِ يَعُودُ الْمَرِيضَ وَيَشْهَدُ الْجَنَائِزَ", "page": 142}, {"no": 95, "ml": "ഇഅ്തികാഫിരിക്കുന്നവൻ തല കഴുകലും മുടി ചീകലും", "ar": "بَابٌ: مَا جَاءَ فِي الْمُعْتَكِفِ يَغْسِلُ رَأْسَهُ وَيُرَجِّلُ", "page": 143}, {"no": 96, "ml": "ഇസ്തിഹാളത്തുള്ളവൾ ഇഅ്തികാഫിരിക്കൽ", "ar": "بَابٌ: فِي الْمُسْتَحَاضَةِ تَعْتَكِفُ", "page": 143}, {"no": 97, "ml": "ഇഅ്തികാഫിരിക്കുന്നതിന്റെ പ്രതിഫലം", "ar": "بَابٌ: فِي ثَوَابِ الْإِعْتِكَافِ", "page": 144}, {"no": 98, "ml": "രണ്ടു പെരുന്നാൾ രാത്രിയിലെ ആരാധന", "ar": "بَابٌ: فِيمَنْ قَامَ فِي لَيْلَتَيِ الْعِيدَيْنِ", "page": 144}], "hadiths": [{"hadith_no": 1, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"الصِّيَامُ جُنَّةٌ، فَلَا يَرْفُثْ وَلَا يَجْهَلْ، وَإِنِ امْرُؤٌ قَاتَلَهُ أَوْ شَاتَمَهُ فَلْيَقُلْ: إِنِّي صَائِمٌ، مَرَّتَيْنِ، وَالَّذِي نَفْسِي بِيَدِهِ لَخُلُوفُ فَمِ الصَّائِمِ أَطْيَبُ عِنْدَ اللَّهِ تَعَالَى مِنْ رِيحِ الْمِسْكِ، يَتْرُكُ طَعَامَهُ وَشَرَابَهُ وَشَهْوَتَهُ مِنْ أَجْلِي، الصِّيَامُ لِي وَأَنَا أَجْزِي بِهِ، وَالْحَسَنَةُ بِعَشْرِ أَمْثَالِهَا\". (خ)", "malayalam": "അബൂഹുറൈറ(റ): റസൂൽ(സ) പറഞ്ഞു: \"നോമ്പ് പരിചയാണ്. നോമ്പുകാരൻ തെറ്റായ പ്രവൃത്തികൾ ചെയ്യുകയോ സംസ്കാരമില്ലാത്ത വാക്കുകൾ പറയുകയോ ചെയ്യരുത്. വല്ലവനും അവനോടു ശണ്ഠ കൂടുകയോ അവനെ ശകാരിക്കുകയോ ചെയ്തെങ്കിൽ ഞാൻ നോമ്പുകാരനാണെന്നു രണ്ടു തവണ അവൻ പറയട്ടെ. എന്റെ ആത്മാവിനെ നിയന്ത്രിക്കുന്ന അല്ലാഹുവാണെ! നോമ്പുകാരന്റെ വായയുടെ വാസന അല്ലാഹുവിന്റെ അടുക്കൽ കസ്തൂരിയേക്കാൾ സുഗന്ധമുള്ളതാണ്. അവൻ ഭക്ഷണ പാനീയങ്ങളും ദേഹേച്ഛയും എനിക്കു വേണ്ടിയാണ് ഉപേക്ഷിക്കുന്നത്. നോമ്പ് എനിക്കുള്ളതാണ്. ഞാൻ തന്നെയാണ് അതിന് പ്രതിഫലം നൽകുന്നത്. ഓരോ സൽകർമ്മത്തിനും പത്തിരട്ടിയാണ് ഞാൻ പ്രതിഫലം നൽകുക.\" (ബു)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["خ"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 1, "page_start": 49}, {"hadith_no": 2, "arabic": "عَنْ عُثْمَانَ بْنِ أَبِي الْعَاصِ رَضِيَ اللهُ عَنْهُ: سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ: \"الصِّيَامُ جُنَّةٌ مِنَ النَّارِ، كَجُنَّةِ أَحَدِكُمْ مِنَ الْقِتَالِ\". (ن,جه)", "malayalam": "ഉസ്മാനുബ്നു അബിൽആസ്(റ): റസൂൽ(സ) പറയുന്നത് ഞാൻ കേട്ടു: \"യുദ്ധത്തിൽ നിങ്ങളുടെ പരിച പോലെ നരകത്തിൽ നിന്നുള്ള പരിചയാണ് നോമ്പ്.\" (ന,ജ)", "narrator_ml": "ഉസ്മാനുബ്നു അബിൽആസ്(റ)", "source_codes_ar": ["ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 1, "page_start": 49}, {"hadith_no": 3, "arabic": "عَنْ سَهْلِ بْنِ سَعْدٍ رَضِيَ اللهُ عَنْهُ: أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"إِنَّ فِي الْجَنَّةِ بَابًا يُقَالُ لَهُ الرَّيَّانُ، يُدْعَى يَوْمَ الْقِيَامَةِ، يُقَالُ: أَيْنَ الصَّائِمُونَ؟ فَمَنْ كَانَ مِنَ الصَّائِمِينَ دَخَلَهُ، وَمَنْ دَخَلَهُ لَمْ يَظْمَأْ أَبَدًا\". (ت,جه)", "malayalam": "സഹ്ലുബ്നു സഅ്ദ്(റ): റസൂൽ(സ) പറഞ്ഞു: \"നിശ്ചയം സ്വർഗ്ഗത്തിൽ 'റയ്യാൻ' എന്നു വിളിക്കപ്പെടുന്ന ഒരു വാതിലുണ്ട്. അന്ത്യനാളിൽ വിളിക്കപ്പെടും: നോമ്പുകാരെവിടെ? അപ്പോൾ നോമ്പുകാർ അതിലൂടെ പ്രവേശിക്കും. അതിൽ പ്രവേശിച്ചവന് ഒരിക്കലും ദാഹമുണ്ടാകുകയില്ല.\" (തു,ജ)", "narrator_ml": "സഹ്ലുബ്നു സഅ്ദ്(റ)", "source_codes_ar": ["ت", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 1, "page_start": 49}, {"hadith_no": 4, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"مَنْ أَنْفَقَ زَوْجَيْنِ فِي سَبِيلِ اللَّهِ نُودِيَ مِنْ أَبْوَابِ الْجَنَّةِ: يَا عَبْدَ اللَّهِ هَذَا خَيْرٌ، فَمَنْ كَانَ مِنْ أَهْلِ الصَّلَاةِ دُعِيَ مِنْ بَابِ الصَّلَاةِ، وَمَنْ كَانَ مِنْ أَهْلِ الْجِهَادِ دُعِيَ مِنْ بَابِ الْجِهَادِ، وَمَنْ كَانَ مِنْ أَهْلِ الصِّيَامِ دُعِيَ مِنْ بَابِ الرَّيَّانِ، وَمَنْ كَانَ مِنْ أَهْلِ الصَّدَقَةِ دُعِيَ مِنْ بَابِ الصَّدَقَةِ\". فَقَالَ أَبُو بَكْرٍ رَضِيَ اللهُ عَنْهُ: بِأَبِي أَنْتَ وَأُمِّي يَا رَسُولَ اللَّهِ مَا عَلَى مَنْ دُعِيَ مِنْ تِلْكَ الْأَبْوَابِ مِنْ ضَرُورَةٍ، فَهَلْ يُدْعَى أَحَدٌ مِنْ تِلْكَ الْأَبْوَابِ كُلِّهَا؟ قَالَ: \"نَعَمْ، وَأَرْجُو أَنْ تَكُونَ مِنْهُمْ\". (خ,ن)", "malayalam": "അബൂഹുറൈറ(റ): റസൂൽ(സ) പറഞ്ഞു: \"വല്ലവരും ഒരു ജോടി (കുതിരകളെ) അല്ലാഹുവിന്റെ മാർഗത്തിൽ ചെലവഴിച്ചാൽ സ്വർഗ്ഗത്തിന്റെ വാതിലുകളിൽ നിന്ന് വിളിച്ചു പറയപ്പെടും: അല്ലാഹുവിന്റെ ദാസാ, ഈ വാതിലാണ് നിങ്ങൾക്കു നല്ലത്. നിസ്കാരക്കാരെ നിസ്കാരത്തിന്റെ വാതിലിൽ നിന്നും, അല്ലാഹുവിന്റെ മാർഗത്തിൽ യുദ്ധം ചെയ്തവരെ ജിഹാദിന്റെ വാതിലിൽ നിന്നും, നോമ്പുകാരെ 'റയ്യാൻ' എന്നു പേരുള്ള വാതിലിൽ നിന്നും, ദാനധർമ്മങ്ങൾ നൽകിയവരെ സ്വദഖയുടെ വാതിലിൽ നിന്നും വിളിക്കപ്പെടും\". അപ്പോൾ അബൂബക്കർ(റ) പറഞ്ഞു: എന്റെ മാതാപിതാക്കൾ അങ്ങേക്ക് ദണ്ഡമാണ് നബിയേ, ഈ വാതിലുകളിൽ നിന്നേതെങ്കിലും ഒന്നിൽ നിന്ന് ആരെങ്കിലും വിളിക്കപ്പെട്ടാൽ അവനു സ്വർഗ്ഗത്തിൽ പ്രവേശിക്കാൻ പ്രയാസമേതുമില്ല. എന്നാൽ മുഴുവൻ വാതിലുകളിൽ നിന്നും ഒരാൾ വിളിക്കപ്പെടുമോ? നബി(സ) പ്രതിവചിച്ചു: \"അതേ, നിങ്ങൾ അവരിലൊരാൾ ആകണമെന്നാണ് എന്റെ ആഗ്രഹം\". (ബു,ന)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["خ", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 1, "page_start": 49}, {"hadith_no": 5, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"قَالَ اللَّهُ: كُلُّ عَمَلِ ابْنِ آدَمَ لَهُ، إِلَّا الصِّيَامَ فَإِنَّهُ لِي وَأَنَا أَجْزِي بِهِ، وَالصِّيَامُ جُنَّةٌ، فَإِذَا كَانَ يَوْمُ صَوْمِ أَحَدِكُمْ فَلَا يَرْفُثْ يَوْمَئِذٍ وَلَا يَسْخَبْ، فَإِنْ سَابَّهُ أَحَدٌ أَوْ قَاتَلَهُ فَلْيَقُلْ: إِنِّي امْرُؤٌ صَائِمٌ، وَالَّذِي نَفْسُ مُحَمَّدٍ بِيَدِهِ لَخُلُوفُ فَمِ الصَّائِمِ أَطْيَبُ عِنْدَ اللَّهِ مِنْ رِيحِ الْمِسْكِ، لِلصَّائِمِ فَرْحَتَانِ يَفْرَحُهُمَا: إِذَا أَفْطَرَ فَرِحَ بِفِطْرِهِ، وَإِذَا لَقِيَ رَبَّهُ فَرِحَ بِصَوْمِهِ\". (م)", "malayalam": "അബൂഹുറൈറ(റ): റസൂൽ(സ) അരുൾചെയ്തു: \"അല്ലാഹു പറഞ്ഞു: ആദം സന്തതികളുടെ നോമ്പൊഴികെയുള്ള മുഴുവൻ ആരാധനകളും അവർക്കുതന്നെയാണ്. നോമ്പെനിക്കുള്ളതാണ്. അതിനു പ്രതിഫലം നൽകുന്നതും ഞാൻ തന്നെ. നോമ്പു പരിചയാണ്. നിങ്ങളിലൊരാൾ നോമ്പെടുത്താൽ അന്നേ ദിവസം അവൻ തെറ്റായ പ്രവർത്തനങ്ങൾ ചെയ്യാതിരിക്കുകയും ബഹളമുണ്ടാക്കാതിരിക്കുകയും ചെയ്യട്ടെ. വല്ലവരും അവനെ ആക്ഷേപിക്കുകയോ അവനോട് ശണ്ഠകൂടുകയോ ചെയ്താൽ ഞാൻ നോമ്പുകാരനാണെന്ന് അവൻ പറയട്ടെ. എന്റെ ആത്മാവ് ആരുടെ നിയന്ത്രണത്തിലാണോ അവൻ തന്നെയാണ്! നിശ്ചയം നോമ്പുകാരന്റെ വായയുടെ ഗന്ധം അന്ത്യനാളിൽ അല്ലാഹുവിന്റെയടുക്കൽ കസ്തൂരിയേക്കാൾ സുഗന്ധമുള്ളതാണ്. നോമ്പുകാരനു രണ്ട് ആനന്ദമുണ്ട്. നോമ്പുതുറക്കുന്ന സമയത്തും മറ്റൊന്ന് അല്ലാഹുവിനെ കണ്ടുമുട്ടുന്ന സമയത്തും. ആ സമയത്ത് അവന്റെ നോമ്പുകൊണ്ടവൻ ആനന്ദിക്കുന്നു.\" (മു)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["م"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 1, "page_start": 50}, {"hadith_no": 6, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"إِنَّ رَبَّكُمْ يَقُولُ: كُلُّ حَسَنَةٍ بِعَشْرِ أَمْثَالِهَا إِلَى سَبْعِ مِائَةِ ضِعْفٍ، وَالصَّوْمُ لِي وَأَنَا أَجْزِي بِهِ، الصَّوْمُ جُنَّةٌ مِنَ النَّارِ، وَلَخُلُوفُ فَمِ الصَّائِمِ أَطْيَبُ عِنْدَ اللَّهِ مِنْ رِيحِ الْمِسْكِ، وَإِنْ جَهِلَ عَلَى أَحَدِكُمْ جَاهِلٌ وَهُوَ صَائِمٌ فَلْيَقُلْ: إِنِّي صَائِمٌ\". حَسَنٌ غَرِيبٌ (خ,ت)", "malayalam": "അബൂഹുറൈറ(റ): റസൂൽ(സ) പറഞ്ഞു: \"നിങ്ങളുടെ രക്ഷിതാവ് പറയുന്നു: ഓരോ നന്മക്കും പത്തിരട്ടി മുതൽ എഴുന്നൂറിരട്ടിവരെയാണു പ്രതിഫലം. നോമ്പ് എനിക്കുള്ളതും, ഞാൻ അതിനു പ്രതിഫലം നൽകുന്നതുമാണ്. വ്രതം നരകാഗ്നിയിൽ നിന്നുള്ള രക്ഷാകവചമാണ്. നിശ്ചയം നോമ്പുകാരന്റെ വായയുടെ ഗന്ധത്തിന് അല്ലാഹുവിന്റെയടുക്കൽ കസ്തൂരിയേക്കാൾ സുഗന്ധമുണ്ട്. നിങ്ങൾ നോമ്പുകാരനായിരിക്കെ വല്ലവരും നിങ്ങളോട് അറിവില്ലായ്മ പ്രവർത്തിച്ചാൽ നിങ്ങൾ ഞാൻ നോമ്പുകാരനാണ് എന്നു പറയുക.\" (ബു,തു)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["خ", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 1, "page_start": 50}, {"hadith_no": 7, "arabic": "عَنْ أَبِي أُمَامَةَ رَضِيَ اللهُ عَنْهُ قَالَ: أَتَيْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقُلْتُ: مُرْنِي بِأَمْرٍ آخُذُهُ عَنْكَ. قَالَ: \"عَلَيْكَ بِالصَّوْمِ، فَإِنَّهُ لَا مِثْلَ لَهُ\". وَفِي رِوَايَةٍ: قُلْتُ: يَا رَسُولَ اللَّهِ، مُرْنِي بِأَمْرٍ يَنْفَعُنِي اللَّهُ بِهِ. قَالَ: \"عَلَيْكَ بِالصَّوْمِ، فَإِنَّهُ لَا مِثْلَ لَهُ\". وَفِي رِوَايَةٍ: أَنَّهُ سَأَلَ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: أَيُّ الْعَمَلِ أَفْضَلُ؟ قَالَ: \"عَلَيْكَ بِالصَّوْمِ، فَإِنَّهُ لَا عِدْلَ لَهُ\". وَفِي رِوَايَةٍ قَالَ: قُلْتُ: يَا رَسُولَ اللَّهِ، مُرْنِي بِعَمَلٍ. قَالَ: \"عَلَيْكَ بِالصَّوْمِ، فَإِنَّهُ لَا عَدْلَ لَهُ\". (ن)", "malayalam": "അബൂഉമാമ(റ): ഞാൻ റസൂൽ(സ)യുടെ അടുത്തുചെന്നു ചോദിച്ചു: അല്ലാഹുവിന്റെ റസൂലേ, എന്നോടു വല്ലതും കൽപിക്കുക. അങ്ങയിൽനിന്നു ഞാനതു സ്വീകരിച്ചോട്ടേ. അവിടന്ന് പറഞ്ഞു: \"നീ നോമ്പനുഷ്ഠിക്കുക. അതിനോടു സദൃശ്യമായ മറ്റൊന്നുമില്ല.\"\nമറ്റൊരു നിവേദനം: ഞാൻ പറഞ്ഞു: എനിക്കല്ലാഹു ഉപകാരം ചെയ്യുന്ന ഒരു കാര്യം അല്ലാഹുവിന്റെ റസൂലേ, എന്നോടു കൽപിക്കുക. അവിടന്ന് പറഞ്ഞു: \"നോമ്പനുഷ്ഠിക്കുക. അതിനോടു സദൃശ്യമായ മറ്റൊന്നില്ലതന്നെ.\"\nമറ്റൊരു നിവേദനം: അദ്ദേഹം റസൂൽ(സ)യോട് ചോദിച്ചു: ഏറ്റവും ശ്രേഷ്ഠമായ ആരാധനയേതാണ്? നബി(സ) പ്രതിവചിച്ചു: \"നോമ്പനുഷ്ഠിക്കുക, നിശ്ചയം അതിന് തുല്യമായ മറ്റൊന്നില്ല.\"\nമറ്റൊരു നിവേദനം: ഞാൻ പറഞ്ഞു: റസൂലേ, എനിക്ക് ഒരു കർമ്മം പറഞ്ഞു തരിക. അവിടന്ന് പറഞ്ഞു: \"നീ നോമ്പനുഷ്ഠിക്കുക, അതിനോട് തുല്യമായ ഒന്നുമില്ല.\" (ന)", "narrator_ml": "അബൂഉമാമ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: قُلْتُ: يَا رَسُولَ اللَّهِ، مُرْنِي بِأَمْرٍ يَنْفَعُنِي اللَّهُ بِهِ. قَالَ: \"عَلَيْكَ بِالصَّوْمِ، فَإِنَّهُ لَا مِثْلَ لَهُ\".", "malayalam": "മറ്റൊരു നിവേദനം: ഞാൻ പറഞ്ഞു: എനിക്കല്ലാഹു ഉപകാരം ചെയ്യുന്ന ഒരു കാര്യം അല്ലാഹുവിന്റെ റസൂലേ, എന്നോടു കൽപിക്കുക. അവിടന്ന് പറഞ്ഞു: \"നോമ്പനുഷ്ഠിക്കുക. അതിനോടു സദൃശ്യമായ മറ്റൊന്നില്ലതന്നെ.\""}, {"seq": 2, "arabic": "وَفِي رِوَايَةٍ: أَنَّهُ سَأَلَ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: أَيُّ الْعَمَلِ أَفْضَلُ؟ قَالَ: \"عَلَيْكَ بِالصَّوْمِ، فَإِنَّهُ لَا عِدْلَ لَهُ\".", "malayalam": "മറ്റൊരു നിവേദനം: അദ്ദേഹം റസൂൽ(സ)യോട് ചോദിച്ചു: ഏറ്റവും ശ്രേഷ്ഠമായ ആരാധനയേതാണ്? നബി(സ) പ്രതിവചിച്ചു: \"നോമ്പനുഷ്ഠിക്കുക, നിശ്ചയം അതിന് തുല്യമായ മറ്റൊന്നില്ല.\""}, {"seq": 3, "arabic": "وَفِي رِوَايَةٍ قَالَ: قُلْتُ: يَا رَسُولَ اللَّهِ، مُرْنِي بِعَمَلٍ. قَالَ: \"عَلَيْكَ بِالصَّوْمِ، فَإِنَّهُ لَا عَدْلَ لَهُ\". (ن)", "malayalam": "മറ്റൊരു നിവേദനം: ഞാൻ പറഞ്ഞു: റസൂലേ, എനിക്ക് ഒരു കർമ്മം പറഞ്ഞു തരിക. അവിടന്ന് പറഞ്ഞു: \"നീ നോമ്പനുഷ്ഠിക്കുക, അതിനോട് തുല്യമായ ഒന്നുമില്ല.\" (ന)"}], "bab_seq": 1, "page_start": 50}, {"hadith_no": 8, "arabic": "عَنْ أَبِي عُبَيْدَةَ رَضِيَ اللهُ عَنْهُ قَالَ: سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ: \"الصَّوْمُ جُنَّةٌ، مَا لَمْ يَخْرِقْهَا\". (ن)", "malayalam": "അബൂഉബൈദ(റ): റസൂൽ(സ) പറയുന്നത് ഞാൻ കേട്ടു: \"നോമ്പു പരിചയാണ്, അതു പൊളിച്ചുകളയാത്ത കാലത്തോളം.\" (ന)", "narrator_ml": "അബൂഉബൈദ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 1, "page_start": 51}, {"hadith_no": 9, "arabic": "عَنْ سَهْلِ بْنِ سَعْدٍ رَضِيَ اللهُ عَنْهُ، عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"لِلصَّائِمِينَ بَابٌ فِي الْجَنَّةِ يُقَالُ لَهُ الرَّيَّانُ، لَا يَدْخُلُ فِيهِ أَحَدٌ غَيْرُهُمْ، فَإِذَا دَخَلَ آخِرُهُمْ أُغْلِقَ. مَنْ دَخَلَ فِيهِ شَرِبَ، وَمَنْ شَرِبَ لَمْ يَظْمَأْ أَبَدًا\". (ن)", "malayalam": "സഹ്ലുബ്നു സഅ്ദ്(റ): നബി(സ) പറഞ്ഞു: \"സ്വർഗ്ഗത്തിൽ നോമ്പുകാർക്ക് 'റയ്യാൻ' എന്ന് പേരുള്ള ഒരു കവാടമുണ്ട്, നോമ്പുകാരല്ലാതെ മറ്റാരാളും അതിലൂടെ പ്രവേശിക്കുകയില്ല. അവരിൽ അവസാനത്തെയാൾ അതിലൂടെ പ്രവേശിച്ചാൽ വാതിൽ അടക്കപ്പെടും. അതിൽ പ്രവേശിച്ചവർ കുടിക്കുന്നു. കുടിച്ചവന്ന് പിന്നീട് ദാഹിക്കുകയില്ല.\"(ന)", "narrator_ml": "സഹ്ലുബ്നു സഅ്ദ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 1, "page_start": 51}, {"hadith_no": 10, "arabic": "عَنْ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ رَضِيَ اللهُ عَنْهُ قَالَ: خَرَجْنَا مَعَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَنَحْنُ شَبَابٌ لَا نَقْدِرُ عَلَى شَيْءٍ، قَالَ: \"يَا مَعْشَرَ الشَّبَابِ عَلَيْكُمْ بِالْبَاءَةِ، فَإِنَّهُ أَغَضُّ لِلْبَصَرِ وَأَحْصَنُ لِلْفَرْجِ. وَمَنْ لَمْ يَسْتَطِعْ فَعَلَيْهِ بِالصَّوْمِ، فَإِنَّهُ لَهُ وِجَاءٌ\". (ن)", "malayalam": "അബ്ദുല്ലാഹിബ്നു മസ്ഊദ്(റ): ഞങ്ങൾ റസൂൽ(സ)യോടൊപ്പം പുറപ്പെട്ടു. ഒരു കാര്യത്തിനും കഴിവില്ലാത്ത യുവാക്കളായിരുന്നു ഞങ്ങൾ. (വിവാഹം പോലെയുള്ള കാര്യങ്ങൾക്ക് സാധിക്കുന്നവരായിരുന്നില്ലെന്ന് സൂചിപ്പിക്കപ്പെടുന്നു). നബി(സ) പറഞ്ഞു: \"ഓ യുവാക്കളെ, നിങ്ങൾ വിവാഹം കഴിക്കുക, തീർച്ചയായും അത് കണ്ണുകളെ കീഴ്പ്പോട്ടാക്കുകയും ഗുഹ്യസ്ഥാനങ്ങളെ നിയന്ത്രിക്കുകയും ചെയ്യും. വിവാഹത്തിന് കഴിയാത്തവർ നോമ്പനുഷ്ഠിച്ചു കൊള്ളട്ടെ. അതവർക്ക് വികാര നിയന്ത്രണത്തിനുതകും.\" (ന)", "narrator_ml": "അബ്ദുല്ലാഹിബ്നു മസ്ഊദ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 1, "page_start": 51}, {"hadith_no": 11, "arabic": "عَنْ عَلْقَمَةَ: أَنَّ ابْنَ مَسْعُودٍ رَضِيَ اللهُ عَنْهُ لَقِيَ عُثْمَانَ رَضِيَ اللهُ عَنْهُ بِعَرَفَاتٍ فَخَلَا بِهِ فَحَدَّثَهُ، وَأَنَّ عُثْمَانَ قَالَ لِابْنِ مَسْعُودٍ: هَلْ لَكَ فِي فَتَاةٍ أُزَوِّجُكَهَا؟ فَدَعَا عَبْدُ اللَّهِ عَلْقَمَةَ فَحَدَّثَهُ: أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"مَنِ اسْتَطَاعَ مِنْكُمُ الْبَاءَةَ فَلْيَتَزَوَّجْ، فَإِنَّهُ أَغَضُّ لِلْبَصَرِ وَأَحْصَنُ لِلْفَرْجِ، وَمَنْ لَمْ يَسْتَطِعْ فَلْيَصُمْ، فَإِنَّ الصَّوْمَ لَهُ وِجَاءٌ\". (ن)", "malayalam": "അൽഖമ(റ): ഇബ്നുമസ്ഊദ്(റ) അറഫയിൽവെച്ച് ഉസ്മാൻ(റ)നെ കണ്ടുമുട്ടി. അദ്ദേഹത്തെ തനിച്ചു ലഭിച്ചപ്പോൾ അദ്ദേഹത്തോട് ഒത്തിരി സംസാരിച്ചു. ഉസ്മാൻ(റ) ഇബ്നുമസ്ഊദ്(റ)നോട് ചോദിച്ചു: നിങ്ങൾക്കു വല്ല യുവതികളിലും താൽപര്യമുണ്ടോ? ഞാൻ വിവാഹം കഴിപ്പിച്ചുതരാം. അപ്പോൾ അബ്ദുല്ല(റ) അൽഖമ(റ)നെ വിളിച്ച് പറഞ്ഞു: നിശ്ചയം നബി(സ) പറഞ്ഞിട്ടുണ്ട്: \"നിങ്ങളിൽ സാധിക്കുന്നവർ വിവാഹിതരാവട്ടെ. നിശ്ചയം അതു കണ്ണുകളെ താഴ്ത്തുകയും ഗുഹ്യസ്ഥാനങ്ങളെ നിയന്ത്രിക്കുകയും ചെയ്യും. വിവാഹത്തിനു സാധിക്കാത്തവൻ നോമ്പെടുത്തുകൊള്ളട്ടെ. നിശ്ചയം നോമ്പ് അവനു വികാരശമനോപാധിയാണ്.\" (ന)", "narrator_ml": "അൽഖമ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 1, "page_start": 51}, {"hadith_no": 12, "arabic": "عَنْ عَبْدِ الرَّحْمَنِ بْنِ يَزِيدَ قَالَ: دَخَلْنَا عَلَى عَبْدِ اللَّهِ بْنِ مَسْعُودٍ رَضِيَ اللهُ عَنْهُ، وَمَعَنَا عَلْقَمَةُ وَالْأَسْوَدُ وَجَمَاعَةٌ، فَحَدَّثَنَا بِحَدِيثٍ مَا رَأَيْتُهُ حَدَّثَ بِهِ الْقَوْمَ إِلَّا مِنْ أَجْلِي، لِأَنِّي كُنْتُ أَحْدَثَهُمْ سِنًّا، قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"يَا مَعْشَرَ الشَّبَابِ، مَنِ اسْتَطَاعَ مِنْكُمُ الْبَاءَةَ فَلْيَتَزَوَّجْ، فَإِنَّهُ أَغَضُّ لِلْبَصَرِ وَأَحْصَنُ لِلْفَرْجِ\". (ن)", "malayalam": "അബ്ദുറഹ്മാനുബ്നു യസീദ്(റ): ഞങ്ങൾ അബ്ദുല്ലാഹിബ്നു മസ്ഊദ്(റ)വിന്റെ അടുത്തു ചെന്നു. തദവസരം അൽഖമ(റ)യും അസ്വദ്(റ)വും മറ്റൊരു വിഭാഗവും ഞങ്ങളോടൊപ്പമുണ്ട്. അബ്ദുല്ല(റ) ഞങ്ങളോടൊരു ഹദീസ് പറഞ്ഞു. ഞാനുണ്ടായതു കൊണ്ടാണ് അവരത് പറഞ്ഞു തന്നതെന്നാണ് ഞാൻ മനസ്സിലാക്കുന്നത്, കാരണം ഞാനായിരുന്നു അവരിൽ ഏറ്റവും പ്രായം കുറഞ്ഞ വ്യക്തി. അദ്ദേഹം പറയുന്നു: റസൂൽ(സ) പറഞ്ഞിട്ടുണ്ട്: \"ഓ യുവാക്കളേ, നിങ്ങളിൽ കഴിവുള്ളവർ വിവാഹിതരാവട്ടെ. കാരണം, അതു കണ്ണിനെ താഴ്ത്തുകയും ഗുഹ്യസ്ഥാനങ്ങളെ നിയന്ത്രിക്കുകയും ചെയ്യും..\" (ന).", "narrator_ml": "അബ്ദുറഹ്മാനുബ്നു യസീദ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 1, "page_start": 52}, {"hadith_no": 13, "arabic": "عَنِ الْحَسَنِ بْنِ عَلِيٍّ رَضِيَ اللهُ عَنْهُمَا قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"تُحْفَةُ الصَّائِمِ الدُّهْنُ وَالْمِجْمَرُ\". (ت)", "malayalam": "ഹസനുബ്നു അലി(റ): റസൂൽ(സ) പറഞ്ഞു: \"നോമ്പുകാരനുള്ള സമ്മാനം (അവന്റെ ക്ഷീണം ഇല്ലാതാക്കുന്ന വസ്തുക്കൾ) എണ്ണയും ഉലുവാനുമാണ്. (തു)", "narrator_ml": "ഹസനുബ്നു അലി(റ)", "source_codes_ar": ["ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 1, "page_start": 52}, {"hadith_no": 14, "arabic": "عَنْ أَبِي سَعِيدٍ رَضِيَ اللهُ عَنْهُ: أَنَّهُ سَمِعَ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ: \"مَا مِنْ عَبْدٍ يَصُومُ يَوْمًا فِي سَبِيلِ اللَّهِ عَزَّ وَجَلَّ إِلَّا بَعَّدَ اللَّهُ عَزَّ وَجَلَّ بِذَلِكَ الْيَوْمِ وَجْهَهُ عَنِ النَّارِ سَبْعِينَ خَرِيفًا\". وَفِي رِوَايَةٍ: \"مَنْ صَامَ يَوْمًا فِي سَبِيلِ اللَّهِ عَزَّ وَجَلَّ بَاعَدَهُ اللَّهُ- وَفِي رِوَايَةٍ: بَاعَدَ اللَّهُ وَجْهَهُ- عَنِ النَّارِ سَبْعِينَ خَرِيفًا\". (ن)", "malayalam": "അബൂസഈദ്(റ): റസൂൽ(സ) പറയുന്നു: \"ഒരടിമ അല്ലാഹുവിന്റെ മാർഗ്ഗത്തിൽ ഒരു ദിവസം നോമ്പനുഷ്ഠിച്ചാൽ എഴുപത് വർഷത്തെ വിദൂരം നരകത്തിൽ നിന്നും അവന്റെ മുഖത്തെ അല്ലാഹു അകറ്റും.\" മറ്റൊരു നിവേദനത്തിൽ: \"അല്ലാഹുവിന്റെ മാർഗ്ഗത്തിൽ ഒരുത്തൻ ഒരു നോമ്പ് അനുഷ്ഠിച്ചാൽ നരകത്തെ തൊട്ട് അല്ലാഹു അവനെ എഴുപത് വർഷം വിദൂരത്താക്കുന്നതാണ്.\" (ന)", "narrator_ml": "അബൂസഈദ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: \"مَنْ صَامَ يَوْمًا فِي سَبِيلِ اللَّهِ عَزَّ وَجَلَّ بَاعَدَهُ اللَّهُ-", "malayalam": "മറ്റൊരു നിവേദനത്തിൽ: \"അല്ലാഹുവിന്റെ മാർഗ്ഗത്തിൽ ഒരുത്തൻ ഒരു നോമ്പ് അനുഷ്ഠിച്ചാൽ നരകത്തെ തൊട്ട് അല്ലാഹു അവനെ എഴുപത് വർഷം വിദൂരത്താക്കുന്നതാണ്.\" (ന)"}, {"seq": 2, "arabic": "وَفِي رِوَايَةٍ: بَاعَدَ اللَّهُ وَجْهَهُ- عَنِ النَّارِ سَبْعِينَ خَرِيفًا\". (ن)", "malayalam": null}], "bab_seq": 1, "page_start": 52}, {"hadith_no": 15, "arabic": "عَنْ عُقْبَةَ بْنِ عَامِرٍ رَضِيَ اللهُ عَنْهُ، عَنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"مَنْ صَامَ يَوْمًا فِي سَبِيلِ اللَّهِ عَزَّ وَجَلَّ بَاعَدَ اللَّهُ مِنْهُ جَهَنَّمَ مَسِيرَةَ مِائَةِ عَامٍ\". (ن)", "malayalam": "ഉഖ്ബതുബ്നു ആമിർ(റ): റസൂൽ(സ) പറഞ്ഞു: \"ആരെങ്കിലും അല്ലാഹുവിന്റെ മാർഗ്ഗത്തിൽ ഒരു ദിനം നോമ്പെടുത്താൽ അവനും നരകത്തിനുമിടക്ക് നൂറുവർഷത്തെ ദൂരം അല്ലാഹു സൃഷ്ടിക്കും.\" (ന)", "narrator_ml": "ഉഖ്ബതുബ്നു ആമിർ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 1, "page_start": 52}, {"hadith_no": 16, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"لِكُلِّ شَيْءٍ زَكَاةٌ، وَزَكَاةُ الْجِسْمِ الصَّوْمُ\". وَفِي رِوَايَةٍ: وَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"الصِّيَامُ نِصْفُ الصَّبْرِ\". [ز: في سنده ضعيف] (جه)", "malayalam": "അബൂഹുറൈറ(റ): റസൂൽ(സ) പറയുന്നു: \"എല്ലാ വസ്തുവിനും നിർബന്ധദാനമുണ്ട്. ശരീരത്തിന്റെ നിർബന്ധദാനം വ്രതമത്രെ.\" മറ്റൊരു നിവേദനം: റസൂൽ(സ) പറയുന്നു: \"വ്രതം ക്ഷമയുടെ പകുതിഭാഗമത്രെ.\" (പരമ്പരയിൽ ദുർബലനുണ്ട്) (ജ)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["جه"], "grading_note_ml": "പരമ്പരയിൽ ദുർബലനുണ്ട്", "grading_note_ar": "ز: في سنده ضعيف", "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: وَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"الصِّيَامُ نِصْفُ الصَّبْرِ\". [ز: في سنده ضعيف] (جه)", "malayalam": "മറ്റൊരു നിവേദനം: റസൂൽ(സ) പറയുന്നു: \"വ്രതം ക്ഷമയുടെ പകുതിഭാഗമത്രെ.\" (പരമ്പരയിൽ ദുർബലനുണ്ട്) (ജ)"}], "bab_seq": 1, "page_start": 52}, {"hadith_no": 17, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"ثَلَاثَةٌ لَا تُرَدُّ دَعْوَتُهُمْ: الْإِمَامُ الْعَادِلُ، وَالصَّائِمُ حَتَّى يُفْطِرَ، وَدَعْوَةُ الْمَظْلُومِ: يَرْفَعُهَا اللَّهُ دُونَ الْغَمَامِ يَوْمَ الْقِيَامَةِ، وَتُفْتَحُ لَهَا أَبْوَابُ السَّمَاءِ، وَيَقُولُ: بِعِزَّتِي لَأَنْصُرَنَّكِ وَلَوْ بَعْدَ حِينٍ\". (ت,جه)", "malayalam": "അബൂഹുറൈറ(റ): റസൂൽ(സ) അരുളി: \"മൂന്നുപേരുടെ പ്രാർത്ഥന തള്ളപ്പെടുകയില്ല: നീതിമാനായ ഭരണാധിപൻ, നോമ്പുകാരൻ നോമ്പു മുറിക്കുന്നതുവരെ, അക്രമിക്കപ്പെട്ടവന്റെ പ്രാർത്ഥന. അന്ത്യദിനത്തിൽ മറകൂടാതെ അവ ഉയർത്തപ്പെടുന്നു. ആകാശ കവാടങ്ങൾ അവക്കുവേണ്ടി തുറക്കപ്പെടും. അല്ലാഹു പറയും: എന്റെ ഔന്നിത്യം തന്നെ സത്യം, പിന്നീടെങ്കിലും നിന്നെ ഞാൻ സഹായിക്കുമെന്നതു തീർച്ച.\" (തു,ജ)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["ت", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 1, "page_start": 52}, {"hadith_no": 18, "arabic": "عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو رَضِيَ اللهُ عَنْهُمَا: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"إِنَّ لِلصَّائِمِ عِنْدَ فِطْرِهِ لَدَعْوَةً مَا تُرَدُّ\". (جه)", "malayalam": "അബ്ദുല്ലാഹിബ്നു അംറ്(റ): തിരുമേനി(സ) പറയുന്നു: \"നോമ്പുകാരൻ നോമ്പ് അവസാനിപ്പിക്കുന്ന അവസരത്തിൽ തള്ളപ്പെടാത്തൊരു പ്രാർത്ഥനയുമുണ്ട്. (ജ)", "narrator_ml": "അബ്ദുല്ലാഹിബ്നു അംറ്(റ)", "source_codes_ar": ["جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 1, "page_start": 53}, {"hadith_no": 19, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"إِذَا كَانَ أَوَّلُ لَيْلَةٍ مِنْ شَهْرِ رَمَضَانَ صُفِّدَتِ الشَّيَاطِينُ وَمَرَدَةُ الْجِنِّ، وَغُلِّقَتْ أَبْوَابُ النَّارِ فَلَمْ يُفْتَحْ مِنْهَا بَابٌ، وَفُتِّحَتْ أَبْوَابُ الْجَنَّةِ فَلَمْ يُغْلَقْ مِنْهَا بَابٌ، وَيُنَادِي مُنَادٍ: يَا بَاغِيَ الْخَيْرِ أَقْبِلْ، وَيَا بَاغِيَ الشَّرِّ أَقْصِرْ، وَلِلَّهِ عُتَقَاءُ مِنَ النَّارِ. وَذَلِكَ كُلَّ لَيْلَةٍ\". (م,ن,جه)", "malayalam": "അബൂഹുറൈറ(റ): റസൂൽ(സ) പറഞ്ഞു: \"റമളാനിന്റെ ആദ്യരാത്രിയായാൽ പിശാചുക്കളും അഹങ്കാരികളായ ജിന്നുകളും ചങ്ങലകളിൽ ബന്ധിക്കപ്പെടും. നരകത്തിന്റെ വാതിലുകൾ കൊട്ടിയടക്കപ്പെടും. അവയിലൊരു വാതിലും തുറക്കപ്പെടുകയില്ല. സ്വർഗ്ഗവാതിലുകൾ തുറക്കപ്പെടും. അവയിലൊരു വാതിലും അടക്കപ്പെടുകയില്ല. പിന്നെ, വിളിച്ചു പറയുന്ന ഒരാൾ വിളിച്ചു പറയും: നൻമേച്ഛുക്കളേ മുന്നിടൂ. തിന്മ കൊതിക്കുന്നവരേ തെറ്റുനിറുത്തുക. അല്ലാഹുവിന് നരകത്തിൽനിന്ന് മോചിപ്പിക്കപ്പെടുന്ന കുറെ അടിമകളുണ്ട്. ഇത് (റമളാനിലെ) എല്ലാ രാത്രികളിലുമുണ്ട്.\" (മു,ന,ജ)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["م", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 2, "page_start": 53}, {"hadith_no": 20, "arabic": "عَنْ عَرْفَجَةَ بْنِ عَبْدِ اللَّهِ الثَّقَفِيِّ قَالَ: عُدْنَا عُتْبَةَ بْنَ فَرْقَدٍ رَضِيَ اللهُ عَنْهُ، فَتَذَاكَرْنَا شَهْرَ رَمَضَانَ، فَقَالَ: مَا تَذْكُرُونَ؟ قُلْنَا: شَهْرُ رَمَضَانَ. قَالَ: سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ: \"تُفْتَحُ فِيهِ أَبْوَابُ الْجَنَّةِ، وَتُغْلَقُ فِيهِ أَبْوَابُ النَّارِ، وَتُغَلُّ فِيهِ الشَّيَاطِينُ، وَيُنَادِي مُنَادٍ كُلَّ لَيْلَةٍ: يَا بَاغِيَ الْخَيْرِ هَلُمَّ، وَيَا بَاغِيَ الشَّرِّ أَقْصِرْ\". وَفِي رِوَايَةٍ قَالَ: كُنْتُ فِي بَيْتٍ فِيهِ عُتْبَةُ بْنُ فَرْقَدٍ رَضِيَ اللهُ عَنْهُ، فَأَرَدْتُ أَنْ أُحَدِّثَ بِحَدِيثٍ، وَكَانَ رَجُلٌ مِنْ أَصْحَابِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَأَنَّهُ أَوْلَى بِالْحَدِيثِ مِنِّي، فَحَدَّثَ الرَّجُلُ عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ فِي رَمَضَانَ: \"تُفْتَحُ فِيهِ أَبْوَابُ السَّمَاءِ، وَتُغْلَقُ فِيهِ أَبْوَابُ النَّارِ، وَيُصَفَّدُ فِيهِ كُلُّ شَيْطَانٍ مَرِيدٍ، وَيُنَادِي مُنَادٍ كُلَّ لَيْلَةٍ: يَا طَالِبَ الْخَيْرِ هَلُمَّ، وَيَا طَالِبَ الشَّرِّ أَمْسِكْ\". (ن)", "malayalam": "അർഫജതുബ്നു അബ്ദില്ല(റ): ഞങ്ങൾ ഉത്ബതുബ്നു ഫർഖദ്(റ)വിനെ സന്ദർശിച്ചു. തദവസരത്തിൽ റമളാൻ മാസത്തെക്കുറിച്ച് ഞങ്ങൾ സംസാരിച്ചു. അപ്പോൾ അദ്ദേഹം ചോദിച്ചു: എന്തിനെക്കുറിച്ചാണ് നിങ്ങൾ സംസാരിക്കുന്നത്? റമളാനെക്കുറിച്ചാണെന്ന് ഞങ്ങൾ പറഞ്ഞു. തുടർന്ന് അദ്ദേഹം പറഞ്ഞു: റസൂൽ(സ) പറയുന്നത് ഞാൻ കേട്ടു: \"റമളാനിൽ സ്വർഗ്ഗവാതിലുകൾ തുറക്കപ്പെടും. നരകവാതിലുകൾ അടക്കപ്പെടും. പിശാചുക്കൾ ബന്ധിക്കപ്പെടും. എല്ലാ രാത്രിയിലും ഒരാൾ വിളിച്ചുപറഞ്ഞുകൊണ്ടിരിക്കും: നന്മ ആഗ്രഹിക്കുന്നവനേ, മുന്നോട്ട് വരിക. തിന്മയാഗ്രഹിക്കുന്നവനേ, അതിൽ നിന്നും പിന്തിരിയുക.\"\nമറ്റൊരു നിവേദനം: ഞാൻ ഉത്ബതുബ്നു ഫർഖദ്(റ) ഉണ്ടായിരുന്ന ഒരു വീട്ടിലായിരുന്നു. അന്നേരം ഞാൻ ഒരു ഹദീസ് പറയാനുദ്ദേശിച്ചു. എന്നേക്കാൾ ഹദീസിനെക്കുറിച്ച് പറയാനർഹനായ, നബി(സ)യുടെ അനുചരൻമാരിൽപ്പെട്ട ഒരാളുണ്ടായിരുന്നു അവിടെ. റമളാനിനെക്കുറിച്ച് നബി(സ) പറഞ്ഞതായി അദ്ദേഹം പറഞ്ഞു: \"അതിൽ ആകാശവാതിലുകൾ തുറക്കപ്പെടും, നരകവാതിലുകൾ അടക്കപ്പെടും, അക്രമകാരികളായ പിശാചുക്കളെല്ലാം തളക്കപ്പെടും. എല്ലാ രാത്രിയിലും ഒരാൾ വിളിച്ചുപറയും: നന്മ ആഗ്രഹിക്കുന്നവനേ, മുന്നോട്ട് വരിക, തിന്മ ആഗ്രഹിക്കുന്നവനേ, മാറിനിൽക്ക്.\" (ന)", "narrator_ml": "അർഫജതുബ്നു അബ്ദില്ല(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ قَالَ: كُنْتُ فِي بَيْتٍ فِيهِ عُتْبَةُ بْنُ فَرْقَدٍ رَضِيَ اللهُ عَنْهُ، فَأَرَدْتُ أَنْ أُحَدِّثَ بِحَدِيثٍ، و ote_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 2, "page_start": 54}, {"hadith_no": 23, "arabic": "عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ قَالَ: دَخَلَ رَمَضَانُ، فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"إِنَّ هَذَا الشَّهْرَ قَدْ حَضَرَكُمْ، وَفِيهِ لَيْلَةٌ خَيْرٌ مِنْ أَلْفِ شَهْرٍ، مَنْ حُرِمَهَا فَقَدْ حُرِمَ الْخَيْرَ كُلَّهُ، وَلَا يُحْرَمُ خَيْرَهَا إِلَّا مَحْرُومٌ\". (ن)", "malayalam": "അനസ്(റ): റമളാൻ ആഗതമായ സന്ദർഭം റസൂൽ(സ) അരുളി: \"നിശ്ചയം ഈ മാസം നിങ്ങൾക്ക് ആഗതമായിരിക്കുന്നു. അതിൽ ആയിരം മാസത്തേക്കാൾ പുണ്യമുള്ള ഒരു രാത്രിയുണ്ട്. ആ രാത്രി തടയപ്പെട്ടവർക്ക് മുഴുവൻ നന്മയും തടയപ്പെട്ടു, നിർഭാഗ്യവാന്മാർക്കല്ലാതെ ആ ഗുണം തടയപ്പെടുകയില്ല.\" (ന)", "narrator_ml": "അനസ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 2, "page_start": 54}, {"hadith_no": 24, "arabic": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لِامْرَأَةٍ مِنَ الْأَنْصَارِ: \"إِذَا كَانَ رَمَضَانُ فَاعْتَمِرِي فِيهِ، فَإِنَّ عُمْرَةً فِيهِ تَعْدِلُ حَجَّةً\". (ن)", "malayalam": "ഇബ്നുഅബ്ബാസ്(റ): റസൂൽ(സ) ഒരു അൻസാരി സ്ത്രീയോട് പറഞ്ഞു: \"റമളാൻ ആഗതമായാൽ അതിൽ നീ ഉംറ നിർവ്വഹിക്കുക. റമളാനിലെ ഉംറ ഹജ്ജിന് തുല്യമാണ്.\" (ന)", "narrator_ml": "ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 2, "page_start": 54}, {"hadith_no": 25, "arabic": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا: {يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ كَمَا كُتِبَ عَلَى الَّذِينَ مِنْ قَبْلِكُمْ} [البقرة:١٨٣] فَكَانَ النَّاسُ عَلَى عَهْدِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِذَا صَلَّوُا الْعَتَمَةَ حَرُمَ عَلَيْهِمُ الطَّعَامُ وَالشَّرَابُ وَالنِّسَاءُ، وَصَامُوا إِلَى الْقَابِلَةِ، فَاخْتَانَ رَجُلٌ نَفْسَهُ، فَجَامَعَ امْرَأَتَهُ وَقَدْ صَلَّى الْعِشَاءَ وَلَمْ يُفْطِرْ، فَأَرَادَ اللَّهُ عَزَّ وَجَلَّ أَنْ يَجْعَلَ ذَلِكَ يُسْرًا لِمَنْ بَقِيَ وَرُخْصَةً وَمَنْفَعَةً، فَقَالَ سُبْحَانَهُ: {عَلِمَ اللَّهُ أَنَّكُمْ كُنْتُمْ تَخْتَانُونَ أَنْفُسَكُمْ} [البقرة:١٨٧] الْآيَةَ. وَكَانَ هَذَا مِمَّا نَفَعَ اللَّهُ بِهِ النَّاسَ وَرَخَّصَ لَهُمْ وَيَسَّرَ. (د)", "malayalam": "ഇബ്നുഅബ്ബാസ്(റ): 'സത്യവിശ്വാസികളേ, നിങ്ങളുടെ മുൻഗാമികൾക്കു നോമ്പു നിർബന്ധമാക്കപ്പെട്ടതുപോലെ നിങ്ങൾക്കും നോമ്പ് നിർബന്ധമാക്കപ്പെട്ടിരിക്കുന്നു.' (അൽബഖറ: 183) നബി(സ)യുടെ കാലത്ത് രാത്രി നിസ്കാരശേഷം ജനങ്ങൾക്ക് അന്നപാനീയങ്ങളും ഭാര്യമാരും വിലക്കപ്പെടുകയും ആ സമയത്ത് തന്നെ അടുത്ത നോമ്പ് ആരംഭിക്കുകയും ചെയ്യുമായിരുന്നു. ആത്മവഞ്ചനയിലകപ്പെട്ട ഒരാൾ 'ഇശാ'നിസ്കരിച്ച് ഭാര്യയുമായി ബന്ധപ്പെടുകയും നോമ്പ് തുടരുകയും ചെയ്തു. ഇത് മറ്റുള്ളവർക്കു കൂടി ഇളവും സൗകര്യവും ഉപകാരപ്രദവുമാകാൻ അല്ലാഹു ഉദ്ദേശിച്ചു. അങ്ങനെ അല്ലാഹു പറഞ്ഞു: 'നിങ്ങൾ ആത്മവഞ്ചനയിലകപ്പെടുകയായിരുന്നുവെന്ന് അല്ലാഹു അറിഞ്ഞിരിക്കുന്നു.' (അൽബഖറ: 187) ഇത് അല്ലാഹു ജനങ്ങൾക്ക് നൽകിയ ഉപകാരവും വിട്ടുവീഴ്ചയും സൗകര്യവുമായിരുന്നു. (ദ)", "narrator_ml": "ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": "البقرة:١٨٧", "explanation_ml": null, "variants": [], "bab_seq": 3, "page_start": 54}, {"hadith_no": 26, "arabic": "عَنِ الْبَرَاءِ رَضِيَ اللهُ عَنْهُ قَالَ: كَانَ أَصْحَابُ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِذَا كَانَ الرَّجُلُ صَائِمًا فَحَضَرَ الْإِفْطَارُ فَنَامَ قَبْلَ أَنْ يُفْطِرَ لَمْ يَأْكُلْ لَيْلَتَهُ وَلَا يَوْمَهُ حَتَّى يُمْسِيَ، وَإِنَّ قَيْسَ بْنَ صِرْمَةَ الْأَنْصَارِيَّ كَانَ صَائِمًا فَلَمَّا حَضَرَ الْإِفْطَارُ أَتَى امْرَأَتَهُ فَقَالَ لَهَا: أَعِنْدَكِ طَعَامٌ؟ قَالَتْ: لَا، وَلَكِنْ أَنْطَلِقُ فَأَطْلُبُ لَكَ وَكَانَ يَوْمَهُ يَعْمَلُ فَغَلَبَتْهُ عَيْنَاهُ فَجَاءَتْهُ امْرَأَتُهُ، فَلَمَّا رَأَتْهُ قَالَتْ: خَيْبَةً لَكَ، فَلَمَّا انْتَصَفَ النَّهَارُ غُشِيَ عَلَيْهِ فَذُكِرَ ذَلِكَ لِلنَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَنَزَلَتْ هَذِهِ الْآيَةُ: {أُحِلَّ لَكُمْ لَيْلَةَ الصِّيَامِ الرَّفَثُ إِلَى نِسَائِكُمْ} فَفَرِحُوا بِهَا فَرَحًا شَدِيدًا، وَنَزَلَتْ: {وَكُلُوا وَاشْرَبُوا حَتَّى يَتَبَيَّنَ لَكُمُ الْخَيْطُ الْأَبْيَضُ مِنَ الْخَيْطِ الْأَسْوَدِ}. (خ,د,ت,ن)", "malayalam": "ബറാഅ്(റ): മുഹമ്മദ്(സ)യുടെ അനുയായികൾ; അവരിൽ ഒരാൾ നോമ്പനുഷ്ഠിച്ചു. തുറക്കുന്ന സമയമായെങ്കിലും നോമ്പ് തുറക്കുംമുമ്പ് അദ്ദേഹം ഉറങ്ങിപ്പോയി. ആ രാത്രിയും അടുത്ത പകലും അയാൾ ഒന്നും തന്നെ ഭക്ഷിച്ചില്ല. വൈകുവോളം കാത്തിരുന്നു. ഖൈസുബ്നു സ്വിർമത് നോമ്പുകാരനായിരുന്നു. നോമ്പു തുറക്കുവാനുള്ള സമയമായപ്പോൾ അദ്ദേഹം തന്റെ ഭാര്യയുടെ അടുത്തുചെന്നു ചോദിച്ചു: നിന്റെയടുത്ത് ഭക്ഷണം വല്ലതുമുണ്ടോ? അവർ പറഞ്ഞു: ഇല്ല, എങ്കിലും ഞാൻ നിങ്ങൾക്ക് വേണ്ടി അന്വേഷിക്കാം. അന്നു പകൽ മുഴുവനും അദ്ദേഹം ജോലിയെടുത്തിരുന്നു. അതുമൂലം അയാൾ ഉറങ്ങിപ്പോയി. ഭാര്യ തിരിച്ചുവന്നു. അദ്ദേഹം ഉറങ്ങുന്നതുകണ്ടപ്പോൾ അവർ പറഞ്ഞു: താങ്കളുടെ ദൗർഭാഗ്യം! പിറ്റേന്ന് ഉച്ചസമയത്ത് അദ്ദേഹം ബോധരഹിതനായി. വിഷയം നബി(സ)യെ ധരിപ്പിച്ചു. അപ്പോൾ സൂക്തമിറങ്ങി: 'നോമ്പിന്റെ രാത്രി ഭാര്യമാരുമായി സഹവസിക്കൽ നിങ്ങൾക്ക് അനുവദിക്കപ്പെട്ടിരിക്കുന്നു.' ഈ വിധിയിൽ അവർ വളരെയധികം സന്തോഷിച്ചു. ഈ സൂക്തവുമിറങ്ങി: 'വെളുത്ത നൂലിഴകളിൽനിന്ന് കറുത്ത നൂലിഴകൾ നിങ്ങൾക്ക് വെളിവാകുന്നതുവരെ നിങ്ങൾ തിന്നുകയും കുടിക്കുകയും ചെയ്യുക.' (2: 187) (ബു,ദ,തു,ന)", "narrator_ml": "ബറാഅ്(റ)", "source_codes_ar": ["خ", "د", "ت", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 3, "page_start": 55}, {"hadith_no": 27, "arabic": "عَنْ طَلْحَةَ بْنِ عُبَيْدِ اللَّهِ رَضِيَ اللهُ عَنْهُ: أَنَّ أَعْرَابِيًّا جَاءَ إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ ثَائِرَ الرَّأْسِ، فَقَالَ: يَا رَسُولَ اللَّهِ، أَخْبِرْنِي مَاذَا فَرَضَ اللَّهُ عَلَيَّ مِنَ الصَّلَاةِ؟ قَالَ: \"الصَّلَوَاتُ الْخَمْسُ إِلَّا أَنْ تَطَوَّعَ شَيْئًا\". قَالَ: أَخْبِرْنِي بِمَا افْتَرَضَ اللَّهُ عَلَيَّ مِنَ الصِّيَامِ؟ قَالَ: \"صِيَامُ شَهْرِ رَمَضَانَ إِلَّا أَنْ تَطَوَّعَ شَيْئًا\". قَالَ: أَخْبِرْنِي بِمَا افْتَرَضَ اللَّهُ عَلَيَّ مِنَ الزَّكَاةِ: فَأَخْبَرَهُ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِشَرَائِعِ الْإِسْلَامِ، فَقَالَ: وَالَّذِي أَكْرَمَكَ لَا أَتَطَوَّعُ شَيْئًا، لَا أَنْقُصُ مِمَّا فَرَضَ اللَّهُ عَلَيَّ شَيْئًا. فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"أَفْلَحَ إِنْ صَدَقَ. أَوْ: دَخَلَ الْجَنَّةَ إِنْ صَدَقَ\". (ن)", "malayalam": "ത്വൽഹതുബ്നു ഉബൈദില്ല(റ): ഒരു അഅ്റാബി മുടിയും പറത്തി റസൂൽ(സ)യുടെ സന്നിധിയിലെത്തി. എന്നിട്ടു പറഞ്ഞു: അല്ലാഹുവിന്റെ റസൂലേ, അല്ലാഹു എന്റെ മേൽ നിർബന്ധമാക്കിയ നിസ്കാരങ്ങൾ ഏതൊക്കെയെന്ന് എനിക്ക് പറഞ്ഞുതന്നാലും. അവിടന്ന് പറഞ്ഞു: \"അഞ്ചുനേരത്തെ നിസ്കാരം, നീ സുന്നത്ത് അനുഷ്ഠിക്കുന്നതൊഴികെ.\" അഅ്റാബി ചോദിച്ചു: എനിക്ക് നിർബന്ധമായ നോമ്പിനെക്കുറിച്ചു പറഞ്ഞുതരു. റസൂൽ(സ) പറഞ്ഞു: \"റമളാൻ മാസം വ്രതമനുഷ്ഠിക്കുക, പിന്നെ സുന്നത്തുകളും അനുഷ്ഠിക്കാം.\" അഅ്റാബി ചോദിച്ചു: സകാത്തിൽനിന്ന് എനിക്ക് നിർബന്ധമാക്കിയതിനെക്കുറിച്ച് പറഞ്ഞുതരൂ. അപ്പോൾ റസൂൽ(സ) ഇസ്ലാമിക നിയമങ്ങൾ പറഞ്ഞുകൊടുത്തു. തദവസരം അഅ്റാബി പറഞ്ഞു: അങ്ങയെ ആദരിച്ചവനാണു സത്യം! സുന്നത്തുകളൊന്നും ഞാൻ ചെയ്യില്ല. എന്റെ മേൽ നിർബന്ധമായതിൽ നിന്നൊന്നും തന്നെ ഞാൻ ചുരുക്കുകയുമില്ല. തൽക്ഷണം റസൂൽ(സ) പ്രതിവചിച്ചു: \"പറഞ്ഞത് സത്യമെങ്കിൽ അദ്ദേഹം വിജയിച്ചു.\" അല്ലെങ്കിൽ \"പറഞ്ഞത് സത്യമെങ്കിൽ അദ്ദേഹം സ്വർഗ്ഗത്തിൽ പ്രവേശിച്ചു.\" (ന)", "narrator_ml": "ത്വൽഹതുബ്നു ഉബൈദില്ല(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 3, "page_start": 55}, {"hadith_no": 28, "arabic": "عَنْ أَنَسٍ رَضِيَ اللهُ عَنْهُ قَالَ: نُهِينَا فِي الْقُرْآنِ أَنْ نَسْأَلَ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ عَنْ شَيْءٍ، فَكَانَ يُعْجِبُنَا أَنْ يَجِيءَ الرَّجُلُ الْعَاقِلُ مِنْ أَهْلِ الْبَادِيَةِ فَيَسْأَلَهُ، فَجَاءَ رَجُلٌ مِنْ أَهْلِ الْبَادِيَةِ فَقَالَ: يَا مُحَمَّدُ، أَتَانَا رَسُولُكَ فَأَخْبَرَنَا أَنَّكَ تَزْعُمُ: أَنَّ اللَّهَ عَزَّ وَجَلَّ أَرْسَلَكَ؟ قَالَ: \"صَدَقَ\". قَالَ: فَمَنْ خَلَقَ السَّمَاءَ؟ قَالَ: \"اللَّهُ\". قَالَ: فَمَنْ خَلَقَ الْأَرْضَ؟ قَالَ: \"اللَّهُ\". قَالَ: فَمَنْ نَصَبَ فِيهَا الْجِبَالَ: قَالَ: \"اللَّهُ\". قَالَ: فَمَنْ جَعَلَ فِيهَا الْمَنَافِعَ؟ قَالَ: \"اللَّهُ\". قَالَ: فَبِالَّذِي خَلَقَ السَّمَاءَ وَالْأَرْضَ وَنَصَبَ فِيهَا الْجِبَالَ وَجَعَلَ فِيهَا الْمَنَافِعَ، آللَّهُ أَرْسَلَكَ؟ قَالَ: \"نَعَمْ\". قَالَ: وَزَعَمَ رَسُولُكَ أَنَّ عَلَيْنَا خَمْسَ صَلَوَاتٍ فِي كُلِّ يَوْمٍ وَلَيْلَةٍ؟ قَالَ: \"صَدَقَ\". قَالَ: فَبِالَّذِي أَرْسَلَكَ، آللَّهُ أَمَرَكَ بِهَذَا؟ قَالَ: \"نَعَمْ\". قَالَ: وَزَعَمَ رَسُولُكَ أَنَّ عَلَيْنَا زَكَاةَ أَمْوَالِنَا؟ قَالَ: \"صَدَقَ\". قَالَ: فَبِالَّذِي أَرْسَلَكَ، آللَّهُ أَمَرَكَ بِهَذَا؟ قَالَ: \"نَعَمْ\". قَالَ: وَزَعَمَ رَسُولُكَ أَنَّ عَلَيْنَا صَوْمَ شَهْرِ رَمَضَانَ فِي كُلِّ سَنَةٍ؟ قَالَ: \"صَدَقَ\". قَالَ: فَبِالَّذِي أَرْسَلَكَ، آللَّهُ أَمَرَكَ بِهَذَا؟ قَالَ: \"نَعَمْ\". قَالَ: وَزَعَمَ رَسُولُكَ أَنَّ عَلَيْنَا الْحَجَّ مَنِ اسْتَطَاعَ إِلَيْهِ سَبِيلًا؟ قَالَ: \"صَدَقَ\". قَالَ: فَبِالَّذِي أَرْسَلَكَ، آللَّهُ أَمَرَكَ بِهَذَا؟ قَالَ: \"نَعَمْ\". قَالَ: فَوَالَّذِي بَعَثَكَ بِالْحَقِّ لَا أَزِيدَنَّ عَلَيْهِنَّ شَيْئًا وَلَا أَنْقُصُ. فَلَمَّا وَلَّى قَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"لَئِنْ صَدَقَ لَيَدْخُلَنَّ الْجَنَّةَ\". (ن)", "malayalam": "അനസ്(റ): നബി(സ)യോട് വല്ലതും ചോദിക്കുന്നതിൽ നിന്ന് ഖുർആൻ ഞങ്ങളെ വിലക്കിയിരുന്നു. എന്നാൽ, ബദവികളിൽപ്പെട്ട ബുദ്ധിമാനായ ഒരാൾ വന്ന് നബി(സ)യോട് ചോദ്യങ്ങൾ ചോദിക്കുന്നത് ഞങ്ങളെ ആശ്ചര്യഭരിതരാക്കിയിരുന്നു. ഒരു ബദവി വന്ന് നബി(സ)യോട് ചോദിച്ചു: മുഹമ്മദേ, താങ്കളെ അല്ലാഹു പ്രവാചകനായി നിയോഗിച്ചെന്ന് താങ്കൾ വാദിക്കുന്നതായി താങ്കളുടെ ഒരു ദൂതൻ ഞങ്ങളോട് പറഞ്ഞു. നബി(സ) പറഞ്ഞു: \"അത് സത്യമാണ്.\" അദ്ദേഹം ചോദിച്ചു: ആകാശം സൃഷ്ടിച്ചതാരാണ്? അവിടന്ന് പറഞ്ഞു: \"അല്ലാഹു.\" അയാൾ: ഭൂമിയെ സൃഷ്ടിച്ചതാരാണ്? നബി(സ): \"അല്ലാഹു.\" അയാൾ: അതിൽ പർവ്വതങ്ങൾ സ്ഥാപിച്ചതാരാണ്? നബി(സ): \"അല്ലാഹു.\" അയാൾ: ആരാണതിൽ ഉപകാരമുള്ള വസ്തുക്കൾ സൃഷ്ടിച്ചത്? നബി(സ): \"അല്ലാഹു.\" അയാൾ: ആകാശഭൂമികളെ സൃഷ്ടിക്കുകയും അതിൽ പർവ്വതങ്ങൾ സ്ഥാപിക്കുകയും ഉപകാരങ്ങൾ ഉണ്ടാക്കുകയും ചെയ്ത നാഥനാണോ താങ്കളെ നിയോഗിച്ചത്? നബി(സ): \"അതെ\". താങ്കളുടെ ദൂതൻ രാവിലും പകലിലുമായി അഞ്ചുസമയത്തു നിസ്കാരം നിർബന്ധമാണെന്ന് വാദിച്ചുവല്ലോ? നബി(സ): \"സത്യമാണയാൾ പറഞ്ഞത്.\" അയാൾ: താങ്കളെ നിയോഗിച്ച നാഥനാണ് സത്യം, അല്ലാഹുവാണോ താങ്കളോടിത് കൽപ്പിച്ചത്? റസൂൽ(സ): \"അതെ.\" അയാൾ: നിങ്ങളുടെ ദൂതൻ ഞങ്ങളുടെ സമ്പത്തിൽനിന്ന് നിർബന്ധദാനം നൽകണമെന്ന് വാദിച്ചുവല്ലോ? റസൂൽ(സ): \"അത് സത്യമാണ്.\" അയാൾ: നിങ്ങളെ നിയോഗിച്ചവൻ തന്നെ സത്യം, ഇത് താങ്കളോട് അല്ലാഹു കൽപിച്ചതാണോ? റസൂൽ(സ): \"അതെ.\" അയാൾ: ഓരോ വർഷവും റമളാൻ മാസം നോമ്പനുഷ്ഠിക്കണമെന്ന് നിങ്ങളുടെ ദൂതൻ വാദിച്ചുവല്ലോ? റസൂൽ(സ): \"സത്യമാണ് അദ്ദേഹം പറഞ്ഞത്\". അയാൾ: താങ്കളുടെ നിയോക്താവാണ് സത്യം, ഇതും നിങ്ങളോടല്ലാഹു കല്പിച്ച കാര്യമാണോ? റസൂൽ(സ): \"അതെ.\" അയാൾ: സാധ്യമെങ്കിൽ ഞങ്ങൾ ഹജ്ജ് ചെയ്യണമെന്ന് നിങ്ങളുടെ ദൂതൻ വാദിച്ചുവല്ലോ? നബി(സ) പറഞ്ഞു: \"സത്യമായും.\" അയാൾ: താങ്കളെ നിയോഗിച്ചവനാണ് സത്യം! താങ്കളോടിതും അല്ലാഹു കൽപിച്ചതാണോ? റസൂൽ(സ): \"അതെ.\" അയാൾ പറഞ്ഞു: സത്യദൂതുമായി താങ്കളെ നിയോഗിച്ച ഒരുവനാണ് സത്യം, ഞാൻ ഇതിൽ ഒന്നും അധികമാക്കുകയോ ചുരുക്കുകയോ ചെയ്യുകയില്ല. അയാൾ പിന്തിരിഞ്ഞപ്പോൾ റസൂൽ(സ) പറഞ്ഞു: \"അയാൾ പറഞ്ഞത് സത്യമെങ്കിൽ അയാൾ സ്വർഗ്ഗത്തിൽ പ്രവേശിക്കും.\" (ന)", "narrator_ml": "അനസ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 3, "page_start": 56}, {"hadith_no": 29, "arabic": "عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ: بَيْنَمَا نَحْنُ جُلُوسٌ فِي الْمَسْجِدِ جَاءَ رَجُلٌ عَلَى جَمَلٍ فَأَنَاخَهُ فِي الْمَسْجِدِ ثُمَّ عَقَلَهُ، فَقَالَ لَهُمْ: أَيُّكُمْ مُحَمَّدٌ؟ وَرَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مُتَّكِئٌ بَيْنَ ظَهْرَانَيْهِمْ، قُلْنَا لَهُ: هَذَا الرَّجُلُ الْأَبْيَضُ الْمُتَّكِئُ. فَقَالَ لَهُ الرَّجُلُ: يَا ابْنَ عَبْدِ الْمُطَّلِبِ، فَقَالَ لَهُ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"قَدْ أَجَبْتُكَ\". فَقَالَ الرَّجُلُ: إِنِّي سَائِلُكَ يَا مُحَمَّدُ فَمُشَدِّدٌ عَلَيْكَ فِي الْمَسْأَلَةِ، فَلَا تَجِدَنَّ فِي نَفْسِكَ. قَالَ: \"سَلْ مَا بَدَا لَكَ\". فَقَالَ الرَّجُلُ: نَشَدْتُكَ بِرَبِّكَ وَرَبِّ مَنْ قَبْلَكَ، آللَّهُ أَرْسَلَكَ إِلَى النَّاسِ كُلِّهِمْ؟ فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"اللَّهُمَّ نَعَمْ\". قَالَ: فَأَنْشُدُكَ اللَّهَ، آللَّهُ أَمَرَكَ أَنْ تُصَلِّيَ الصَّلَوَاتِ الْخَمْسَ فِي الْيَوْمِ وَاللَّيْلَةِ؟ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"اللَّهُمَّ نَعَمْ\". قَالَ: فَأَنْشُدُكَ اللَّهَ، آللَّهُ أَمَرَكَ أَنْ تَصُومَ هَذَا الشَّهْرَ مِنَ السَّنَةِ؟ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"اللَّهُمَّ نَعَمْ\". قَالَ: فَأَنْشُدُكَ اللَّهَ، آللَّهُ أَمَرَكَ أَنْ تَأْخُذَ هَذِهِ الصَّدَقَةَ مِنْ أَغْنِيَائِنَا فَتَقْسِمَهَا عَلَى فُقَرَائِنَا؟ فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"اللَّهُمَّ نَعَمْ\". فَقَالَ الرَّجُلُ: آمَنْتُ بِمَا جِئْتَ بِهِ، وَأَنَا رَسُولُ مَنْ وَرَائِي مِنْ قَوْمِي، وَأَنَا ضِمَامُ بْنُ ثَعْلَبَةَ أَخُو بَنِي سَعْدِ بْنِ بَكْرٍ.(ن)", "malayalam": "അനസുബ്നു മാലിക്(റ): ഞങ്ങൾ പള്ളിയിൽ ഇരിക്കുമ്പോൾ ഒട്ടകപ്പുറത്ത് ഒരാൾ വന്നിറങ്ങുകയും ഒട്ടകത്തെ ബന്ധിക്കുകയും ചെയ്തു. എന്നിട്ട് ഞങ്ങളോടു ചോദിച്ചു: നിങ്ങളിൽ മുഹമ്മദാരാണ്? തദവസരം റസൂൽ(സ) ഞങ്ങളുടെ ഇടയിൽ ചാരി ഇരിക്കുകയായിരുന്നു. ഞങ്ങൾ പറഞ്ഞു: ഈ ചാരിയിരിക്കുന്ന വെളുത്തയാളാണ്. ആഗതൻ നബി(സ)യോടു പറഞ്ഞു: അബ്ദുൽമുത്തലിബിന്റെ സന്താനമേ. റസൂൽ(സ) അയാളോട് പറഞ്ഞു: \"നിങ്ങൾക്ക് ഞാനുത്തരം നൽകി.\" ആഗതൻ പറഞ്ഞു: മുഹമ്മദേ, ഞാൻ താങ്കളോടു ചോദിക്കുകയാണ്, ചോദിക്കുന്നതിൽ വിഷമം കാണിക്കരുത്. റസൂൽ(സ): \"നിങ്ങൾക്ക് വേണ്ടതെല്ലാം ചോദിക്കൂ.\" ആഗതൻ പറഞ്ഞു: നിങ്ങളുടെയും നിങ്ങളുടെ മുൻകാലക്കാരുടെയും രക്ഷിതാവാണ് സത്യം! ഞാൻ ചോദിക്കുന്നു, അല്ലാഹു നിങ്ങളെ നിയോഗിച്ചത് മുഴുവൻ മനുഷ്യസമൂഹത്തിലേക്കുമായാണോ? റസൂൽ(സ): \"അല്ലാഹുവാണ സത്യം! അതെ.\" ആഗതൻ: അല്ലാഹുവാണ് സത്യം! ഞാനപേക്ഷിക്കുന്നു, രാവും പകലുമായി അഞ്ച് നേരം നിസ്കരിക്കാൻ നിങ്ങളോട് കൽപിച്ചത് അല്ലാഹു തന്നെയോ? റസൂൽ(സ): \"അതെ.\" ആഗതൻ: നാഥനാണെ, ഞാനപേക്ഷിക്കുന്നു, വർഷത്തിൽ ഒരു മാസം നോമ്പനുഷ്ഠിക്കാൻ നിങ്ങളോട് കൽപിച്ചത് നാഥൻ തന്നെയോ? റസൂൽ(സ): അതെ. ആഗതൻ: ഞങ്ങളിലുള്ള ദനാഢ്യരിൽ നിന്നും സ്വദഖ പിടിച്ച് പാവങ്ങൾക്ക് വിതരണം ചെയ്യാൻ നിങ്ങളോട് നാഥൻ കൽപിച്ചുവോ? റസൂൽ(സ): അതെ. ആഗതൻ പറഞ്ഞു: താങ്കൾ കൊണ്ടുവന്നതെല്ലാം ഞാൻ വിശ്വസിച്ചു കഴിഞ്ഞു. എന്റെ സമൂഹത്തിനു (ഗോത്രത്തിന്) ദൂതനാണു ഞാൻ. ഞാൻ ബനൂ സഅ്ദിബ്നി ബക്റിന്റെ സഹോദരൻ ളിമാമുബ്നു സഅ്ലബയാണ്. (ന)", "narrator_ml": "അനസുബ്നു മാലിക്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 3, "page_start": 57}, {"hadith_no": 30, "arabic": "عَنْ أَبِي الْبَخْتَرِيِّ رَضِيَ اللهُ عَنْهُ قَالَ: خَرَجْنَا لِلْعُمْرَةِ، فَلَمَّا نَزَلْنَا بِبَطْنِ نَخْلَةَ، قَالَ: تَرَاءَيْنَا الْهِلَالَ، فَقَالَ بَعْضُ الْقَوْمِ: هُوَ ابْنُ ثَلَاثٍ. وَقَالَ بَعْضُ الْقَوْمِ: هُوَ ابْنُ لَيْلَتَيْنِ. قَالَ: فَلَقِينَا ابْنَ عَبَّاسٍ فَقُلْنَا: إِنَّا رَأَيْنَا الْهِلَالَ، فَقَالَ بَعْضُ الْقَوْمِ: هُوَ ابْنُ ثَلَاثٍ، وَقَالَ بَعْضُ الْقَوْمِ: هُوَ ابْنُ لَيْلَتَيْنِ. فَقَالَ: أَيَّ لَيْلَةٍ رَأَيْتُمُوهُ؟ قَالَ: قُلْنَا: لَيْلَةَ كَذَا وَكَذَا، فَقَالَ ابْنُ عَبَّاسٍ: إِنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"إِنَّ اللَّهَ مَدَّهُ لِلرُّؤْيَةِ، فَهُوَ لِلَيْلَةٍ رَأَيْتُمُوهُ\". (م)", "malayalam": "അബുൽ ബഖ്തരി(റ): ഞങ്ങൾ ഉംറക്ക് പുറപ്പെട്ടു. അങ്ങനെ ഞങ്ങൾ 'ബത്നുനഖ്ല'യിൽ ഇറങ്ങിയപ്പോൾ (റമളാൻ) മാസപ്പിറവി ദർശിക്കാനിടയായി. അപ്പോൾ ചിലർ പറഞ്ഞു: ഇത് ഉദിച്ചിട്ട് മൂന്നുദിവസം കഴിഞ്ഞിരിക്കുന്നു. ചിലർ രണ്ടുദിനമെന്നഭിപ്രായപ്പെട്ടു. അങ്ങനെ ഇബ്നുഅബ്ബാസ്(റ)വിനെ കണ്ടപ്പോൾ ഞങ്ങൾ പറഞ്ഞു: ഞങ്ങൾ മാസം ദർശിച്ചിരിക്കുന്നു. എന്നാൽ ചിലർ അത് ഉദിച്ച് രണ്ടുദിവസം കഴിഞ്ഞെന്നും ചിലർ മൂന്നുദിവസമെന്നും അഭിപ്രായപ്പെടുന്നു. അപ്പോൾ ഇബ്നുഅബ്ബാസ്(റ) ചോദിച്ചു: നിങ്ങൾ ഏത് രാത്രിയിലാണ് പിറവി കണ്ടത്. ഇന്ന രാത്രിയിലാണെന്നു ഞങ്ങൾ മറുപടി പറഞ്ഞപ്പോൾ ഇബ്നുഅബ്ബാസ്(റ) പറഞ്ഞു: റസൂൽ(സ) പറഞ്ഞിട്ടുണ്ട്. \"മാസത്തെ നിങ്ങൾ ദർശിക്കുന്നതു (സമയം) വരെ അല്ലാഹു നിങ്ങൾക്ക് നീട്ടിത്തന്നിട്ടുണ്ട്. നിങ്ങൾ കാണുന്ന രാത്രിയേതോ അന്നുനിങ്ങൾ വ്രതം ആരംഭിക്കുക.\" (മു)", "narrator_ml": "അബുൽ ബഖ്തരി(റ)", "source_codes_ar": ["م"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 4, "page_start": 57}, {"hadith_no": 31, "arabic": "عَنْ رِبْعِيِّ بْنِ حِرَاشٍ، عَنْ حُذَيْفَةَ بْنِ الْيَمَانِ رَضِيَ اللهُ عَنْهُ، عَنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"لَا تُقَدِّمُوا الشَّهْرَ حَتَّى تَرَوُا الْهِلَالَ قَبْلَهُ، أَوْ تُكْمِلُوا الْعِدَّةَ، ثُمَّ صُومُوا حَتَّى تَرَوُا الْهِلَالَ أَوْ تُكْمِلُوا الْعِدَّةَ قَبْلَهُ\". (ن)", "malayalam": "രിബ്ഇയ്യുബ്നു ഹിറാശ്(റ), ഹുദൈഫത്തുബ്നുൽയമാൻ(റ): റസൂൽ(സ) പറഞ്ഞു: \"റമളാനിനു മുമ്പ് മാസം കാണുന്നത് വരെ, അല്ലെങ്കിൽ മാസം പൂർത്തിയാകുന്നതുവര  മാസം കണ്ടാൽ അപ്പോൾ നോമ്പുനോൽക്കും. കാണാതിരുന്നാൽ, പൊടിപടലങ്ങളോ മേഘമോ കാഴ്ചക്ക് മറയിട്ടില്ലെങ്കിൽ, നോമ്പില്ലാത്തവരായിരിക്കും. പൊടിപടലങ്ങളോ മേഘമോ മറയിട്ടാൽ അദ്ദേഹം നോമ്പുകാരനുമായിരിക്കും. (ദ)", "narrator_ml": "ഇബ്നുഉമർ(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 4, "page_start": 58}, {"hadith_no": 34, "arabic": "عَنِ ابْنِ عُمَرَ رَضِيَ اللهُ عَنْهُمَا عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنَّهُ قَالَ: \"إِنَّا أُمَّةٌ أُمِّيَّةٌ لَا نَكْتُبُ وَلَا نَحْسُبُ الشَّهْرُ هَكَذَا وَهَكَذَا، يَعْنِي مَرَّةً تِسْعَةً وَعِشْرِينَ، وَمَرَّةً ثَلَاثِينَ\". (خ)", "malayalam": "ഇബ്നുഉമർ(റ): നബി(സ) പറഞ്ഞു: \"എഴുതുകയോ കണക്കുകൂട്ടുകയോ ചെയ്യാത്ത നിരക്ഷര സമുദായ മാണ് നാം. മാസം ഇപ്രകാരമാണ്, ഇപ്രകാരവുമാണ്. അതായത് ചില സമയത്ത് ഇരുപത്തി ഒൻപതും ചിലപ്പോൾ മുപ്പതും.\" (ബു)", "narrator_ml": "ഇബ്നുഉമർ(റ)", "source_codes_ar": ["خ"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 5, "page_start": 58}, {"hadith_no": 35, "arabic": "عَنِ ابْنِ عُمَرَ رَضِيَ اللهُ عَنْهُمَا، عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"إِنَّا أُمَّةٌ أُمِّيَّةٌ، لَا نَكْتُبُ وَلَا نَحْسُبُ، الشَّهْرُ هَكَذَا وَهَكَذَا وَهَكَذَا\" ثَلَاثًا، حَتَّى ذَكَرَ تِسْعًا وَعِشْرِينَ. وَفِي رِوَايَةٍ: وَعَقَدَ الْإِبْهَامَ فِي الثَّالِثَةِ: \"وَالشَّهْرُ هَكَذَا وَهَكَذَا وَهَكَذَا\". تَمَامَ الثَّلَاثِينَ. وَفِي رِوَايَةٍ: وَنَقَصَ فِي الثَّالِثَةِ إِصْبَعًا مِنْ أَصَابِعِ يَدَيْهِ. (م,ن)", "malayalam": "ഇബ്നുഉമർ(റ): നബി(സ) പറഞ്ഞു: \"നാം നിരക്ഷര സമൂഹമാണ്. എഴുതുകയോ കണക്കുകൂട്ടുകയോ ഇല്ല. മാസം ഇപ്രകാരവും ഇപ്രകാരവും ഇപ്രകാരവുമാകുന്നു.\" മൂന്ന് പ്രാവശ്യം കാണിച്ചു. ഇരുപത്തൊൻപത് ദിവസത്തെയും പരാമർശിച്ചു.\nമറ്റൊരു നിവേദനം: മൂന്നാം പ്രാവശ്യം കൈകൊണ്ട് ആംഗ്യം കാണിച്ചപ്പോൾ തള്ളവിരൽ മടക്കിപ്പിടിച്ചു: \"മാസം ഇപ്രകാരവും, ഇപ്രകാരവും, ഇപ്രകാരവുമാണ്.\" മുപ്പത് പൂർത്തിയാക്കി കാണിച്ചു.\nമറ്റൊരു നിവേദനം: മൂന്നാം പ്രാവശ്യത്തെ ആംഗ്യത്തിൽ നബി(സ)യുടെ ഇരുകൈകളിൽ നിന്നുള്ള ഒരു വിരലിനെ ചുരുക്കിപ്പിടിച്ചു. (മു,ന)", "narrator_ml": "ഇബ്നുഉമർ(റ)", "source_codes_ar": ["م", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: وَعَقَدَ الْإِبْهَامَ فِي الثَّالِثَةِ: \"وَالشَّهْرُ هَكَذَا وَهَكَذَا وَهَكَذَا\". تَمَامَ الثَّلَاثِينَ.", "malayalam": "മറ്റൊരു നിവേദനം: മൂന്നാം പ്രാവശ്യം കൈകൊണ്ട് ആംഗ്യം കാണിച്ചപ്പോൾ തള്ളവിരൽ മടക്കിപ്പിടിച്ചു: \"മാസം ഇപ്രകാരവും, ഇപ്രകാരവും, ഇപ്രകാരവുമാണ്.\" മുപ്പത് പൂർത്തിയാക്കി കാണിച്ചു."}, {"seq": 2, "arabic": "وَفِي رِوَايَةٍ: وَنَقَصَ فِي الثَّالِثَةِ إِصْبَعًا مِنْ أَصَابِعِ يَدَيْهِ. (م,ن)", "malayalam": "മറ്റൊരു നിവേദനം: മൂന്നാം പ്രാവശ്യത്തെ ആംഗ്യത്തിൽ നബി(സ)യുടെ ഇരുകൈകളിൽ നിന്നുള്ള ഒരു വിരലിനെ ചുരുക്കിപ്പിടിച്ചു. (മു,ന)"}], "bab_seq": 5, "page_start": 59}, {"hadith_no": 36, "arabic": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا، عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"أَتَانِي جِبْرِيلُ عَلَيْهِ السَّلَامُ فَقَالَ: الشَّهْرُ تِسْعٌ وَعِشْرُونَ يَوْمًا\". وَفِي رِوَايَةٍ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"الشَّهْرُ تِسْعٌ وَعِشْرُونَ يَوْمًا\". (ن)", "malayalam": "ഇബ്നുഅബ്ബാസ്(റ): നബി(സ) പറഞ്ഞു: \"ജിബ്രീൽ(അ) എന്റെയടുക്കൽ വന്നുപറഞ്ഞു: മാസം ഇരുപത്തൊൻപത് ദിനങ്ങളാകുന്നു.\"\nമറ്റൊരു നിവേദനം: നബി(സ) അരുളി: \"മാസം ഇരുപത്തിയൊമ്പത് ദിനങ്ങളാകുന്നു.\" (ന)", "narrator_ml": "ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"الشَّهْرُ تِسْعٌ وَعِشْرُونَ يَوْمًا\". (ن)", "malayalam": "മറ്റൊരു നിവേദനം: നബി(സ) അരുളി: \"മാസം ഇരുപത്തിയൊമ്പത് ദിനങ്ങളാകുന്നു.\" (ന)"}], "bab_seq": 5, "page_start": 59}, {"hadith_no": 37, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"كَمْ مَضَى مِنَ الشَّهْرِ\". قَالَ: قُلْنَا: اثْنَانِ وَعِشْرُونَ، وَبَقِيَتْ ثَمَانٍ. فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"الشَّهْرُ هَكَذَا، وَالشَّهْرُ هَكَذَا، وَالشَّهْرُ هَكَذَا\". ثَلَاثَ مَرَّاتٍ، وَأَمْسَكَ وَاحِدَةً. (جه)", "malayalam": "അബൂഹുറൈറ(റ): റസൂൽ(സ) ചോദിച്ചു: \"മാസം എത്രയായി?\" ഞങ്ങൾ പറഞ്ഞു: ഇരുപത്തിരണ്ട്, എട്ടുദിവസം ശേഷിക്കുന്നു. അപ്പോൾ അവിടന്ന് \"മാസം ഇപ്രകാരമാണ്, മാസം ഇപ്രകാരമാണ്, മാസം ഇപ്രകാരമാണ്.\" എന്ന് മൂന്ന് തവണ പറയുകയും ഒരു വിരൽ മടക്കിപ്പിടിക്കുകയും ചെയ്തു. (ജ)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 5, "page_start": 59}, {"hadith_no": 38, "arabic": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا قَالَ: لَمْ أَزَلْ حَرِيصًا أَنْ أَسْأَلَ عُمَرَ بْنَ الْخَطَّابِ رَضِيَ اللهُ عَنْهُ عَنِ الْمَرْأَتَيْنِ مِنْ أَزْوَاجِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، اللَّتَيْنِ قَالَ اللَّهُ لَهُمَا: {إِنْ تَتُوبَا إِلَى اللَّهِ فَقَدْ صَغَتْ قُلُوبُكُمَا} [التحريم:٤]. وَسَاقَ الْحَدِيثَ.. وَقَالَ فِيهِ: فَاعْتَزَلَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نِسَاءَهُ- مِنْ أَجْلِ ذَلِكَ الْحَدِيثِ حِينَ أَفْشَتْهُ حَفْصَةُ إِلَى عَائِشَةَ- تِسْعًا وَعِشْرِينَ لَيْلَةً، قَالَتْ عَائِشَةُ: وَكَانَ قَالَ: \"مَا أَنَا بِدَاخِلٍ عَلَيْهِنَّ شَهْرًا\". مِنْ شِدَّةِ مَوْجِدَتِهِ عَلَيْهِنَّ حِينَ حَدَّثَهُ اللَّهُ عَزَّ وَجَلَّ حَدِيثَهُنَّ، فَلَمَّا مَضَتْ تِسْعٌ وَعِشْرُونَ لَيْلَةً دَخَلَ عَلَى عَائِشَةَ فَبَدَأَ بِهَا، فَقَالَتْ لَهُ عَائِشَةُ رَضِيَ اللهُ عَنْهَا: إِنَّكَ قَدْ كُنْتَ آلَيْتَ- يَا رَسُولَ اللَّهِ- أَنْ لَا تَدْخُلَ عَلَيْنَا شَهْرًا، وَإِنَّا أَصْبَحْنَا مِنْ تِسْعٍ وَعِشْرِينَ لَيْلَةً، نَعُدُّهَا عَدَدًا؟ فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"الشَّهْرُ تِسْعٌ وَعِشْرُونَ لَيْلَةً\". (ن)", "malayalam": "ഇബ്നുഅബ്ബാസ്(റ): 'നിങ്ങൾ രണ്ടുപേരും അല്ലാഹുവിലേക്ക് ഖേദിച്ചു മടങ്ങുകയാണെങ്കിൽ, നിങ്ങളുടെ ഹൃദയങ്ങൾ അതിലേക്ക് ചാഞ്ഞിരിക്കുന്നു.' (തഹ്രീം:4) എന്ന സൂക്തത്തിൽ അല്ലാഹു പ്രദിപാദിച്ച നബി(സ)യുടെ രണ്ട് ഭാര്യമാരെക്കുറിച്ച് ഉമറുബ്നുൽ ഖത്താബ്(റ)വിനോട് ചോദിച്ചറിയണമെന്ന് എനിക്ക് വല്ലാത്ത ആഗ്രഹമുണ്ടായിരുന്നു. അദ്ദേഹം ഹദീസ് പൂർണമായി ഉദ്ധരിക്കുന്നു... അതിൽ അദ്ദേഹം പറയുന്നു: ഹഫ്സ(റ) ആഇശ(റ)യോട് വിവരമറിയിച്ചതനുസരിച്ച് ഹദീസിലെ പരാമർശവിഷയം കാരണം നബി(സ) ഭാര്യമാരിൽ നിന്ന് ഇരുപത്തൊൻപത് ദിവസം ഒഴിഞ്ഞു നിന്നു. ആഇശ(റ) പറയുന്നു: നബി(സ) \"ഒരു മാസം, ഞാനവരുടെ അടുത്ത് പോവില്ലെ\"ന്ന് പറഞ്ഞിരുന്നു. അവരെക്കുറിച്ച് അല്ലാഹു തആല പറഞ്ഞറിയിച്ചതുമൂലം അവരോട് ഉണ്ടായ ദേഷ്യം കാരണമായിരുന്നു അത്. ഇപ്രകാരം ഇരുപത്തി ഒൻപത് ദിവസം പിന്നിട്ടപ്പോൾ നബി(സ) ആഇശ(റ)യുടെ അടുത്ത് ചെന്നു. അന്നേരം ആഇശ(റ) നബി(സ)യോട് ചോദിച്ചു: തിരുദൂതരേ, നിങ്ങൾ ഞങ്ങളുമായി ഒരു മാസക്കാലം ബന്ധപ്പെടുകയില്ലെന്ന് സത്യം ചെയ്തിരുന്നില്ലേ? ഇന്നേക്ക് ഇരുപത്തൊൻപത് ദിനങ്ങളേ ആയിട്ടുള്ളൂ. ഞങ്ങളത് എണ്ണിക്കൊണ്ടിരിക്കുകയാണ്. അന്നേരം നബി(സ) പറഞ്ഞു: \"മാസം ഇരുപത്തൊൻപത് രാവുകളാണ്.\" (ന)", "narrator_ml": "ഇബ്നുഅബ്ബാസ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": "التحريم:٤", "explanation_ml": null, "variants": [], "bab_seq": 5, "page_start": 59}, {"hadith_no": 39, "arabic": "عَنِ ابْنِ مَسْعُودٍ رَضِيَ اللهُ عَنْهُ قَالَ: لَمَا صُمْنَا مَعَ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ تِسْعًا وَعِشْرِينَ أَكْثَرَ مِمَّا صُمْنَا مَعَهُ ثَلَاثِينَ. (د,ت)", "malayalam": "ഇബ്നുമസ്ഊദ്(റ): നബി(സ)യോടു കൂടെ ഞങ്ങൾ മുപ്പതു നോമ്പ് അനുഷ്ഠിച്ചതിനേക്കാൾ കൂടുതൽ ഇരുപത്തിയൊൻപത് നോമ്പ് അനുഷ്ഠിച്ചിട്ടില്ല. (ദ,തു)", "narrator_ml": "ഇബ്നുമസ്ഊദ്(റ)", "source_codes_ar": ["د", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 5, "page_start": 60}, {"hadith_no": 40, "arabic": "عَنْ أَبِي بَكْرَةَ رَضِيَ اللهُ عَنْهُ: عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"شَهْرَا عِيدٍ لَا يَنْقُصَانِ، رَمَضَانُ وَذُو الْحِجَّةِ\". (ق,د,ت,جه)", "malayalam": "അബൂബക്റ(റ): നബി(സ) പറഞ്ഞു: \"പെരുന്നാളിന്റെ രണ്ടുമാസങ്ങളായ റമളാനും ദുൽഹിജ്ജയും ചുരുങ്ങുകയില്ല.\" (ബു,മു,ദ,തു,ജ)", "narrator_ml": "അബൂബക്റ(റ)", "source_codes_ar": ["ق", "د", "ت", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 6, "page_start": 60}, {"hadith_no": 41, "arabic": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ- ذَكَرَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِيهِ- قَالَ: \"وَفِطْرُكُمْ يَوْمَ تُفْطِرُونَ، وَأَضْحَاكُمْ يَوْمَ تُضَحُّونَ، وَكُلُّ عَرَفَةَ مَوْقِفٌ، وَكُلُّ مِنًى مَنْحَرٌ، وَكُلُّ فِجَاجِ مَكَّةَ مَنْحَرٌ، وَكُلُّ جَمْعٍ مَوْقِفٌ\". (د,ت,جه)", "malayalam": "അബൂഹുറൈറ(റ): നബി(സ) ഈ വിഷയത്തിൽ പറഞ്ഞു: \"നിങ്ങൾ നോമ്പു മുറിക്കുന്ന ദിവസമാണു നിങ്ങളുടെ (ഈദുൽ) ഫിത്വ്ർ. നിങ്ങൾ ബലിയറുക്കുന്ന ദിവസംതന്നെയാണ് നിങ്ങളുടെ ബലി പെരുന്നാൾ. അറഫ മുഴുവൻ നിൽക്കാനുള്ള സ്ഥലമാണ്. മിന മുഴുവൻ ബലിസ്ഥലമാണ്. മക്കയിലെ മലമ്പാതകളെല്ലാം ബലിസ്ഥലമാണ്. ജംഅ്(മുസ്ദലിഫ) മുഴുവൻ ജനങ്ങൾക്ക് നിൽക്കാനുള്ളതാണ്.\" (ദ,തു,ജ)", "narrator_ml": "അബൂഹുറൈറ(റ)", "source_codes_ar": ["د", "ت", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 6, "page_start": 60}, {"hadith_no": 42, "arabic": "عَنْ كُرَيْبٍ: أَنَّ أُمَّ الْفَضْلِ ابْنَةَ الْحَارِثِ بَعَثَتْهُ إِلَى مُعَاوِيَةَ رَضِيَ اللهُ عَنْهُ بِالشَّامِ، قَالَ: فَقَدِمْتُ الشَّامَ فَقَضَيْتُ حَاجَتَهَا فَاسْتَهَلَّ رَمَضَانُ وَأَنَا بِالشَّامِ، فَرَأَيْنَا الْهِلَالَ لَيْلَةَ الْجُمُعَةِ، ثُمَّ قَدِمْتُ الْمَدِينَةَ فِي آخِرِ الشَّهْرِ، فَسَأَلَنِي ابْنُ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا، ثُمَّ ذَكَرَ الْهِلَالَ، فَقَالَ: مَتَى رَأَيْتُمُ الْهِلَالَ؟ قُلْتُ: رَأَيْتُهُ لَيْلَةَ الْجُمُعَةِ، قَالَ: أَنْتَ رَأَيْتَهُ؟ قُلْتُ: نَعَمْ، وَرَآهُ النَّاسُ، وَصَامُوا وَصَامَ مُعَاوِيَةُ. قَالَ: لَكِنَّا رَأَيْنَاهُ لَيْلَةَ السَّبْتِ، فَلَا نَزَالُ نَصُومُهُ حَتَّى نُكْمِلَ الثَّلَاثِينَ أَوْ نَرَاهُ. فَقُلْتُ: أَفَلَا تَكْتَفِي بِرُؤْيَةِ مُعَاوِيَةَ وَصِيَامِهِ؟ قَالَ: لَا، هَكَذَا أَمَرَنَا رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. (م,د,ت,ن)", "malayalam": "കുറൈബ്(റ): ഹാരിസിന്റെ മകൾ ഉമ്മുൽഫള്ൽ(റ) അദ്ദേഹത്തെ ശാമിലുള്ള മുആവിയ(റ)യുടെ അടുത്തേക്കു പറഞ്ഞയച്ചു. നിവേദകൻ പറയുന്നു: ഞാൻ ശാമിൽ പ്രവേശിച്ചു അവരുടെ ആഗ്രഹം നിർവഹിച്ചു. ഞാൻ ശാമിലായിരിക്കെ അവിടെ റമളാൻ പിറ കണ്ടു. ഞങ്ങൾ വെള്ളിയാഴ്ച രാത്രിയാണു മാസപ്പിറവി ദർശിച്ചത്. മാസാവസാനം ഞാൻ മദീനയിലേക്കു വന്നു. അപ്പോൾ ഇബ്നുഅബ്ബാസ്(റ) എന്നോടു കുശലാന്വേഷണങ്ങൾ നടത്തവെ മാസപ്പിറവിയെക്കുറിച്ച് പരാമർശിച്ചു. അദ്ദേഹം ചോദിച്ചു: നിങ്ങൾ എപ്പോഴാണ് മാസപ്പിറവി കണ്ടത്. ഞാൻ പറഞ്ഞു: വെള്ളിയാഴ്ച രാത്രിയിലാണത് കണ്ടത്. അദ്ദേഹം ചോദിച്ചു: താങ്കൾ തന്നെയാണോ അതു കണ്ടത്? ഞാൻ പറഞ്ഞു: അതേ, ജനങ്ങളും അത് കണ്ടിട്ടുണ്ട്. അവരും മുആവിയ(റ)യും നോമ്പെടുക്കുകയും ചെയ്തു. ഇബ്നുഅബ്ബാസ്(റ) പറഞ്ഞു: എന്നാൽ ഞങ്ങൾ കണ്ടതു ശനിയാഴ്ച രാത്രിയിലായിരുന്നു. അപ്പോൾ ഞങ്ങൾ മാസം കാണുംവരെയോ മുപ്പതു പൂർത്തിയാക്കുംവരെയോ നോമ്പെടുക്കും. അപ്പോൾ ഞാൻ ചോദിച്ചു: മുആവിയ(റ)യുടെ ദർശനവും നോമ്പും താങ്കൾക്ക് മതിയാവുകയില്ലേ? അദ്ദേഹം പറഞ്ഞു: ഇല്ല. ഇങ്ങനെയാണ് റസൂൽ(സ) നമ്മോട് കൽപിച്ചിരിക്കുന്നത്. (മു,ദ,തു,ന)", "narrator_ml": "കുറൈബ്(റ)", "source_codes_ar": ["م", "د", "ت", "ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 7, "page_start": 60}, {"hadith_no": 43, "arabic": "عَنِ الْحَسَنِ رَضِيَ اللَّهُ عَنْهُ – فِي رَجُلٍ كَانَ بِمِصْرٍ مِنَ الْأَمْصَارِ فَصَامَ يَوْمَ الِاثْنَيْنِ، وَشَهِدَ رَجُلَانِ أَنَّهُمَا رَأَيَا الْهِلَالَ لَيْلَةَ الْأَحَدِ– فَقَالَ: لَا يَقْضِي ذَلِكَ الْيَوْمَ الرَّجُلُ وَلَا أَهْلُ مِصْرِهِ، إِلَّا أَنْ يَعْلَمُوا أَنَّ أَهْلَ مِصْرٍ مِنْ أَمْصَارِ الْمُسْلِمِينَ قَدْ صَامُوا يَوْمَ الْأَحَدِ، فَيَقْضُونَهُ. (د)", "malayalam": "ഹസൻ(റ): ഞായറാഴ്ച രാവിൽ മാസപ്പിറവി ദർശിച്ചതായി രണ്ടാളുകൾ സാക്ഷി പറഞ്ഞിരിക്കെ തിങ്കളാഴ്ച നോമ്പെടുത്ത ആ നഗരത്തിലുണ്ടായിരുന്ന ഒരാളെക്കുറിച്ച് പറയുന്നു: മുസ്‌ലിം പട്ടണനിവാസികൾ ഞായറാഴ്ച നോമ്പെടുത്തതായി അവർ അറിഞ്ഞാലല്ലാതെ അയാളോ തന്റെ പട്ടണനിവാസികളോ നോമ്പ് വീണ്ടെടുക്കേണ്ടതില്ല. അവരതറിഞ്ഞാൽ വീണ്ടെടുക്കുകയും വേണം. (ദ)", "narrator_ml": "ഹസൻ(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 7, "page_start": 61}, {"hadith_no": 44, "arabic": "عَنْ عِكْرِمَةَ رَضِيَ اللَّهُ عَنْهُ: أَنَّهُمْ شَكُّوا فِي هِلَالِ رَمَضَانَ مَرَّةً، فَأَرَادُوا أَنْ لَا يَقُومُوا وَلَا يَصُومُوا، فَجَاءَ أَعْرَابِيٌّ مِنَ الْحَرَّةِ فَشَهِدَ أَنَّهُ رَأَى الْهِلَالَ، فَأُتِيَ بِهِ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، فَقَالَ: \"أَتَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ، وَأَنِّي رَسُولُ اللَّهِ\". قَالَ: نَعَمْ، وَشَهِدَ أَنَّهُ رَأَى الْهِلَالَ، فَأَمَرَ بِلَالًا فَنَادَى فِي النَّاسِ أَنْ يَقُومُوا وَأَنْ يَصُومُوا. (د,ت,ن,جه)", "malayalam": "ഇക്‌രിമ(റ): ഒരിക്കൽ റമളാൻ മാസപ്പിറവിയിൽ അവർ സംശയിച്ചു. അങ്ങനെ വ്രതവും തറാവീഹും ഉപേക്ഷിക്കാൻ അവരുദ്ദേശിച്ചു. അപ്പോൾ കൽപ്രദേശവാസിയായ ഒരു ഗ്രാമീണൻ വന്നു ചന്ദ്രപ്പിറവി ദർശിച്ചതായി സാക്ഷിനിന്നു. തുടർന്ന് അദ്ദേഹത്തെ നബി(സ)യുടെ അടുക്കൽ കൊണ്ടുവന്നു. നബി(സ) അദ്ദേഹത്തോടു ചോദിച്ചു: \"ഞാൻ അല്ലാഹുവിന്റെ ദൂതരാണെന്നും, അല്ലാഹുവല്ലാതെ ആരാധ്യനില്ലെന്നും താങ്കൾ സാക്ഷ്യം വഹിക്കുന്നുവോ?\" അദ്ദേഹം മറുപടി പറഞ്ഞു: അതെ. അയാൾ ചന്ദ്രപ്പിറവി ദർശിച്ചെന്ന് സാക്ഷിനിൽക്കുകയും ചെയ്തു. അപ്പോൾ നബി(സ) ജനങ്ങളോടു നോമ്പെടുക്കാനും തറാവീഹ് നിസ്കരിക്കാനും വിളിച്ചുപറയാൻ ബിലാൽ(റ)വിനോട് കൽപിച്ചു. (ദ,തു,ന,ജ)", "narrator_ml": "ഇക്‌രിമ(റ)", "source_codes_ar": ["د", "ت", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 8, "page_start": 61}, {"hadith_no": 45, "arabic": "عَنِ ابْنِ عُمَرَ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: تَرَاءَى النَّاسُ الْهِلَالَ، فَأَخْبَرْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنِّي رَأَيْتُهُ، فَصَامَهُ وَأَمَرَ النَّاسَ بِصِيَامِهِ. (د)", "malayalam": "ഇബ്നുഉമർ(റ): ജനങ്ങൾ ചന്ദ്രപ്പിറവി കണ്ടു. അപ്പോൾ ഞാൻ ചന്ദ്രനെ കണ്ടിരിക്കുന്നുവെന്ന് നബി(സ)യെ വിവരമറിയിച്ചു. തുടർന്ന് നബി(സ) വ്രതമെടുക്കുകയും ജനങ്ങളോട് വ്രതമെടുക്കാൻ കൽപ്പിക്കുകയും ചെയ്തു. (ദ)", "narrator_ml": "ഇബ്നുഉമർ(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 8, "page_start": 61}, {"hadith_no": 46, "arabic": "عَنْ أَبِي مَالِكٍ الْأَشْجَعِيِّ: حَدَّثَنَا حُسَيْنُ بْنُ الْحَارِثِ الْجَدَلِيُّ: أَنَّ أَمِيرَ مَكَّةَ خَطَبَ ثُمَّ قَالَ: عَهِدَ إِلَيْنَا رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنْ نَنْسُكَ لِلرُّؤْيَةِ، فَإِنْ لَمْ نَرَهُ وَشَهِدَ شَاهِدَا عَدْلٍ نَسَكْنَا بِشَهَادَتِهِمَا. فَسَأَلْتُ الْحُسَيْنَ بْنَ الْحَارِثِ: مَنْ أَمِيرُ مَكَّةَ؟ قَالَ: لَا أَدْرِي، ثُمَّ لَقِيَنِي بَعْدُ فَقَالَ: هُوَ الْحَارِثُ بْنُ حَاطِبٍ أَخُو مُحَمَّدِ بْنِ حَاطِبٍ. ثُمَّ قَالَ الْأَمِيرُ: إِنَّ فِيكُمْ مَنْ هُوَ أَعْلَمُ بِاللَّهِ وَرَسُولِهِ مِنِّي، وَشَهِدَ هَذَا مِنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَأَوْمَأَ بِيَدِهِ إِلَى رَجُلٍ. قَالَ الْحُسَيْنُ: فَقُلْتُ لِشَيْخٍ إِلَى جَنْبِي: مَنْ هَذَا الَّذِي أَوْمَأَ إِلَيْهِ الْأَمِيرُ؟ قَالَ: هَذَا عَبْدُ اللَّهِ بْنُ عُمَرَ، وَصَدَقَ، كَانَ أَعْلَمَ بِاللَّهِ مِنْهُ، فَقَالَ: بِذَلِكَ أَمَرَنَا رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. (د)", "malayalam": "അബൂമാലികുൽ അശ്ജഈ(റ): ഹാരിസുൽ ജദ്‌ലിയുടെ മകനായ ഹുസൈൻ(റ) ഞങ്ങൾക്കൊരു സംഭവം വിവരിച്ചു തന്നു: മക്കയുടെ അമീർ ജനങ്ങളെ അഭിസംബോധന ചെയ്തു പറഞ്ഞു: മാസപ്പിറവി കണ്ടാൽ നോമ്പനുഷ്ഠിക്കാൻ റസൂൽ(സ) നമ്മോട് കരാർ ചെയ്തിട്ടുണ്ട്. നമ്മൾ മാസപ്പിറവി ദർശിച്ചില്ലെങ്കിൽ നീതിമാന്മാരായ രണ്ടാളുകൾ മാസപ്പിറവി ദർശിച്ചതായി സാക്ഷിനിന്നാൽ അതുമുഖേന നാം നോമ്പനുഷ്ഠിക്കും. അപ്പോൾ ഞാൻ ഹുസൈനുബ്നു ഹാരിസിനോട് ചോദിച്ചു: ആരാണ് മക്കയുടെ അമീർ? അദ്ദേഹം പറഞ്ഞു: എനിക്കറിയില്ല. പിന്നീട് കാലങ്ങൾക്ക് ശേഷം എന്നെ കണ്ടപ്പോൾ അദ്ദേഹം പറഞ്ഞു: അത് (മക്കയിലെ അമീർ) മുഹമ്മദുബ്നു ഹാത്വിബിന്റെ സഹോദരനായ ഹാരിസുബ്നു ഹാത്വിബ് ആയിരുന്നു. തുടർന്ന് അമീർ (പ്രഭാഷണത്തിൽ) പറഞ്ഞു: നിശ്ചയം നിങ്ങളിൽ എന്നേക്കാൾ കൂടുതൽ അല്ലാഹുവിനെയും അവന്റെ പ്രവാചകനേയും അറിയുന്ന ഒരാളുണ്ട്. അദ്ദേഹം പ്രവാചകരിൽ നിന്ന് ഇതിന് സാക്ഷിയായിട്ടുണ്ട്. അമീർ ഒരാളുടെ നേരെ കൈ ചൂണ്ടി. ഹുസൈൻ പറയുന്നു: അപ്പോൾ ഞാൻ എന്റെ അരികിലുണ്ടായിരുന്ന വൃദ്ധനോട് ചോദിച്ചു: അമീർ കൈ ചൂണ്ടിയ ആൾ ആരാണ്? അദ്ദേഹം പറഞ്ഞു: അത് അബ്ദുല്ലാഹിബ്നു ഉമർ(റ) ആണ്. അമീർ പറഞ്ഞത് സത്യമാണ്. ഇബ്നുഉമർ(റ) അമീറിനേക്കാൾ അല്ലാഹുവിനെക്കുറിച്ച് അറിയുന്നവരാണ്. അപ്പോൾ ഇബ്നുഉമർ(റ) പറഞ്ഞു: റസൂൽ(സ) ഇപ്രകാരം ചെയ്യാനാണ് നമ്മോട് കൽപിച്ചത്. (ദ)", "narrator_ml": "അബൂമാലികുൽ അശ്ജഈ(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 8, "page_start": 62}, {"hadith_no": 47, "arabic": "عَنْ رِبْعِيِّ بْنِ حِرَاشٍ، عَنْ رَجُلٍ مِنْ أَصْحَابِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: اخْتَلَفَ النَّاسُ فِي آخِرِ يَوْمٍ مِنْ رَمَضَانَ، فَقَدِمَ أَعْرَابِيَّانِ فَشَهِدَا عِنْدَ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِاللَّهِ لَأَهَلَّا الْهِلَالَ أَمْسِ عَشِيَّةً، فَأَمَرَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ النَّاسَ أَنْ يُفْطِرُوا، وَأَنْ يَغْدُوا إِلَى مُصَلَّاهُمْ. (د)", "malayalam": "രിബ്ഇയ്യുബ്നു ഹിറാശ്(റ) റസൂൽ(സ)യുടെ അനുചരരിൽ പെട്ട ഒരാളിൽനിന്ന്: റമളാൻ മാസത്തിലെ അവസാനദിനത്തിൽ ജനങ്ങൾ ഭിന്നാഭിപ്രായക്കാരായി. അപ്പോൾ ഗ്രാമീണവാസികളായ രണ്ട് അറബികൾ നബിയുടെ അടുക്കൽ വന്ന് തലേദിവസം വൈകി മാസപ്പിറവി ദർശിച്ചതായി അല്ലാഹുവിന്റെ പേരിൽ സത്യം ചെയ്ത് സാക്ഷിനിന്നു. ഉടനെ റസൂൽ(സ) ജനങ്ങളോട് അവരുടെ നോമ്പ് ഉപേക്ഷിക്കുവാനും പ്രഭാതത്തിൽ (പെരുന്നാൾ) നിസ്കാരസ്ഥലത്തേക്ക് പോകുവാനും കല്പിച്ചു. (ദ)", "narrator_ml": "രിബ്ഇയ്യുബ്നു ഹിറാശ്(റ)", "source_codes_ar": ["د"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 8, "page_start": 62}, {"hadith_no": 48, "arabic": "عَنْ عَبْدِ الرَّحْمَنِ بْنِ زَيْدِ بْنِ الْخَطَّابِ: أَنَّهُ خَطَبَ النَّاسَ فِي الْيَوْمِ الَّذِي يُشَكُّ فِيهِ، فَقَالَ: أَلَا، إِنِّي جَالَسْتُ أَصْحَابَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَسَاءَلْتُهُمْ، وَإِنَّهُمْ حَدَّثُونِي أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"صُومُوا لِرُؤْيَتِهِ وَأَفْطِرُوا لِرُؤْيَتِهِ، وَانْسُكُوا لَهَا، فَإِنْ غُمَّ عَلَيْكُمْ فَأَكْمِلُوا ثَلَاثِينَ، فَإِنْ شَهِدَ شَاهِدَانِ فَصُومُوا وَأَفْطِرُوا\". (ن)", "malayalam": "അബ്ദുർറഹ്മാനുബ്നു സൈദുബ്നുൽ ഖത്താബ്(റ): (നോമ്പാണോ അല്ലയോ എന്ന്) സംശയിക്കപ്പെട്ട ഒരു ദിനത്തിൽ അദ്ദേഹം ജനങ്ങളോട് പ്രസംഗിച്ചു. (പ്രസംഗത്തിൽ) അദ്ദേഹം പറഞ്ഞു: അറിയുക! ഞാൻ പ്രവാചകരുടെ സ്വഹാബതിന്റെ കൂടെ ഇരിക്കുകയും അവരോടു ചോദിക്കുകയും ചെയ്തിട്ടുണ്ട്. അവർ എന്നോടൊരു ഹദീസ് പറഞ്ഞു: റസൂൽ(സ) പറഞ്ഞു: \"മാസപ്പിറവി ദർശനത്താൽ നിങ്ങൾ വ്രതമനുഷ്ഠിക്കുകയും മാസപ്പിറവി കണ്ടാൽ നിങ്ങൾ നോമ്പുപേക്ഷിക്കുകയും ചെയ്യുക. മാസപ്പിറവി കണ്ടാൽ നിങ്ങൾ നോമ്പെടുക്കുക. മേഘം മറയിട്ടതിനാൽ മാസപ്പിറവി ദൃശ്യമാവാതെ വന്നാൽ മുപ്പത് ദിവസം നിങ്ങൾ പൂർണ്ണമാക്കുക. രണ്ടുപേർ സാക്ഷിനിന്നാൽ നിങ്ങൾ നോമ്പെടുക്കുകയും ഉപേക്ഷിക്കുകയും ചെയ്യുക.\" (ന)", "narrator_ml": "അബ്ദുർറഹ്മാനുബ്നു സൈദുബ്നുൽ ഖത്താബ്(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 8, "page_start": 62}, {"hadith_no": 49, "arabic": "عَنْ أَبِي عُمَيْرِ بْنِ أَنَسِ بْنِ مَالِكٍ قَالَ: حَدَّثَنِي عُمُومَتِي مِنَ الْأَنْصَارِ– مِنْ أَصْحَابِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ– قَالُوا أُغْمِيَ عَلَيْنَا هِلَالُ شَوَّالٍ، فَأَصْبَحْنَا صِيَامًا، فَجَاءَ رَكْبٌ مِنْ آخِرِ النَّهَارِ فَشَهِدُوا عِنْدَ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: أَنَّهُمْ رَأَوُا الْهِلَالَ بِالْأَمْسِ. فَأَمَرَهُمْ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنْ يُفْطِرُوا، وَأَنْ يَخْرُجُوا إِلَى عِيدِهِمْ مِنَ الْغَدِ. (د,ن,جه)", "malayalam": "അബൂ ഉമൈറുബ്നു അനസുബ്നു മാലിക്(റ): പ്രവാചകരുടെ സ്വഹാബിമാരിൽപ്പെട്ട അൻസ്വാരികളായ പിതൃസഹോദരിമാർ എന്നോട് പറഞ്ഞു: ഒരിക്കൽ മേഘപടലം കാരണം ശവ്വാൽപിറവി ഞങ്ങൾക്കു കാണാൻ സാധിക്കാതെ വന്നു. പിറ്റേദിനം ഞങ്ങൾ നോമ്പനുഷ്ഠിച്ചു. വൈകുന്നേരസമയത്ത് ഒരു യാത്രാസംഘം നബി(സ)യുടെ അടുക്കൽവന്ന് തലേന്ന് അവർ ചന്ദ്രനെ കണ്ടതായി സാക്ഷിനിന്നു. അപ്പോൾ നബി(സ) അവരോട് നോമ്പ് ഉപേക്ഷിക്കാനും അടുത്ത ദിവസം 'ഈദ്' ആഘോഷിക്കാനും കൽപിച്ചു. (ദ,ന,ജ)", "narrator_ml": "അബൂ ഉമൈറുബ്നു അനസുബ്നു മാലിക്(റ)", "source_codes_ar": ["د", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 8, "page_start": 63}, {"hadith_no": 50, "arabic": "عَنْ صِلَةَ بْنِ زُفَرَ الْعَبْسِيِّ قَالَ: كُنَّا عِنْدَ عَمَّارٍ رَضِيَ اللَّهُ عَنْهُ فَأُتِيَ بِشَاةٍ مَصْلِيَّةٍ، فَقَالَ: كُلُوا. فَتَنَحَّى بَعْضُ الْقَوْمِ قَالَ: إِنِّي صَائِمٌ. فَقَالَ عَمَّارٌ: مَنْ صَامَ الْيَوْمَ الَّذِي يُشَكُّ فِيهِ فَقَدْ عَصَى أَبَا الْقَاسِمِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. (خ,د,ت,ن)", "malayalam": "സ്വിലതുബ്നു സുഫറുൽ അബസീ(റ): ഞങ്ങൾ അമ്മാർ(റ)വിന്റെ സമീപത്തായിരിക്കെ വേവിച്ച ഒരാട് കൊണ്ടുവരപ്പെട്ടു. അപ്പോൾ അമ്മാർ(റ) പറഞ്ഞു: നിങ്ങൾ ഭക്ഷിച്ചോളൂ. അന്നേരം, ഒരാൾ നീങ്ങിയിരിക് ഭാതത്തിനു (ഫജ്റ്) മുമ്പ് നോമ്പിനെ കരുതാത്തവൻ നോമ്പ് അനുഷ്ഠിക്കുന്നില്ല.\". (ദ,തു,ന,ജ)", "narrator_ml": "അബ്ദുല്ലാഹിബ്നു ഉമർ(റ)", "source_codes_ar": ["د", "ت", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ: مِنَ اللَّيْلِ– فَلَا صِيَامَ لَهُ\".", "malayalam": "മറ്റൊരു നിവേദനം: \"പ്രഭാതത്തിനു (ഫജ്റ്) മുമ്പ് നോമ്പിനെ കരുതാത്തവൻ നോമ്പ് അനുഷ്ഠിക്കുന്നില്ല.\". (ദ,തു,ന,ജ)"}, {"seq": 2, "arabic": "وَفِي رِوَايَةٍ: \"مَنْ لَمْ يُجْمِعِ الصِّيَامَ قَبْلَ طُلُوعِ الْفَجْرِ فَلَا يَصُومُ\". (د,ت,ن,جه)", "malayalam": null}], "bab_seq": 12, "page_start": 64}, {"hadith_no": 56, "arabic": "عَنِ ابْنِ عُمَرَ، عَنْ حَفْصَةَ– رَضِيَ اللَّهُ عَنْهُمْ– قَالَتْ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"لَا صِيَامَ لِمَنْ لَمْ يَفْرِضْهُ مِنَ اللَّيْلِ\". (د,ت,ن,جه)", "malayalam": "ഹഫ്സ(റ)യിൽനിന്ന് ഇബ്നുഉമർ(റ): മഹതി പറഞ്ഞു: റസൂൽ(സ) അരുളി: \"ഫർള് നോമ്പിനെ രാത്രിയിൽ കരുതാത്തവനു നോമ്പില്ല.\" (ദ,തു,ന,ജ)", "narrator_ml": "ഹഫ്സ(റ)", "source_codes_ar": ["د", "ت", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 12, "page_start": 64}, {"hadith_no": 57, "arabic": "عَنْ سَلَمَةَ بْنِ الْأَكْوَعِ رَضِيَ اللَّهُ عَنْهُ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بَعَثَ رَجُلًا يُنَادِي فِي النَّاسِ يَوْمَ عَاشُورَاءَ: إِنَّ مَنْ أَكَلَ فَلْيُتِمَّ أَوْ فَلْيَصُمْ، وَمَنْ لَمْ يَأْكُلْ فَلَا يَأْكُلْ. (خ)", "malayalam": "സലമതുബ്നു അക്‌വഅ്(റ): നബി(സ) ആശുറാഅ് (മുഹറം 10) ദിനത്തിൽ \"ഭക്ഷണം കഴിച്ചവർ അതു പൂർത്തീകരിക്കട്ടെ, അല്ലെങ്കിൽ നോമ്പനുഷ്ഠിക്കട്ടെ. ഭക്ഷണം കഴിക്കാത്തവർ കഴിക്കാതിരിക്കുകയും ചെയ്യട്ടെ\" എന്ന് ജനങ്ങളോട് വിളിച്ചുപറയാൻ ഒരാളെ അയച്ചു. (ബു)", "narrator_ml": "സലമതുബ്നു അക്‌വഅ്(റ)", "source_codes_ar": ["خ"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 13, "page_start": 65}, {"hadith_no": 58, "arabic": "عَنْ سَلَمَةَ رَضِيَ اللَّهُ عَنْهُ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ لِرَجُلٍ: \"أَذِّنْ يَوْمَ عَاشُورَاءَ: مَنْ كَانَ أَكَلَ فَلْيُتِمَّ بَقِيَّةَ يَوْمِهِ، وَمَنْ لَمْ يَكُنْ أَكَلَ فَلْيَصُمْ\". (ن)", "malayalam": "സലമ(റ): റസൂൽ(സ) ഒരാളോട് ഇപ്രകാരം പറഞ്ഞു: \"ആശൂറാഅ് ദിവസം നീ ഇപ്രകാരം വിളിച്ചുപറയൂ: വല്ലവരും ഭക്ഷണം കഴിച്ചെങ്കിൽ ദിവസത്തിൽ ബാക്കിഭാഗം അവൻ പൂർത്തീകരിക്കട്ടെ. ഭക്ഷണം കഴിക്കാത്തവൻ നോമ്പനുഷ്ഠിച്ചുകൊള്ളട്ടെ.\" (ന)", "narrator_ml": "സലമ(റ)", "source_codes_ar": ["ن"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 13, "page_start": 65}, {"hadith_no": 59, "arabic": "عَنْ أُمِّ هَانِئٍ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: لَمَّا كَانَ يَوْمُ الْفَتْحِ– فَتْحِ مَكَّةَ– جَاءَتْ فَاطِمَةُ فَجَلَسَتْ عَنْ يَسَارِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَأُمُّ هَانِئٍ عَنْ يَمِينِهِ، قَالَتْ: فَجَاءَتِ الْوَلِيدَةُ بِإِنَاءٍ فِيهِ شَرَابٌ فَنَاوَلَتْهُ، فَشَرِبَ مِنْهُ، ثُمَّ نَاوَلَهُ أُمَّ هَانِئٍ، فَشَرِبَتْ مِنْهُ، قَالَتْ: يَا رَسُولَ اللَّهِ، لَقَدْ أَفْطَرْتُ وَكُنْتُ صَائِمَةً؟ فَقَالَ لَهَا: \"أَكُنْتِ تَقْضِينَ شَيْئًا\". قَالَتْ: لَا، قَالَ: \"فَلَا يَضُرُّكِ إِنْ كَانَ تَطَوُّعًا\". (د,ت)", "malayalam": "ഉമ്മുഹാനിഅ്(റ): ഫത്ഹു മക്കാദിനത്തിൽ ഫാത്വിമ(റ) വന്ന് നബി(സ)യുടെ ഇടഭാഗത്തും ഉമ്മു ഹാനിഅ്(റ) വലഭാഗത്തും ഇരുന്നു. ഉമ്മുഹാനിഅ്(റ) പറഞ്ഞു: അപ്പോൾ വലീദത് ഒരു പാത്രത്തിൽ പാനീയവുമായി വന്ന് നബി(സ)യ്ക്ക് കൊടുത്തു. നബി(സ) അതിൽനിന്ന് കുടിച്ചു. പിന്നീട് അത് ഉമ്മുഹാനിഅ്(റ)ന് കൊടുത്തു, അവരും അതിൽനിന്ന് കുടിച്ചു. ശേഷം ഉമ്മുഹാനിഅ്(റ) പറഞ്ഞു: പ്രവാചകരേ, ഞാൻ നോമ്പുകാരിയായിരുന്നു. ഇപ്പോൾ ഞാൻ നോമ്പ് മുറിച്ചിരിക്കുന്നു. അപ്പോൾ നബി(സ) അവളോട് ചോദിച്ചു: \"നീ വല്ലതിനേയും 'ഖളാഅ്' വീട്ടുന്നവളായിരുന്നോ?\" അവർ മറുപടി നൽകി: അല്ല. അപ്പോൾ നബി(സ) പറഞ്ഞു: \"സുന്നത് നോമ്പാണെങ്കിൽ നിന്നെ അത് ബുദ്ധിമുട്ടാക്കില്ല.\" (ദ,തു)", "narrator_ml": "ഉമ്മുഹാനിഅ്(റ)", "source_codes_ar": ["د", "ت"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [], "bab_seq": 13, "page_start": 65}, {"hadith_no": 60, "arabic": "عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: دَخَلَ عَلَيَّ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَوْمًا فَقَالَ: \"هَلْ عِنْدَكُمْ شَيْءٌ\". فَقُلْتُ: لَا. قَالَ: \"فَإِنِّي صَائِمٌ\". ثُمَّ مَرَّ بِي بَعْدَ ذَلِكَ الْيَوْمِ وَقَدْ أُهْدِيَ إِلَيَّ حَيْسٌ، فَخَبَأْتُ لَهُ مِنْهُ، وَكَانَ يُحِبُّ الْحَيْسَ، قَالَتْ: يَا رَسُولَ اللَّهِ، إِنَّهُ أُهْدِيَ لَنَا حَيْسٌ فَخَبَأْتُ لَكَ مِنْهُ؟ قَالَ: \"أَدْنِيهِ، أَمَا إِنِّي قَدْ أَصْبَحْتُ وَأَنَا صَائِمٌ\". فَأَكَلَ مِنْهُ، ثُمَّ قَالَ: \"إِنَّمَا مَثَلُ صَوْمِ الْمُتَطَوِّعِ مَثَلُ الرَّجُلِ يُخْرِجُ مِنْ مَالِهِ الصَّدَقَةَ، فَإِنْ شَاءَ أَمْضَاهَا وَإِنْ شَاءَ حَبَسَهَا\". وَفِي رِوَايَةٍ قَالَتْ: دَارَ عَلَيَّ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ دَوْرَةً، قَالَ: \"أَعِنْدَكِ شَيْءٌ\". قَالَتْ: لَيْسَ عِنْدِي شَيْءٌ. قَالَ: \"فَأَنَا صَائِمٌ\". قَالَتْ: ثُمَّ دَارَ عَلَيَّ الثَّانِيَةَ وَقَدْ أُهْدِيَ لَنَا حَيْسٌ فَجِئْتُ بِهِ فَأَكَلَ، فَعَجِبْتُ مِنْهُ، فَقُلْتُ: يَا رَسُولَ اللَّهِ، دَخَلْتَ عَلَيَّ وَأَنْتَ صَائِمٌ، ثُمَّ أَكَلْتَ حَيْسًا؟ قَالَ: \"نَعَمْ يَا عَائِشَةُ، إِنَّمَا مَنْزِلَةُ مَنْ صَامَ فِي غَيْرِ رَمَضَانَ– أَوْ: غَيْرِ قَضَاءِ رَمَضَانَ، أَوْ: فِي التَّطَوُّعِ– بِمَنْزِلَةِ رَجُلٍ أَخْرَجَ صَدَقَةَ مَالِهِ، فَجَادَ مِنْهَا بِمَا شَاءَ فَأَمْضَاهُ، وَبَخِلَ مِنْهَا بِمَا بَقِيَ فَأَمْسَكَهُ\". (م,د,ت,ن,جه)", "malayalam": "ആഇശ(റ): ഒരു ദിവസം എന്റെയടുക്കൽ വന്നു റസൂൽ(സ) ചോദിച്ചു. \"നിങ്ങളുടെയടുക്കൽ വല്ലതുമുണ്ടോ?\" ഇല്ലെന്ന് ഞാൻ പറഞ്ഞു: \"എങ്കിൽ ഞാനിന്ന് വ്രതമനുഷ്ഠിക്കുകയാണ്.\" അവിടന്നരുളി. പിന്നീടൊരുദിനം അവിടന്ന് എന്റെയരികെ നടന്നു. പാരിതോഷികമായി കിട്ടിയ 'ഹൈസ്' എന്ന പലഹാരം എന്റെ അടുത്തുണ്ടായിരുന്നു. അവിടത്തേക്കതിഷ്ടമായതിനാൽ ഞാനത് കരുതിവെച്ചിരുന്നു. ഞാൻ പറഞ്ഞു: അല്ലാഹുവിന്റെ റസൂലേ, പാരിതോഷികമായി നമുക്ക് ലഭിച്ച ഹൈസ് പലഹാരം അങ്ങേയ്ക്കുവേണ്ടി ഞാൻ കരുതിവെച്ചിരിക്കുന്നു. റസൂൽ(സ) പറഞ്ഞു: \"എന്നാൽ കൊണ്ടുവരൂ. പ്രഭാതത്തിൽ ഞാനൊരു നോമ്പുകാരനായിരുന്നു.\" റസൂൽ(സ) അതിൽനിന്ന് ഭക്ഷിച്ചു. ശേഷം പറഞ്ഞു: \"സുന്നത് നോമ്പനുഷ്ഠിക്കുന്നവൻ ദാനം ചെയ്യുന്നവനെപ്പോലെയാണ്. വേണമെങ്കിൽ കൊടുക്കാം. അല്ലെങ്കിൽ തടഞ്ഞുവെക്കാം.\"\nമറ്റൊരു നിവേദനത്തിൽ: ആഇശ(റ) പറഞ്ഞു: ഒരു ദിവസം എന്റെയടുക്കൽ വന്ന് നബി(സ) ചോദിച്ചു. \"നിങ്ങളുടെയടുക്കൽ വല്ലതുമുണ്ടോ?\" എന്റെയടുക്കൽ ഒന്നുമില്ലെന്ന് മഹതി പറഞ്ഞു: \"എങ്കിൽ ഞാനിന്ന് നോമ്പുകാരനാ\"ണെന്ന് നബി(സ) പറഞ്ഞു. രണ്ടാമതായി ഒരു ദിവസം വന്നു. അന്ന് ഒരു പലഹാരം ദാനമായി ലഭിച്ചിരുന്നു. ഞാൻ അത് കൊണ്ടുവന്നു. അപ്പോൾ അതിൽ നിന്ന് നബി(സ) ഭക്ഷിച്ചു. എനിക്കത്ഭുതമായി. ഞാൻ ചോദിച്ചു: റസൂലേ, നിങ്ങൾ എന്റെയടുക്കൽ നോമ്പുകാരനാണെന്ന് പറഞ്ഞു വന്നിട്ട് ഇപ്പോൾ ഈ പലഹാരം കഴിക്കുന്നോ? നബി(സ) പറഞ്ഞു: \"അതേ ആഇശ, ഒരാൾ അനുഷ്ഠിക്കുന്നത് റമളാനിലെ നോമ്പോ റമളാനിലേത് ഖളാഅ് വീട്ടുന്ന നോമ്പോ, സുന്നത് നോമ്പാണ് അനുഷ്ഠിക്കുന്നതെങ്കിൽ അയാൾ ദാനം ചെയ്യുന്നവനെപ്പോലെയാണ്. സമ്പത്തിൽ നിന്നും ഉദ്ദേശിച്ചത് ദാനത്തിന് മാറ്റിവെക്കുകയും ദാനംചെയ്യുകയും, ബാക്കിയുള്ളവ അദ്ദേഹത്തിനായി എടുത്ത് വെക്കുകയും ചെയ്യുന്നു.\" (മു,ദ,തു,ന,ജ)", "narrator_ml": "ആഇശ(റ)", "source_codes_ar": ["م", "د", "ت", "ن", "جه"], "grading_note_ml": null, "grading_note_ar": null, "explanation_ml": null, "variants": [{"seq": 1, "arabic": "وَفِي رِوَايَةٍ قَالَتْ: دَارَ عَلَيَّ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ دَوْرَةً، قَالَ: \"أَعِنْدَكِ شَيْءٌ\". قَالَتْ: لَيْسَ عِنْدِي شَيْءٌ. قَالَ: \"فَأَنَا صَائِمٌ\". قَالَتْ: ثُمَّ دَارَ عَلَيَّ الثَّانِيَةَ وَقَدْ أُهْدِيَ لَنَا حَيْسٌ فَجِئْتُ بِهِ فَأَكَلَ، فَعَجِبْتُ مِنْهُ، فَقُلْتُ: يَا رَسُولَ اللَّهِ، دَخَلْتَ عَلَيَّ وَأَنْتَ صَائِمٌ، ثُمَّ أَكَلْتَ حَيْسًا؟ قَالَ: \"نَعَمْ يَا عَائِشَةُ، إِنَّمَا مَنْزِلَةُ مَنْ صَامَ فِي غَيْرِ رَمَضَانَ– أَوْ: غَيْرِ قَضَاءِ رَمَضَانَ، أَوْ: فِي التَّطَوُّعِ– بِمَنْزِلَةِ رَجُلٍ أَخْرَجَ صَدَقَةَ مَالِهِ، فَجَادَ مِنْهَا بِمَا شَاءَ فَأَمْضَاهُ، وَبَخِلَ مِنْهَا بِمَا بَقِيَ فَأَمْسَكَهُ\". (م,د,ت,ن,جه)", "malayalam": "മറ്റൊരു നിവേദനത്തിൽ: ആഇശ(റ) പറഞ്ഞു: ഒരു ദിവസം എന്റെയടുക്കൽ വന്ന് നബി(സ) ചോദിച്ചു. \"നിങ്ങളുടെയടുക്കൽ വല്ലതുമുണ്ടോ?\" എന്റെയടുക്കൽ ഒന്നുമില്ലെന്ന് മഹതി പറഞ്ഞു: \"എങ്കിൽ ഞാനിന്ന് നോമ്പുകാരനാ\"ണെന്ന് നബി(സ) പറഞ്ഞു. രണ്ടാമതായി ഒരു ദിവസം വന്നു. അന്ന് ഒരു പലഹാരം ദാനമായി ലഭിച്ചിരുന്നു. ഞാൻ അത് കൊണ്ടുവന്നു. അപ്പോൾ അതിൽ നിന്ന് നബി(സ) ഭക്ഷിച്ചു. എനിക്കത്
